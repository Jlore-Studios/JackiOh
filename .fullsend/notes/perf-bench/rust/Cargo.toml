# The native half of .fullsend/notes/perf.md's benchmark (perf agent): a crate of its own, outside the
# workspace, so it never builds with it. From the repo root:
#   cp Cargo.lock .fullsend/notes/perf-bench/rust/
#   CARGO_TARGET_DIR=target/bench cargo build --release --manifest-path .fullsend/notes/perf-bench/rust/Cargo.toml
#   target/bench/release/jackioh-bench "$PWD" 60 2 100 300 all
[package]
name = "jackioh-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jackioh-engine = { path = "../../../../crates/engine" }
jackioh-cards = { path = "../../../../crates/cards" }
serde_json = "1.0.151"
libc = "0.2.190"

[profile.release]
lto = "thin"
debug = "line-tables-only"
