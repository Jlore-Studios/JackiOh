name: Bug
description: Something that behaves wrongly. A rule, a card, a crash, a failing job.
title: "Patch v0.3.Y: "
labels: ["patch"]
body:
  - type: markdown
    attributes:
      value: |
        Titles and labels follow [docs/issues-and-patches.md](https://github.com/Jlore-Studios/JackiOh/blob/main/docs/issues-and-patches.md).

        - **Title:** a fix to the game is usually a micro patch, `Patch v0.3.Y: <what the fix does>`. For a failing job or tool, retitle it `CI: …` and swap `patch` for `architecture`. A bug in the night bot or Squishy goes through the Night bot form.
        - **Who does it:** choose below, or later label it `human` (people) or `bot:build` (the night bot). Your choice, difficulty and priority become labels, and triage adds the type label and the issue type (Task, Bug or Feature); with no difficulty, the bot's planner rates it.
  - type: textarea
    id: happens
    attributes:
      label: What happens
      description: What you saw. Paste errors and logs as text.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What should happen
      description: What SPEC (a section or an R-number), the card's text or the docs say should happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: "Steps from a fresh start. For the engine, a seed (`cargo jackioh fuzz --from <seed> --seeds 1` replays a fuzz seed) or a replay (the game's seed and action log). For a job, a link to the failing run."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The rules engine or a card
        - The AI
        - The client (hotseat, practice, online, menus)
        - The server or the database
        - CI, deploys or tooling
        - Somewhere else
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version or commit
      description: The catalog version, the commit, or the page and date you saw it on.
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty (a guess)
      description: The weakest model tier that may build it. A choice here becomes its `difficulty:*` label; with none, the bot's planner rates it.
      options:
        - Not sure (the planner rates it)
        - "easy: small, one crate or app, no engine, AI, catalog, card or migration work"
        - "medium: the rest"
        - "hard: engine rules, the AI, design across crates, a migration, or about 40 files or more"
      default: 0
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The night bot's pickup order; a choice here becomes its `priority:*` label.
      options:
        - No priority
        - high
        - medium
        - low
      default: 0
  - type: dropdown
    id: method
    attributes:
      label: Who does it
      description: "People: labelled `human` and assigned to both people. The night bot: labelled `bot:build`, which queues it. Or decide later and add one of those labels yourself."
      options:
        - Decide later
        - People (human)
        - The night bot (bot:build)
      default: 0
