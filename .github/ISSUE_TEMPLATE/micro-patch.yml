name: Micro patch
description: One fix or tweak to the game, named when it ships (Patch v0.3.Y).
title: "Patch v0.3.Y: "
labels: ["patch"]
body:
  - type: markdown
    attributes:
      value: |
        **What makes a patch micro** ([docs/issues-and-patches.md](https://github.com/Jlore-Studios/JackiOh/blob/main/docs/issues-and-patches.md), Version numbers; R650): it is small. One fix, one card's numbers or text, or one cosmetic or client tweak, with no new mechanic, keyword, ruling set or feature. Anything larger is a normal patch (the Patch form). If this one grows past that, retitle it `Patch v0.3.X: …`.

        - **Title:** `Patch v0.3.Y: <what it does>`. Keep the `Y`: `patches ship` names it when it ships (the newest version plus the next letter, such as v0.3.1b). A micro patch that changes no card data ships no version and keeps its `Y`.
        - **Who does it:** choose below, or later label it `human` (people) or `bot:build` (the night bot). Your choice, difficulty and priority become labels, and triage adds the type label and the issue type (Task, Bug or Feature); with no difficulty, the bot's planner rates it.
  - type: textarea
    id: change
    attributes:
      label: The fix or tweak
      description: The one thing that changes, and why. Name the card, rule or screen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What a test can check once it is done.
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Blocked by, part of
      description: "`Blocked by #125`, `Part of #80`, if any."
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty (a guess)
      description: The weakest model tier that may build it. A choice here becomes its `difficulty:*` label; with none, the bot's planner rates it.
      options:
        - Not sure (the planner rates it)
        - "easy: small, one crate or app, no engine, AI, catalog, card or migration work"
        - "medium: the rest"
        - "hard: engine rules, the AI, design across crates, a migration, or about 40 files or more"
      default: 0
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The night bot's pickup order; a choice here becomes its `priority:*` label.
      options:
        - No priority
        - high
        - medium
        - low
      default: 0
  - type: dropdown
    id: method
    attributes:
      label: Who does it
      description: "People: labelled `human` and assigned to both people. The night bot: labelled `bot:build`, which queues it. Or decide later and add one of those labels yourself."
      options:
        - Decide later
        - People (human)
        - The night bot (bot:build)
      default: 0
