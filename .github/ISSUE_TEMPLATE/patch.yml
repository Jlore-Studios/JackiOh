name: Patch
description: A change to the game, however small (cards, rules, the client, the server's features). Its version is named when it ships.
title: "Patch: "
labels: ["patch"]
body:
  - type: markdown
    attributes:
      value: |
        Titles, labels and version numbers follow [docs/issues-and-patches.md](https://github.com/Jlore-Studios/JackiOh/blob/main/docs/issues-and-patches.md).

        - **Title:** `Patch: <what it does>`, a short phrase with no version. The version is never guessed: the classifier reads what the change does to the cards, and `patches ship` names it from that when it ships (a patch for 10 or more cards that play differently, a micro for fewer or for wording alone, a major when a set ships; Version numbers), then retitles this issue `Patch v<version>: …`. A change that ships no card data takes no version and keeps its title. A part of a change split over several issues is `Patch (part n of m): …`, a sub-issue of its tracker.
        - **Who does it:** choose below, or later label it `human` (people) or `bot:build` (the night bot). Your choice, difficulty and priority become labels, and triage adds the type label and the issue type (Task, Bug or Feature); with no difficulty, the bot's planner rates it.
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: What changes for players or for the code, and why. Name the cards, rules (SPEC sections, R-numbers) and screens it touches.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What a test can check once it is done, one item per line. A ruling the spec does not make yet gets a new note and a test named after it (CLAUDE.md rule 3).
      placeholder: |
        - …
        - …
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Blocked by, part of
      description: "Open issues that must close first, and the tracker this is a part of: `Blocked by #125`, `Part of #80`. Triage links them as issue dependencies."
      placeholder: "Blocked by #… · Part of #…"
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty (a guess)
      description: The weakest model tier that may build it. A choice here becomes its `difficulty:*` label; with none, the bot's planner rates it.
      options:
        - Not sure (the planner rates it)
        - "easy: small, one crate or app, no engine, AI, catalog, card or migration work"
        - "medium: the rest"
        - "hard: engine rules, the AI, design across crates, a migration, or about 40 files or more"
      default: 0
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The night bot's pickup order; a choice here becomes its `priority:*` label.
      options:
        - No priority
        - high
        - medium
        - low
      default: 0
  - type: dropdown
    id: method
    attributes:
      label: Who does it
      description: "People: labelled `human` and assigned to both people. The night bot: labelled `bot:build`, which queues it. Or decide later and add one of those labels yourself."
      options:
        - Decide later
        - People (human)
        - The night bot (bot:build)
      default: 0
