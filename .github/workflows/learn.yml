# The learn lane (#466, #1012; training/learn.md): the learned evaluation, retrained on fresh
# self-play and promoted to main by the same gate as every AI, with no LLM anywhere in it
# (docs/learned-eval.md D2). Weekly, and by dispatch (`gh workflow run learn.yml`). It runs with nobody
# watching it and with main moving under it (training/learn.md, Running unattended):
#
#   plan      names the export's seed base (`learned-<catalog>-<date>-<run>`, never a gate's or the dev
#             set's, R1006002). A lane pull request still open is left to merge while its checks are
#             green or running; one with a failed check, or open LEARN_PR_STALE_HOURS, is closed and the
#             run goes on, so a stuck promotion never holds the lane
#   export    selfplay.yml, called: `games` games in `shards` jobs on `runner` (GitHub's, or the
#             local runner, jackioh-selfplay-local); none with `export_run`, which retrains on an
#             earlier run's export (its artifacts are kept 30 days)
#   retrain   on main: training/ml/retrain.sh over the export (positions, folded by the export's own
#             build while its features are main's, the fit, the weights, the switch on, and an 800-game
#             paired screen against main's AI on improve-dev, decided in advance). Only a screen with
#             edgeLow above zero goes on, to training/ml/learn-promote.sh: the network onto main as it
#             is now, `promote --lane learn` (the lane's 400 hold-out games, R1012000, R850001) against
#             that main's AI, the practice-claim fixture recorded again by the new AI (R1303002), and,
#             when main moved in what the gate depends on meanwhile, all of it again on the newer main
#             (LEARN_GATE_TRIES). A pass is pushed as `AI gen <N> (learn): …` with auto-merge on, and
#             CI's training gate plays the gate again (`promote --verify`) before it merges, as for
#             every lane. When main kept moving through every try, the run starts another on the same
#             export (at most LEARN_CHAIN_MAX in a row). Each stage's report is kept as the run's
#             `learn-<run>` artifact and in its summary, whether or not it passed.
#   watch     when CI finishes red on the lane's pull request: its failed jobs run once more (a flaky
#             test); red again, the pull request is closed with the failed jobs named, and a run on the
#             same export starts (at most LEARN_CHAIN_MAX in a row), on main as it is by then.
#
# Pushing ai/learn and opening its pull request take LEARN_LANE_TOKEN, a fine-grained token that can
# write contents and pull requests on this repository alone (a pull request opened with the run's
# own token would start no CI). Without it, a passing promotion stops at its artifact
# (`learn-<run>/promotion.patch`) and the run says so in red. The night bot's status issue shows the
# lane (bot/harness/dashboard.py, `learn_lane`).
name: learn

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      games:
        description: "Games to export"
        required: true
        default: "100000"
      shards:
        description: "Export jobs"
        required: true
        default: "20"
      runner:
        description: "Where the export runs"
        type: choice
        options:
          - ubuntu-latest
          - jackioh-selfplay-local
        default: ubuntu-latest
      screen:
        description: "Paired screen games against main (decided before it is played)"
        required: true
        default: "800"
      export_run:
        description: "Retrain on an earlier run's export (its run id) instead of playing one"
        required: false
        default: ""
      chain:
        description: "Runs on this export before this one, each started by the lane itself (it sets this)"
        required: false
        default: "0"
  # The lane's pull request's CI, for `watch`. Only a workflow file on main hears it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [ai/learn]

permissions:
  contents: read

env:
  # A lane pull request open this long is closed at the next run, whatever its checks say.
  LEARN_PR_STALE_HOURS: "48"
  # Gates on a newer main when main moved during the last one (learn-promote.sh --tries).
  LEARN_GATE_TRIES: "3"
  # Runs the lane starts by itself on one export, one after another.
  LEARN_CHAIN_MAX: "2"

# A watch run never waits behind a retrain, nor replaces one waiting to start.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'learn-watch' || 'learn' }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          EXPORT_RUN: ${{ inputs.export_run }}
        run: |
          set -euo pipefail
          open=$(gh pr list -R "$REPO" --head ai/learn --state open --json number,createdAt --jq '.[0] // empty')
          if [ -n "$open" ]; then
            number=$(jq -r .number <<< "$open")
            age=$(( $(date -u +%s) - $(date -u -d "$(jq -r .createdAt <<< "$open")" +%s) ))
            failed=$(gh pr view "$number" -R "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[]
              | select((.conclusion // "") | test("^(FAILURE|TIMED_OUT|CANCELLED|STARTUP_FAILURE|ACTION_REQUIRED)$"))
              | .name] | unique | join(", ")')
            if [ -z "$failed" ] && [ "$age" -lt $((LEARN_PR_STALE_HOURS * 3600)) ]; then
              echo "the learn lane's pull request #$number is open and not failing: it merges first" >> "$GITHUB_STEP_SUMMARY"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            why=${failed:+"its checks failed ($failed)"}
            why=${why:-"it has been open more than $LEARN_PR_STALE_HOURS hours"}
            gh pr close "$number" -R "$REPO" --comment "The learn lane closes this promotion: $why. Run ${RUN} retrains on main as it is now (training/learn.md, Running unattended)."
            echo "closed the lane's pull request #$number: $why" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$EXPORT_RUN" ]; then
            # An earlier run's export, retrained on again: its seed names its shards' artifacts.
            seed=$(gh api "repos/$REPO/actions/runs/$EXPORT_RUN/artifacts" --paginate \
              --jq '.artifacts[] | select(.expired | not) | .name' \
              | sed -n 's/^selfplay-\(learned-.*\)-[0-9][0-9]*$/\1/p' | sort -u)
            if [ "$(printf '%s\n' "$seed" | grep -c .)" != 1 ]; then
              echo "::error::run $EXPORT_RUN holds no single learned export (seeds: ${seed:-none})"
              exit 1
            fi
            echo "retraining on run $EXPORT_RUN's export, $seed" >> "$GITHUB_STEP_SUMMARY"
            echo "seed=$seed" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The '-' goes last: between '_' and '\n' it would be a range, which tr refuses.
          catalog=$(jq -r '.[-1].version' crates/cards/patches/patches.json | tr -c 'A-Za-z0-9._\n-' '_')
          echo "seed=learned-$catalog-$(date -u +%Y%m%d)-$RUN" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  export:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' && !inputs.export_run }}
    uses: ./.github/workflows/selfplay.yml
    with:
      games: ${{ inputs.games || '100000' }}
      seed: ${{ needs.plan.outputs.seed }}
      shards: ${{ inputs.shards || '20' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      retention: "30"
      count: false

  retrain:
    name: retrain, screen, gate
    needs: [plan, export]
    # After the export, or with none when the run reuses an earlier one's (export_run).
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && (needs.export.result == 'success' || needs.export.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      # training/ml pins Python 3.13 (its pyproject.toml), and uv as super.yml's notebooks job does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: uv, pinned
        run: python3 -m pip install uv==0.13.0
      - uses: actions/download-artifact@v4
        with:
          pattern: selfplay-${{ needs.plan.outputs.seed }}-*
          path: ${{ runner.temp }}/export
          run-id: ${{ inputs.export_run || github.run_id }}
          github-token: ${{ github.token }}
      # The build that played the export folds its logs, so a rules change merged since then drops
      # none of its games (retrain.sh --positions-bin). It is kept 3 days: a later re-run folds with
      # main's build instead.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selfplay-jackioh
          path: ${{ runner.temp }}/exporter
          run-id: ${{ inputs.export_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: retrain and screen (training/ml/retrain.sh)
        id: retrain
        env:
          SCREEN: ${{ inputs.screen || '800' }}
        run: |
          set -uo pipefail
          git switch -c ai/learn
          status=0
          fold=()
          if tar -xzf "$RUNNER_TEMP/exporter/jackioh.tgz" -C "$RUNNER_TEMP/exporter" 2>/dev/null; then
            fold=(--positions-bin "$RUNNER_TEMP/exporter/target/release/jackioh")
          fi
          # The tree is main's, so the exporter retrain.sh builds first is main's AI: the parent.
          bash training/ml/retrain.sh --logs "$RUNNER_TEMP/export" --out "$RUNNER_TEMP/learn" \
            --parent-bin tree --screen-games "$SCREEN" "${fold[@]}" || status=$?
          echo "passed=$([ "$status" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## The learn lane, run ${{ github.run_number }}"
            echo
            [ -f "$RUNNER_TEMP/learn/fit/report.md" ] && sed -n '1,40p' "$RUNNER_TEMP/learn/fit/report.md"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/learn/summary.json" 2>/dev/null || echo '{"stage":"failed before the screen"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # retrain.sh writes summary.json whenever it decides (the fit stops it, or the screen does):
          # a run without one broke, and says so in red rather than as a screen that did not pass.
          if [ ! -f "$RUNNER_TEMP/learn/summary.json" ]; then
            echo "::error::retrain.sh stopped (exit $status) before it decided anything"
            exit 1
          fi
      # Node for the practice-claim fixture, which the promotion records again.
      - uses: ./.github/actions/setup
        if: ${{ steps.retrain.outputs.passed == 'true' }}
        with:
          rust: "false"
      - name: the gate on main as it is now (training/ml/learn-promote.sh)
        id: gate
        if: ${{ steps.retrain.outputs.passed == 'true' }}
        run: |
          set -uo pipefail
          games=$(jq -r '.counts.replayed' "$RUNNER_TEMP/learn/positions.json")
          status=0
          bash training/ml/learn-promote.sh --out "$RUNNER_TEMP/learn" --games "$games" \
            --tries "$LEARN_GATE_TRIES" || status=$?
          {
            echo
            echo '```json'
            cat "$RUNNER_TEMP/learn/deliver.json" 2>/dev/null || echo '{"stage":"failed before the gate"}'
            echo '```'
            cat "$RUNNER_TEMP/learn/promote.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          stage=$(jq -r .stage "$RUNNER_TEMP/learn/deliver.json" 2>/dev/null || echo broken)
          {
            echo "stage=$stage"
            echo "games=$games"
            echo "generation=$(jq -r '.generation // empty' "$RUNNER_TEMP/learn/deliver.json" 2>/dev/null)"
          } >> "$GITHUB_OUTPUT"
          if [ "$stage" = broken ]; then
            echo "::error::learn-promote.sh stopped (exit $status) before it decided anything"
            exit 1
          fi
      - name: deliver (push ai/learn, open its pull request, auto-merge)
        if: ${{ steps.gate.outputs.stage == 'ready' }}
        env:
          LEARN_LANE_TOKEN: ${{ secrets.LEARN_LANE_TOKEN }}
          REPO: ${{ github.repository }}
          GENERATION: ${{ steps.gate.outputs.generation }}
          GAMES: ${{ steps.gate.outputs.games }}
          EXPORT_RUN: ${{ inputs.export_run || github.run_id }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          set -euo pipefail
          if [ -z "$LEARN_LANE_TOKEN" ]; then
            echo "::error::the gate passed, but LEARN_LANE_TOKEN is not set: the promotion is the run's artifact (promotion.patch)"
            exit 1
          fi
          remote="https://x-access-token:${LEARN_LANE_TOKEN}@github.com/${REPO}.git"
          # A closed promotion leaves its branch, on an older main. Pushed as a new branch, ai/learn
          # brings only the lane's commits, never main's changes to .github/workflows/, which a token
          # without the workflow permission may not push.
          git push --quiet "$remote" --delete ai/learn 2> /dev/null || true
          if ! git push "$remote" HEAD:refs/heads/ai/learn; then
            echo "::error::LEARN_LANE_TOKEN could not push ai/learn: it may have expired (training/learn.md, Setting it up)"
            exit 1
          fi
          export GH_TOKEN="$LEARN_LANE_TOKEN"
          # `watch` reads which export to retrain on, and how many runs in a row it has had, from this.
          { cat "$RUNNER_TEMP/learn/promote.md"; echo; echo "<!-- learn-lane export_run=$EXPORT_RUN chain=$CHAIN -->"; } \
            > "$RUNNER_TEMP/learn/pull-body.md"
          title="AI gen $GENERATION (learn): the learned evaluation, retrained on $GAMES games"
          gh pr create -R "$REPO" --base main --head ai/learn --title "$title" \
            --body-file "$RUNNER_TEMP/learn/pull-body.md"
          gh pr merge -R "$REPO" ai/learn --auto --squash
      # main moved through every try: the same export again, on main as it is when that run gets there.
      - name: main kept moving, so another run on this export
        if: ${{ steps.gate.outputs.stage == 'moving' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPORT_RUN: ${{ inputs.export_run || github.run_id }}
          CHAIN: ${{ inputs.chain || '0' }}
          SCREEN: ${{ inputs.screen || '800' }}
        run: |
          set -euo pipefail
          if [ "$CHAIN" -ge "$LEARN_CHAIN_MAX" ]; then
            echo "::warning::main moved through every gate, and this export has had $LEARN_CHAIN_MAX runs after its first: the next scheduled run exports again"
            exit 0
          fi
          gh workflow run learn.yml -R "$REPO" -f export_run="$EXPORT_RUN" -f chain=$((CHAIN + 1)) -f screen="$SCREEN"
          echo "main moved through every gate: run $((CHAIN + 2)) on export $EXPORT_RUN started" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/learn/summary.json
            ${{ runner.temp }}/learn/positions.json
            ${{ runner.temp }}/learn/fit/report.md
            ${{ runner.temp }}/learn/fit/report.json
            ${{ runner.temp }}/learn/quantize-report.json
            ${{ runner.temp }}/learn/weights-float.json
            ${{ runner.temp }}/learn/screen.txt
            ${{ runner.temp }}/learn/deliver.json
            ${{ runner.temp }}/learn/promote*.md
            ${{ runner.temp }}/learn/promotion.patch
            crates/ai/src/learned/weights.json
          if-no-files-found: ignore
          retention-days: 90

  watch:
    name: watch the lane's pull request
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          open=$(gh pr list -R "$REPO" --head ai/learn --state open --json number,headRefOid,body --jq '.[0] // empty')
          if [ -z "$open" ]; then
            echo "CI was $CONCLUSION on ai/learn, and no lane pull request is open"
            exit 0
          fi
          number=$(jq -r .number <<< "$open")
          if [ "$(jq -r .headRefOid <<< "$open")" != "$HEAD_SHA" ]; then
            echo "CI run $CI_RUN was on an older head of #$number"
            exit 0
          fi
          failed=$(gh api "repos/$REPO/actions/runs/$CI_RUN/jobs?per_page=100" --jq '[.jobs[]
            | select((.conclusion // "") | test("^(failure|timed_out|cancelled)$")) | .name] | join(", ")')
          if [ "$ATTEMPT" -lt 2 ]; then
            gh run rerun "$CI_RUN" -R "$REPO" --failed
            echo "CI was $CONCLUSION on #$number ($failed): its failed jobs run once more" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker=$(jq -r .body <<< "$open" | sed -n 's/.*<!-- learn-lane export_run=\([0-9][0-9]*\) chain=\([0-9][0-9]*\) -->.*/\1 \2/p' | tail -n 1)
          next="the next scheduled run exports again"
          if [ -n "$marker" ]; then
            export_run=${marker% *}
            chain=${marker#* }
            if [ "$chain" -lt "$LEARN_CHAIN_MAX" ]; then
              gh workflow run learn.yml -R "$REPO" -f export_run="$export_run" -f chain=$((chain + 1))
              next="a run on the same export (run $export_run's) starts now, on main as it is when it gets there"
            fi
          fi
          gh pr close "$number" -R "$REPO" --comment "CI failed twice on this promotion: ${failed:-$CONCLUSION}. The learn lane closes it; $next (training/learn.md, Running unattended)."
          echo "closed #$number after CI failed twice ($failed); $next" >> "$GITHUB_STEP_SUMMARY"
