# Promotes pending card-patch fragments (SPEC R646, issue #63): `patches ship` after every merge to
# main that touches crates/cards/patches/pending/, opened as a pull request.
#
# A branch that changes card data adds one fragment under pending/ and never edits the history.
# Once it merges, `cargo jackioh patches ship` (crates/tools, docs/v0.3.0/SURFACE.md §12) appends the
# patches in ship order, each snapshot the patch before it with the cards its fragment claims as the
# catalog holds them (R1280000), records shipped.json, deletes the fragments and bumps CATALOG_VERSION
# everywhere it lives (render.yaml, crates/server/.env.example, apps/web/.env.production). It needs
# main's whole history (fetch-depth: 0) for the commits' order and dates. It ships whenever
# `patches check` passes, which CI holds every pull request to; a refusal writes nothing, fails this
# run and opens (or comments on) an issue for the night bot, so the queue never waits unseen: patch
# v0.3.8 to v0.3.15 waited four days behind one refusal (#1280).
#
# The result goes up from `patches/ship-<short sha>`, never a `bot/` branch (bot-commands.yml treats
# those as the night bot's), and auto-merges by squash like the night bot's own pull requests. It is
# pushed and opened with BOT_GITHUB_TOKEN because a pull request opened with GITHUB_TOKEN starts no
# workflow, so the checks branch protection requires would never report.
#
# A run supersedes every promotion still open: it starts from a newer main, whose pending/ still
# holds their fragments, so it ships all of them, and it closes the older pull requests. Merging
# the promotion deletes the fragments, which touches pending/ and runs this again; with nothing
# pending it opens nothing.
#
# Once a promotion has merged (the push that runs this changed patches.json), `retitle` names the
# version on the threads it shipped (#1360, #1370): the pull request whose commit added each patch's
# fragment and the issues that pull request closes become `Patch v<version>: <what it does>`, each
# with a comment naming the version (`bot/go/internal/titles`). Versions are named by tier when they
# ship (R1366000), so no title holds one before.
#
# A promotion that is still open STUCK_AFTER_SECONDS (2 hours) after it opened, its checks done and
# one of them red or the pull request in conflict with main, did not merge itself: `watch` escalates
# it, and the technical log's pull requests (`patches/log-*`, promote-production.yml's) the same way.
# Twice a test that reads the shipped history broke only on the history a promotion ships (#1644,
# #1832), and a log sat red, then in conflict, for two days (#1727), each unseen. The watch opens one
# issue for it (or comments on the one open) queued for the night bot as `bot:build` and
# `difficulty:hard`, and assigns the bot. A promotion's fix lands on main, which a fix outside
# pending/ does not ship, so once that issue is closed the watch runs this workflow again from the
# newer main, superseding the stuck promotion with one that carries the fix. Nothing supersedes a
# log, which alone holds its commits, so its fix lands its entries on main and the watch then closes
# it. GitHub does not start this repository's scheduled runs reliably (promote-production.yml), so
# every completed CI run checks too; the check is a few API calls.
name: patches ship

on:
  push:
    branches: [main]
    paths: ["crates/cards/patches/pending/**", "crates/cards/patches/patches.json"]
  workflow_dispatch:
  # `watch` alone: hourly if GitHub starts it, and after every CI run.
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]

# The ship runs one at a time and is never cancelled; the watch runs in a group of its own, so a watch
# queued behind a ship never displaces a ship waiting its turn.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'patches-ship' || 'patches-ship-watch' }}
  cancel-in-progress: false

permissions:
  contents: read
  # The refusal's issue (the last step).
  issues: write

jobs:
  ship:
    name: promote pending fragments
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # A release build of the CLI first (the cache holds its dependencies, not the crates themselves).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          node: "false"

      # `shell: bash` runs with pipefail, so a refused promotion fails the step through `tee`. Cargo's
      # own build output goes to stderr, so the log holds only what `patches ship` printed.
      - name: ship
        shell: bash
        run: cargo jackioh patches ship | tee "$RUNNER_TEMP/ship.log"

      - name: open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing pending; no promotion to open."
            exit 0
          fi

          versions=$(sed -n 's/^patches ship: shipped //p' "$RUNNER_TEMP/ship.log" | paste -sd, - | sed 's/,/, /g')
          head=$(git rev-parse HEAD)
          branch="patches/ship-$(git rev-parse --short HEAD)"
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)

          git checkout -b "$branch"
          git add -A
          git -c user.name="$login" -c user.email="$id+$login@users.noreply.github.com" \
            commit -q -m "patches ship: $versions" \
            -m "Promotes the pending fragments on main at $head (R646): snapshots, patches.json, shipped.json, index.json and CATALOG_VERSION."
          git push -u origin "$branch"

          body=$(printf '%s\n' \
            "Promotes the card patches pending on main at $head (SPEC R646): $versions." \
            "" \
            "\`patches ship\` appended the patches in ship order, each snapshot the patch before it with the cards its fragment claims (R1280000), recorded \`shipped.json\`, deleted the fragments and bumped \`CATALOG_VERSION\`. Opened by \`.github/workflows/patches-ship.yml\`; it merges itself once CI passes.")
          url=$(gh pr create --base main --head "$branch" --title "patches ship: $versions" --body "$body")
          gh pr merge "$url" --auto --squash

          # Older promotions still open shipped a subset of what this one ships.
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("patches/ship-")) | "\(.number) \(.headRefName)"' |
            while read -r number ref; do
              [ "$ref" = "$branch" ] && continue
              gh pr close "$number" --delete-branch --comment "Superseded by $url, which ships everything this one did from a newer main."
            done
          echo "### patches ship: $versions" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # R1280000: a refused promotion leaves every pending patch unshipped and the catalog version where
      # it was, so it opens one issue (or comments on the one open) with the run, queued for the night
      # bot as ci-duration.yml queues its own, instead of failing quietly on every push to main.
      - name: report a refused promotion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="patches ship refused to promote the pending patches"
          body=$(printf '%s\n' \
            "\`cargo jackioh patches ship\` refused on main at $GITHUB_SHA ([the run]($RUN_URL)), so no pending patch shipped and \`CATALOG_VERSION\` did not move (R646, R1280000)." \
            "" \
            "The run's \`ship\` step names the refusal. Fix the fragment or the tool on a branch whose \`cargo jackioh patches check\` passes; once it merges, run this workflow again (Actions -> patches ship -> Run workflow) if it touched nothing under \`crates/cards/patches/pending/\`.")
          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label "bot:build" --label "difficulty:medium" --label "priority:high"
          fi

  # The threads of the patches this push shipped, retitled with their versions. A push that shipped
  # nothing (a fragment's own merge) changes nothing. The workflow's token: an edit made with it
  # starts no workflow, and nothing fires on a title edit anyway.
  retitle:
    name: retitle what shipped
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/harness
      - name: the shipped patches' issues and pull requests, titled with their versions
        working-directory: bot
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: harness titles shipped --before "$BEFORE" --after "$AFTER"

  # The header's stuck pull request, a promotion or a log: open STUCK_AFTER_SECONDS, no check still
  # running, and a check red or a conflict with main. One issue holds the escalations: the first opens
  # it (bot:build, difficulty:hard, assigned to the night bot), a later one while it is open comments
  # on it, each pull request once, which its `stuck #N` marker records. A log whose commits are all on
  # main's technical log already is closed instead. Once no such issue is open, a promotion it named
  # that is still stuck is shipped again from the newer main, unless main has not moved or a ship from
  # it is on its way or already ran; a log it named is left to a person. A pull request still running
  # its checks, or green and only waiting to merge, is left alone.
  watch:
    name: escalate a stuck promotion or log
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # `gh pr close`: a log whose commits are on main already.
      pull-requests: write
      # `gh run list` and `gh workflow run`: the ship again, once its issue is closed.
      actions: write
    steps:
      - name: escalate each promotion or log still stuck 2 hours after it opened
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STUCK_AFTER_SECONDS: "7200"
          NIGHT_BOT: jgoetzmann-bot
          # bot/go/internal/titles' LeftAlone holds it, so no retitle hides the issue from this.
          TITLE: "CI: a patches promotion or log is stuck"
          TECHNICAL: crates/cards/patches/technical.json
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          nl=$'\n'
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          # The commits a ref's technical log holds, sorted for `comm`.
          logged() {
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$TECHNICAL?ref=$1" | jq -r '.[].commit' | sort -u
          }
          on_main=$(logged main)
          gh pr list --repo "$REPO" --state open --base main --limit 50 \
            --json number,headRefName,createdAt,url,body \
            --jq '.[] | select(.headRefName | startswith("patches/ship-") or startswith("patches/log-")) | [.number, .headRefName, .createdAt, .url, (((.body // "") | capture("pending on main at (?<sha>[0-9a-f]{40})") | .sha) // "")] | @tsv' |
            while IFS=$'\t' read -r number head created url base; do
              case "$head" in patches/log-*) kind=log ;; *) kind=ship ;; esac
              age=$(( now - $(date -u -d "$created" +%s) ))
              if [ "$age" -lt "$STUCK_AFTER_SECONDS" ]; then
                echo "#$number: open $((age / 60)) minutes; waiting"
                continue
              fi
              state=$(gh pr view "$number" --repo "$REPO" --json mergeable,statusCheckRollup)
              running=$(jq '[(.statusCheckRollup // [])[] | select((.status != null and .status != "COMPLETED") or (.state == "PENDING" or .state == "EXPECTED"))] | length' <<<"$state")
              if [ "$running" -gt 0 ]; then
                echo "#$number: $running check(s) still running; waiting"
                continue
              fi
              failed=$(jq -r '(.statusCheckRollup // [])[] | select(((.conclusion // .state) // "") as $c | ["FAILURE", "TIMED_OUT", "STARTUP_FAILURE", "ERROR", "ACTION_REQUIRED"] | index($c)) | "- [\(.name // .context)](\(.detailsUrl // .targetUrl))"' <<<"$state")
              # GitHub neither runs a conflicted pull request's checks again nor merges it.
              if [ "$(jq -r .mergeable <<<"$state")" = CONFLICTING ]; then
                failed="${failed:+$failed$nl}- a conflict with main"
              fi
              if [ -z "$failed" ]; then
                echo "#$number: every check passed and no conflict; left to merge itself"
                continue
              fi

              # A log whose commits are all on main's technical log (its fix landed them) has nothing
              # left to land. Nothing else supersedes one: a later log holds only what went live later.
              missing=""
              if [ "$kind" = log ]; then
                on_head=$(logged "$head")
                [ -n "$on_head" ] || { echo "::error::#$number: $head's technical log reads as empty"; exit 1; }
                missing=$(comm -23 <(printf '%s\n' "$on_head") <(printf '%s\n' "$on_main"))
                if [ -z "$missing" ]; then
                  gh pr close "$number" --repo "$REPO" --comment "Every commit this pull request logs is on main's technical log already, so it has nothing left to land."
                  echo "#$number: its commits are on main; closed"
                  continue
                fi
              fi

              # Whole, so #18's marker is not found in #1832's.
              marker="<!-- stuck #$number -->"
              issues=$(gh issue list --repo "$REPO" --state all --search "in:title \"$TITLE\"" --limit 50 \
                --json number,title,state,body,comments \
                --jq "[.[] | select(.title == \"$TITLE\")]")
              open=$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<<"$issues")
              named=$(jq -r --arg marker "$marker" '[.[] | select(((.body // "") | contains($marker)) or ([.comments[].body // ""] | any(contains($marker))))] | length' <<<"$issues")

              if [ "$named" -eq 0 ]; then
                if [ "$kind" = log ]; then
                  note=$(printf '%s\n' \
                    "$marker" \
                    "The technical log's pull request $url (\`patches log\`, R1369000) has been open over 2 hours and did not merge itself:" \
                    "" \
                    "$failed" \
                    "" \
                    "Until its entries are on main, the $(wc -l <<<"$missing") commit(s) it logs are missing from the technical log, and nothing logs them again: a later log holds only what went live after it." \
                    "" \
                    "Fix it on a branch from main: add the entries this pull request adds to \`$TECHNICAL\` as they are, each after the entry it follows here, and keep main's, each commit once (\`cargo jackioh patches check\` holds the file's shape). Keep their \`version\`, the patch that was live when they went live (R1369000): \`cargo jackioh patches log\` run again would log them on today's. Fix too any check red here that is red on main. Close this issue with that pull request; the watch in \`.github/workflows/patches-ship.yml\` then closes this one." \
                    "" \
                    "If they are red for a reason outside the repository (CI or Render out of minutes, a spending limit, billing, an account, a runner that never started), no change here fixes it: open the plan with a \`**Human required:**\` line saying what a person must do, and build nothing.")
                else
                  note=$(printf '%s\n' \
                    "$marker" \
                    "The card-patch promotion $url (\`patches ship\`, R646) has been open over 2 hours and did not merge itself:" \
                    "" \
                    "$failed" \
                    "" \
                    "Until it merges, the patches it ships are not live as versions: \`CATALOG_VERSION\` stays where it was and the patch notes do not show them." \
                    "" \
                    "Fix it on a branch from main: a check that only fails here usually reads the shipped history (\`crates/cards/patches/\`) and must hold for the history this promotion ships, so check out its branch and run the failing tests there to see it fail first, then show them pass there with the fix. A conflict alone needs no fix. Close this issue with the fix's pull request (or, for a conflict alone, by hand); the watch in \`.github/workflows/patches-ship.yml\` then ships again from the newer main, and that promotion supersedes this one." \
                    "" \
                    "If they are red for a reason outside the repository (CI or Render out of minutes, a spending limit, billing, an account, a runner that never started), no change here fixes it: open the plan with a \`**Human required:**\` line saying what a person must do, and build nothing.")
                fi
                if [ -n "$open" ]; then
                  gh issue comment "$open" --repo "$REPO" --body "$note"
                  echo "#$number: stuck; commented on #$open"
                else
                  issue=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$note" \
                    --label "bot:build" --label "difficulty:hard" --label "priority:high")
                  # The label queues it; the assignment is the bot's other way in, and a refused one
                  # leaves the queued issue as it is.
                  gh issue edit "$issue" --repo "$REPO" --add-assignee "$NIGHT_BOT" ||
                    echo "::warning::could not assign $NIGHT_BOT to $issue; it is queued by its bot:build label"
                  echo "#$number: stuck; opened $issue"
                fi
                continue
              fi

              # Named in an issue already: wait while one is open. A log whose issue closed with its
              # commits still off main is a person's to look at; a promotion ships again from a newer main.
              if [ -n "$open" ]; then
                echo "#$number: stuck; #$open is open"
                continue
              fi
              if [ "$kind" = log ]; then
                echo "::warning::#$number: stuck, its issue closed, and it still logs $(wc -l <<<"$missing") commit(s) main's technical log does not"
                continue
              fi
              if [ "$base" = "$main" ]; then
                echo "#$number: stuck, its issue closed, but main has not moved since it shipped"
                continue
              fi
              # Once per main: a ship refused there (its own issue above) is not dispatched again on
              # every CI run until main moves.
              active=$(gh run list --repo "$REPO" --workflow patches-ship.yml --event workflow_dispatch --limit 20 \
                --json status,headSha | jq --arg main "$main" '[.[] | select(.status != "completed" or .headSha == $main)] | length')
              if [ "$active" -gt 0 ]; then
                echo "#$number: stuck, its issue closed; a ship from main at $main is on its way or already ran"
                continue
              fi
              gh workflow run patches-ship.yml --repo "$REPO" --ref main
              echo "#$number: stuck, its issue closed; shipping again from main at $main"
            done
