# Promotes pending card-patch fragments (SPEC R646, issue #63): `patches ship` after every merge to
# main that touches crates/cards/patches/pending/, opened as a pull request.
#
# A branch that changes card data adds one fragment under pending/ and never edits the history.
# Once it merges, `cargo jackioh patches ship` (crates/tools, docs/v0.3.0/SURFACE.md §12) appends the
# patches in ship order, each snapshot the patch before it with the cards its fragment claims as the
# catalog holds them (R1280000), records shipped.json, deletes the fragments and bumps CATALOG_VERSION
# everywhere it lives (render.yaml, crates/server/.env.example, apps/web/.env.production). It needs
# main's whole history (fetch-depth: 0) for the commits' order and dates. It ships whenever
# `patches check` passes, which CI holds every pull request to; a refusal writes nothing, fails this
# run and opens (or comments on) an issue for the night bot, so the queue never waits unseen: patch
# v0.3.8 to v0.3.15 waited four days behind one refusal (#1280).
#
# The result goes up from `patches/ship-<short sha>`, never a `bot/` branch (bot-commands.yml treats
# those as the night bot's), and auto-merges by squash like the night bot's own pull requests. It is
# pushed and opened with BOT_GITHUB_TOKEN because a pull request opened with GITHUB_TOKEN starts no
# workflow, so the checks branch protection requires would never report.
#
# A run supersedes every promotion still open: it starts from a newer main, whose pending/ still
# holds their fragments, so it ships all of them, and it closes the older pull requests. Merging
# the promotion deletes the fragments, which touches pending/ and runs this again; with nothing
# pending it opens nothing.
name: patches ship

on:
  push:
    branches: [main]
    paths: ["crates/cards/patches/pending/**"]
  workflow_dispatch:

concurrency:
  group: patches-ship
  cancel-in-progress: false

permissions:
  contents: read
  # The refusal's issue (the last step).
  issues: write

jobs:
  ship:
    name: promote pending fragments
    runs-on: ubuntu-latest
    # A release build of the CLI first (the cache holds its dependencies, not the crates themselves).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          node: "false"

      # `shell: bash` runs with pipefail, so a refused promotion fails the step through `tee`. Cargo's
      # own build output goes to stderr, so the log holds only what `patches ship` printed.
      - name: ship
        shell: bash
        run: cargo jackioh patches ship | tee "$RUNNER_TEMP/ship.log"

      - name: open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing pending; no promotion to open."
            exit 0
          fi

          versions=$(sed -n 's/^patches ship: shipped //p' "$RUNNER_TEMP/ship.log" | paste -sd, - | sed 's/,/, /g')
          head=$(git rev-parse HEAD)
          branch="patches/ship-$(git rev-parse --short HEAD)"
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)

          git checkout -b "$branch"
          git add -A
          git -c user.name="$login" -c user.email="$id+$login@users.noreply.github.com" \
            commit -q -m "patches ship: $versions" \
            -m "Promotes the pending fragments on main at $head (R646): snapshots, patches.json, shipped.json, index.json and CATALOG_VERSION."
          git push -u origin "$branch"

          body=$(printf '%s\n' \
            "Promotes the card patches pending on main at $head (SPEC R646): $versions." \
            "" \
            "\`patches ship\` appended the patches in ship order, each snapshot the patch before it with the cards its fragment claims (R1280000), recorded \`shipped.json\`, deleted the fragments and bumped \`CATALOG_VERSION\`. Opened by \`.github/workflows/patches-ship.yml\`; it merges itself once CI passes.")
          url=$(gh pr create --base main --head "$branch" --title "patches ship: $versions" --body "$body")
          gh pr merge "$url" --auto --squash

          # Older promotions still open shipped a subset of what this one ships.
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("patches/ship-")) | "\(.number) \(.headRefName)"' |
            while read -r number ref; do
              [ "$ref" = "$branch" ] && continue
              gh pr close "$number" --delete-branch --comment "Superseded by $url, which ships everything this one did from a newer main."
            done
          echo "### patches ship: $versions" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # R1280000: a refused promotion leaves every pending patch unshipped and the catalog version where
      # it was, so it opens one issue (or comments on the one open) with the run, queued for the night
      # bot as ci-duration.yml queues its own, instead of failing quietly on every push to main.
      - name: report a refused promotion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="patches ship refused to promote the pending patches"
          body=$(printf '%s\n' \
            "\`cargo jackioh patches ship\` refused on main at $GITHUB_SHA ([the run]($RUN_URL)), so no pending patch shipped and \`CATALOG_VERSION\` did not move (R646, R1280000)." \
            "" \
            "The run's \`ship\` step names the refusal. Fix the fragment or the tool on a branch whose \`cargo jackioh patches check\` passes; once it merges, run this workflow again (Actions -> patches ship -> Run workflow) if it touched nothing under \`crates/cards/patches/pending/\`.")
          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label "bot:build" --label "difficulty:medium" --label "priority:high"
          fi
