# CI for JackiOh after v0.3.0 (#306, docs/v0.3.0/README.md §7): the essential checks on every pull
# request, each job under five minutes; everything slow or statistical runs once a day in super.yml.
#
# Branch protection and the bots' `required_checks` (.harness/config.json, .squishy/config.json)
# wait on five names: `rust`, `web`, `e2e smoke` and `db` here, and `bot selftest` (bot-selftest.yml).
# Each of the four is a summary job that needs its pieces and fails unless every piece passed. A
# summary job runs `if: !cancelled()`, never on plain `needs`: a required check SKIPPED because a
# piece failed would count as passing. The pieces run side by side and each aims to finish under
# five minutes (ci-duration.yml opens an issue past seven, #73); a piece that grows is split further
# (a longer matrix list, or the test step by crate), never folded back into one long job.
#
#   rust       fmt and clippy; cargo test with the generated-types diff (V20); the release build of
#              jackioh and jackioh-server, made once for the run; the catalog, patches and spec checks
#              and 200 fuzz seeds on that build; and, on a pull request from a training lane's ai/*
#              branch, the training gate (README §8).
#   web        the WASM module and the e2e client, built once for the run; typecheck and eslint; the
#              web's unit tests in thirds, without the audio, fx and asset tests.
#   e2e smoke  Chrome only, specs 01, 06, 10, 13 and 19 (e2e/scripts/shard-specs.mjs SMOKE) against
#              the release jackioh-server, in two shards that each boot their own server.
#   db         sql, the store contract and the Render deploy rehearsal against a real Postgres, only
#              when the pull request touches what they test (scripts/ci-scope.sh's `db`); a skip passes.
#
# The release build, the WASM module and the built client travel between jobs as artifacts
# (`rust-release`, `web-build`), so each is compiled once per run, not once per job that uses it.
#
# Not run per pull request (README §7): e2e on Electron (dropped), the AI gates, coverage, the
# 10,000-seed fuzz runs, `golden check` (cargo test replays the same traces), every e2e spec beyond
# the smoke list, the component specs and the web's audio, fx and asset tests. super.yml runs them
# daily, and opens an issue when they fail.
#
# A pull request that changes only files no job here reads (`scripts/ci-scope.sh` lists them: the
# night bot's code and switches, the workflows that run the bot, the agent instruction files, the
# training lanes' prompts) skips every job below except `bot selftest`, which has its own workflow and
# always runs. The `changes` job decides; each job below it runs `if: needs.changes.outputs.full ==
# 'true'`, so a skip is a job-level skip, which counts as passing for a required check (a
# workflow-level `paths:` filter would leave the check pending forever), and the summary jobs accept
# "skipped" only on `full == 'false'`. A push to main, a dispatch, and any doubt run everything.
#
# `workflow_dispatch` lets a person run all of it on any branch (`gh workflow run ci.yml --ref
# staging`); the v0.3.0 rewrite's first full run is its cutover pull request (part 38).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's newer push replaces its running CI. main's never does: when every push to main
  # cancelled the run before it, a busy afternoon (the night bot merges every few minutes) left no
  # commit of main green for hours, and promote-production.yml, which takes only commits whose
  # push-to-main CI passed, had nothing to ship. On main a newer push waits behind the running one,
  # and GitHub keeps only the newest waiting, so main is green at most a run or two behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No secret belongs in this file: SUPABASE_SECRET_KEY and CODE_PEPPER are the two that must never be
# committed, which is why .gitignore carries `.env`. The catalog version is compiled into the binaries
# from crates/cards/patches/patches.json, and the server refuses to boot on a different one, so it is
# not set here either.
env:
  CARGO_TERM_COLOR: always

jobs:
  # `full` is `false` only for a pull request whose every changed file is on scripts/ci-scope.sh's
  # skip list, and `db` is `true` only when the db job's own paths changed. A failed `changes` job
  # leaves both empty and skips every job below it, which fails each summary job (it accepts a skip
  # only on `full == 'false'`, or for db on `db == 'false'`).
  changes:
    name: what the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      db: ${{ steps.scope.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            sh scripts/ci-scope.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'full=true\ndb=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------------------------------------
  # rust
  # ------------------------------------------------------------------------------------------------

  # The pure crates' purity is their clippy.toml (SURFACE §3), so clippy is the purity gate too.
  rust-lint:
    name: rust (fmt, clippy)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Every crate's tests: the engine's rules and golden replay, every card, the AI's units, the server
  # on the fake store, the tools. The two features are the engine's: testkit, which its `rules`
  # binary requires, and ts, whose export_bindings tests write apps/web/src/wire/generated/ (SURFACE
  # §5.1) in the same run as the export_config tests that write engineConfig.ts and serverConfig.ts.
  # What they wrote must be what is committed (V20).
  rust-test:
    name: rust (test)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: cargo test --workspace
        run: cargo test --workspace --features jackioh-engine/testkit,jackioh-engine/ts
      - name: the web's generated types and constants are what the Rust exports (V20)
        run: |
          changed=$(git status --porcelain -- apps/web/src/wire)
          if [ -n "$changed" ]; then
            echo "::error::apps/web/src/wire/ differs from what the Rust generates. Regenerate it with \`cargo test --workspace --features jackioh-engine/testkit,jackioh-engine/ts\` and commit the result."
            echo "$changed"
            git --no-pager diff --stat -- apps/web/src/wire
            exit 1
          fi

  # The release binaries, built once for the run: `jackioh` (the CLI, which e2e spec 01's replay
  # check also runs) and `jackioh-server` (which e2e smoke boots). The checks run on them in their own
  # job, so a failed check never keeps the binaries from e2e smoke.
  rust-build:
    name: rust (release build)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: jackioh and jackioh-server
        run: cargo build --release -p jackioh-server -p jackioh-tools
      # A tarball keeps the executable bits an artifact would drop.
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/rust-release.tgz" target/release/jackioh target/release/jackioh-server
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}/rust-release.tgz
          if-no-files-found: error
          retention-days: 1

  # `cargo jackioh <command>` (SURFACE §12) without the cargo: the binary rust-build made.
  rust-checks:
    name: rust (checks, fuzz 200)
    needs: [changes, rust-build]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack the binaries
        run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: catalog data (catalog check)
        run: target/release/jackioh catalog check
      - name: every catalog change claimed by a pending fragment (patches check)
        run: target/release/jackioh patches check
      - name: every ruling has its proof, every cited R-id its note (spec check)
        run: target/release/jackioh spec check
      - name: fuzz, seeds 1-200
        run: target/release/jackioh fuzz --seeds 200

  # README §8: a pull request from a training lane's branch (ai/improve, ai/unban) may change only
  # crates/ai/** and training/history/**, must be exactly one generation on from main, and must pass
  # its lane's promotion gate again here, against main's AI with the same seeds. A lane's own claim is
  # never trusted. Any other pull request skips this job and the `rust` summary accepts the skip, so
  # it needs no required-check name of its own. It plays 200 games, so it may take longer than the
  # other pieces; ci-duration.yml does not report it.
  training-gate:
    name: rust (training gate)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The branch's own commit, not the merge commit GitHub makes: promote seeds its games from
      # `git rev-parse HEAD:crates/ai/src`, as the lane's run did. All history, for main's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # git and jq only, so a branch that may not promote fails before anything compiles.
      - id: claim
        name: only the AI and its history changed, one generation on from main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          lane=${HEAD_REF#ai/}
          case "$lane" in
            improve | unban) ;;
            *) echo "::error::$HEAD_REF is not a training lane's branch (ai/improve or ai/unban)"; exit 1 ;;
          esac
          # --no-renames, so a file moved into crates/ai/ still shows where it came from.
          outside=$(git diff --no-renames --name-only "$BASE...HEAD" | grep -Ev '^(crates/ai/|training/history/)' || true)
          if [ -n "$outside" ]; then
            echo "::error::a training lane may change only crates/ai/** and training/history/** (docs/v0.3.0/README.md §8). This branch also changes:"
            echo "$outside"
            exit 1
          fi
          parent=$(git show "$BASE:crates/ai/generation.json" | jq -er .generation)
          generation=$(jq -er .generation crates/ai/generation.json)
          if [ "$generation" -ne $((parent + 1)) ]; then
            echo "::error::crates/ai/generation.json is generation $generation; main's is $parent, so a promotion from it is $((parent + 1))"
            exit 1
          fi
          named=$(jq -er .lane crates/ai/generation.json)
          if [ "$named" != "$lane" ]; then
            echo "::error::crates/ai/generation.json names the lane $named, but the branch is $HEAD_REF"
            exit 1
          fi
          history="training/history/$lane.jsonl"
          if [ ! -s "$history" ] || [ "$(tail -n 1 "$history" | jq -cS .)" != "$(jq -cS . crates/ai/generation.json)" ]; then
            echo "::error::$history must end with the record crates/ai/generation.json holds (promote writes both)"
            exit 1
          fi
          echo "generation $generation of the $lane lane, on main's $parent"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          node: "false"
      # Built from main's commit in a worktree beside this one, into the same target directory so the
      # dependencies compile once; copied out before the branch's own build replaces target/release.
      - name: main's jackioh, the parent
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" "$BASE"
          cargo build --release -p jackioh-tools --manifest-path "$RUNNER_TEMP/main/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target"
          cp target/release/jackioh "$RUNNER_TEMP/parent-jackioh"
      - name: the lane's gate, played again against the parent (promote --verify)
        env:
          LANE: ${{ steps.claim.outputs.lane }}
        run: |
          cargo build --release -p jackioh-tools
          target/release/jackioh promote --lane "$LANE" --parent-bin "$RUNNER_TEMP/parent-jackioh" --verify

  rust:
    name: rust
    needs: [changes, rust-lint, rust-test, rust-build, rust-checks, training-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every piece passed
        env:
          FULL: ${{ needs.changes.outputs.full }}
          LINT: ${{ needs.rust-lint.result }}
          TEST: ${{ needs.rust-test.result }}
          BUILD: ${{ needs.rust-build.result }}
          CHECKS: ${{ needs.rust-checks.result }}
          TRAINING: ${{ needs.training-gate.result }}
          AI_BRANCH: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/') }}
        run: |
          echo "full=$FULL lint=$LINT test=$TEST build=$BUILD checks=$CHECKS training-gate=$TRAINING (ai/* branch: $AI_BRANCH)"
          if [ "$FULL" = false ]; then
            echo "only files no job reads changed (scripts/ci-scope.sh)"
            exit 0
          fi
          test "$LINT" = success
          test "$TEST" = success
          test "$BUILD" = success
          test "$CHECKS" = success
          if [ "$AI_BRANCH" = true ]; then
            test "$TRAINING" = success
          fi

  # ------------------------------------------------------------------------------------------------
  # web
  # ------------------------------------------------------------------------------------------------

  # The WASM module (scripts/build-wasm.sh, SURFACE §10.2) and the e2e client (`pnpm build:e2e`,
  # which BUILD M5-T3's `window.__jackioh` needs: a plain `build` strips it), once for the run. The
  # unit tests and the typecheck read the module; e2e smoke serves the client.
  wasm:
    name: web (wasm, client build)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: the WASM module
        run: sh scripts/build-wasm.sh
      - name: the e2e client
        run: pnpm build:e2e
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/web-build.tgz" apps/web/src/wasm/pkg apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tgz
          if-no-files-found: error
          retention-days: 1

  web-check:
    name: web (typecheck, eslint)
    needs: [changes, wasm]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # Before the module is unpacked, so its generated JavaScript is never linted.
      - name: eslint
        run: pnpm exec eslint apps/web e2e
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}
      - name: unpack the WASM module
        run: tar -xzf "$RUNNER_TEMP/web-build.tgz"
      - name: typecheck the web
        run: pnpm --dir apps/web typecheck
      - name: typecheck the e2e specs and the component specs
        run: pnpm --dir e2e typecheck && pnpm --dir e2e typecheck:component

  # In thirds, by file. The audio and fx layers and the asset tests (the recorded voice and music,
  # the card art convention) run in super.yml instead: cosmetic, large, and broken on Linux by every
  # new card until its assets are rendered (docs/v0.3.0/research/D-ci-spec.md §2.4).
  web-unit:
    name: web (unit ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, wasm]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}
      - name: unpack the WASM module
        run: tar -xzf "$RUNNER_TEMP/web-build.tgz"
      - name: vitest
        run: >-
          pnpm exec vitest run --project web --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --exclude '**/src/audio/**' --exclude '**/src/fx/**' --exclude '**/src/cards/art/convention.test.ts'

  web:
    name: web
    needs: [changes, wasm, web-check, web-unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every piece passed
        env:
          FULL: ${{ needs.changes.outputs.full }}
          WASM: ${{ needs.wasm.result }}
          CHECK: ${{ needs.web-check.result }}
          UNIT: ${{ needs.web-unit.result }}
        run: |
          echo "full=$FULL wasm=$WASM check=$CHECK unit=$UNIT"
          if [ "$FULL" = false ]; then
            echo "only files no job reads changed (scripts/ci-scope.sh)"
            exit 0
          fi
          test "$WASM" = success
          test "$CHECK" = success
          test "$UNIT" = success

  # ------------------------------------------------------------------------------------------------
  # e2e smoke
  # ------------------------------------------------------------------------------------------------

  # One smoke per user-facing flow, on Chrome, against this run's release jackioh-server and client
  # (.github/actions/e2e-shard says why each shard boots its own server).
  e2e-smoke-shard:
    name: e2e smoke (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, wasm, rust-build]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: ./.github/actions/e2e-shard
        with:
          specs: smoke
          shard: ${{ matrix.shard }}
          shards: ${{ strategy.job-total }}

  e2e-smoke:
    name: e2e smoke
    needs: [changes, e2e-smoke-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          FULL: ${{ needs.changes.outputs.full }}
          SHARDS: ${{ needs.e2e-smoke-shard.result }}
        run: |
          echo "full=$FULL shards=$SHARDS"
          if [ "$FULL" = false ]; then
            echo "only files no job reads changed (scripts/ci-scope.sh)"
            exit 0
          fi
          test "$SHARDS" = success

  # ------------------------------------------------------------------------------------------------
  # db
  # ------------------------------------------------------------------------------------------------

  # What only a real Postgres can measure, each suite starting its own container (no `services:`
  # block: the scripts drive Docker themselves and need no secret and no DATABASE_URL from here).
  #   sql invariants   BUILD M6-T3's raw SQL test: RLS under `authenticated`, the append-only
  #                    triggers, the SECURITY DEFINER boundaries, the unique indexes (V17).
  #   store contract   the store contract suite against PgStore, as `cargo test` runs it against the
  #                    fake (V16).
  #   deploy rehearsal Render's deploy before it happens: the Docker image on render.yaml's settings,
  #                    migrating as a role that is not a superuser, as Supabase's is not, then a
  #                    production boot held to the readiness probe and the free instance's memory
  #                    (V22). Migration 0013 passed every superuser suite and then failed Render's
  #                    deploy: this is the suite that would have caught it.
  # Per pull request only when it touches what they test (scripts/ci-scope.sh's `db`); daily in
  # super.yml regardless.
  db-suite:
    name: db (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: sql invariants
            script: crates/server/tests/sql/run.sh
            rust: false
          - suite: store contract
            script: crates/server/tests/db/run.sh
            rust: true
          - suite: deploy rehearsal
            script: crates/server/tests/deploy/rehearse.sh
            rust: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: ${{ matrix.rust }}
        with:
          node: "false"
      - name: pre-pull postgres
        run: docker pull postgres:16
      - name: ${{ matrix.suite }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: sh "$SCRIPT"

  db:
    name: db
    needs: [changes, db-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every suite passed, or none was needed
        env:
          FULL: ${{ needs.changes.outputs.full }}
          DB: ${{ needs.changes.outputs.db }}
          SUITES: ${{ needs.db-suite.result }}
        run: |
          echo "full=$FULL db=$DB suites=$SUITES"
          if [ "$FULL" = false ] || [ "$DB" = false ]; then
            echo "nothing the db suites test changed (scripts/ci-scope.sh); super.yml runs them daily"
            exit 0
          fi
          test "$SUITES" = success
