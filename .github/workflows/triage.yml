# Triage (bot/harness/triage.py): an issue someone trusted labels `method:manual` or
# `method:use-bot` (#307), or a bot suggestion a person labels `bot:approved` (which counts as
# `method:use-bot`), two minutes after the label goes on, and each pull request someone
# trusted opens, gets its labels, its assignees, a title that follows docs/issues-and-patches.md
# and, for an issue, its dependencies (blocked by, blocks, its patch's tracker as parent), from a
# Muse call. `method:manual` makes an issue `human` and assigns both people; `method:use-bot`
# queues it for the bot and assigns the bot. Then it takes the labels that asked for it off (the
# method label, `bot:approved`, a decided suggestion's `bot:suggestion`, and for `method:manual`
# the bot's queue labels) and comments that it classified the thread. Call it on any thread with
# `gh workflow run triage.yml -f number=<n>`: an issue with no method label (one triage already
# answered) is classified again without one.
#
# gate -> classify -> apply. Only classify runs a model, on Muse's runner on the bot's machine
# (night-vm-muse; it ran on Devin's until #317), and it holds no write token: it reads the thread's
# title and body through the API and writes the answer as an artifact. apply, on GitHub's runner,
# holds the write token and runs no model; it checks the answer against the thread and the
# repository before changing anything. None of the jobs checks out pull request code. A stranger's
# issue or pull request stops at the gate, so its text never reaches the machine. Any failure
# skips quietly.
name: triage

on:
  # A label set while the issue is being opened sends `labeled` too.
  issues:
    types: [labeled]
  # _target: this repository's workflow runs, never code from the pull request.
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: "The issue or pull request to triage (again)"
        required: true

permissions: {}

# A run for any label but a method label (or bot:approved) gets a group of its own and is skipped
# at once, so a `difficulty:*` or `priority:*` label a person adds during the two-minute wait never
# cancels the method run. A newer method label cancels an older method run, and the wait starts
# again.
concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}${{ github.event_name == 'issues' && !startsWith(github.event.label.name, 'method:') && github.event.label.name != 'bot:approved' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gate:
    name: gate
    if: github.event_name != 'issues' || startsWith(github.event.label.name, 'method:') || github.event.label.name == 'bot:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read           # a dispatched thread's title, body and author
      pull-requests: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
      number: ${{ steps.gate.outputs.number }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Trusted author (owner, member, collaborator or .harness/trust.txt), not the bot itself
      # unless it is the bot's suggestion a person approved, an issue with exactly one method
      # label (bot:approved counts as method:use-bot; never `human` with it), and Muse switched
      # on (providers.json). A method label waits two minutes and reads the issue again;
      # a dispatch names the thread, which the gate reads read-only.
      - name: Should this be triaged?
        id: gate
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m harness triage gate --payload "$GITHUB_EVENT_PATH"

  classify:
    name: classify
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: night-vm-muse
    timeout-minutes: 15
    permissions:
      contents: read         # the default branch's code and conventions
      issues: read           # the thread's title, body and labels
      pull-requests: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Ask Muse
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only; never in Muse's environment
          NUMBER: ${{ needs.gate.outputs.number }}
        run: |
          python3 -m harness triage classify --number "${NUMBER}" \
            --verdict "$RUNNER_TEMP/triage/verdict.json"

      - name: Keep the answer
        uses: actions/upload-artifact@v4
        with:
          name: triage
          path: ${{ runner.temp }}/triage
          if-no-files-found: ignore
          retention-days: 7

  apply:
    name: apply
    needs: [gate, classify]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the answer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: triage
          path: ${{ runner.temp }}/triage

      # Labels from the repository's own set (no bot:*), assignees only the two people or the
      # bot, a title only when the old one breaks the convention, dependencies only to open
      # issues; removes the assignee a method label moves, then the labels that asked for the
      # triage, and comments that it classified the thread. The method label's own labels and
      # assignees, and the links the issue's own text gives, are made even when Muse gave no
      # answer. A dispatch (`--asked`) classifies an issue that has no method label.
      - name: Label, assign, title, link and say so
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.gate.outputs.number }}
          FROM_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          flag=""
          if [ "${FROM_DISPATCH}" = "true" ]; then flag="--asked"; fi
          python3 -m harness triage apply --number "${NUMBER}" \
            --verdict "$RUNNER_TEMP/triage/verdict.json" ${flag}
