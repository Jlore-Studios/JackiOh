# Triage (bot/harness/triage.py, #664), from fixed rules and no model. An issue someone trusted
# opens gets its issue form's answers as labels (difficulty, priority, and who does it: `bot:build`
# or `human`), the type label its title's prefix names, and an issue type; a pull request someone
# trusted opens gets its type label; an issue a person labels `human` is assigned to both people
# and leaves the bot's queue. Call it on any thread with `gh workflow run triage.yml -f number=<n>`.
#
# The job reads the thread through the API and matches it against fixed patterns: nothing in it
# runs, and nothing checks out pull request code. Labels it puts on with its own token start no
# workflow; the night bot's queue reads `bot:build` by label, so a form's `bot:build` still
# queues. Any failure skips quietly.
name: triage

on:
  # A label set while the issue is being opened sends `labeled` too.
  issues:
    types: [opened, labeled]
  # _target: this repository's workflow runs, never code from the pull request.
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: "The issue or pull request to triage (again)"
        required: true

permissions: {}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  triage:
    name: triage
    # Any label but `human` asks nothing of triage, so its run is skipped at once.
    if: github.event_name != 'issues' || github.event.action == 'opened' || github.event.label.name == 'human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Trusted author (owner, member, collaborator or .harness/trust.txt) for a new thread, not
      # the bot or an app, which label their own; a person for `human`; anyone's thread for a
      # dispatch, which names it.
      - name: Label, type and assign
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m harness triage --payload "$GITHUB_EVENT_PATH"
