# The night bot (bot/README.md): gate -> plan -> work -> deliver.
#
# Each run takes one item on one subscription (.harness/providers.json): a Claude account, ChatGPT
# through Codex, Google through Antigravity (agy), or Meta through Muse. Up to `max_parallel` runs
# go at once, each on a different subscription; plan, serialized below, decides which.
#
# The model job runs where its subscription's `runs_on` says: GitHub's ubuntu-latest, or that
# subscription's own runner on the bot's machine (night-vm-<id>, one Linux user each, holding
# only its own login; bot/machine/README.md). The machine starts itself when such a job queues
# and powers off when idle. gate, plan and deliver always run on GitHub's runners.
#
# gate starts nothing unless there is work a free subscription can take; it no longer waits
# for the shared Claude subscription (claude-1) to be quiet, though a run on claude-1 still
# names its model step so the partner bot (bright-bots-harness) excuses the spending.
# plan and deliver hold the bot
# account's token and run no model. gate and work hold a model secret and no GitHub write token;
# work holds only the one secret of the subscription plan chose, and its output is a result file
# and a git bundle that deliver checks for itself before pushing.
#
# With `controller` on (.harness/config.json, #1455), bot-status's loop plans the work and starts
# each run with its plan made (bot/harness/controller.py): `plan_ref` names the plan, which the loop
# wrote to the state branch, and `runs_on`, `cli`, `secret` and `shared` are its runner, CLI,
# secret name and shared flag. Such a run skips gate and plan, so it waits in GitHub's queue once,
# for its model job, not three times; work's first step holds those inputs to the plan and to
# providers.json before any step is handed a secret, and deliver reads the plan from the state
# branch, where the model job cannot write. A run started any other way (the schedule, a command,
# a person) gates and plans itself, and its gate defers to the loop while the loop is going.
name: bot-night
# A run started with its plan names it, and where its model job runs: the loop finds its run by
# this title, and Squishy counts a run on GitHub's runners against the slots the bots share.
run-name: ${{ inputs.plan_ref && format('bot-night {0} on {1}', inputs.plan_ref, inputs.runs_on) || 'bot-night' }}

on:
  schedule:
    # Hourly at :17, all day. Each subscription has its own hours (providers.json), and a firing
    # with nothing a free subscription can take ends in seconds. GitHub starts scheduled runs late
    # and sometimes drops them, so the bot-commands sweep also starts a run every ten minutes when
    # a lane is free, and a run that claims or finishes an item starts the next one itself.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Issue or PR number (blank: the planner picks)"
        required: false
        default: ""
      force:
        description: "Run even outside the subscriptions' hours"
        type: boolean
        default: false
      mode:
        description: "What to do"
        type: choice
        options: [auto, build, revise, review, suggest]
        default: auto
      dry_run:
        description: "Record GitHub writes instead of sending them"
        type: boolean
        default: false
      plan_ref:
        description: "Set by bot-status's loop (#1455): its plan on the state branch, plans/<ref>.json. Empty: the run gates and plans itself"
        required: false
        default: ""
      runs_on:
        description: "With plan_ref: the plan's runner"
        required: false
        default: ""
      cli:
        description: "With plan_ref: the plan's CLI"
        required: false
        default: ""
      secret:
        description: "With plan_ref: the name of the plan's secret (work checks it against providers.json)"
        required: false
        default: ""
      shared:
        description: "With plan_ref: whether the plan's subscription is the shared one"
        required: false
        default: ""

# No workflow-wide concurrency group: runs on different subscriptions go in parallel. The plan
# job alone is serialized (below), so two runs never claim the same item or subscription.

permissions: {}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HARNESS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}

jobs:
  gate:
    name: gate
    # A run the status loop started with its plan needs no gate and no plan (#1455).
    if: ${{ !inputs.plan_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20     # no step waits any more (the quiet wait is retired): reads and a peek
    permissions:
      contents: read         # the queue and the state file; no write of any kind
      actions: read          # whether a run that holds an item is still alive
    outputs:
      # Go when there is work, unless it waits for the shared subscription and that is not quiet
      # and no other subscription could take work instead.
      go: ${{ steps.peek.outputs.work == 'true' && (steps.peek.outputs.quiet_check != 'true' || steps.quiet.outputs.quiet == 'true' || steps.peek.outputs.fallback == 'true') }}
      quiet_ok: ${{ steps.quiet.outputs.quiet == 'true' && steps.peek.outputs.quiet_provider || '' }}
    steps:
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" = "200" ]; then
            echo "halted by .harness/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the default branch
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Python
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Reads only. Nothing a free subscription can take means no usage reading and no wait.
      - name: Is there work? (harness peek)
        id: peek
        if: steps.halt.outputs.halted != 'true'
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Which provider secrets exist, never their values (providers.SECRETS).
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_7' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          INPUT_ITEM: ${{ github.event.inputs.item }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          force=""
          if [ "${INPUT_FORCE}" = "true" ]; then force="--force"; fi
          python -m harness peek --item "${INPUT_ITEM}" --mode "${INPUT_MODE:-auto}" ${force}

      - name: Install the claude CLI
        if: steps.peek.outputs.quiet_check == 'true'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      # Skipped for forced work and for any subscription that is not shared. Usage readings ten
      # minutes apart (a one-turn Haiku call each), for up to two hours; a rise that is not the
      # partner bot's holds that subscription back. The step's name is what plan.quiet_waiting
      # looks for, so only one run waits at a time.
      - name: Wait until the subscription is quiet
        id: quiet
        if: steps.peek.outputs.quiet_check == 'true'
        working-directory: bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[steps.peek.outputs.quiet_secret] }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only: the partner's public runs
        run: python -m harness quiet

  plan:
    name: plan
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One plan at a time, across every run: claims and the lanes stay consistent. A plan that
    # waits is not cancelled, though GitHub keeps only one waiting; one it drops loses nothing,
    # since the queue is the labels.
    concurrency:
      group: bot-night-plan
      cancel-in-progress: false
    permissions:
      contents: write        # the state file on the bot-state branch
      issues: write
      pull-requests: write
      actions: write         # whether a run that holds an item is alive; start one more run
    outputs:
      action: ${{ steps.plan.outputs.action }}
      number: ${{ steps.plan.outputs.number }}
      provider: ${{ steps.plan.outputs.provider }}
      cli: ${{ steps.plan.outputs.cli }}
      secret: ${{ steps.plan.outputs.secret }}
      shared: ${{ steps.plan.outputs.shared }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
    steps:
      # First, before anything else: a committed .harness/HALT stops the whole run.
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" = "200" ]; then
            echo "halted by .harness/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the default branch
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Python
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Plan
        id: plan
        if: steps.halt.outputs.halted != 'true'
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Which provider secrets exist, never their values: a subscription without its secret
          # takes nothing.
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_7' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          QUIET_OK: ${{ needs.gate.outputs.quiet_ok }}
          INPUT_ITEM: ${{ github.event.inputs.item }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          force=""
          if [ "${INPUT_FORCE}" = "true" ]; then force="--force"; fi
          python -m harness plan --out "$RUNNER_TEMP/plan/plan.json" --quiet-ok "${QUIET_OK}" \
            --item "${INPUT_ITEM}" --mode "${INPUT_MODE:-auto}" ${force}

      - name: Keep the plan for the next jobs
        if: steps.plan.outputs.action != '' && steps.plan.outputs.action != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan/plan.json
          retention-days: 14
          overwrite: true

  work:
    name: work
    needs: plan
    # After the plan job, or with no gate and no plan job in a run the status loop started with its
    # plan (`plan_ref`, #1455).
    if: ${{ !cancelled() && (inputs.plan_ref || contains(fromJSON('["plan", "build", "revise", "review", "suggest"]'), needs.plan.outputs.action)) }}
    # The subscription's runner (providers.json `runs_on`). On the machine the CLIs, Node, pnpm,
    # each user's Rust and Python are installed already, and a login there never leaves it.
    runs-on: ${{ inputs.plan_ref && inputs.runs_on || needs.plan.outputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 350
    permissions:
      contents: read         # the model job may read; it may not write anything to GitHub
    # The plan job's outputs, or a loop's run's inputs, which the step after the checkout holds to
    # the plan and providers.json before any step is handed a secret (`plan-fetch --check`).
    env:
      PLAN_RUNS_ON: ${{ inputs.plan_ref && inputs.runs_on || needs.plan.outputs.runs_on || 'ubuntu-latest' }}
      PLAN_CLI: ${{ inputs.plan_ref && inputs.cli || needs.plan.outputs.cli }}
      PLAN_SECRET: ${{ inputs.plan_ref && inputs.secret || needs.plan.outputs.secret }}
      PLAN_SHARED: ${{ inputs.plan_ref && inputs.shared || needs.plan.outputs.shared }}
    steps:
      # On the machine the checkout stays between jobs, and the last model job's worktrees (in
      # RUNNER_TEMP, emptied after every job) stay registered in it. Checkout then cannot reset a
      # branch one of them claims ("used by worktree at ...") and clones the repository afresh.
      - name: Forget the last job's worktrees
        if: ${{ !startsWith(env.PLAN_RUNS_ON, 'ubuntu-') }}
        run: git -C "$GITHUB_WORKSPACE" worktree prune 2>/dev/null || true

      # On the machine, the job's temporary files go in RUNNER_TEMP, which is emptied when the
      # job ends, not in the /tmp every subscription's jobs share (bot/machine/README.md, Disk).
      # Its Rust builds keep no incremental cache and no debug info: each job builds in a fresh
      # worktree that goes when it ends, so both only fill the shared disk (the cards' tests build
      # 5.2 GB with them, 0.55 GB without; four card jobs at once filled it on 2026-10-09, #590).
      - name: Keep the job's temporary files with the job
        if: ${{ !startsWith(env.PLAN_RUNS_ON, 'ubuntu-') }}
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          {
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "CARGO_INCREMENTAL=0"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"

      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      # A run the status loop started with its plan (#1455): the plan comes from the state branch,
      # where only the bots' tokens write, and the runner, CLI, secret name and shared flag this job
      # was given must be the plan's and its subscription's in providers.json, or the job stops
      # here, before any step is handed a secret.
      - name: The loop's plan, held to providers.json
        if: ${{ inputs.plan_ref }}
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_REF: ${{ inputs.plan_ref }}
        run: python3 -m harness plan-fetch --ref "$PLAN_REF" --out "$RUNNER_TEMP/plan/plan.json" --check

      # On GitHub's runners only: the machine has its own (bot/machine/setup.sh).
      - uses: pnpm/action-setup@v4
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')

      - uses: actions/setup-node@v4
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Rust toolchain rust-toolchain.toml pins, with its components and target, as ci.yml's
      # setup installs it (.github/actions/setup); the harness's checks run cargo.
      - uses: dtolnay/rust-toolchain@1.97.0
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        with:
          python-version: "3.13"

      # On GitHub's runners only (#1263): every worktree of the job builds into the checkout's
      # target/, which starts from bot-cache.yml's entry, and scripts/build-wasm.sh keeps
      # wasm-bindgen and the emsdk in the checkout's .cache/, which starts from CI's emsdk entry.
      # Both are restored and never saved: only bot-cache.yml, on main, writes the Rust entry, so
      # nothing a model ran here reaches a later job through the cache. No debug info, as on the
      # machine and in CI's test profile, which keeps the entry small. These lines are the same as
      # bot-cache.yml's step of this name, since the entry's key hashes them.
      - name: The night bot's build directories
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        run: |
          {
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
            echo "JACKIOH_CACHE_DIR=$GITHUB_WORKSPACE/.cache"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"

      # As .github/actions/setup does: rust-cache keys on every toolchain rustup has.
      - name: Only the pinned toolchain
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        run: |
          pinned=$(rustup show active-toolchain | cut -d ' ' -f 1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$pinned" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
          rustup toolchain list

      - uses: Swatinem/rust-cache@v2
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        with:
          shared-key: night-bot-checks
          cache-directories: .cache/bin
          save-if: false

      - name: The emsdk scripts/build-wasm.sh pins
        id: emsdk
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        run: echo "version=$(sed -n 's/^EMSDK_VERSION="\([^"]*\)"$/\1/p' scripts/build-wasm.sh)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: startsWith(env.PLAN_RUNS_ON, 'ubuntu-') && steps.emsdk.outputs.version != ''
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.emsdk.outputs.version }}

      # Only the CLI of the subscription plan chose, and only on GitHub's runners. The provider
      # and CLI come from plan's outputs, which providers.json decides; the model never sets them.
      - name: Install the claude CLI
        if: env.PLAN_CLI == 'claude' && startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Install the codex CLI and its sandbox
        if: env.PLAN_CLI == 'codex' && startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        run: |
          npm install --global @openai/codex
          codex --version
          # Codex sandboxes commands with bubblewrap, which Ubuntu's AppArmor blocks by default
          # (as openai/codex-action does on these runners).
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the muse CLI
        if: env.PLAN_CLI == 'muse' && startsWith(env.PLAN_RUNS_ON, 'ubuntu-')
        env:
          MUSE_NO_AUTO_UPDATE: "1"
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/muse" --version

      - name: Fetch the plan
        if: ${{ !inputs.plan_ref }}
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Doctor (stops here, before any model call, if something is missing)
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_PROVIDER_SECRET: ${{ secrets[env.PLAN_SECRET] }}
        run: python3 -m harness doctor --work --plan "$RUNNER_TEMP/plan/plan.json"

      # bright-bots-harness reads a step named "Build, check and review" as this bot spending the
      # shared Claude subscription (quiet.py), so only a run on it (claude-1) has that name; a run
      # on any other subscription must not excuse a rise on the shared one.
      - name: Build, check and review
        if: env.PLAN_SHARED == 'true'
        working-directory: bot
        env:
          # The one secret of the subscription plan chose, picked by name; no other provider's.
          HARNESS_PROVIDER_SECRET: ${{ secrets[env.PLAN_SECRET] }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only: the checkpoints read HALT and the state
        run: |
          python3 -m harness work --plan "$RUNNER_TEMP/plan/plan.json" \
            --out "$RUNNER_TEMP/out" --work-dir "$RUNNER_TEMP/work"

      - name: Work on another subscription (build, check and review)
        if: env.PLAN_SHARED != 'true'
        working-directory: bot
        env:
          HARNESS_PROVIDER_SECRET: ${{ secrets[env.PLAN_SECRET] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m harness work --plan "$RUNNER_TEMP/plan/plan.json" \
            --out "$RUNNER_TEMP/out" --work-dir "$RUNNER_TEMP/work"

      - name: Keep the result, the bundle, the sealed login and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  deliver:
    name: deliver
    needs: [plan, work]
    if: ${{ always() && (inputs.plan_ref || contains(fromJSON('["plan", "build", "revise", "review", "suggest"]'), needs.plan.outputs.action)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # the push (with the Actions token only when no bot token is set)
      issues: write
      pull-requests: write
      actions: write         # start the next run; re-run failed CI jobs
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the plan
        if: ${{ !inputs.plan_ref }}
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      # The status loop's plan (#1455), from the state branch, where the model job cannot write: in
      # such a run its action, item and subscription are the plan file's, as there is no plan job.
      - name: The loop's plan
        if: ${{ inputs.plan_ref }}
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_REF: ${{ inputs.plan_ref }}
        run: python3 -m harness plan-fetch --ref "$PLAN_REF" --out "$RUNNER_TEMP/plan/plan.json"

      - name: Fetch the model job's output
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}/out

      # The item and the subscription come from the plan job's outputs, which the model job
      # cannot touch; the plan file carries only the context around them.
      - name: Deliver
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_7' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          PLAN_ACTION: ${{ needs.plan.outputs.action }}
          PLAN_NUMBER: ${{ needs.plan.outputs.number }}
          PLAN_PROVIDER: ${{ needs.plan.outputs.provider }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m harness deliver --plan "$RUNNER_TEMP/plan/plan.json" --out "$RUNNER_TEMP/out" \
            --action "${PLAN_ACTION}" --number "${PLAN_NUMBER}" --provider "${PLAN_PROVIDER}"
