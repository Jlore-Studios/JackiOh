# Merges main into production (Cloudflare) through a pull request, once a day, with a countdown
# issue anyone can hold or delay. docs/deploy-cloudflare.md is the plan; scripts/promote-production.sh
# is the logic (read its header first) and apps/web/src/net/promote-production.test.ts holds it.
#
# Cloudflare builds one branch, `production`, and nothing else. This workflow is the only thing that
# moves it, and only by merging a pull request whose head is a commit of main whose push-to-main CI
# run passed. It never force-pushes: a `production` that carries anything main does not fails the
# run, loudly, for a human to look at.
#
# The open issue labelled `production merge` says "Merging to production in N hours". The check
# merges when the issue's time has passed and nobody has put it on hold. GitHub has not started this
# repository's scheduled runs at all (CLAUDE.md, the night bot), so the check never rests on the
# cron: every green CI run on main runs it too, and main moves many times a day.
#
# Four ways in:
#   schedule           every hour, at minute 7 (the top of the hour is where GitHub's queue is longest),
#                      if GitHub starts it: read the new comments, merge if due and not on hold, then
#                      close the issue with the pull request and open the next.
#   issue_comment      a /hold, /resume or /delay on the countdown issue, from someone GitHub calls an
#                      owner, member or collaborator: the same check, so the answer is quick and a
#                      /resume on an overdue merge goes out at once.
#   workflow_run (CI)  right after a green CI run on main: the same check, and the one that does the
#                      work in practice. It also merges a commit that changes render.yaml's
#                      CATALOG_VERSION at once, hold or no hold. Render deploys apps/server from main
#                      on every push, and the bundle compiles the catalog version in
#                      (packages/cards), so a catalog bump left a day behind would refuse every deck
#                      save and queue in production (SPEC §9.4, R105).
#   workflow_dispatch  by hand (Actions -> promote production -> Run workflow): the newest green
#                      commit, or the `sha` given, which must also be green and on main. A hold does
#                      not stop it.
#
# A push or a merge made with GITHUB_TOKEN starts no workflow (so this cannot loop) but GitHub still
# sends it to Cloudflare's GitHub app, which is what builds and deploys. Opening pull requests needs
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: promote production

on:
  schedule:
    - cron: "7 * * * *"
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to promote (default: the newest one whose CI passed)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  promote:
    name: merge main into production
    # A workflow_run fires for every completed CI run, and an issue_comment for every comment in the
    # repository; only a green push to main, or a command on the countdown issue, gets past here.
    # The label is `RELEASE_LABEL` in scripts/promote-production.sh, which the test holds equal. The
    # concurrency group is the job's, not the workflow's, so a comment that wakes nothing never takes
    # the place of a run waiting its turn.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && contains(github.event.issue.labels.*.name, 'production merge')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && (contains(github.event.comment.body, '/hold') || contains(github.event.comment.body, '/resume')
          || contains(github.event.comment.body, '/release') || contains(github.event.comment.body, '/unhold')
          || contains(github.event.comment.body, '/delay')))
    concurrency:
      group: promote-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: merge main into production and keep the countdown issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: bash scripts/promote-production.sh
