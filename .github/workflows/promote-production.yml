# Promotes main to production (Cloudflare) once a day. docs/deploy-cloudflare.md is the plan.
#
# Cloudflare builds one branch, `production`, and nothing else. This workflow is the only thing that
# moves it, and only ever by fast-forward to a commit of main whose push-to-main CI run passed. It
# never force-pushes: a `production` that is not an ancestor of the candidate fails the run, loudly,
# for a human to look at.
#
# Three ways in:
#   schedule           once a day: the newest green commit of main.
#   workflow_run (CI)  right after a green CI run on main, but ONLY when that commit changes
#                      render.yaml's CATALOG_VERSION. Render deploys apps/server from main on every
#                      push, and the bundle compiles the catalog version in (packages/cards), so a
#                      catalog bump left a day behind would refuse every deck save and queue in
#                      production (SPEC §9.4, R105). Anything else waits for the daily run, unless
#                      production's commit is already MAX_LAG_HOURS older than this one: GitHub did
#                      not start this repository's first scheduled run at all (it starts schedules
#                      late, if ever, here: CLAUDE.md, the night bot), so the first green CI run on
#                      main a day after the last promotion stands in for the cron.
#   workflow_dispatch  by hand (Actions -> promote production -> Run workflow): the newest green
#                      commit, or the `sha` given, which must also be green and on main.
#
# A push made with GITHUB_TOKEN starts no workflow, so this cannot loop.
#
# The `deploy` job then builds production and deploys it to the Cloudflare Worker itself, with
# `wrangler deploy` and the CLOUDFLARE_API_TOKEN secret: the same install CI runs (where the build is
# known to pass), the public VITE_ settings from apps/web/.env.production, and
# apps/web/scripts/check-production-bundle.mjs between the build and the deploy, so a bundle that
# cannot sign in never goes live. Cloudflare's own Git builds failed on every commit after the first,
# with logs only the dashboard shows, and built every branch; with this job they are disconnected
# (docs/deploy-cloudflare.md, step 3). After the deploy it fetches the live site and checks it.
name: promote production

on:
  schedule:
    # 15:00 UTC daily. GitHub may start a scheduled run late under load; that only delays it.
    - cron: "0 15 * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to promote (default: the newest one whose CI passed)"
        required: false
        default: ""
      redeploy:
        description: "Build and deploy production even if it does not move"
        type: boolean
        required: false
        default: false

env:
  # How far behind main (by commit time) production may fall before a green push to main promotes it
  # without a catalog change. The cron is the intended daily run; this is its fallback.
  MAX_LAG_HOURS: "24"
  # The Cloudflare account the `jackioh` Worker lives in (dash.cloudflare.com/<this>/workers/...).
  # An identifier, not a secret; the API token is the secret.
  CLOUDFLARE_ACCOUNT_ID: 3c0495fcdd2622a08e1a91b8de248b46

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: fast-forward production
    # A workflow_run fires for every completed CI run; only a green push to main can promote.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: pick the candidate and promote it
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          green() {
            [ -n "$(gh run list --workflow ci.yml --branch main --event push --status success \
              --commit "$1" --limit 1 --json headSha --jq '.[].headSha')" ]
          }
          catalog() {
            git show "$1:render.yaml" 2>/dev/null | awk '$1 == "-" && $2 == "key:" { k = $3; next }
              k == "CATALOG_VERSION" && $1 == "value:" { gsub(/"/, "", $2); print $2; exit }'
          }

          case "$EVENT" in
            workflow_run) candidate=$RUN_SHA ;;
            workflow_dispatch) candidate=${INPUT_SHA:-} ;;
            *) candidate= ;;
          esac
          if [ -z "$candidate" ]; then
            candidate=$(gh run list --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -z "$candidate" ]; then
            echo "::error::No push to main has a passing CI run; nothing can be promoted."
            exit 1
          fi
          candidate=$(git rev-parse --verify "$candidate^{commit}")

          git merge-base --is-ancestor "$candidate" origin/main \
            || { echo "::error::$candidate is not on main."; exit 1; }
          green "$candidate" \
            || { echo "::error::$candidate has no passing push-to-main CI run."; exit 1; }

          if git rev-parse --verify -q origin/production >/dev/null; then
            current=$(git rev-parse origin/production)
            if [ "$current" = "$candidate" ]; then
              echo "production is already $candidate."
              exit 0
            fi
            if git merge-base --is-ancestor "$candidate" "$current"; then
              echo "production ($current) is already past $candidate; nothing to do."
              exit 0
            fi
            git merge-base --is-ancestor "$current" "$candidate" || {
              echo "::error::production ($current) is not an ancestor of $candidate. It was moved by hand or main was rewritten. Not force-pushing; see docs/deploy-cloudflare.md, 'production has diverged'."
              exit 1
            }
            if [ "$EVENT" = workflow_run ] && [ "$(catalog "$current")" = "$(catalog "$candidate")" ]; then
              lag=$(( $(git log -1 --format=%ct "$candidate") - $(git log -1 --format=%ct "$current") ))
              if [ "$lag" -lt $(( MAX_LAG_HOURS * 3600 )) ]; then
                echo "No catalog change ($(catalog "$candidate")) and production is $(( lag / 3600 )) h behind; this waits for the daily promotion."
                exit 0
              fi
              echo "No catalog change, but production is $(( lag / 3600 )) h behind main and the daily promotion has not run: this one stands in for it."
            fi
          else
            current=
            echo "production does not exist yet; this run creates it."
          fi

          git push origin "$candidate:refs/heads/production"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          {
            echo "### production -> \`${candidate:0:12}\` ($EVENT)"
            echo
            echo "Catalog: $(catalog "$candidate")"
            if [ -n "$current" ]; then
              echo
              echo "Commits promoted:"
              echo
              git log --format='- %h %s' "$current..$candidate"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: build and deploy to Cloudflare
    needs: promote
    if: >-
      needs.promote.outputs.promoted == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.redeploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The install covers the whole workspace, e2e/ included; no browser is needed here.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - uses: ./.github/actions/setup

      - name: build the web app
        env:
          # A repository variable may hold the publishable key instead of apps/web/.env.production.
          # It is only exported when set: an empty variable would override the file's value.
          KEY_FROM_VARS: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$KEY_FROM_VARS" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$KEY_FROM_VARS" >> "$GITHUB_ENV"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$KEY_FROM_VARS"
          fi
          pnpm --filter @jackioh/web build

      - name: refuse a bundle that cannot sign in or reach the server
        run: |
          if [ ! -f apps/web/scripts/check-production-bundle.mjs ]; then
            echo "::error::production ($(git rev-parse --short HEAD)) predates this deploy job and its settings. Run this workflow without a sha once main's CI is green, so production moves to a commit that has them."
            exit 1
          fi
          node apps/web/scripts/check-production-bundle.mjs

      - name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so production was built but not deployed. docs/deploy-cloudflare.md, step 3, says how to make one."
            exit 1
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: check the live site
        if: steps.deploy.outputs.url != ''
        env:
          SITE: ${{ steps.deploy.outputs.url }}
        run: |
          # The new version can take a few seconds to reach every edge.
          # The settings land in whichever chunk holds src/net/auth.ts, so every script index.html
          # loads or preloads is read.
          for attempt in 1 2 3 4 5 6; do
            scripts=$(curl -fsS "$SITE/" | grep -oE '/assets/[A-Za-z0-9_.-]+\.js' | sort -u || true)
            found=
            for script in $scripts; do
              if curl -fsS "$SITE$script" | grep -q 'sb_publishable_'; then found=$script; break; fi
            done
            if [ -n "$found" ]; then echo "sign-in is configured ($found)"; break; fi
            if [ "$attempt" = 6 ]; then echo "::error::$SITE does not serve a bundle with sign-in configured"; exit 1; fi
            sleep 10
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/decks")
          [ "$status" = 200 ] || { echo "::error::$SITE/decks answered $status, not 200"; exit 1; }
          curl -sI "$SITE/decks" | grep -qi '^content-security-policy:' || { echo "::error::$SITE sends no Content-Security-Policy"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/not-a-page")
          [ "$status" = 404 ] || { echo "::error::$SITE/not-a-page answered $status, not 404"; exit 1; }
          echo "### production is live at $SITE" >> "$GITHUB_STEP_SUMMARY"
