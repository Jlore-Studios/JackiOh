# Moves production once a day by itself, and sooner on request, never past a red super run (#2750;
# daily since 2026-11-03, the owners' call), taking its commits from the `_staging` branch (#3275, the
# owners' call of 2026-11-05). promote-staging.yml moves `_staging` every two hours to main's newest
# green commit. The daily promotion: when super.yml's daily run on `_staging` passes every job, the
# script merges the commit it tested into production (through a pull request super does not run on
# again) and deploys it to jackioh.com, the site and its game server together. A red run on
# `_staging` is the night bot's to fix, before everything else it has queued (super.yml's `report`),
# and production waits for the next run that passes. Sooner: someone comments `/promote` on the open
# issue labeled `production merge` (or runs this from the Actions tab); the script opens a pull
# request of staging's commit into production, super runs on it, and it merges once every one of that
# run's jobs passed. A promotion or a deploy that fails is the night bot's (`report` below).
# docs/deploy-cloudflare.md is the plan; scripts/promote-production.sh is the logic (read its header
# first) and apps/web/src/net/promote-production.test.ts holds it. Staging's site is
# deploy-staging.yml's, which deploys each move of `_staging`.
#
# The `jackioh` Worker serves what the `_production` branch holds, and nothing else. This workflow is
# the only thing that moves it, and only by merging a pull request whose head is a commit of staging
# (and so of main) whose push-to-main CI run passed and whose super run passed every job, or, the
# emergency way, one a person merged with a written reason (`/skip-super <reason>`, or the
# `skip_super_reason` input), which the issue records. It never force-pushes: a `_production` that carries anything main does not fails
# the run, loudly, for a human to look at.
#
# Three ways in:
#   issue_comment      `/promote [sha]` (or `/fast-forward`), `/skip-super <reason>` or `/cancel` on the
#                      production issue (or on one a fresh issue took over from, which the script
#                      opens weekly), from someone GitHub calls an owner, member or collaborator.
#                      `/hold`, `/resume` and `/delay` are answered that there is nothing to hold.
#   workflow_run       a super run on staging that passed: the daily promotion. A finished super run on a
#                      promotion pull request (`promote/*`): it merges when the run passed, and says so
#                      on the issue when it did not. A green push-to-main CI run wakes it too, to bring
#                      the issue's queue up to date (and to make up a dropped wake-up).
#   workflow_dispatch  by hand (Actions -> promote production -> Run workflow): `/promote` for the
#                      `sha` given or staging's commit, or `/skip-super` when
#                      `skip_super_reason` is filled; `redeploy` deploys production as it is.
#
# The promote branch, its pull request and the merge go out with the bot's token (BOT_GITHUB_TOKEN),
# because GitHub refuses the Actions token any update to production that carries a change to
# .github/workflows, and because a pull request the Actions token opens starts no workflow, so super
# would never test it. Nothing loops: CI and super run on the promotion pull request, and this
# workflow wakes on their completion only to reconcile; no workflow runs on a push to a promote branch;
# and the one that runs on a push to production, releases.yml (when it brings patches.json), writes
# only GitHub releases. The production issue stays on the Actions token, whose writes start no
# workflow.
#
# Once production has moved, `technical-log` logs what went live (#1360, part 5's `cargo jackioh
# patches log`, R1369000): each App, AI and Internal commit between the main commit production
# held before and the one it holds now goes into crates/cards/patches/technical.json under the
# newest shipped patch, with the player note its pull request's "## Player note" carries. It lands
# on main through the same auto-merged pull request path patches-ship.yml uses, in that workflow's
# concurrency group, so it never interleaves with a ship. Technical changes never bump the catalog
# version, which the server and every client must agree on (R105). Nothing supersedes a log that
# does not merge, so patches-ship.yml's `watch` escalates one still red or in conflict 2 hours on.
#
# The `deploy` job then builds production and deploys it to the `jackioh` Worker and its container
# itself, with `wrangler deploy` and the CLOUDFLARE_API_TOKEN secret: the same install CI runs (where
# the build is known to pass), the public VITE_ settings from apps/web/.env.production, and
# apps/web/scripts/check-production-bundle.mjs between the build and the deploy, so a bundle that
# cannot sign in never goes live. The server's image is scripts/server-image.sh's, as
# deploy-staging.yml's header says: named by its inputs in Cloudflare's registry, where staging has
# almost always pushed it already, so a promotion builds no server; else CI's `deploy-image` of the
# promoted main commit, else a build on CI's layer cache. The WASM module comes from the cache
# deploy-staging.yml fills (WASM_CACHE) when nothing it is built from changed. The Worker hands
# the container the commit it was deployed from (DEPLOYED_COMMIT), which the server reports as
# `x-deployed-commit`.
# Cloudflare's own Git builds failed on every commit after the first, with logs only the dashboard
# shows, and built every branch; with this job they are disconnected (docs/deploy-cloudflare.md,
# step 3). After the deploy it fetches the live site and checks it, then waits for the server to
# report the commit. The server's own secrets are the Worker's (`wrangler secret put`,
# apps/edge/README.md), never this repository's.
name: promote production

# No `schedule` of its own: the daily promotion runs off super.yml's daily run on staging, whose
# completion wakes this (`workflow_run`).
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, super]
    types: [completed]
    branches: [main, _staging, "promote/**"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of staging to promote (default: staging's head)"
        required: false
        default: ""
      skip_super_reason:
        description: "Emergency only: merge at once without the super run, for this reason (recorded on the production issue)"
        required: false
        default: ""
      redeploy:
        description: "Build and deploy production even if it does not move"
        type: boolean
        required: false
        default: false

env:
  # The Cloudflare account the `jackioh` Worker lives in (dash.cloudflare.com/<this>/workers/...),
  # and deploy-staging.yml's `jackioh-staging`. An identifier, not a secret; the API token is the
  # secret.
  CLOUDFLARE_ACCOUNT_ID: 3c0495fcdd2622a08e1a91b8de248b46

permissions:
  contents: write
  actions: read
  # The production issue's Staging column: staging's newest deployment that succeeded.
  deployments: read
  issues: write
  pull-requests: write

jobs:
  promote:
    name: promote production
    # A workflow_run fires for every completed CI or super run, and an issue_comment for every comment
    # in the repository; only a green push to main, a passing super run on staging, a super run on a
    # promotion pull request, or a command on the production issue gets past here. The label is `RELEASE_LABEL` in
    # scripts/promote-production.sh, which the test holds equal. The concurrency group is the job's,
    # not the workflow's, so a comment that wakes nothing never takes the place of a run waiting its
    # turn; and every run reconciles with the super run, so one that GitHub drops from the group's
    # queue is made up by the next.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
        && ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
          || (github.event.workflow_run.name == 'super' && github.event.workflow_run.event == 'pull_request'
            && startsWith(github.event.workflow_run.head_branch, 'promote/'))
          || (github.event.workflow_run.name == 'super' && github.event.workflow_run.event != 'pull_request'
            && github.event.workflow_run.head_branch == '_staging' && github.event.workflow_run.conclusion == 'success')))
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && contains(github.event.issue.labels.*.name, 'production merge')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && (contains(github.event.comment.body, '/promote') || contains(github.event.comment.body, '/fast-forward')
          || contains(github.event.comment.body, '/skip-super') || contains(github.event.comment.body, '/cancel')
          || contains(github.event.comment.body, '/hold') || contains(github.event.comment.body, '/resume')
          || contains(github.event.comment.body, '/release') || contains(github.event.comment.body, '/unhold')
          || contains(github.event.comment.body, '/delay')))
    concurrency:
      group: promote-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      # The script pushes with the checkout's credentials. Moving production past a change to
      # .github/workflows is refused to the Actions token, so the bot's token (it has the `workflow`
      # scope) does the moving: here, and as PROMOTE_TOKEN below. The script's header says more.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}

      - name: promote production and keep its issue
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_SKIP_REASON: ${{ inputs.skip_super_reason }}
          # The issue a command is on: a production issue that a fresh one has since taken over from
          # (the script's ROTATE_DAYS) is still read, so a command left there is carried out.
          COMMENT_ISSUE: ${{ github.event.issue.number }}
        run: bash scripts/promote-production.sh

  # What went live, onto the technical log (R1369000). Production's tip is the promotion's merge
  # commit: its second parent the main commit it brought in, its first the production before. The
  # range starts at the newest main commit production already held.
  technical-log:
    name: log what went live
    needs: promote
    if: ${{ needs.promote.outputs.promoted == 'true' }}
    concurrency:
      group: patches-ship
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
      - id: range
        name: the commits that went live
        run: |
          set -euo pipefail
          git fetch -q origin _production
          tip=$(git rev-parse FETCH_HEAD)
          new=$(git rev-parse --verify -q "$tip^2" || git rev-parse "$tip")
          old=$(git merge-base "$tip^1" "$new" || true)
          if [ -z "$old" ] || [ "$old" = "$new" ]; then
            echo "nothing new went live"
            exit 0
          fi
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "promoted ${old:0:7}..${new:0:7}"
      - if: ${{ steps.range.outputs.new != '' }}
        uses: ./.github/actions/setup
        with:
          node: "false"
      # A squash commit on main carries its pull request's number, not its body; the player notes
      # are in the bodies.
      - name: the pull requests' bodies, for their player notes
        if: ${{ steps.range.outputs.new != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.range.outputs.old }}
          NEW: ${{ steps.range.outputs.new }}
        run: |
          set -euo pipefail
          git log --first-parent --format=%s "$OLD..$NEW" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p' | sort -u |
            while read -r number; do
              gh pr view "$number" --json number,body || true
            done | jq -s 'map({(.number | tostring): (.body // "")}) | add // {}' > "$RUNNER_TEMP/bodies.json"
      - name: patches log
        if: ${{ steps.range.outputs.new != '' }}
        env:
          OLD: ${{ steps.range.outputs.old }}
          NEW: ${{ steps.range.outputs.new }}
        run: cargo jackioh patches log "$OLD..$NEW" --bodies "$RUNNER_TEMP/bodies.json"
      - name: land it on main
        if: ${{ steps.range.outputs.new != '' }}
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          OLD: ${{ steps.range.outputs.old }}
          NEW: ${{ steps.range.outputs.new }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain crates/cards/patches/technical.json)" ]; then
            echo "nothing to log"
            exit 0
          fi
          range="${OLD:0:7}..${NEW:0:7}"
          branch="patches/log-${NEW:0:7}"
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          git checkout -b "$branch"
          git add crates/cards/patches/technical.json
          git -c user.name="$login" -c user.email="$id+$login@users.noreply.github.com" \
            commit -q -m "patches log: $range" -m "The App, AI and Internal commits that went live with production's merge of $range (R1369000)."
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "patches log: $range" \
            --body "Logs the commits that went live in $range onto the newest patch's technical log (\`crates/cards/patches/technical.json\`, R1369000). Opened by \`.github/workflows/promote-production.yml\`; it merges itself once CI passes.")
          gh pr merge "$url" --auto --squash
          echo "### patches log: $range" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: build and deploy to Cloudflare
    needs: promote
    if: >-
      needs.promote.outputs.promoted == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.redeploy)
    # Two deploys never overlap; a deploy waiting its turn builds whatever production is by then.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # An hour, for the rare deploy whose server image neither the registry nor CI has: a release
    # build of crates/server/Dockerfile on CI's layer cache, which compiles the workspace's crates and
    # the thin-LTO link at least (CI's deploy rehearsal splits the same build into three jobs). Then
    # the web's build, the image's upload, and the wait for the server (LIVE_SECONDS).
    timeout-minutes: 60
    env:
      # The install covers the whole workspace, e2e/ included; no browser is needed here.
      CYPRESS_INSTALL_BINARY: "0"
      # deploy-staging.yml's: the cache key's prefix of the WASM module's production build, and the
      # layer cache CI's deploy image jobs write.
      WASM_CACHE: wasm-player-v1
      IMAGE_CACHE_FROM: type=gha,scope=deploy-rehearsal
      # The address players use, which the live checks read.
      SITE: https://jackioh.com
      # How long the live check waits for the server to report the deployed commit: the first request
      # starts the container on the new image, after the Worker has drained one still on the old
      # (apps/edge/src/index.ts).
      LIVE_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _production
          # Its second parent, the promoted commit of main, names the CI run whose image it may use.
          fetch-depth: 2

      # The production build of the WASM module, when nothing it is built from changed.
      - name: the WASM module, if cached
        id: wasm
        uses: actions/cache@v4
        with:
          path: apps/web/src/wasm/pkg
          key: ${{ env.WASM_CACHE }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'scripts/build-wasm.sh') }}

      # The Node half installs apps/edge's wrangler; the Rust half is for the build's prebuild,
      # scripts/build-wasm.sh, which a cached module skips.
      - uses: ./.github/actions/setup
        with:
          rust: ${{ steps.wasm.outputs.cache-hit == 'true' && 'false' || 'true' }}

      # Before anything writes to the checkout, as deploy-staging.yml's step of the same name; the
      # script is this workflow's commit's, since production's own may predate it.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: the server's image
        id: image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_COMMIT=$(git rev-parse --verify -q HEAD^2 || git rev-parse HEAD)
          export IMAGE_COMMIT
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git show FETCH_HEAD:scripts/server-image.sh > "$RUNNER_TEMP/server-image.sh"
          bash "$RUNNER_TEMP/server-image.sh" use jackioh-server

      - name: build the web app
        # Every public setting comes from apps/web/.env.production, and nothing here overrides one: a
        # repository secret holding staging's publishable key did until 2026-11-04, so production's
        # pages sent staging's key to production's Supabase and every sign-in ended in a 401.
        env:
          WASM_CACHED: ${{ steps.wasm.outputs.cache-hit }}
        run: |
          # With the module cached, `build` runs without `prebuild`, the WASM build.
          if [ "$WASM_CACHED" = true ]; then
            pnpm --dir apps/web exec vite build
          else
            pnpm --filter @jackioh/web build
          fi

      - name: refuse a bundle that cannot sign in or reach the server
        run: |
          if [ ! -f apps/web/scripts/check-production-bundle.mjs ]; then
            echo "::error::production ($(git rev-parse --short HEAD)) predates this deploy job and its settings. Run this workflow without a sha once main's CI is green, so production moves to a commit that has them."
            exit 1
          fi
          node apps/web/scripts/check-production-bundle.mjs

      # The Worker, the site's files and the server's container in one deploy, so the site and its
      # server never run apart. `--env=""` names the top level, production, which wrangler otherwise
      # warns is left implicit in a file that has environments.
      - name: deploy the site and its server
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so production was built but not deployed. docs/deploy-cloudflare.md, section 4, step 2, says how to make one."
            exit 1
          fi
          if [ ! -f apps/edge/package.json ]; then
            echo "::error::production ($(git rev-parse --short HEAD)) predates the Worker in front of the server (apps/edge). Run this workflow without a sha once main's CI is green, so production moves to a commit that has it."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          pnpm --dir apps/edge exec wrangler deploy --config ../../wrangler.jsonc --env="" --var "DEPLOYED_COMMIT:$sha" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # jackioh.com, and the workers.dev address the deploy printed, which wrangler.jsonc keeps on.
      - name: check the live site
        env:
          WORKERS_DEV: ${{ steps.deploy.outputs.url }}
        run: |
          for address in "$SITE" ${WORKERS_DEV:+"$WORKERS_DEV"}; do
            # The new version can take a few seconds to reach every edge.
            # The settings land in whichever chunk holds src/net/auth.ts, so every script index.html
            # loads or preloads is read.
            for attempt in 1 2 3 4 5 6; do
              scripts=$(curl -fsS "$address/" | grep -oE '/assets/[A-Za-z0-9_.-]+\.js' | sort -u || true)
              found=
              for script in $scripts; do
                if curl -fsS "$address$script" | grep -q 'sb_publishable_'; then found=$script; break; fi
              done
              if [ -n "$found" ]; then echo "$address: sign-in is configured ($found)"; break; fi
              if [ "$attempt" = 6 ]; then echo "::error::$address does not serve a bundle with sign-in configured"; exit 1; fi
              sleep 10
            done
            status=$(curl -s -o /dev/null -w '%{http_code}' "$address/decks")
            [ "$status" = 200 ] || { echo "::error::$address/decks answered $status, not 200"; exit 1; }
            curl -sI "$address/decks" | grep -qi '^content-security-policy:' || { echo "::error::$address sends no Content-Security-Policy"; exit 1; }
            status=$(curl -s -o /dev/null -w '%{http_code}' "$address/not-a-page")
            [ "$status" = 404 ] || { echo "::error::$address/not-a-page answered $status, not 404"; exit 1; }
          done

      - name: wait for the server on this commit
        uses: ./.github/actions/poll-live
        with:
          site: ${{ env.SITE }}
          commit: ${{ steps.deploy.outputs.sha }}
          seconds: ${{ env.LIVE_SECONDS }}

      # R3074000: the dev dashboard (apps/admin), a Worker of its own that binds this one, so it goes
      # after the site's, from apps/admin/.env.production. Its address, admin.jackioh.com, and the
      # Access application in front of it are infra/cloudflare.tf's; until they are applied the
      # Worker serves nothing. A production that predates the dashboard has none to deploy.
      - name: build and deploy the dev dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -f apps/admin/wrangler.jsonc ]; then
            echo "::notice::production ($(git rev-parse --short HEAD)) predates the dev dashboard (apps/admin): nothing to deploy."
            exit 0
          fi
          pnpm --dir apps/admin build
          pnpm --dir apps/edge exec wrangler deploy --config ../admin/wrangler.jsonc --env=""

      # Only after the server reported its commit, and never failing a deploy that went live.
      - name: drop the registry's older images
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ steps.image.outputs.tag }}
        run: bash "$RUNNER_TEMP/server-image.sh" prune "$TAG"

      - name: say so
        env:
          SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          echo "### production is live at $SITE, its server on \`${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"

  # A promotion that failed after a super run (the daily promotion, or a merge once a promotion's run
  # passed) or a deploy that failed: production waits on it, so it is handed to the night bot as
  # `priority:high`, as super.yml hands it a red run. Squishy takes only what a person hands it (#3676).
  # One issue, PROMOTION_TITLE, opened or commented on; a deploy that passes closes it. A command or a
  # manual run that fails is the asker's to read, and is not reported. It never checks out or runs code.
  report:
    name: report
    needs: [promote, deploy]
    if: >-
      !cancelled() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure'
        || (needs.promote.result == 'failure' && github.event_name == 'workflow_run'
          && github.event.workflow_run.name == 'super'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROMOTE: ${{ needs.promote.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PROMOTION_TITLE: "CI: production promotion failed"
          # Who fixes it: the night bot (.harness/config.json's bot_login) and its queue label.
          BOT_LOGIN: jgoetzmann-bot
          BOT_QUEUE: "bot:build"
        run: |
          set -euo pipefail
          export TITLE=$PROMOTION_TITLE
          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$DEPLOY" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" --reason completed --comment "[This run]($RUN_URL) deployed production."
              echo "closed #$open"
            fi
            exit 0
          fi
          what="the promotion"
          [ "$PROMOTE" != success ] || what="the deploy"
          body=$(printf '%s\n' \
            "[promote-production run]($RUN_URL): $what failed (promote: $PROMOTE, deploy: $DEPLOY), so production did not move to what the super run passed." \
            "" \
            "Night bot: production waits on this, so it is yours and it comes first (\`priority:high\`). Read the failed job's log, find the cause and fix it in a pull request on \`main\`. A failure outside your reach (\`.github/\`, a secret, Cloudflare's or GitHub's settings) is a person's: say exactly what they must do. Once it is fixed, the next daily promotion, a \`/promote\` on the production issue, or *promote production* run with \`redeploy\` moves production; a deploy that passes closes this." \
            "" \
            "---" \
            "_Posted by \`.github/workflows/promote-production.yml\`._")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
            [ "$(gh issue view "$open" --repo "$REPO" --json assignees --jq '.assignees | length')" = 0 ] || exit 0
            number=$open
          else
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$body")
            echo "opened $url"
            number=${url##*/}
          fi
          gh issue edit "$number" --repo "$REPO" --add-assignee "$BOT_LOGIN" --add-label "$BOT_QUEUE" \
            --add-label "priority:high" --add-label "difficulty:hard" \
            && echo "handed #$number to @$BOT_LOGIN, high priority" \
            || echo "::warning::could not hand #$number to @$BOT_LOGIN"
