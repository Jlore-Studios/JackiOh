# Merges main into production (Cloudflare) through a pull request, once a day, with a countdown
# issue anyone can hold or delay. docs/deploy-cloudflare.md is the plan; scripts/promote-production.sh
# is the logic (read its header first) and apps/web/src/net/promote-production.test.ts holds it.
#
# The Worker serves what the `production` branch holds, and nothing else. This workflow is the only
# thing that moves it, and only by merging a pull request whose head is a commit of main whose push-to-main CI
# run passed. It never force-pushes: a `production` that carries anything main does not fails the
# run, loudly, for a human to look at.
#
# The open issue labelled `production merge` says "Merging to production in N hours". The check
# merges when the issue's time has passed and nobody has put it on hold. GitHub has not started this
# repository's scheduled runs at all (CLAUDE.md, the night bot), so the check never rests on the
# cron: every green CI run on main runs it too, and main moves many times a day.
#
# Four ways in:
#   schedule           every hour, at minute 7 (the top of the hour is where GitHub's queue is longest),
#                      if GitHub starts it: read the new comments, merge if due and not on hold, then
#                      close the issue with the pull request and open the next.
#   issue_comment      a /hold, /resume, /delay or /fast-forward on the countdown issue, from someone GitHub calls an
#                      owner, member or collaborator: the same check, so the answer is quick and a
#                      /resume on an overdue merge goes out at once.
#   workflow_run (CI)  right after a green CI run on main: the same check, and the one that does the
#                      work in practice. It also merges a commit that changes render.yaml's
#                      CATALOG_VERSION at once, hold or no hold. Render deploys apps/server from main
#                      on every push, and the bundle compiles the catalog version in
#                      (packages/cards), so a catalog bump left a day behind would refuse every deck
#                      save and queue in production (SPEC §9.4, R105).
#   workflow_dispatch  by hand (Actions -> promote production -> Run workflow): the newest green
#                      commit, or the `sha` given, which must also be green and on main. A hold does
#                      not stop it.
#
# The promote branch, its pull request and the merge go out with the bot's token (BOT_GITHUB_TOKEN),
# because GitHub refuses the Actions token any update to production that carries a change to
# .github/workflows. Nothing loops: a pull request's CI never starts this workflow (only a green push
# to main does), and no workflow runs on a push to a promote branch or to production. The countdown
# issue stays on the Actions token, whose writes start no workflow.
#
# The `deploy` job then builds production and deploys it to the Cloudflare Worker itself, with
# `wrangler deploy` and the CLOUDFLARE_API_TOKEN secret: the same install CI runs (where the build is
# known to pass), the public VITE_ settings from apps/web/.env.production, and
# apps/web/scripts/check-production-bundle.mjs between the build and the deploy, so a bundle that
# cannot sign in never goes live. Cloudflare's own Git builds failed on every commit after the first,
# with logs only the dashboard shows, and built every branch; with this job they are disconnected
# (docs/deploy-cloudflare.md, step 3). After the deploy it fetches the live site and checks it.
name: promote production

on:
  schedule:
    - cron: "7 * * * *"
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to promote (default: the newest one whose CI passed)"
        required: false
        default: ""
      redeploy:
        description: "Build and deploy production even if it does not move"
        type: boolean
        required: false
        default: false

env:
  # The Cloudflare account the `jackioh` Worker lives in (dash.cloudflare.com/<this>/workers/...).
  # An identifier, not a secret; the API token is the secret.
  CLOUDFLARE_ACCOUNT_ID: 3c0495fcdd2622a08e1a91b8de248b46

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  promote:
    name: merge main into production
    # A workflow_run fires for every completed CI run, and an issue_comment for every comment in the
    # repository; only a green push to main, or a command on the countdown issue, gets past here.
    # The label is `RELEASE_LABEL` in scripts/promote-production.sh, which the test holds equal. The
    # concurrency group is the job's, not the workflow's, so a comment that wakes nothing never takes
    # the place of a run waiting its turn.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && contains(github.event.issue.labels.*.name, 'production merge')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && (contains(github.event.comment.body, '/hold') || contains(github.event.comment.body, '/resume')
          || contains(github.event.comment.body, '/release') || contains(github.event.comment.body, '/unhold')
          || contains(github.event.comment.body, '/delay') || contains(github.event.comment.body, '/fast-forward')))
    concurrency:
      group: promote-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      # The script pushes with the checkout's credentials. Moving production past a change to
      # .github/workflows is refused to the Actions token, so the bot's token (it has the `workflow`
      # scope) does the moving: here, and as PROMOTE_TOKEN below. The script's header says more.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}

      - name: merge main into production and keep the countdown issue
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: bash scripts/promote-production.sh

  deploy:
    name: build and deploy to Cloudflare
    needs: promote
    if: >-
      needs.promote.outputs.promoted == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.redeploy)
    # Two deploys never overlap; a deploy waiting its turn builds whatever production is by then.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The install covers the whole workspace, e2e/ included; no browser is needed here.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - uses: ./.github/actions/setup

      - name: build the web app
        env:
          # A repository variable (or a secret, if it was saved on that tab) may hold the publishable key
          # instead of apps/web/.env.production. It is only exported when set: an empty variable would
          # override the file's value.
          KEY_FROM_VARS: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$KEY_FROM_VARS" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$KEY_FROM_VARS" >> "$GITHUB_ENV"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$KEY_FROM_VARS"
          fi
          pnpm --filter @jackioh/web build

      - name: refuse a bundle that cannot sign in or reach the server
        run: |
          if [ ! -f apps/web/scripts/check-production-bundle.mjs ]; then
            echo "::error::production ($(git rev-parse --short HEAD)) predates this deploy job and its settings. Run this workflow without a sha once main's CI is green, so production moves to a commit that has them."
            exit 1
          fi
          node apps/web/scripts/check-production-bundle.mjs

      - name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so production was built but not deployed. docs/deploy-cloudflare.md, step 3, says how to make one."
            exit 1
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: check the live site
        if: steps.deploy.outputs.url != ''
        env:
          SITE: ${{ steps.deploy.outputs.url }}
        run: |
          # The new version can take a few seconds to reach every edge.
          # The settings land in whichever chunk holds src/net/auth.ts, so every script index.html
          # loads or preloads is read.
          for attempt in 1 2 3 4 5 6; do
            scripts=$(curl -fsS "$SITE/" | grep -oE '/assets/[A-Za-z0-9_.-]+\.js' | sort -u || true)
            found=
            for script in $scripts; do
              if curl -fsS "$SITE$script" | grep -q 'sb_publishable_'; then found=$script; break; fi
            done
            if [ -n "$found" ]; then echo "sign-in is configured ($found)"; break; fi
            if [ "$attempt" = 6 ]; then echo "::error::$SITE does not serve a bundle with sign-in configured"; exit 1; fi
            sleep 10
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/decks")
          [ "$status" = 200 ] || { echo "::error::$SITE/decks answered $status, not 200"; exit 1; }
          curl -sI "$SITE/decks" | grep -qi '^content-security-policy:' || { echo "::error::$SITE sends no Content-Security-Policy"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/not-a-page")
          [ "$status" = 404 ] || { echo "::error::$SITE/not-a-page answered $status, not 404"; exit 1; }
          echo "### production is live at $SITE" >> "$GITHUB_STEP_SUMMARY"
