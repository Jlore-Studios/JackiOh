# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: R290's tutorial tier on #4897's card branch alone; run-sim's seed 0 along #4897's commits after
# the merge its AI came in by; and on main, what each root move of the decision that falls back returns.
name: tmp repro 4984 round 3

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984f.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r290-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 520637fc0815702cf1f411d10f85d6595ec52c1f
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache-key: tmp-r290-cards
      - name: R290's tutorial tier
        run: |
          cargo test -p jackioh-ai --tests --features jackioh-engine/testkit -- --ignored r290_the_greedy_baseline --nocapture 2>&1 | grep -E "R290 tutorial tier|not won" | cut -c1-600 || true

  run-sim-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref:
          - d27b20098ff2062f5a27a4418689013270663790
          - 6f0aa70b97c6b1a03816aafa2bcb6cdb4bdd15ed
          - 0782be295dcfcd65609c42516d3d7d9f68242631
          - 31a0428c9098191a8d968d58f402e5f14e373d2e
          - e5cf0dc507dbf5137b43d2dc9421cec9540a4ffa
          - 042177fb4f98c204b2b1183cc112e42baf5d077c
          - 6d48a73e944308e9cdfea21b95e766694aa6c2dc
          - de2fd1df55ae85d51ecded69cf78c6780c541d4d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache-key: tmp-runsim-${{ matrix.ref }}
      - name: run-sim seed 0 at full budget
        run: |
          cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -E "fell back|runs won" | tail -3 || true

  root-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: log each root move
        run: |
          python3 - <<'PY'
          p = 'crates/ai/src/search.rs'
          t = open(p).read()
          a = "                let next = match simulate(&line.state, seat, &action, counter, prices) {\n"
          assert t.count(a) == 1, 'simulate anchor'
          t = t.replace(a, "                let tmp_before = counter.used();\n" + a)
          b = "                    Some(Err(_)) => continue,\n                    Some(Ok(next)) => next,\n                };\n"
          assert t.count(b) == 1, 'result anchor'
          t = t.replace(b, b.replace("                    Some(Err(_)) => continue,\n",
              "                    Some(Err(e)) => { if depth == 0 { eprintln!(\"TMP-ROOT err {:?} used {}->{} {}\", e, tmp_before, counter.used(), serde_json::to_string(&action).unwrap_or_default()); } continue }\n"))
          c = "                let mut actions = line.actions.clone();\n                actions.push(action);\n"
          assert t.count(c) == 1, 'actions anchor'
          t = t.replace(c, "                if depth == 0 { eprintln!(\"TMP-ROOT ok used {}->{} pending {} {}\", tmp_before, counter.used(), next.pending.is_some(), serde_json::to_string(&action).unwrap_or_default()); }\n" + c)
          d = "                    Some(Ok(next)) => next,\n"
          t = t.replace("                    None => {\n                        stopped = true;\n                        break;\n                    }\n",
              "                    None => {\n                        if depth == 0 { eprintln!(\"TMP-ROOT none used {}->{} {}\", tmp_before, counter.used(), serde_json::to_string(&action).unwrap_or_default()); }\n                        stopped = true;\n                        break;\n                    }\n", 1)
          e = "                children.push(OpenLine {\n"
          assert t.count(e) == 1, 'push anchor'
          t = t.replace(e, "                if depth == 0 { eprintln!(\"TMP-ROOT scored used {} score {}\", counter.used(), score); }\n" + e)
          open(p, 'w').write(t)
          q = 'crates/ai/src/decide.rs'
          u = open(q).read()
          f = "    if found.is_empty() {\n        let stopped_by = if counter.stopped_by() != StoppedBy::Exhausted {\n"
          assert u.count(f) == 1, 'empty anchor'
          u = u.replace(f, f.replace("    if found.is_empty() {\n", "    if found.is_empty() {\n        eprintln!(\"TMP-EMPTY used {} remaining {} reserve {} beam {:?}\", counter.used(), remaining, reserve, beam_stopped_by);\n", 1))
          open(q, 'w').write(u)
          PY
      - name: run-sim seed 0 at full budget
        run: |
          cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -E "TMP-|fell back" | grep -B12 -A1 "TMP-EMPTY" | cut -c1-700 | head -40 || true
