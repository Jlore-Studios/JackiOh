# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: tmp-repro-4984d.yml's fallback detail again, on main after #4905 reshaped decide.rs's fallback.
name: tmp repro 4984 fallback

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: log the empty beam's numbers
        run: |
          python3 - <<'PY'
          p = 'crates/ai/src/decide.rs'
          t = open(p).read()
          a = "    if found.is_empty() {\n        let stopped_by = if counter.stopped_by() != StoppedBy::Exhausted {\n"
          assert t.count(a) == 1, 'empty-beam anchor'
          log = ("    if found.is_empty() {\n"
                 "        eprintln!(\"TMP-EMPTY nodes {} used {} remaining {} reserve {} candidates {} beam {:?} counter {:?} passed_over {} turn {} seat {}\", budget.nodes, counter.used(), remaining, reserve, scratch.candidates.len(), beam_stopped_by, counter.stopped_by(), passed_over.is_some(), det0.turn, seat.as_str());\n"
                 "        eprintln!(\"TMP-CANDIDATES {}\", serde_json::to_string(&scratch.candidates).unwrap_or_default().chars().take(3000).collect::<String>());\n")
          t = t.replace(a, a.replace("    if found.is_empty() {\n", log, 1))
          open(p, 'w').write(t)
          PY
      - name: run-sim seed 0 at full budget
        run: |
          cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -E "TMP-|fell back" | cut -c1-3200 | head -12 || true
