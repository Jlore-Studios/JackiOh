# TEMPORARY (issue #4440, part 2), deleted before its pull request merges: the session building
# it cannot build Rust (its container's network policy denies crates.io), so this records
# crates/server/tests/fixtures/practice-claim.json again on the pull request's merge commit, as
# training/ml/learn-promote.sh does, and prints it into the log for the session to commit.
name: tmp record practice claim

on:
  pull_request:
    paths: [".github/workflows/tmp-record-practice-claim.yml"]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: the WASM module
        run: sh scripts/build-wasm.sh
      - name: record the practice-claim fixture again
        run: JACKIOH_RECORD_PRACTICE_CLAIM=1 pnpm --dir apps/web exec vitest run src/practice/claim.test.ts
      - name: the claim test against the new fixture
        run: pnpm --dir apps/web exec vitest run src/practice/claim.test.ts
      - name: print it
        run: |
          echo "PRACTICE-CLAIM-BEGIN"
          base64 -w0 crates/server/tests/fixtures/practice-claim.json
          echo
          echo "PRACTICE-CLAIM-END"
      - uses: actions/upload-artifact@v4
        with:
          name: practice-claim
          path: crates/server/tests/fixtures/practice-claim.json
