# The pull request title check (#187): a pull request's title becomes its squash commit's subject,
# so it must follow docs/issues-and-patches.md (Titles): `Patch: <what it does>`, a shipped card
# change's `Patch vX.Y.Z: …` and a part's `Patch (part n of m): …` (#1360); the older prefixes
# (`Patch v0.3.X`, `vX.Y.0`, `Night bot`, `CI`, `Architecture`, …) stopped passing with the title
# retcon (#1372). The pattern is triage's
# (`bot/go/internal/triage`'s `Convention`), with the titles tools give their own pull requests
# (`AutomatedPull`: `patches ship: v0.3.1`, `Promote main to production: N commit(s) up to abc1234`,
# a training lane's `AI gen N (lane): …`) and GitHub's `Revert "…"` of a title that passes. The
# bots title theirs from their issue when the builder's title breaks it, and when both do (a
# workflow's `CI: …` alert) write `Patch: <what it does>` (`triage.PullTitle`).
#
# _target: this repository's workflow and its default branch's harness run, never code from the pull
# request, and the job reads nothing but the title, from the event, through the environment. It
# runs again on every edit and push, so the result always belongs to the newest title and head.
#
# Not a required check: making it one is branch protection's setting, the owner's call.
name: pr title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            bot
            .harness
            .github/actions/harness

      - uses: ./.github/actions/harness

      - name: The title follows docs/issues-and-patches.md
        working-directory: bot
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: harness pr-title --title="$TITLE" --server-url="$GITHUB_SERVER_URL" --repository="$GITHUB_REPOSITORY"
