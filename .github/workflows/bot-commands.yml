# The night bot's ears (bot/README.md): comment commands, labels, assignment, reviews, and the
# results of CI on its pull requests. No model runs here; model work is queued for the night run,
# or started at once when an operator adds --force. Every ten minutes a sweep reads the last three
# days back and answers anything an event never delivered or a handler failed to answer, then
# starts a night run if one should be going and none is (GitHub drops scheduled bot-night runs).
name: bot-commands

on:
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"
  workflow_dispatch: {}
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [labeled, assigned]
  # _target, so the job runs this repository's workflow with its secrets and never code from the
  # pull request; it checks out the default branch and reads the event payload only.
  pull_request_target:
    types: [labeled, assigned, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI, bot selftest]
    types: [completed]

# No concurrency group: a group keeps one pending run and cancels the rest, which would drop a
# person's command behind the bot's own reply event. The state file is compare-and-set and label
# changes are idempotent, so handlers may overlap.

permissions: {}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  event:
    name: event
    # Wakes only for something the bot answers, so most comments cost nothing, and a comment or
    # review wakes it only from someone GitHub calls an owner, member or collaborator (the trust
    # list is checked again inside). The bot's own comments and labels are skipped by actor. A CI
    # run and a closed bot pull request are handled whoever caused them: the bot's own push
    # starts the CI runs it answers, and GitHub credits an auto-merge to the bot.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
        && contains(fromJSON('["failure", "timed_out", "cancelled", "startup_failure"]'), github.event.workflow_run.conclusion)
        && startsWith(github.event.workflow_run.head_branch, 'bot/'))
      || (github.event_name == 'pull_request_target' && github.event.action == 'closed'
        && contains(github.event.pull_request.labels.*.name, 'bot:pr'))
      || (github.actor != 'jgoetzmann-bot' && github.actor != 'github-actions[bot]' && (
        ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
          && (contains(github.event.comment.body, '/harness')
              || contains(github.event.comment.body, '@jgoetzmann-bot')))
        || (github.event_name == 'pull_request_review'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
          && (contains(github.event.review.body, '/harness')
              || contains(github.event.review.body, '@jgoetzmann-bot')
              || github.event.review.state == 'changes_requested'))
        || ((github.event_name == 'issues' || github.event_name == 'pull_request_target')
          && github.event.action == 'labeled' && startsWith(github.event.label.name, 'bot:'))
        || ((github.event_name == 'issues' || github.event_name == 'pull_request_target')
          && github.event.action == 'assigned' && github.event.assignee.login == 'jgoetzmann-bot')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the state file on the bot-state branch
      issues: write
      pull-requests: write
      actions: write         # start a forced run; re-run failed CI jobs once
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Handle the event, or sweep for anything left unanswered
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Which provider secrets exist, never their values: replies say when a subscription
          # can take the work, and the sweep starts a night run only for work one can take.
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python -m harness sweep
          else
            python -m harness event
          fi
