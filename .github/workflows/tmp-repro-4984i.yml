# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: on this branch, run-sim's seed 0 and its whole daily sweep, and R290's tutorial tier tests.
name: tmp repro 4984 verify

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984i.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: seed 0 at full budget
        run: |
          cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -E "fell back|runs won" | tail -3 || true
      - name: the daily sweep
        run: |
          cargo test -p jackioh-tools --features jackioh-engine/testkit -- --ignored run_sim::tests::the_daily_sweep 2>&1 | grep -E "^test |test result|panicked|fell back" | cut -c1-400 || true

  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: R290's tests
        run: |
          cargo test -p jackioh-ai --tests --features jackioh-engine/testkit -- --ignored r290_ --nocapture 2>&1 | grep -E "R290 tutorial tier|^test tutorial_tier.*(ok|FAILED)|test result: (ok|FAILED)\. [1-9]" | cut -c1-300 || true
