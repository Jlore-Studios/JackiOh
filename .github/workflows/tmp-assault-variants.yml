# TEMPORARY (issue #4783), deleted before its pull request merges: the session building it cannot build Rust
# (its container's network policy denies crates.io), so this plays the Assault's band tests (R4583000) under
# a few candidate tunings side by side on the pull request's merge commit, to choose the retune.
name: tmp assault variants

on:
  pull_request:
    paths: [".github/workflows/tmp-assault-variants.yml"]

permissions:
  contents: read

jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [nohold, nowincon, h30_5, nowincon_h3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: apply the variant
        env:
          V: ${{ matrix.variant }}
        run: |
          health() { sed -i "s/ASSAULT_COMMANDER_HEALTH: (i32, i32) = (30, 3);/ASSAULT_COMMANDER_HEALTH: (i32, i32) = ($1);/" crates/run/src/config.rs; }
          nowincon() { sed -i 's/if !deckable(def) {/if !deckable(def) || def.tags.contains(\&jackioh_engine::wire::Tag::Wincon) {/' crates/run/src/assault/content.rs; }
          case "$V" in
            nohold) health "30, 2"; sed -i 's/pub const AI_LAST_RESORT: &\[&str\] = &\["classic-037", "stinkyscapeplus-079"\];/pub const AI_LAST_RESORT: \&[\&str] = \&[];/' crates/ai/src/config.rs ;;
            nowincon) health "30, 2"; nowincon ;;
            h30_5) health "30, 5" ;;
            nowincon_h3) nowincon ;;
          esac
          git diff
      - name: the band tests
        run: |
          cargo test -p jackioh-tools --bin jackioh -- assault_sim::tests::r4583000 --nocapture 2>&1 | tee bands.log || true
          echo "VARIANT-RESULT ${{ matrix.variant }}: $(grep -E '^test result' bands.log | tail -1)"
          grep -E '^test assault_sim' bands.log || true
