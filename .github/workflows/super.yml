# The daily super run (#306, docs/v0.3.0/README.md §7): everything too slow or too statistical to
# hold every pull request to, once a day on `_staging` (07:17 UTC, #3275) and on demand on any branch
# (`gh workflow run super.yml --ref <branch>`). CI (ci.yml) keeps the essential checks per pull
# request; this keeps the rest from rotting.
#
#   fuzz            `jackioh fuzz` seeds 1-10,000, plain and with the rotating handicap, and the Duos
#                   co-op wave's seeds 1-2,000 (`fuzz --duos`), in quarters (V7, V9, #936 B25)
#   ai gates        `jackioh gate --full` in shards, held together by `gate merge` (V10)
#   golden          `jackioh golden check`: every recorded TypeScript trace replays identically (V4)
#   daily tests     every Rust test `#[ignore = "daily: …"]` leaves out of a pull request's cargo test:
#                   the many-game sweeps, whose rule a cheaper test holds per pull request
#   coverage        cargo llvm-cov over engine, cards and ai, failing under .github/coverage-floor.txt
#                   (90% at the start, raised by hand as it climbs toward #306's 99%)
#   e2e             all 35 e2e specs on Chrome, in shards, and the component specs (V21)
#   web             the audio, fx and asset unit tests and the two promotion tests, which the pull
#                   requests leave out, and the tutorial lessons' whole sweeps (JACKIOH_DAILY=1)
#   db              sql invariants, the store contract and the deploy rehearsal against a real Postgres
#   notebooks       analysis/'s tests on its committed fixtures: the loader's card figures against the
#                   Rust report's, and every notebook run end to end (#442 L19, #445)
#
# On failure the `report` job opens one issue titled `CI: daily super run failed`, or comments on it
# when it is already open, naming each failed job with a link to its log; a run that passes closes it
# (V25). The run is long on purpose and ci-duration.yml does not watch it.
#
# It is also production's gate (#2750). The daily run tests `_staging`, not main (#3275, the owners'
# call of 2026-11-05): promote-staging.yml moves `_staging` to a green commit of main every two hours,
# so the run tests one commit that holds still instead of a main that moves many times an hour. A
# schedule always runs on the default branch, so the scheduled run's one job, `daily`, starts this
# workflow on `_staging` and every other job skips; that dispatched run's `head_sha` is the commit it
# tested. The daily promotion: when the run on `_staging` passes every job, promote-production.yml,
# woken by its completion, merges the commit it tested into `_production` and deploys it. Sooner: a
# `/promote` on the production issue opens a pull request of staging's commit into `_production`,
# this workflow runs on it (`pull_request` below), and
# promote-production.yml merges it only once every job here passed. A red run on such a pull request
# opens its own issue, CANDIDATE_TITLE, handed to the night bot as `priority:high` and
# `difficulty:hard`, since production waits on it; the pull request stays open, and re-running the
# failed jobs merges it once they pass. A run that passes on one closes that issue, never the daily one.
#
# A failed run on `_staging` (or on the default branch, whose commits reach `_staging` within two
# hours) hands the issue to the night bot (.harness/config.json's bot_login), as ci-duration.yml hands
# over its report: a new issue is assigned to it and queued with bot:build and `priority:high`
# (production waits for the next run on `_staging` that passes), and an open one nobody is assigned to
# is handed over the same way, so the red run is worked on without anyone asking. The bot takes this
# issue, found by its title, before every other queued item, `priority:high` ones included
# (bot/go/internal/queue `GateTitles`, #3275). Only a run on `_staging`, on the default branch or on a
# promotion pull request closes it. A dispatched run on any other branch tests that branch's change,
# so it is reported but never handed over, and its report says the branch's author owns it.
#
# The release binaries and the built client travel between jobs as artifacts, built once per run:
# both binaries in one `rust-build` job at Cargo.toml's opt-levels (ci.yml splits them in two,
# #2540; the daily run waits on nobody), and the client as ci.yml's `wasm` jobs build it.
name: super

on:
  # The daily run, on `_staging`: the `daily` job below starts it there.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  # A promotion pull request (promote-production.yml): its head is a commit of staging, so the run
  # tests exactly what production would get.
  pull_request:
    branches: [_production]

# One run per branch at a time; a run is never cancelled for the next one, so every day reports.
concurrency:
  group: super-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fuzz wave's size (README §7); `fuzz` splits it evenly over its matrix.
  FUZZ_SEEDS: "10000"
  # The Duos wave's (§13, #936 B25), ten times `fuzz --duos`'s 200: a Duos game is four seats and a
  # pool, several times a 1v1 game's work. Split the same way.
  DUOS_FUZZ_SEEDS: "2000"

jobs:
  # ------------------------------------------------------------------------------------------------
  # builds, once per run
  # ------------------------------------------------------------------------------------------------

  # The scheduled run starts the daily run on `_staging` (the header says why) and does nothing else:
  # every job below skips on `schedule`, those that need one through it. The Actions token may start a
  # workflow_dispatch. A commit a finished run already tested is not run again: while that run is red,
  # staging holds still for the night bot's fix (scripts/promote-staging.sh, the freeze, the owners'
  # call of 2026-11-10), which starts the run itself on the commit that carries the fix, and a second
  # run on the same commit would only open a second issue for the same failures.
  daily:
    name: start the daily run on staging
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: gh workflow run super.yml --ref _staging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/_staging" --jq .sha)
          tested=$(gh run list --workflow super.yml --branch _staging --commit "$sha" --status completed --limit 20 \
            --json conclusion --jq '[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped")] | length')
          if [ "$tested" != 0 ]; then
            echo "### \`_staging\` (${sha:0:12}) has a finished super run already, so none starts today" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run super.yml --ref _staging
          echo "### started the daily super run on \`_staging\` (${sha:0:12})" >> "$GITHUB_STEP_SUMMARY"

  rust-build:
    name: release build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: jackioh and jackioh-server
        run: cargo build --release -p jackioh-server -p jackioh-tools
      # A tarball keeps the executable bits an artifact would drop.
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/rust-release.tgz" target/release/jackioh target/release/jackioh-server
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}/rust-release.tgz
          if-no-files-found: error
          retention-days: 3

  wasm:
    name: wasm and client build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: the WASM module
        run: sh scripts/build-wasm.sh
      - name: the e2e client
        run: pnpm build:e2e
      # R3074000: the dev dashboard's e2e client, which spec 49 drives on :5174.
      - name: the dev dashboard's e2e client
        run: pnpm --dir apps/admin build:e2e
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/web-build.tgz" apps/web/src/wasm/pkg apps/web/dist apps/admin/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tgz
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------------------------------------
  # the engine at scale
  # ------------------------------------------------------------------------------------------------

  # Seeds 1-FUZZ_SEEDS, each quarter plain and then with the handicap (fuzz-handicap.test.ts's
  # rotation), as `--from` and `--seeds` ranges: a seed is its own game whatever run it sits in, so
  # the quarters together play exactly `fuzz --seeds 10000` and `fuzz --seeds 10000 --handicap`. Then
  # the quarter's share of the Duos co-op wave, seeds 1-DUOS_FUZZ_SEEDS (`fuzz --duos`), which no
  # pull request plays beyond the tools crate's three seeds.
  fuzz:
    name: fuzz (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack the binaries
        run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: this quarter's seeds, plain and handicapped
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          per=$(( FUZZ_SEEDS / SHARDS ))
          from=$(( (SHARD - 1) * per + 1 ))
          echo "seeds $from..$(( from + per - 1 ))"
          target/release/jackioh fuzz --from "$from" --seeds "$per"
          target/release/jackioh fuzz --from "$from" --seeds "$per" --handicap
      # Also after a failure above, so one run reports every wave.
      - name: this quarter's Duos seeds
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          per=$(( DUOS_FUZZ_SEEDS / SHARDS ))
          from=$(( (SHARD - 1) * per + 1 ))
          echo "Duos seeds $from..$(( from + per - 1 ))"
          target/release/jackioh fuzz --duos --from "$from" --seeds "$per"

  # The three matchups at their full seed counts against gateNeeded, and the perf gate, every k-th
  # game per shard. Wins are a property of the whole run, so each shard keeps its games and `gate
  # merge` holds them together.
  gate-shard:
    name: ai gates (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack the binaries
        run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: this shard's games
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: target/release/jackioh gate --full --shard "$SHARD" --out gate-shards
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gate-${{ matrix.shard }}
          path: gate-shards/
          if-no-files-found: error
          retention-days: 3

  gate:
    name: ai gates (full)
    needs: [rust-build, gate-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack the binaries
        run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-gate-*
          path: gate-shards
          merge-multiple: true
      - name: each matchup's wins against gateNeeded, over every shard
        run: target/release/jackioh gate merge gate-shards

  golden:
    name: golden check
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack the binaries
        run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: every recorded trace replays with the same hashes
        run: target/release/jackioh golden check
      # The Rust side of the first mismatch (SURFACE §13.3); scripts/golden/record.ts --dump-step,
      # in a checkout of 05f5cfd (the last commit that has the TypeScript), writes its side beside it.
      - name: keep the diff when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: target/golden-diff/
          if-no-files-found: warn

  # The Rust tests too slow or too statistical for every pull request: each `#[ignore = "daily: …"]`
  # in the workspace, its reason naming what holds the same rule per pull request (acceptance.rs
  # holds every ignore to that form), and nothing else. `--tests` leaves out the doc-tests, whose
  # `ignore` blocks are not tests at all. Most of the job is compiling the workspace.
  daily-tests:
    name: daily tests (cargo test -- --ignored)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache-key: daily-tests
      - name: every test a pull request leaves to the daily run
        run: cargo test --workspace --tests --features jackioh-engine/testkit,jackioh-engine/ts -- --ignored

  coverage:
    name: coverage (engine, cards, ai)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: the LLVM tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: line coverage, held to the floor in .github/coverage-floor.txt
        run: |
          floor=$(tr -d '[:space:]' < .github/coverage-floor.txt)
          echo "floor: $floor% of lines"
          cargo llvm-cov --package jackioh-engine --package jackioh-cards --package jackioh-ai \
            --features jackioh-engine/testkit --summary-only --fail-under-lines "$floor"

  # ------------------------------------------------------------------------------------------------
  # the web and e2e
  # ------------------------------------------------------------------------------------------------

  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [rust-build, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: ./.github/actions/e2e-shard
        with:
          specs: all
          shard: ${{ matrix.shard }}
          shards: ${{ strategy.job-total }}

  # BUILD M5-T1's "without layout overflow at 1280x720 and 390x844": jsdom has no layout engine, so
  # Cypress component testing mounts the 10-unit/10-backrow fixture board in a real browser. No
  # client build and no server: the component dev server compiles apps/web/src itself, on port 5273,
  # and only needs the WASM module. All the specs in one job: 16 minutes on 2026-11-07, cut off at 20
  # on 2026-11-08 (#3439) as the art and animation specs grew, so it gets 60 until it is sharded.
  component:
    name: e2e component (chrome)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}
      - name: unpack the WASM module
        run: tar -xzf "$RUNNER_TEMP/web-build.tgz"
      - name: the fixture board's layout, measured in a browser
        run: pnpm --dir e2e exec cypress run --component --browser chrome
      - name: keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-component
          path: e2e/artifacts/component/screenshots
          if-no-files-found: warn

  # The unit tests ci.yml's `web (unit k/4)` leave out: the audio and fx layers, the asset tests and
  # promote-production.test.ts and promote-staging.test.ts (which ci.yml's `web (promote-production)`
  # runs only when what they test changed); and, with JACKIOH_DAILY=1 (apps/web/src/test/daily.ts), the whole of
  # each sweep a pull request plays only the first game of: the tutorial lessons'.
  web-extra:
    name: web (audio, fx, asset and daily tests)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}
      - name: unpack the WASM module
        run: tar -xzf "$RUNNER_TEMP/web-build.tgz"
      - name: vitest
        env:
          JACKIOH_DAILY: "1"
        run: >-
          pnpm exec vitest run --project web src/audio/ src/fx/ src/cards/art/convention.test.ts
          src/net/promote-production.test.ts src/net/promote-staging.test.ts src/tutorial/scripts/

  # ------------------------------------------------------------------------------------------------
  # notebooks
  # ------------------------------------------------------------------------------------------------

  # The balance notebooks (#442 L19): analysis/'s tests on its committed fixtures, which hold the
  # loader's card win rates to the Rust report's and run every notebook. No pull request runs them:
  # analysis/ is on scripts/ci-scope.sh's skip list, since nothing a per-pull-request job reads is in it.
  notebooks:
    name: notebooks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: uv, pinned
        run: python3 -m pip install uv==0.13.0
      - name: the pinned dependencies, exactly as the lock has them
        run: python3 -m uv sync --frozen --project analysis
      - name: the loader's tests and every notebook, on the fixtures
        run: python3 -m uv run --project analysis pytest analysis/tests

  # ------------------------------------------------------------------------------------------------
  # db
  # ------------------------------------------------------------------------------------------------

  # ci.yml's db suites (its comment says what each measures), run whatever changed.
  db:
    name: db (${{ matrix.suite }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: sql invariants
            script: crates/server/tests/sql/run.sh
            rust: false
          - suite: store contract
            script: crates/server/tests/db/run.sh
            rust: true
          - suite: deploy rehearsal
            script: crates/server/tests/deploy/rehearse.sh
            rust: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: ${{ matrix.rust }}
        with:
          node: "false"
      - name: pre-pull postgres
        run: docker pull postgres:16
      - name: ${{ matrix.suite }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: sh "$SCRIPT"

  # ------------------------------------------------------------------------------------------------
  # report
  # ------------------------------------------------------------------------------------------------

  # One issue, found by its exact title: opened (or commented on) when anything above did not pass,
  # closed when everything did on `_staging`, the default branch or a promotion, and handed to the
  # night bot when the red run is on one of those. It never checks out or runs code; the job names it quotes reach the shell through the
  # API's JSON and env, never through `${{ }}` in the script.
  report:
    name: report
    needs: [rust-build, wasm, fuzz, gate-shard, gate, golden, daily-tests, coverage, e2e, component, web-extra, notebooks, db]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DAILY_TITLE: "CI: daily super run failed"
          # A promotion pull request's own issue; scripts/promote-production.sh names it (SUPER_TITLE).
          CANDIDATE_TITLE: "CI: super run failed on a production candidate"
          # Who fixes the red run: the night bot (.harness/config.json's bot_login).
          BOT_LOGIN: jgoetzmann-bot
          # The branch the daily run tests and production takes its commits from (#3275).
          STAGING_BRANCH: _staging
        run: |
          set -euo pipefail
          red=false
          for result in $RESULTS; do
            [ "$result" = success ] || red=true
          done
          echo "results: $RESULTS"

          # A promotion pull request into production has its own issue, so its run never closes, or
          # comments on, the daily one.
          candidate=false
          TITLE=$DAILY_TITLE
          if [ "$EVENT" = pull_request ] && [ "$BASE" = _production ]; then
            candidate=true
            TITLE=$CANDIDATE_TITLE
          fi
          export TITLE
          # The runs the daily issue belongs to: on `_staging` (the daily run, production's gate) and on
          # the default branch, whose commits reach `_staging` within two hours. Any other branch's run
          # tests that branch's change.
          gate=false
          if [ "$candidate" = false ] && { [ "$REF" = "$STAGING_BRANCH" ] || [ "$REF" = "$DEFAULT_BRANCH" ]; }; then
            gate=true
          fi

          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          where="[super run $RUN_ID]($RUN_URL) on \`$REF\` (\`${SHA:0:7}\`, $EVENT)"
          [ "$candidate" = false ] || where="[super run $RUN_ID]($RUN_URL) on #$PR, the promotion of \`${SHA:0:12}\` into production,"

          if [ "$red" = false ]; then
            if [ "$candidate" = false ] && [ "$gate" = false ]; then
              echo "every job passed on $REF; the daily issue is left to the runs on $STAGING_BRANCH"
              exit 0
            fi
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" --reason completed --comment "$where passed every job."
              echo "closed #$open"
            else
              echo "every job passed; no issue open"
            fi
            exit 0
          fi

          # This attempt's jobs that ended badly. A job skipped because one it needs failed is left
          # out: the one that failed is listed. The filter's `\(...)` is jq's, not the shell's.
          failed=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" --jq '
            .jobs[]
            | select(.status == "completed")
            | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")
            | "| [\(.name | gsub("\\|"; "\\|"))](\(.html_url)) | \(.conclusion) |"')
          if [ -z "$failed" ]; then
            failed="| [the run]($RUN_URL) | a job did not pass; see the run |"
          fi
          echo "$failed"

          # Staging's red run, main's and a promotion's are the night bot's to fix, first; a branch's is
          # its author's.
          if [ "$candidate" = true ]; then
            owner="Night bot: production waits on this run, so it is yours and it comes first (\`priority:high\`, and you take it before every other queued item). #$PR promotes \`${SHA:0:12}\`, a commit of \`$STAGING_BRANCH\` (and so of \`$DEFAULT_BRANCH\`), so the fix lands on \`$DEFAULT_BRANCH\` like any other. Root-cause each failed job from its log and fix it in a pull request: a flake is not a root cause, so make a flaky test robust instead of re-running it, and never skip, disable or quarantine a test to get green. Reproduce it with the job's own command (CLAUDE.md, Commands; one fuzz seed is \`cargo jackioh fuzz --from <seed> --seeds 1\`, with \`--handicap\` for the handicapped wave and \`--duos\` for the Duos wave; a daily test is \`cargo test -p <crate> <name> -- --ignored\`). Say in the pull request which job here the fix makes pass and how you checked it. You cannot change \`.github/\`: make the part of the fix that lives elsewhere, and when the rest needs a workflow or an action, give the exact lines to change there and ask a person to make them. Once the fix is on \`$DEFAULT_BRANCH\`, promote-staging.yml brings it to \`$STAGING_BRANCH\` within two hours; the next daily run there that passes promotes it, or a \`/promote\` on the production issue tests staging's newer commit sooner."
          elif [ "$gate" = true ]; then
            owner="Night bot: this run is on \`$REF\`, so it is yours, and it comes first (\`priority:high\`, and you take it before every other queued item): production promotes itself only from a daily run on \`$STAGING_BRANCH\` that passes every job, so it waits on this fix, and \`$STAGING_BRANCH\` holds still until this issue closes (scripts/promote-staging.sh, the freeze). Fix every failed job here, in the one pull request on \`$DEFAULT_BRANCH\` that closes this: when it closes, \`$STAGING_BRANCH\` takes main's first green commit after the close and the super run starts on it at once, and a run still red opens a new issue. Before you start, look for an open pull request or issue already fixing one of these jobs, and build on it instead of fixing the same test twice. Root-cause each failed job from its log and fix it in a pull request: a flake is not a root cause, so make a flaky test robust instead of re-running it, and never skip, disable or quarantine a test to get green. Reproduce it with the job's own command (CLAUDE.md, Commands; one fuzz seed is \`cargo jackioh fuzz --from <seed> --seeds 1\`, with \`--handicap\` for the handicapped wave and \`--duos\` for the Duos wave; a daily test is \`cargo test -p <crate> <name> -- --ignored\`). A pull request's CI runs only the e2e smoke specs and leaves the tests marked \`#[ignore = \"daily: …\"]\` out, so say in the pull request which job here the fix makes pass and how you checked it. You cannot change \`.github/\`: make the part of the fix that lives elsewhere, and when the rest needs a workflow or an action, give the exact lines to change there and ask a person to make them."
          else
            owner="This run is on \`$REF\`, not \`$STAGING_BRANCH\` or \`$DEFAULT_BRANCH\`: it tests that branch's change, so the branch's author fixes it, and it is not handed to the night bot."
          fi

          body=$(printf '%s\n' \
            "$where failed:" \
            "" \
            "| Job | Result |" \
            "|---|---|" \
            "$failed" \
            "" \
            "Each link opens that job's log. This issue stays open while the run is red and the next run that passes every job closes it. \`gh workflow run super.yml --ref <branch>\` runs it again on demand." \
            "" \
            "$owner" \
            "" \
            "---" \
            "_Posted by \`.github/workflows/super.yml\`._")

          # Hands the issue to the night bot: assigned to it and queued, as a person assigning it
          # would, for a red run on `_staging`, the default branch or a promotion pull request only, all
          # as high priority and hard since production waits on them (docs/issues-and-patches.md; the
          # daily one too since 2026-11-10, after a medium plan fixed part of a red run). A failure here
          # leaves the report standing for a person.
          hand_over() {
            if [ "$candidate" = true ]; then
              gh issue edit "$1" --repo "$REPO" --add-assignee "$BOT_LOGIN" --add-label "bot:build" \
                --add-label "priority:high" --add-label "difficulty:hard" \
                && echo "handed #$1 to @$BOT_LOGIN, high priority" \
                || echo "::warning::could not hand #$1 to @$BOT_LOGIN"
              return 0
            fi
            if [ "$gate" = false ]; then
              echo "a run on $REF: #$1 is not handed to @$BOT_LOGIN"
              return 0
            fi
            gh issue edit "$1" --repo "$REPO" --add-assignee "$BOT_LOGIN" --add-label "bot:build" \
              --add-label "priority:high" --add-label "difficulty:hard" \
              && echo "handed #$1 to @$BOT_LOGIN, high priority" \
              || echo "::warning::could not hand #$1 to @$BOT_LOGIN"
          }

          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
            # Someone already on it, the bot or a person, keeps it.
            if [ "$(gh issue view "$open" --repo "$REPO" --json assignees --jq '.assignees | length')" = 0 ]; then
              hand_over "$open"
            fi
          else
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$body")
            echo "opened $url"
            hand_over "${url##*/}"
          fi
