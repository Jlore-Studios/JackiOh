# The weekly hygiene run (#839): an issue that hands the cleanup to Squishy, for a person to review and
# merge (`person merges`). Its body asks for dead files, archives and the agent instructions held to
# Anthropic's current guidance, and lists the stale branches safe to delete for a person to delete by
# hand. Nothing here deletes or merges anything. Mondays at 06:41 UTC, and on demand:
# `gh workflow run hygiene.yml`, with `-f dry_run=true` to open nothing.
#
# Two jobs, so the model never holds a GitHub token. `research` runs the model on Squishy's
# subscription to read Anthropic's pages for the guidance, since a builder has no web access. `sweep`
# reads the branches and opens the issue, with no model. The rule, the prompt and the issue's text are
# in .github/hygiene/, where no bot may change them; bot/tests/test_hygiene.py tests the rule.
name: hygiene

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Open no issue; show what it would say
        type: boolean
        default: false

permissions: {}

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  research:
    name: research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/hygiene
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the claude CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version
      # Web access on Anthropic's sites alone, and search; nothing else. A failed call leaves the
      # issue without a digest, not without an issue.
      - name: the model reads the current guidance
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY }}
        run: |
          allowed="WebSearch,WebFetch(domain:code.claude.com),WebFetch(domain:docs.claude.com)"
          allowed="$allowed,WebFetch(domain:www.anthropic.com),WebFetch(domain:anthropic.com)"
          allowed="$allowed,WebFetch(domain:claude.com),WebFetch(domain:claude.dev)"
          timeout 25m claude -p "$(cat .github/hygiene/research.md)" --model opus --permission-mode dontAsk \
            --allowedTools "$allowed" --disallowedTools "Bash,Edit,Write,NotebookEdit" \
            --max-turns 40 --output-format text > guidance.md \
            || { echo "::warning::the guidance step failed"; : > guidance.md; }
          wc -c guidance.md
      - uses: actions/upload-artifact@v4
        with:
          name: guidance
          path: guidance.md
          retention-days: 30

  sweep:
    name: sweep
    needs: research
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/hygiene
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: guidance
      - name: survey the branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/hygiene/branches.py survey > survey.json
          python3 .github/hygiene/branches.py report survey.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: survey
          path: survey.json
          retention-days: 30
      - name: open the issue for Squishy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/hygiene/branches.py issue .github/hygiene/issue.md report.md guidance.md | tee -a "$GITHUB_STEP_SUMMARY"
