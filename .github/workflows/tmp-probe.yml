# Temporary: asks jackioh.com which catalog and commit its server reports (removed in the next commit).
name: probe production (temporary)
on:
  push:
    branches: [claude/charming-bell-p8etig]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for i in 1 2 3; do
            curl -sS -m 150 -D h.txt -o b.json https://jackioh.com/api/catalog || true
            echo "status $(head -1 h.txt | tr -d '\r') commit $(grep -i '^x-deployed-commit' h.txt | tr -d '\r') version $(jq -r .version b.json 2>/dev/null)"
            sleep 20
          done
          curl -sS -m 60 -D - -o /dev/null https://jackioh.com/healthz | tr -d '\r' | grep -i 'HTTP/\|x-deployed' || true
