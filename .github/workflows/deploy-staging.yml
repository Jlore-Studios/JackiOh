# Deploys the `_staging` branch to staging, https://staging.jackioh.com (the `jackioh-staging` Worker,
# wrangler.jsonc's `env.staging`), each time it moves: the site and its game server together, as
# promote-production.yml's `deploy` job puts `_production` on jackioh.com, with the same setup and
# staging's own build (`build:staging`, apps/web/.env.staging) and bundle check. promote-staging.yml
# moves `_staging` every two hours to main's newest commit whose push-to-main CI passed (#3275), so
# what deploys here has passed CI on exactly that commit. docs/deploy-cloudflare.md is the plan.
#
# Two ways in:
#   push (staging)     promote-staging.yml's fast-forward, made with the bot's token so that it starts
#                      this: staging's new head. A push runs the workflow file of the commit pushed,
#                      so a change to this file reaches staging with the commit that makes it.
#   workflow_dispatch  by hand (Actions -> deploy staging -> Run workflow): the `sha` given, which must
#                      be on `_staging`, or staging's head. To deploy a newer commit of main, move
#                      staging first (Actions -> promote staging -> Run workflow).
#
# One deploy at a time, and the one running finishes: GitHub keeps one more waiting, the newest, and
# cancels any older one still waiting, so staging's newest head still wins without throwing away a
# build half done. (A newer run cancelled the one running until 2026-11-03: main ships often enough
# that 8 deploys a day were cancelled, 112 minutes of builds.) The job's `environment: staging`
# records each deploy as a GitHub deployment, which the production issue reads.
#
# What each deploy builds, as little as it can:
#   - the server's image: scripts/server-image.sh names it by its inputs and pushes it to Cloudflare's
#     registry once (`jackioh-server`, the repository production's deploy reads too), so a commit
#     that changes nothing the image is built from builds and pushes nothing. A new image comes from
#     the CI run's `deploy-image` artifact, which `db (deploy image)` built from the same Dockerfile;
#     only without it is it built, on CI's layer cache. After a checked deploy, `prune` drops the
#     registry's tags past the newest few.
#   - the WASM module: the production build (`JACKIOH_WASM_PREVIEW=0`, as apps/web's
#     `prebuild:staging`), kept in GitHub's cache under a key of everything it is built from
#     (WASM_CACHE), so a commit that changes nothing under crates/ skips the build. CI's own module
#     carries the `preview` feature a player's bundle must not, so it is not used.
#
# Needs CLOUDFLARE_API_TOKEN, the secret production's deploy uses, and for the live check an Access
# service token that Cloudflare Access lets through to staging.jackioh.com, in CF_ACCESS_CLIENT_ID and
# CF_ACCESS_CLIENT_SECRET: without them the check is skipped with a notice, since Access refuses
# everyone else. The server's own secrets are the Worker's (`wrangler secret put --env staging`,
# apps/edge/README.md), never this repository's.
name: deploy staging

on:
  push:
    branches: [_staging]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of staging to deploy (default: staging's head)"
        required: false
        default: ""

env:
  # The Cloudflare account both Workers live in, as promote-production.yml has it: an identifier, not
  # a secret.
  CLOUDFLARE_ACCOUNT_ID: 3c0495fcdd2622a08e1a91b8de248b46
  # Staging's address, behind Cloudflare Access (infra/cloudflare.tf).
  SITE: https://staging.jackioh.com
  # How long the live check waits for the server to report the deployed commit, as production's.
  LIVE_SECONDS: "900"
  # The cache key's prefix for the production build of the WASM module, shared with
  # promote-production.yml's deploy job (the same module), and the layer cache CI's deploy image
  # jobs write, which a server image built here reads.
  WASM_CACHE: wasm-player-v1
  IMAGE_CACHE_FROM: type=gha,scope=deploy-rehearsal

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: build and deploy to staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ env.SITE }}
    runs-on: ubuntu-latest
    # A cold release build of the server's image when neither the registry nor CI has it, as
    # production's deploy job (its comment says more).
    timeout-minutes: 60
    env:
      # The install covers the whole workspace, e2e/ included; no browser is needed here.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: the commit to deploy
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # A push deploys what it pushed (a newer push's run waits its turn, and GitHub cancels an
          # older one still waiting); a dispatch deploys the commit named, or staging's head.
          head=$(gh api "repos/$GH_REPO/commits/_staging" --jq .sha)
          if [ "$EVENT" = push ]; then
            sha=$PUSHED
          else
            sha=${INPUT_SHA:-$head}
            sha=$(gh api "repos/$GH_REPO/commits/$sha" --jq .sha) || { echo "::error::$INPUT_SHA is not a commit of $GH_REPO."; exit 1; }
            case $(gh api "repos/$GH_REPO/compare/$sha..._staging" --jq .status) in
              ahead | identical) ;;
              *) echo "::error::$sha is not on _staging. Move _staging first (Actions -> promote staging -> Run workflow)."; exit 1 ;;
            esac
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying ${sha:0:12} to staging (_staging's head is ${head:0:12})"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      # The production build of the WASM module, when nothing it is built from changed.
      - name: the WASM module, if cached
        id: wasm
        uses: actions/cache@v4
        with:
          path: apps/web/src/wasm/pkg
          key: ${{ env.WASM_CACHE }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'scripts/build-wasm.sh') }}

      # As production's deploy job: the Node half installs apps/edge's wrangler, and the Rust half is
      # for the WASM build, which a cached module skips.
      - uses: ./.github/actions/setup
        with:
          rust: ${{ steps.wasm.outputs.cache-hit == 'true' && 'false' || 'true' }}

      # Before anything writes to the checkout: scripts/server-image.sh refuses inputs that differ
      # from HEAD. buildx and the cache service's URL and token are for a build on CI's layer cache,
      # when neither the registry nor the CI run has the image. The script is this workflow's
      # commit's, not the deployed one's, which may predate it.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: the server's image
        id: image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_COMMIT: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git show FETCH_HEAD:scripts/server-image.sh > "$RUNNER_TEMP/server-image.sh"
          bash "$RUNNER_TEMP/server-image.sh" use jackioh-staging-server

      # From apps/web/.env.staging alone: the publishable key a repository variable may hold is
      # production's (promote-production.yml), and staging's Supabase project need not stay the same.
      # With the module cached, `build:staging` runs without `prebuild:staging`, the WASM build.
      - name: build the web app for staging
        env:
          WASM_CACHED: ${{ steps.wasm.outputs.cache-hit }}
        run: |
          if [ "$WASM_CACHED" = true ]; then
            cd apps/web && node --env-file=.env.staging node_modules/vite/bin/vite.js build
          else
            pnpm --filter @jackioh/web build:staging
          fi

      - name: refuse a bundle that cannot sign in or reach the server
        run: node apps/web/scripts/check-production-bundle.mjs --staging

      - name: deploy the site and its server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so staging was built but not deployed. docs/deploy-cloudflare.md, section 4, step 2, says how to make one."
            exit 1
          fi
          pnpm --dir apps/edge exec wrangler deploy --config ../../wrangler.jsonc --env staging --var "DEPLOYED_COMMIT:$SHA"

      # A step's `if` cannot read secrets, so this one says whether the token is there.
      - name: whether Access will let the check through
        id: access
        env:
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$ACCESS_ID" ] && [ -n "$ACCESS_SECRET" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CF_ACCESS_CLIENT_ID or CF_ACCESS_CLIENT_SECRET is not set, so nothing checks that $SITE runs the deploy: Cloudflare Access refuses a request without a service token (docs/deploy-cloudflare.md)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: wait for the server on this commit
        if: steps.access.outputs.set == 'true'
        uses: ./.github/actions/poll-live
        with:
          site: ${{ env.SITE }}
          commit: ${{ steps.sha.outputs.sha }}
          seconds: ${{ env.LIVE_SECONDS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # R3074000: the dev dashboard (apps/admin), a Worker of its own that binds this one, so it goes
      # after the site's. Its address, admin-staging.jackioh.com, and the Access application in front
      # of it are infra/cloudflare.tf's; until they are applied the Worker serves nothing. A commit
      # from before the dashboard has no apps/admin, so it deploys none, as promote-production.yml's
      # step does (deploy-staging run 41938332424 failed on one with ENOENT).
      - name: build and deploy the dev dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -f apps/admin/wrangler.jsonc ]; then
            echo "::notice::staging ($(git rev-parse --short HEAD)) predates the dev dashboard (apps/admin): nothing to deploy."
            exit 0
          fi
          pnpm --dir apps/admin build:staging
          pnpm --dir apps/edge exec wrangler deploy --config ../admin/wrangler.jsonc --env staging

      # Only after a deploy whose server reported its commit, and never failing one that did.
      - name: drop the registry's older images
        if: steps.access.outputs.set == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ steps.image.outputs.tag }}
        run: bash "$RUNNER_TEMP/server-image.sh" prune "$TAG"

      - name: say so
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          CHECKED: ${{ steps.access.outputs.set }}
        run: |
          if [ "$CHECKED" = true ]; then
            echo "### staging is live at $SITE, its server on \`${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### staging deployed \`${SHA:0:12}\` to $SITE (not checked: no Access service token)" >> "$GITHUB_STEP_SUMMARY"
          fi
