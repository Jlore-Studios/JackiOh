# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: tmp-repro-4984.yml's dump, for the run's two handicapped fuzz failures (seed 12125's I19 in an
# I14 branch, which this replays itself, and seed 3928's I21).
name: tmp repro 4984 handicap

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984b.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: patch in the logging
        run: |
          python3 - <<'EOF'
          p = 'crates/tools/src/fuzz.rs'
          t = open(p).read()
          a = "        let action_type = action.action_type().as_str().to_string();\n"
          assert t.count(a) == 1, 'action_type anchor'
          t = t.replace(a, "        let tmp_prev = std::env::var(\"JACKIOH_TMP_DUMP\").ok().map(|_| state.clone());\n" + a)
          b = "        let mut broken = monitor.after(&result.events, &state);\n"
          assert t.count(b) == 1, 'after anchor'
          dump = (
              "        if let (Ok(want), Some(prev)) = (std::env::var(\"JACKIOH_TMP_DUMP\"), tmp_prev.as_ref()) {\n"
              "            if broken.iter().any(|f| f.contains(want.as_str())) {\n"
              "                std::fs::write(\"/tmp/dump-findings.json\", serde_json::to_string(&broken).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-action.json\", serde_json::to_string(&log.last().map(|a| &a.body)).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-events.json\", serde_json::to_string(&result.events).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-prev.json\", serde_json::to_string(prev).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-after.json\", serde_json::to_string(&state).unwrap()).unwrap();\n"
              "            }\n"
              "        }\n"
          )
          t = t.replace(b, b + dump)
          open(p, 'w').write(t)

          p = 'crates/ai/src/match_.rs'
          t = open(p).read()
          c = "            if decision.reason == DecisionReason::Fallback {\n"
          assert t.count(c) == 1, 'match fallback anchor'
          t = t.replace(c, c + "                eprintln!(\"TMP-FALLBACK turn {} seat {}\", current.turn, seat.as_str());\n")
          open(p, 'w').write(t)

          p = 'crates/ai/src/decide.rs'
          t = open(p).read()
          d = "reason: DecisionReason::Fallback,"
          assert t.count(d) == 5, 'decide sites'
          t = t.replace(d, "reason: { eprintln!(\"TMP-FALLBACK site decide.rs:{}\", line!()); DecisionReason::Fallback },")
          open(p, 'w').write(t)
          p = 'crates/tools/src/fuzz.rs'
          t = open(p).read()
          e = "            broken.extend(monitor.listed(&state, probe));\n"
          assert t.count(e) == 1, 'listed anchor'
          branch = (
              "            if let (Ok(want), Ok(raw)) = (std::env::var(\"JACKIOH_TMP_DUMP\"), std::env::var(\"JACKIOH_TMP_BRANCH\")) {\n"
              "                if broken.iter().any(|f| f.contains(want.as_str())) {\n"
              "                    let (seat, body) = raw.split_once(' ').unwrap();\n"
              "                    let body: ActionBody = serde_json::from_str(body).unwrap();\n"
              "                    let seat = if seat == \"p1\" { jackioh_engine::PlayerId::P1 } else { jackioh_engine::PlayerId::P2 };\n"
              "                    let took = reduce(&state, &Action::new(body, seat, \"dump\".to_string()));\n"
              "                    std::fs::write(\"/tmp/dump-findings.json\", serde_json::to_string(&broken).unwrap()).unwrap();\n"
              "                    std::fs::write(\"/tmp/dump-action.json\", serde_json::to_string(&took.error).unwrap()).unwrap();\n"
              "                    std::fs::write(\"/tmp/dump-events.json\", serde_json::to_string(&took.events).unwrap()).unwrap();\n"
              "                    std::fs::write(\"/tmp/dump-prev.json\", serde_json::to_string(&state).unwrap()).unwrap();\n"
              "                    std::fs::write(\"/tmp/dump-after.json\", serde_json::to_string(&took.state).unwrap()).unwrap();\n"
              "                }\n"
              "            }\n"
          )
          t = t.replace(e, e + branch)
          open(p, 'w').write(t)
          EOF
      - name: jackioh and jackioh-server
        run: cargo build --release -p jackioh-server -p jackioh-tools
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/rust-release.tgz" target/release/jackioh target/release/jackioh-server
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}/rust-release.tgz
          retention-days: 1

  fuzz-dump:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 12125
            want: I19
            branch: 'p1 {"type":"play","instanceId":"c94"}'
          - seed: 3928
            want: I21
            branch: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: replay the handicapped seed
        env:
          JACKIOH_TMP_DUMP: ${{ matrix.want }}
          BRANCH: ${{ matrix.branch }}
        run: |
          if [ -n "$BRANCH" ]; then export JACKIOH_TMP_BRANCH="$BRANCH"; fi
          target/release/jackioh fuzz --handicap --from ${{ matrix.seed }} --seeds 1 2>&1 | grep -E "I[0-9]+ |message:|failed|passed" | cut -c1-600 || true
      - name: print the dump
        run: |
          for f in findings action events prev after; do
            echo "DUMP-$f-BEGIN"
            gzip -9c /tmp/dump-$f.json | base64 -w0 || true
            echo
            echo "DUMP-$f-END"
          done
