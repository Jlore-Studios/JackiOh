# Throwaway: proves CLAUDE_CODE_OAUTH_TOKEN_7 logs in and answers on both of claude-7's models,
# and that its stream carries the usage reading the bot caps on. Deleted once it has run.
name: throwaway check of claude-7

on:
  push:
    branches: [claude/dazzling-carson-tyom7b]
    paths: [.github/workflows/throwaway-claude-7.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Is the secret set?
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN_7 is not set in this repository's secrets"
            exit 1
          fi
          echo "set (${#TOKEN} characters)"

      - name: Install the claude CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: One call on each of claude-7's models
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
        run: |
          status=0
          for model in opus sonnet; do
            echo "::group::$model"
            claude -p "Reply with the single word OK." --model "$model" \
              --output-format stream-json --verbose --max-turns 1 \
              > "$RUNNER_TEMP/$model.jsonl" || true
            (cd bot && python3 - "$RUNNER_TEMP/$model.jsonl" "$model") <<'PY' || status=1
          import json, sys
          from harness.runner import parse_stream
          path, model = sys.argv[1], sys.argv[2]
          lines = open(path, encoding="utf-8").read().splitlines()
          result, usage = parse_stream(lines)
          init = next((json.loads(l) for l in lines if '"subtype":"init"' in l.replace(" ", "")), {})
          print("model served:", init.get("model"))
          print("result:", None if result is None else
                {k: result.get(k) for k in ("subtype", "is_error", "result", "num_turns")})
          print("usage reading:", json.dumps(usage))
          if result is None or result.get("is_error") or "OK" not in str(result.get("result")):
              print("\n".join(lines[-20:]))
              sys.exit(f"{model}: no good answer")
          if not usage:
              print(f"::warning::{model}: no usage reading in the stream")
          PY
            echo "::endgroup::"
          done
          exit $status
