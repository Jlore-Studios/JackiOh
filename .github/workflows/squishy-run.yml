# Squishy (bot/README.md, Squishy; #60): the night bot's harness run as a second bot, from
# `.squishy/` (HARNESS_HOME). gate -> plan -> work -> deliver, as in bot-night.yml.
#
# Squishy has one subscription, its own Claude Max account (`claude-squishy`), and its model job
# always runs on GitHub's ubuntu-latest: no job here touches the bot's machine. Its labels,
# commands, branches, state and journal are its own (`squishy:build`, `/squishy`,
# `squishy/issue-<n>`, `squishy-state`, `squishy-journal`), and it never takes an issue that is
# the night bot's (`queue.owner`). Beside a plain build it has three modes: `oneshot` (the whole
# issue in one run with fullsend), `split` (sub-issues it builds) and `split-bot` (sub-issues the
# night bot builds).
#
# plan and deliver hold Squishy's account token (SQUISHY_GITHUB_TOKEN) and run no model; gate and
# work hold no GitHub write token, and work holds only Squishy's Claude token. Its output is a
# result file and a git bundle that deliver checks for itself before pushing.
name: squishy-run

on:
  schedule:
    # Hourly. A run that claims or finishes an item starts the next one itself, and Squishy's
    # sweep (squishy-commands, and the bot-status loop) starts one when a lane is free.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Issue or PR number (blank: the planner picks)"
        required: false
        default: ""
      force:
        description: "Run even outside the subscription's hours"
        type: boolean
        default: false
      mode:
        description: "What to do"
        type: choice
        options: [auto, build, revise, review]
        default: auto
      dry_run:
        description: "Record GitHub writes instead of sending them"
        type: boolean
        default: false

permissions: {}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HARNESS_HOME: .squishy
  HARNESS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read         # the queue and the state file; no write of any kind
      actions: read          # whether a run that holds an item is still alive
    outputs:
      go: ${{ steps.peek.outputs.work == 'true' }}
    steps:
      - name: HALT check (.squishy/HALT on the default branch)
        id: halt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/.squishy/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" = "200" ]; then
            echo "halted by .squishy/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the default branch
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Python
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Is there work? (harness peek)
        id: peek
        if: steps.halt.outputs.halted != 'true'
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Which provider secrets exist, never their values (providers.SECRETS).
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          INPUT_ITEM: ${{ github.event.inputs.item }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          force=""
          if [ "${INPUT_FORCE}" = "true" ]; then force="--force"; fi
          python -m harness peek --item "${INPUT_ITEM}" --mode "${INPUT_MODE:-auto}" ${force}

  plan:
    name: plan
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One plan at a time, across every Squishy run, so two never claim the same item.
    concurrency:
      group: squishy-run-plan
      cancel-in-progress: false
    permissions:
      contents: write        # the state file on the squishy-state branch
      issues: write
      pull-requests: write
      actions: write         # whether a run that holds an item is alive; start one more run
    outputs:
      action: ${{ steps.plan.outputs.action }}
      number: ${{ steps.plan.outputs.number }}
      provider: ${{ steps.plan.outputs.provider }}
      cli: ${{ steps.plan.outputs.cli }}
      secret: ${{ steps.plan.outputs.secret }}
    steps:
      - name: HALT check (.squishy/HALT on the default branch)
        id: halt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/.squishy/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" = "200" ]; then
            echo "halted by .squishy/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the default branch
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Python
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Plan
        id: plan
        if: steps.halt.outputs.halted != 'true'
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.SQUISHY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          INPUT_ITEM: ${{ github.event.inputs.item }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          force=""
          if [ "${INPUT_FORCE}" = "true" ]; then force="--force"; fi
          python -m harness plan --out "$RUNNER_TEMP/plan/plan.json" \
            --item "${INPUT_ITEM}" --mode "${INPUT_MODE:-auto}" ${force}

      - name: Keep the plan for the next jobs
        if: steps.plan.outputs.action != '' && steps.plan.outputs.action != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan/plan.json
          retention-days: 14
          overwrite: true

  work:
    name: work
    needs: plan
    if: contains(fromJSON('["plan", "build", "revise", "review"]'), needs.plan.outputs.action)
    # Always GitHub's runners: Squishy's Claude account never runs on the bot's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read         # the model job may read; it may not write anything to GitHub
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the claude CLI
        if: needs.plan.outputs.cli == 'claude'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Doctor (stops here, before any model call, if something is missing)
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_PROVIDER_SECRET: ${{ secrets[needs.plan.outputs.secret] }}
        run: python3 -m harness doctor --work --plan "$RUNNER_TEMP/plan/plan.json"

      # Not "Build, check and review": bright-bots-harness reads a step of that name as the night
      # bot spending the shared Claude subscription (quiet.py), which Squishy never spends.
      - name: Work on Squishy's account (build, check and review)
        working-directory: bot
        env:
          # The one secret of the subscription plan chose, picked by name; no other provider's.
          HARNESS_PROVIDER_SECRET: ${{ secrets[needs.plan.outputs.secret] }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only: the checkpoints read HALT and the state
        run: |
          python3 -m harness work --plan "$RUNNER_TEMP/plan/plan.json" \
            --out "$RUNNER_TEMP/out" --work-dir "$RUNNER_TEMP/work"

      - name: Keep the result, the bundle, the sealed login and the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  deliver:
    name: deliver
    needs: [plan, work]
    if: always() && contains(fromJSON('["plan", "build", "revise", "review"]'), needs.plan.outputs.action)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # the push (with the Actions token only when no bot token is set)
      issues: write
      pull-requests: write
      actions: write         # start the next run; re-run failed CI jobs
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Fetch the model job's output
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}/out

      # The item and the subscription come from the plan job's outputs, which the model job
      # cannot touch; the plan file carries only the context around them.
      - name: Deliver
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.SQUISHY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
          PLAN_ACTION: ${{ needs.plan.outputs.action }}
          PLAN_NUMBER: ${{ needs.plan.outputs.number }}
          PLAN_PROVIDER: ${{ needs.plan.outputs.provider }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m harness deliver --plan "$RUNNER_TEMP/plan/plan.json" --out "$RUNNER_TEMP/out" \
            --action "${PLAN_ACTION}" --number "${PLAN_NUMBER}" --provider "${PLAN_PROVIDER}"
