# TEMPORARY (#4524), removed before its pull request merges: this session cannot build, so this replays
# the four fuzz seeds super run 45075849498 failed on `_staging` (e21cea61d4), with a patch that prints
# each I19 step's events and I8's listed action, to find what reaches the Dormant cards.
name: tmp diag 4524

on:
  push:
    branches: [claude/charming-bell-p8etig]

permissions:
  contents: read

jobs:
  replay:
    if: contains(github.event.head_commit.message, '[diag-4524]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: keep the patch
        run: cp tmp/diag-4524.patch "$RUNNER_TEMP/diag.patch"
      - uses: actions/checkout@v4
        with:
          ref: e21cea61d46617c1b5a10df6f50ba078c8e2a44e
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: apply the diagnostic patch
        run: git apply "$RUNNER_TEMP/diag.patch" && git diff --stat
      - name: build jackioh
        run: cargo build --release -p jackioh-tools
      - name: replay the seeds
        run: |
          for args in "--from 1186 --seeds 1 --handicap"; do
            echo "=== fuzz $args"
            target/release/jackioh fuzz $args 2>&1 | grep -E "message:|example:|DIAG|seeds .*passed" | cut -c1-40000 || true
          done
