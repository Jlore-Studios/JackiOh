# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: tmp-repro-4984.yml's bisect again, by full commit (checkout takes no short one).
name: tmp repro 4984 bisect

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984c.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: [9be0adf6e2b78a66afc82cd6ae13109e0fe68c84, 53c18151f9279df3052c93ee791ee860339a31d1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache-key: tmp-bisect-${{ matrix.ref }}
      - name: R290's tutorial tier
        run: cargo test -p jackioh-ai --tests --features jackioh-engine/testkit -- --ignored r290_the_greedy_baseline --nocapture 2>&1 | grep -E "R290|test result|not won|panicked" | cut -c1-900 || true
      - name: run-sim seed 0 at full budget
        run: cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -vE "^\s*$|Compiling|Downloaded|Downloading" | tail -40 || true

