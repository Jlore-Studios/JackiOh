# The one-off move from Render to Cloudflare (docs/deploy-cloudflare.md section 4, steps 3 and 6, and
# section 8's copy), run by hand from Actions -> cutover, so no secret passes through anyone's machine:
# each value goes from where it lives (Render's jackioh-server, this repository's secrets) straight to
# where it is used, masked in the log. Once section 4's step 7 has run, delete this workflow, its line in
# bot/go/internal/dashboard (runners.go and testdata/python.json), and the PRODUCTION_* secrets.
#
# Each run does one `step`:
#   staging-secrets     the five server secrets (SERVER_SECRETS, apps/edge/src/routing.ts) from Render
#                       into the `jackioh-staging` Worker, then a staging deploy, since a container reads
#                       its secrets as it starts (step 3). Staging keeps the project production used.
#   drop-ping           drops public.ping() and public.keepalive from staging's database: the free plan's
#                       keep-alive, which the Pro plan does not need (the owner's call, 2026-11-01). Run it
#                       before the copy, so production never has them.
#   production-secrets  the `jackioh` Worker's: CODE_PEPPER, CREATE_ISSUES_TOKEN and DEV_PROFILE_IDS as
#                       Render holds them (the copy keeps every hash and id they fit), with
#                       JackiOh-Production's own key and database from the repository secrets
#                       PRODUCTION_SUPABASE_SECRET_KEY and PRODUCTION_DATABASE_URL (step 6.1).
#   check-production    writes nothing: whether PRODUCTION_SUPABASE_SECRET_KEY is shaped like a secret
#                       key, and whether PRODUCTION_DATABASE_URL reaches JackiOh-Production and what it
#                       holds. Run it after setting either secret.
#   production-auth     JackiOh-Production's sign-in settings, copied from staging's project through
#                       Supabase's Management API (SUPABASE_ACCESS_TOKEN, a personal access token): email
#                       confirmations, SMTP, the email templates, rate limits, MFA, sessions, providers,
#                       with production's own Site URL and Redirect URLs (infra/supabase.tf's) and
#                       leaked-password protection on. It also adds https://staging.jackioh.com/login to
#                       staging's Redirect URLs, keeping the rest (section 4, step 4). A value that names
#                       staging's project, and a secret the API does not hand back, stay out and are
#                       named. With `dry_run` (the default) it lists what it would change and writes
#                       nothing. Run it before the copy's real run.
#   email               both projects' sign-in emails through Resend, from no-reply@jackioh.com, since
#                       Supabase's own mailer reaches only the project's team, two an hour. With the
#                       repository secret RESEND_API_KEY (a Full access key): adds jackioh.com to Resend
#                       and prints the DNS records it asks for; once they are in the zone (and in
#                       infra/cloudflare.tf), verifies the domain, makes a sending-only key for it and
#                       sets it as both projects' SMTP (SUPABASE_ACCESS_TOKEN), then deletes the keys an
#                       earlier run made, so running it again rotates the key. `dry_run` changes nothing.
#                       When this workflow is deleted, this step moves to a workflow of its own.
#   copy                staging's database into the empty JackiOh-Production (section 8): roles, schema
#                       and data, the four statistics tables' live rows alone and none of
#                       game_record_batches (R1933000), in one transaction; then profiles, matches and
#                       auth.users counted on both sides, which must agree. With `dry_run` (the default)
#                       it loads the whole copy the same way and rolls it back, so nothing stays.
#   after-cutover       once https://jackioh.com/api/catalog answers from Cloudflare (x-deployed-commit):
#                       suspends Render's jackioh-server, which then bills nothing (section 4, step 7.1),
#                       and gives staging's project its own Site URL and Redirect URLs, infra/supabase.tf's.
#   delete-render       once after-cutover has run: prints Render's CODE_PEPPER encrypted to `public_key`
#                       (its only readable copy: a Worker's secret cannot be read back), for a person to
#                       decrypt into the repository secret CODE_PEPPER; then deletes the Blueprint and the
#                       suspended jackioh-server, the owners' call of 2026-11-03 (section 4, step 7.1).
#                       production-auth and email never read Render, so they still run afterwards.
#
# PRODUCTION_DATABASE_URL may be the session pooler URI exactly as Supabase shows it, `[YOUR-PASSWORD]`
# and all, with the password itself in PRODUCTION_DB_PASSWORD: the workflow percent-encodes it, so a
# password with `@`, `/` or `#` in it needs no hand-encoding.
#
# Every database is reached through Supabase's session pooler: neither a GitHub runner nor a container
# has dependable IPv6, so a direct `db.<ref>.supabase.co` address is rewritten to the pooler host
# STATS_IMPORT_DATABASE_URL already names (staging's), and the transaction port, 6543, to the session
# port, 5432, which the server's prepared statements need.
name: cutover

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What this run does (the header of .github/workflows/cutover.yml)"
        required: true
        type: choice
        options:
          - staging-secrets
          - drop-ping
          - production-secrets
          - check-production
          - production-auth
          - email
          - copy
          - after-cutover
          - delete-render
      dry_run:
        description: "copy, production-auth, email and after-cutover: show what it would do, and write nothing"
        required: false
        type: boolean
        default: true
      public_key:
        description: "delete-render only: an RSA public key (SPKI DER, base64) that CODE_PEPPER is encrypted to in the log"
        required: false
        type: string

env:
  CLOUDFLARE_ACCOUNT_ID: 3c0495fcdd2622a08e1a91b8de248b46
  RENDER_SERVICE: jackioh-server
  STAGING_REF: exmjdaswedxhnzmpzqrq
  PRODUCTION_REF: fuzpvmjdejvbjcarypyi
  # Supabase's CLI, for `db dump` (section 8).
  SUPABASE_CLI: "2.122.0"

permissions:
  contents: read
  # `gh workflow run deploy-staging.yml` after staging's secrets.
  actions: write

concurrency:
  group: cutover
  cancel-in-progress: false

jobs:
  run:
    name: cutover (${{ inputs.step }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # wrangler (apps/edge's) and Node for the Supabase CLI. Before any secret is read, so no action
      # runs after one is on disk.
      - uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: read jackioh-server's settings from Render, and staging's database address
        if: ${{ inputs.step != 'production-auth' && inputs.step != 'email' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STATS_IMPORT_DATABASE_URL: ${{ secrets.STATS_IMPORT_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$RENDER_API_KEY" ] || { echo "::error::RENDER_API_KEY is not set"; exit 1; }

          # A database URL as the session pooler's, its password masked: argv is (ref, url, pooler host
          # or ""), the URL goes to stdout and what it names to stderr.
          cat > "$RUNNER_TEMP/pooler.py" <<'EOF'
          import sys, urllib.parse as up
          import os
          ref, src, pool = sys.argv[1], sys.argv[2], sys.argv[3]
          def fail(why):
              print(f"::error::{why}", file=sys.stderr); sys.exit(1)
          # A password of its own (PRODUCTION_DB_PASSWORD) wins over whatever the address holds, its
          # `[YOUR-PASSWORD]` or one typed in, percent-encoded or not: the address is cut at its scheme
          # and its last `@`, so a raw `@`, `/` or `#` in the old password cannot move the split.
          raw = os.environ.get("DB_PASSWORD", "")
          if raw:
              scheme, sep, rest = src.partition("://")
              userinfo, at, after = rest.rpartition("@")
              if not (sep and at):
                  fail("the address is not scheme://user:password@host/database")
              src = f"{scheme}://{userinfo.split(':', 1)[0]}:{up.quote(raw, safe='')}@{after}"
          elif "[YOUR-PASSWORD]" in src:
              fail("the address still says [YOUR-PASSWORD], and PRODUCTION_DB_PASSWORD is not set")
          p = up.urlsplit(src)
          creds, _, _ = p.netloc.rpartition("@")
          user, _, password = creds.partition(":")
          for secret in {password, up.unquote(password)} - {""}:
              print(f"::add-mask::{secret}")
          host = p.hostname or ""
          if host.endswith(".pooler.supabase.com"):
              if user != f"postgres.{ref}":
                  fail(f"the pooler address's user is {user}, not postgres.{ref}")
          elif host == f"db.{ref}.supabase.co":
              if user != "postgres":
                  fail(f"the direct address's user is {user}, not postgres")
              host = up.urlsplit(pool).hostname or ""
              if not host.endswith(".pooler.supabase.com"):
                  fail("a direct address needs the pooler host STATS_IMPORT_DATABASE_URL names")
              user = f"postgres.{ref}"
          else:
              fail(f"{host} is neither project {ref}'s direct host nor a Supabase pooler")
          query = up.urlencode([(k, v) for k, v in up.parse_qsl(p.query) if k != "pgbouncer"])
          url = up.urlunsplit((p.scheme, f"{user}:{password}@{host}:5432", p.path or "/postgres", query, ""))
          print(f"::add-mask::{url}")
          print(f"{user}@{host}:5432{p.path or '/postgres'}", file=sys.stderr)
          sys.stdout.write(url)
          EOF

          render() {
            curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" "https://api.render.com/v1$1"
          }
          id=$(render "/services?name=$RENDER_SERVICE&limit=20" |
            jq -r --arg n "$RENDER_SERVICE" '[.[].service | select(.name == $n)][0].id // empty')
          [ -n "$id" ] || { echo "::error::Render has no service named $RENDER_SERVICE"; exit 1; }
          echo "$id" > "$RUNNER_TEMP/render.id"
          vars=$(render "/services/$id/env-vars?limit=100")
          # Every value masked before anything else can print it, but for those under eight characters
          # (TRUSTED_PROXY_HOPS's `1`, CYPRESS_INSTALL_BINARY's `0`): no secret is that short, and masking
          # a lone digit stars it out of every line of the log.
          jq -r '.[].envVar.value // empty' <<<"$vars" | while IFS= read -r value; do
            if [ "${#value}" -ge 8 ]; then echo "::add-mask::$value"; fi
          done
          jq '[.[].envVar | {(.key): .value}] | add // {}' <<<"$vars" > "$RUNNER_TEMP/render.json"
          echo "Render's $RENDER_SERVICE ($id) holds: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/render.json")"

          db=$(jq -r '.DATABASE_URL // empty' "$RUNNER_TEMP/render.json")
          [ -n "$db" ] || { echo "::error::Render's $RENDER_SERVICE has no DATABASE_URL"; exit 1; }
          python3 "$RUNNER_TEMP/pooler.py" "$STAGING_REF" "$db" "$STATS_IMPORT_DATABASE_URL" \
            > "$RUNNER_TEMP/staging.url.raw" 2> "$RUNNER_TEMP/staging.where"
          grep '^::add-mask::' "$RUNNER_TEMP/staging.url.raw" || true
          grep -v '^::add-mask::' "$RUNNER_TEMP/staging.url.raw" | tr -d '\n' > "$RUNNER_TEMP/staging.url"
          echo "staging's database: $(cat "$RUNNER_TEMP/staging.where")"
          rm -f "$RUNNER_TEMP/staging.url.raw"

      - name: production's database address
        if: ${{ inputs.step == 'production-secrets' || inputs.step == 'check-production' || inputs.step == 'copy' }}
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STEP: ${{ inputs.step }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            if [ "$STEP" = check-production ]; then
              echo "PRODUCTION_DATABASE_URL: not set yet" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::PRODUCTION_DATABASE_URL is not set: JackiOh-Production -> Connect -> Session pooler"
            exit 1
          fi
          # Where the password comes from, and what it looks like (never the password): a refused login
          # is most often the wrong thing on the clipboard.
          case "$DB_PASSWORD" in
            "") pw="PRODUCTION_DB_PASSWORD is unset, so the one written into PRODUCTION_DATABASE_URL" ;;
            sb_*) pw="PRODUCTION_DB_PASSWORD, which is a Supabase API key, not the database password" ;;
            postgres*://*) pw="PRODUCTION_DB_PASSWORD, which is a database address, not the password" ;;
            *) pw="PRODUCTION_DB_PASSWORD, ${#DB_PASSWORD} characters" ;;
          esac
          echo "the password: $pw" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 "$RUNNER_TEMP/pooler.py" "$PRODUCTION_REF" "$PRODUCTION_DATABASE_URL" "" \
            > "$RUNNER_TEMP/production.url.raw" 2> "$RUNNER_TEMP/production.where" ||
            { cat "$RUNNER_TEMP/production.where"; exit 1; }
          grep '^::add-mask::' "$RUNNER_TEMP/production.url.raw" || true
          grep -v '^::add-mask::' "$RUNNER_TEMP/production.url.raw" | tr -d '\n' > "$RUNNER_TEMP/production.url"
          echo "production's database: $(cat "$RUNNER_TEMP/production.where")"
          rm -f "$RUNNER_TEMP/production.url.raw"

      - name: staging's secrets into jackioh-staging, then deploy staging
        if: ${{ inputs.step == 'staging-secrets' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/jackioh-staging/settings")
          if [ "$status" != 200 ]; then
            echo "::error::the jackioh-staging Worker answers $status: deploy staging creates it, so let its first run finish"
            exit 1
          fi
          file="$RUNNER_TEMP/staging.secrets.json"
          jq --rawfile db "$RUNNER_TEMP/staging.url" \
            '{SUPABASE_SECRET_KEY, CODE_PEPPER, CREATE_ISSUES_TOKEN, DEV_PROFILE_IDS} + {DATABASE_URL: $db}
             | with_entries(select(.value != null and .value != ""))' "$RUNNER_TEMP/render.json" > "$file"
          for need in SUPABASE_SECRET_KEY CODE_PEPPER DATABASE_URL; do
            jq -e --arg k "$need" 'has($k)' "$file" > /dev/null || { echo "::error::Render holds no $need"; exit 1; }
          done
          echo "setting on jackioh-staging: $(jq -r 'keys | join(", ")' "$file")"
          (cd apps/edge && pnpm exec wrangler secret bulk "$file" --config ../../wrangler.jsonc --env staging)
          rm -f "$file"
          gh workflow run deploy-staging.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "deploy staging started: its container starts with these secrets"

      - name: drop the keep-alive from staging's database
        if: ${{ inputs.step == 'drop-ping' }}
        run: |
          set -euo pipefail
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          db=$(cat "$RUNNER_TEMP/staging.url")
          psql "$db" -XAtq -v ON_ERROR_STOP=1 -c "select 'before: ' || coalesce(to_regprocedure('public.ping()')::text, 'no ping()') || ', ' || coalesce(to_regclass('public.keepalive')::text, 'no keepalive')"
          psql "$db" -Xq -v ON_ERROR_STOP=1 --single-transaction \
            -c "drop function if exists public.ping()" -c "drop table if exists public.keepalive"
          psql "$db" -XAtq -v ON_ERROR_STOP=1 -c "select 'after: ' || coalesce(to_regprocedure('public.ping()')::text, 'no ping()') || ', ' || coalesce(to_regclass('public.keepalive')::text, 'no keepalive')"

      - name: check production's secrets, writing nothing
        if: ${{ inputs.step == 'check-production' }}
        env:
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          key=$PRODUCTION_SUPABASE_SECRET_KEY
          case "$key" in
            sb_secret_*) shape="a secret key (sb_secret_…)" ;;
            eyJ*) shape="a legacy service_role JWT (eyJ…)" ;;
            sb_publishable_*) shape="the PUBLISHABLE key, not the secret one" ;;
            "") shape="EMPTY or unset" ;;
            *) shape="NOT a Supabase key" ;;
          esac
          [ "$key" = "$(jq -r '.SUPABASE_SECRET_KEY // empty' "$RUNNER_TEMP/render.json")" ] && shape="staging's key, not production's"
          echo "PRODUCTION_SUPABASE_SECRET_KEY: $shape, ${#key} characters" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s "$RUNNER_TEMP/production.url" ] || exit 1
          held=$(psql "$(cat "$RUNNER_TEMP/production.url")" -XAtq -v ON_ERROR_STOP=1 -c "select (select count(*) from information_schema.tables where table_schema = 'public') || ' public tables, ' || (select count(*) from auth.users) || ' users'")
          echo "PRODUCTION_DATABASE_URL reaches JackiOh-Production: $held" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$shape" in a\ *) ;; *) exit 1 ;; esac

      - name: production's secrets into jackioh
        if: ${{ inputs.step == 'production-secrets' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$PRODUCTION_SUPABASE_SECRET_KEY" ]; then
            echo "::error::PRODUCTION_SUPABASE_SECRET_KEY is not set: JackiOh-Production -> Project Settings -> API Keys -> a secret key"
            exit 1
          fi
          # A secret key (sb_secret_…) or a legacy service_role JWT (eyJ…): never the publishable key, or
          # whatever else was on the clipboard when the secret was set.
          case "$PRODUCTION_SUPABASE_SECRET_KEY" in
            sb_secret_* | eyJ*) ;;
            *) echo "::error::PRODUCTION_SUPABASE_SECRET_KEY is not a Supabase secret key (sb_secret_…): set it again from JackiOh-Production -> Project Settings -> API Keys"; exit 1 ;;
          esac
          if [ "$PRODUCTION_SUPABASE_SECRET_KEY" = "$(jq -r '.SUPABASE_SECRET_KEY // empty' "$RUNNER_TEMP/render.json")" ]; then
            echo "::error::PRODUCTION_SUPABASE_SECRET_KEY is staging's key, not JackiOh-Production's"
            exit 1
          fi
          file="$RUNNER_TEMP/production.secrets.json"
          jq --arg key "$PRODUCTION_SUPABASE_SECRET_KEY" --rawfile db "$RUNNER_TEMP/production.url" \
            '{CODE_PEPPER, CREATE_ISSUES_TOKEN, DEV_PROFILE_IDS} + {SUPABASE_SECRET_KEY: $key, DATABASE_URL: $db}
             | with_entries(select(.value != null and .value != ""))' "$RUNNER_TEMP/render.json" > "$file"
          jq -e 'has("CODE_PEPPER")' "$file" > /dev/null || { echo "::error::Render holds no CODE_PEPPER"; exit 1; }
          echo "setting on jackioh: $(jq -r 'keys | join(", ")' "$file")"
          (cd apps/edge && pnpm exec wrangler secret bulk "$file" --config ../../wrangler.jsonc --env="")
          rm -f "$file"
          echo "production's server reads these from its next deploy: promote production with redeploy (section 4, step 6.3)"

      - name: copy staging's sign-in settings to JackiOh-Production
        if: ${{ inputs.step == 'production-auth' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # infra/supabase.tf's, so Terraform's first full apply finds nothing to change.
          PRODUCTION_SITE: https://jackioh.com
          PRODUCTION_REDIRECTS: https://jackioh.com/login
          STAGING_REDIRECT: https://staging.jackioh.com/login
        run: |
          set -euo pipefail
          umask 077
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set: a personal access token from https://supabase.com/dashboard/account/tokens"; exit 1 ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN is not a Supabase personal access token (sbp_…)"; exit 1 ;;
          esac
          api() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }
          config=https://api.supabase.com/v1/projects
          api "$config/$STAGING_REF/config/auth" > "$RUNNER_TEMP/auth.staging.json"
          api "$config/$PRODUCTION_REF/config/auth" > "$RUNNER_TEMP/auth.production.json"

          # Prints the plan, writes the two PATCH bodies (an empty object when nothing changes).
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, os, re, sys
          tmp = sys.argv[1]
          staging = json.load(open(f"{tmp}/auth.staging.json"))
          production = json.load(open(f"{tmp}/auth.production.json"))
          staging_ref = os.environ["STAGING_REF"]
          secret = re.compile(r"(pass|secret|key|token)", re.I)
          # The project's own sizing and SAML (an add-on of its own), not sign-in behaviour.
          own = re.compile(r"^(db_max_pool_size|db_max_pool_size_unit|api_max_request_duration|saml_.*)$")
          template = re.compile(r"^mailer_(templates|subjects|notifications)_")
          def hidden(value):
              # A secret the API masks rather than hands back.
              return isinstance(value, str) and re.fullmatch(r"[*\u2022]{3,}", value) is not None
          def shown(key, value):
              if value in (None, ""):
                  return "(empty)"
              if isinstance(value, str) and secret.search(key):
                  return "(a secret, set)"
              if template.match(key):
                  return f"({len(str(value))} characters)"
              text = json.dumps(value)
              return text if len(text) <= 80 else text[:77] + "..."
          # A provider, a hook or SMTP goes over whole or not at all: half of one breaks sign-in.
          def group(key):
              m = re.match(r"^(smtp_|external_[a-z0-9]+_|hook_[a-z0-9_]+?_(?=uri$|secrets$|enabled$))", key)
              return m.group(1) if m else None
          patch, left, broken = {}, [], set()
          for key, value in sorted(staging.items()):
              if key in ("site_url", "uri_allow_list") or own.match(key):
                  continue
              if isinstance(value, str) and staging_ref in value:
                  left.append(f"{key}: names staging's project ({value})")
                  broken.add(group(key))
                  continue
              if secret.search(key) and (hidden(value) or value in (None, "")):
                  if hidden(value):
                      left.append(f"{key}: the API hands it back masked")
                      broken.add(group(key))
                  continue
              if value != production.get(key):
                  patch[key] = value
          patch["site_url"] = os.environ["PRODUCTION_SITE"]
          patch["uri_allow_list"] = os.environ["PRODUCTION_REDIRECTS"]
          patch["password_hibp_enabled"] = True
          patch = {k: v for k, v in patch.items() if v != production.get(k)}
          if staging.get("smtp_host") and not staging.get("smtp_pass"):
              broken.add("smtp_")
          broken.discard(None)
          for prefix in sorted(broken):
              for k in [k for k in patch if k.startswith(prefix)]:
                  del patch[k]
              left.append(f"{prefix}*: all of it, since a part could not come over; set it by hand")
          if "smtp_" in broken:
              # Supabase's own mailer takes no higher email rate limit.
              patch.pop("rate_limit_email_sent", None)
              left.append("SMTP: staging's password does not come back from the API, so production keeps "
                          "Supabase's own mailer: Authentication -> Emails -> SMTP Settings, by hand")
          print(f"JackiOh-Production: {len(patch)} setting(s) to change")
          for key in sorted(patch):
              print(f"  {key}: {shown(key, production.get(key))} -> {shown(key, patch[key])}")
          for line in left:
              print(f"::warning::left out: {line}")
          json.dump(patch, open(f"{tmp}/auth.production.patch.json", "w"))
          redirect = os.environ["STAGING_REDIRECT"]
          urls = [u for u in (staging.get("uri_allow_list") or "").split(",") if u]
          staging_patch = {} if redirect in urls else {"uri_allow_list": ",".join(urls + [redirect])}
          print(f"staging's Redirect URLs: {', '.join(urls) or '(none)'}"
                + ("" if not staging_patch else f" -> adds {redirect}"))
          json.dump(staging_patch, open(f"{tmp}/auth.staging.patch.json", "w"))
          EOF

          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: nothing written. Run it again without dry_run to apply." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for ref in "$PRODUCTION_REF" "$STAGING_REF"; do
            case "$ref" in "$PRODUCTION_REF") body=auth.production.patch.json ;; *) body=auth.staging.patch.json ;; esac
            if [ "$(cat "$RUNNER_TEMP/$body")" = "{}" ]; then echo "$ref: nothing to change"; continue; fi
            api -X PATCH "$config/$ref/config/auth" --data-binary "@$RUNNER_TEMP/$body" > /dev/null
            echo "$ref: changed $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/$body")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # Read back what matters most.
          api "$config/$PRODUCTION_REF/config/auth" \
            | jq -r '"production now: site_url \(.site_url), redirects \(.uri_allow_list), leaked-password protection \(.password_hibp_enabled), confirm email \(.mailer_autoconfirm | not), SMTP host \(.smtp_host // "Supabase'"'"'s own")"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: sign-in emails through Resend
        if: ${{ inputs.step == 'email' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          EMAIL_DOMAIN: jackioh.com
          EMAIL_FROM: no-reply@jackioh.com
          EMAIL_NAME: JackiOh
          # Supabase's own mailer holds a project to 2 an hour; with SMTP of its own, Supabase's usual
          # 30, inside Resend's free 100 a day.
          EMAIL_PER_HOUR: "30"
          # The sending-only key this step makes; an earlier run's, by the same name, is deleted.
          KEY_NAME: supabase-smtp
        run: |
          set -euo pipefail
          umask 077
          case "$RESEND_API_KEY" in
            re_*) ;;
            "") echo "::error::RESEND_API_KEY is not set: a Full access key from https://resend.com/api-keys"; exit 1 ;;
            *) echo "::error::RESEND_API_KEY is not a Resend API key (re_…)"; exit 1 ;;
          esac
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1 ;; esac
          resend() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" "$@"
          }
          supabase() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }
          api=https://api.resend.com
          if ! domains=$(resend "$api/domains" 2>&1); then
            echo "::error::Resend refused to list the domains, so RESEND_API_KEY is probably a Sending access key: make a Full access one. Resend said: $domains"
            exit 1
          fi
          id=$(jq -r --arg d "$EMAIL_DOMAIN" '[(.data // .)[] | select(.name == $d)][0].id // empty' <<<"$domains")
          if [ -z "$id" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "dry_run: would add $EMAIL_DOMAIN to Resend, then print its DNS records" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            id=$(resend -X POST "$api/domains" -d "$(jq -n --arg d "$EMAIL_DOMAIN" '{name: $d}')" | jq -r .id)
            echo "added $EMAIL_DOMAIN to Resend"
          fi
          domain=$(resend "$api/domains/$id")
          # Sign-in mail carries no tracking: no pixel, and no link rewritten through Resend (whose
          # Tracking record then is not needed either).
          if [ "$(jq -r '(.open_tracking // false) or (.click_tracking // false)' <<<"$domain")" = true ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "dry_run: would turn off Resend's open and click tracking for $EMAIL_DOMAIN"
            else
              resend -X PATCH "$api/domains/$id" -d '{"open_tracking": false, "click_tracking": false}' > /dev/null
              domain=$(resend "$api/domains/$id")
            fi
          fi
          status=$(jq -r .status <<<"$domain")
          echo "Resend's $EMAIL_DOMAIN: $status (open tracking $(jq -r '.open_tracking // false' <<<"$domain"), click tracking $(jq -r '.click_tracking // false' <<<"$domain")). Its DNS records, one JSON object a line:"
          jq -c '.records[] | select(.record != "Tracking") | {record, type, name, value, priority, ttl, status}' <<<"$domain"
          if [ "$status" != verified ]; then
            [ "$DRY_RUN" = true ] && exit 0
            resend -X POST "$api/domains/$id/verify" > /dev/null
            for _ in $(seq 1 30); do
              sleep 10
              status=$(resend "$api/domains/$id" | jq -r .status)
              case "$status" in verified | failed) break ;; esac
            done
            if [ "$status" != verified ]; then
              echo "::error::$EMAIL_DOMAIN is $status at Resend: add the records above to the jackioh.com zone, then run this again"
              exit 1
            fi
            echo "$EMAIL_DOMAIN verified"
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: would make a sending-only key for $EMAIL_DOMAIN and set it as both projects' SMTP" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          old=$(resend "$api/api-keys" | jq -r --arg n "$KEY_NAME" '(.data // .)[] | select(.name == $n) | .id')
          key=$(resend -X POST "$api/api-keys" \
            -d "$(jq -n --arg n "$KEY_NAME" --arg d "$id" '{name: $n, permission: "sending_access", domain_id: $d}')" | jq -r .token)
          echo "::add-mask::$key"
          case "$key" in re_*) ;; *) echo "::error::Resend made no key"; exit 1 ;; esac
          jq -n --arg pass "$key" --arg from "$EMAIL_FROM" --arg name "$EMAIL_NAME" --argjson hour "$EMAIL_PER_HOUR" \
            '{smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend", smtp_pass: $pass,
              smtp_admin_email: $from, smtp_sender_name: $name, rate_limit_email_sent: $hour}' > "$RUNNER_TEMP/smtp.json"
          for ref in "$PRODUCTION_REF" "$STAGING_REF"; do
            supabase -X PATCH "https://api.supabase.com/v1/projects/$ref/config/auth" --data-binary "@$RUNNER_TEMP/smtp.json" > /dev/null
            supabase "https://api.supabase.com/v1/projects/$ref/config/auth" \
              | jq -r --arg ref "$ref" '"\($ref): SMTP \(.smtp_host):\(.smtp_port) as \(.smtp_user), from \(.smtp_sender_name) <\(.smtp_admin_email)>, \(.rate_limit_email_sent) emails an hour"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$RUNNER_TEMP/smtp.json"
          # Only now that both projects send with the new key: an earlier run's goes.
          for gone in $old; do
            resend -X DELETE "$api/api-keys/$gone" > /dev/null
            echo "deleted the earlier $KEY_NAME key $gone"
          done

      - name: after the move, Render suspended and staging's sign-in its own
        if: ${{ inputs.step == 'after-cutover' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SITE: https://jackioh.com
          # infra/supabase.tf's, for staging's project.
          STAGING_SITE: https://staging.jackioh.com
          STAGING_REDIRECTS: https://staging.jackioh.com/login
        run: |
          set -euo pipefail
          # Only once production's own server answers on jackioh.com: Render's never says which commit.
          commit=$(curl -fsS -D - -o /dev/null --max-time 60 "$SITE/api/catalog" | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-deployed-commit" { print $2 }')
          [ -n "$commit" ] || { echo "::error::$SITE/api/catalog names no x-deployed-commit: production is not on Cloudflare yet"; exit 1; }
          echo "$SITE serves $commit from Cloudflare"

          id=$(cat "$RUNNER_TEMP/render.id")
          render() {
            curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" "$@"
          }
          state=$(render "https://api.render.com/v1/services/$id" | jq -r .suspended)
          echo "Render's $RENDER_SERVICE: $state"
          if [ "$state" != suspended ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "dry_run: would suspend Render's $RENDER_SERVICE"
            else
              render -X POST "https://api.render.com/v1/services/$id/suspend" > /dev/null
              echo "Render's $RENDER_SERVICE: $(render "https://api.render.com/v1/services/$id" | jq -r .suspended)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          config="https://api.supabase.com/v1/projects/$STAGING_REF/config/auth"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "$config" | jq -r '"staging'"'"'s sign-in: site_url \(.site_url), redirects \(.uri_allow_list)"'
          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: would set staging's site_url to $STAGING_SITE and its redirects to $STAGING_REDIRECTS"
            exit 0
          fi
          jq -n --arg site "$STAGING_SITE" --arg urls "$STAGING_REDIRECTS" '{site_url: $site, uri_allow_list: $urls}' |
            curl -fsS "${auth[@]}" -X PATCH "$config" --data-binary @- > /dev/null
          curl -fsS "${auth[@]}" "$config" | jq -r '"staging'"'"'s sign-in now: site_url \(.site_url), redirects \(.uri_allow_list)"' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render deleted, its CODE_PEPPER kept
        if: ${{ inputs.step == 'delete-render' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          SITE: https://jackioh.com
        run: |
          set -euo pipefail
          umask 077
          commit=$(curl -fsS -D - -o /dev/null --max-time 60 "$SITE/api/catalog" | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-deployed-commit" { print $2 }')
          [ -n "$commit" ] || { echo "::error::$SITE/api/catalog names no x-deployed-commit: production is not on Cloudflare"; exit 1; }
          id=$(cat "$RUNNER_TEMP/render.id")
          render() {
            curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" "$@"
          }
          state=$(render "https://api.render.com/v1/services/$id" | jq -r .suspended)
          [ "$state" = suspended ] || { echo "::error::Render's $RENDER_SERVICE is $state: run after-cutover first"; exit 1; }

          # CODE_PEPPER, encrypted to the key a person holds (RSA-OAEP, SHA-256), so only they can read it.
          [ -n "$PUBLIC_KEY" ] || { echo "::error::public_key is empty: CODE_PEPPER must be kept before Render goes"; exit 1; }
          base64 -d <<<"$PUBLIC_KEY" > "$RUNNER_TEMP/key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/key.der" -out "$RUNNER_TEMP/key.pem"
          pepper=$(jq -r '.CODE_PEPPER // empty' "$RUNNER_TEMP/render.json")
          [ -n "$pepper" ] || { echo "::error::Render holds no CODE_PEPPER"; exit 1; }
          sealed=$(printf %s "$pepper" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/key.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 | base64 -w0)
          echo "CODE_PEPPER (${#pepper} characters), sealed: $sealed"

          blueprints=$(render "https://api.render.com/v1/blueprints?limit=100" |
            jq -r '.[] | (.blueprint // .) | select((.repo // "") | test("JackiOh"; "i")) | .id')
          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: would delete Render's Blueprint(s) ${blueprints:-none} and $RENDER_SERVICE ($id)"
            exit 0
          fi
          for blueprint in $blueprints; do
            render -X DELETE "https://api.render.com/v1/blueprints/$blueprint" > /dev/null
            echo "deleted Render's Blueprint $blueprint"
          done
          render -X DELETE "https://api.render.com/v1/services/$id" > /dev/null
          echo "deleted Render's $RENDER_SERVICE ($id)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: copy staging's database into JackiOh-Production
        if: ${{ inputs.step == 'copy' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Until production leaves it, staging's database serves two servers, Render's and staging's,
          # each up to 10 connections with its ladder bots, through a session pooler of 15 clients,
          # which they kept full (runs 41581788146, 41582767500). 30 is half of Postgres' 60 on the
          # project's compute; the copy needs one.
          STAGING_POOL: "30"
        run: |
          set -euo pipefail
          umask 077
          pooler="https://api.supabase.com/v1/projects/$STAGING_REF/config/database/pooler"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          # No size set reads as null: the compute's default, 15.
          size=$(curl -sS --fail-with-body "${auth[@]}" "$pooler" | jq -r '(if type == "array" then map(.default_pool_size) | max else .default_pool_size end) // 15')
          echo "staging's pooler: $size clients"
          if [ "$size" -lt "$STAGING_POOL" ]; then
            curl -sS --fail-with-body "${auth[@]}" -X PATCH "$pooler" -d "{\"default_pool_size\": $STAGING_POOL}" > /dev/null
            echo "staging's pooler: now $(curl -sS --fail-with-body "${auth[@]}" "$pooler" | jq -r 'if type == "array" then map(.default_pool_size) | max else .default_pool_size end') clients"
          fi
          # PostgreSQL 17's client, from PGDG: a dump made by a current pg_dump opens with `\restrict`,
          # which an older psql refuses.
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          psql() { /usr/lib/postgresql/17/bin/psql "$@"; }
          staging=$(cat "$RUNNER_TEMP/staging.url")
          production=$(cat "$RUNNER_TEMP/production.url")
          q() { psql "$1" -XAtq -v ON_ERROR_STOP=1 -c "$2"; }
          supabase() { npx --yes "supabase@$SUPABASE_CLI" "$@"; }
          stats="game_records card_totals game_totals record_totals"

          held=$(q "$production" "select (select count(*) from information_schema.tables where table_schema = 'public') + (select count(*) from auth.users)")
          if [ "$held" != 0 ]; then
            echo "::error::JackiOh-Production is not empty ($held public tables and users): the copy goes into an empty project only"
            exit 1
          fi
          for table in $stats; do
            [ "$(q "$staging" "select count(*) from information_schema.columns where table_schema = 'public' and table_name = '$table' and column_name = 'source'")" = 1 ] ||
              { echo "::error::public.$table has no source column to keep the live rows by"; exit 1; }
          done

          mkdir -p "$RUNNER_TEMP/copy" && cd "$RUNNER_TEMP/copy"
          # Staging's session pooler holds 15 clients, and the servers on it keep theirs open while
          # they idle (run 41581788146 found it full): each dump waits for a free one, five minutes at most.
          retry() {
            for wait in 30 60 60 60 90 0; do
              "$@" && return 0
              [ "$wait" = 0 ] && return 1
              echo "::notice::the pooler is busy, trying again in ${wait}s"
              sleep "$wait"
            done
          }
          retry supabase db dump --db-url "$staging" -f roles.sql --role-only
          # A role's setting only a superuser may make, which Supabase's postgres is not (the first real
          # run, 41540999815, stopped at `log_min_messages`): left out, and named. The rest are named too.
          # Grants on a parameter (GRANT SET ON PARAMETER …), which need the grant option on it, go too.
          superuser='^(ALTER ROLE .* SET "?(log_[a-z_]+|session_preload_libraries|auto_explain\.[a-z_]+)"? |(GRANT|REVOKE) .* ON PARAMETER )'
          { grep -E "$superuser" roles.sql || true; } | sed -E "s/'[^']*'/'…'/g; s/^/  left out of roles.sql: /"
          sed -i -E "/$superuser/d" roles.sql
          # What is left, every quoted value blanked (a password's hash among them).
          grep -vE '^(--|$)' roles.sql | sed -E "s/'[^']*'/'…'/g; s/^/  roles.sql: /"
          retry supabase db dump --db-url "$staging" -f schema.sql
          # The data leaves out the tables Supabase's postgres may not write (run 41583636531 stopped at
          # storage.buckets_vectors): each project fills its own migrations' tables, and staging holds
          # nothing in Storage or Vault (0 buckets, 0 objects, 0 secrets on 2026-11-03).
          retry supabase db dump --db-url "$staging" -f data.sql --use-copy --data-only \
            -x public.game_records -x public.card_totals -x public.game_totals -x public.record_totals \
            -x public.game_record_batches \
            -x storage.buckets_vectors -x storage.vector_indexes -x storage.migrations \
            -x vault.secrets -x auth.schema_migrations
          for table in $stats; do
            psql "$staging" -Xq -v ON_ERROR_STOP=1 -c "\\copy (select * from public.$table where source = 'live') to '$table.csv' csv"
          done
          # profiles, matches, users: what must agree on both sides.
          counts="select (select count(*) from public.profiles)::text || ' ' || (select count(*) from public.matches)::text || ' ' || (select count(*) from auth.users)::text"
          read -r profiles matches users <<<"$(q "$staging" "$counts")"
          from="$profiles profiles, $matches matches, $users users"
          {
            echo "staging holds $from"
            echo "auth.users in data.sql: $(grep -cE '^COPY "?auth"?\."?users"? ' data.sql || true) COPY block(s)"
            for file in roles.sql schema.sql data.sql; do echo "$file: $(du -h "$file" | cut -f1)"; done
            for table in $stats; do echo "$table: $(wc -l < "$table.csv") live rows"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          copies=()
          for table in $stats; do copies+=(-c "\\copy public.$table from '$table.csv' csv"); done
          # The last statement of the one transaction: counts that differ roll the whole copy back.
          # $check$ is SQL's dollar quoting, for psql, not the shell's.
          # shellcheck disable=SC2016
          check=$(printf 'do $check$ begin if (%s) <> %s then raise exception %s; end if; end $check$' \
            "$counts" "'$profiles $matches $users'" "'the counts differ from staging''s: $from'")
          # A dry run loads everything, checks the counts, and rolls it all back (psql then warns that
          # its closing COMMIT finds no transaction), so a load that would fail fails here first.
          last=()
          [ "$DRY_RUN" = true ] && last=(-c rollback)
          psql "$production" -X -q --single-transaction -v ON_ERROR_STOP=1 -f roles.sql -f schema.sql \
            -c 'set session_replication_role = replica' -f data.sql "${copies[@]}" -c "$check" "${last[@]}"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: the whole copy loaded and its counts agreed, then rolled back; JackiOh-Production holds $(q "$production" "select count(*) from information_schema.tables where table_schema = 'public'") public tables" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r profiles matches users <<<"$(q "$production" "$counts")"
          echo "JackiOh-Production holds $profiles profiles, $matches matches, $users users, as staging does" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f ./*.sql ./*.csv
