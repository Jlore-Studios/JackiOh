# What is left of the move from Render to Cloudflare (docs/deploy-cloudflare.md section 4), run by hand
# from Actions -> cutover, so no secret passes through anyone's machine: each value goes from where it
# lives (this repository's secrets, a project's Management API) straight to where it is used, masked in
# the log. Render's jackioh-server was deleted on 2026-11-03 (section 4, step 7), and with it the steps
# that read it: staging-secrets, drop-ping, production-secrets, copy, after-cutover and delete-render
# (they are in this file's history). The steps below still run.
#
# Each run does one `step`:
#   check-production    writes nothing: whether PRODUCTION_SUPABASE_SECRET_KEY is shaped like a secret
#                       key, and whether PRODUCTION_DATABASE_URL reaches JackiOh-Production and what it
#                       holds. Run it after setting either secret.
#   production-auth     JackiOh-Production's sign-in settings, copied from staging's project through
#                       Supabase's Management API (SUPABASE_ACCESS_TOKEN, a personal access token): email
#                       confirmations, SMTP, the email templates, rate limits, MFA, sessions, providers,
#                       with production's own Site URL and Redirect URLs (infra/supabase.tf's) and
#                       leaked-password protection on. It also adds https://staging.jackioh.com/login to
#                       staging's Redirect URLs, keeping the rest (section 4, step 4). A value that names
#                       staging's project, and a secret the API does not hand back, stay out and are
#                       named. With `dry_run` (the default) it lists what it would change and writes
#                       nothing.
#   email               both projects' sign-in emails through Resend, from no-reply@jackioh.com, since
#                       Supabase's own mailer reaches only the project's team, two an hour. With the
#                       repository secret RESEND_API_KEY (a Full access key): adds jackioh.com to Resend
#                       and prints the DNS records it asks for; once they are in the zone (and in
#                       infra/cloudflare.tf), verifies the domain, makes a sending-only key for it and
#                       sets it as both projects' SMTP (SUPABASE_ACCESS_TOKEN), then deletes the keys an
#                       earlier run made, so running it again rotates the key. `dry_run` changes nothing.
#   stats-logins        JackiOh-Production's two statistics logins, each with a new password of its own
#                       (the copy brought both from staging with staging's): stats_importer, which the
#                       development lanes file through, and stats_reader, read-only, which
#                       winrates-refresh.yml and db-size.yml read through (R1933001). Each address is
#                       checked, then printed encrypted to `public_key` for a person to decrypt into the
#                       repository secrets PRODUCTION_STATS_IMPORT_DATABASE_URL and the reader's.
#   dev-stats           staging's development statistics into JackiOh-Production (R1933001): the
#                       totals' development rows and game_record_batches, replacing whatever production
#                       holds of them, in one transaction whose counts must agree with staging's. Live
#                       rows are not touched. Run it again whenever the two may have drifted (a gather or
#                       learn run whose import into production failed and was not run again): staging
#                       files every development run, so its rows are the whole of them.
#
# PRODUCTION_DATABASE_URL may be the session pooler URI exactly as Supabase shows it, `[YOUR-PASSWORD]`
# and all, with the password itself in PRODUCTION_DB_PASSWORD: the workflow percent-encodes it, so a
# password with `@`, `/` or `#` in it needs no hand-encoding.
#
# Every database is reached through Supabase's session pooler: neither a GitHub runner nor a container
# has dependable IPv6, so a direct `db.<ref>.supabase.co` address is rewritten to the pooler host
# STATS_IMPORT_DATABASE_URL already names (staging's), and the transaction port, 6543, to the session
# port, 5432, which the server's prepared statements need.
name: cutover

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What this run does (the header of .github/workflows/cutover.yml)"
        required: true
        type: choice
        options:
          - check-production
          - production-auth
          - email
          - stats-logins
          - dev-stats
      dry_run:
        description: "production-auth, email, stats-logins and dev-stats: show what it would do, and write nothing"
        required: false
        type: boolean
        default: true
      public_key:
        description: "stats-logins: an RSA public key (SPKI DER, base64) the addresses are encrypted to in the log"
        required: false
        type: string

env:
  STAGING_REF: exmjdaswedxhnzmpzqrq
  PRODUCTION_REF: fuzpvmjdejvbjcarypyi

permissions:
  contents: read

concurrency:
  group: cutover
  cancel-in-progress: false

jobs:
  run:
    name: cutover (${{ inputs.step }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: the database address helper
        run: |
          set -euo pipefail
          umask 077
          # A database URL as the session pooler's, its password masked: argv is (ref, url, pooler host
          # or ""), the URL goes to stdout and what it names to stderr.
          cat > "$RUNNER_TEMP/pooler.py" <<'EOF'
          import sys, urllib.parse as up
          import os
          ref, src, pool = sys.argv[1], sys.argv[2], sys.argv[3]
          def fail(why):
              print(f"::error::{why}", file=sys.stderr); sys.exit(1)
          # A password of its own (PRODUCTION_DB_PASSWORD) wins over whatever the address holds, its
          # `[YOUR-PASSWORD]` or one typed in, percent-encoded or not: the address is cut at its scheme
          # and its last `@`, so a raw `@`, `/` or `#` in the old password cannot move the split.
          raw = os.environ.get("DB_PASSWORD", "")
          if raw:
              scheme, sep, rest = src.partition("://")
              userinfo, at, after = rest.rpartition("@")
              if not (sep and at):
                  fail("the address is not scheme://user:password@host/database")
              src = f"{scheme}://{userinfo.split(':', 1)[0]}:{up.quote(raw, safe='')}@{after}"
          elif "[YOUR-PASSWORD]" in src:
              fail("the address still says [YOUR-PASSWORD], and PRODUCTION_DB_PASSWORD is not set")
          p = up.urlsplit(src)
          creds, _, _ = p.netloc.rpartition("@")
          user, _, password = creds.partition(":")
          for secret in {password, up.unquote(password)} - {""}:
              print(f"::add-mask::{secret}")
          host = p.hostname or ""
          if host.endswith(".pooler.supabase.com"):
              if user != f"postgres.{ref}":
                  fail(f"the pooler address's user is {user}, not postgres.{ref}")
          elif host == f"db.{ref}.supabase.co":
              if user != "postgres":
                  fail(f"the direct address's user is {user}, not postgres")
              host = up.urlsplit(pool).hostname or ""
              if not host.endswith(".pooler.supabase.com"):
                  fail("a direct address needs the pooler host STATS_IMPORT_DATABASE_URL names")
              user = f"postgres.{ref}"
          else:
              fail(f"{host} is neither project {ref}'s direct host nor a Supabase pooler")
          query = up.urlencode([(k, v) for k, v in up.parse_qsl(p.query) if k != "pgbouncer"])
          url = up.urlunsplit((p.scheme, f"{user}:{password}@{host}:5432", p.path or "/postgres", query, ""))
          print(f"::add-mask::{url}")
          print(f"{user}@{host}:5432{p.path or '/postgres'}", file=sys.stderr)
          sys.stdout.write(url)
          EOF

      - name: production's database address
        if: ${{ contains(fromJSON('["check-production", "stats-logins", "dev-stats"]'), inputs.step) }}
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STEP: ${{ inputs.step }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            if [ "$STEP" = check-production ]; then
              echo "PRODUCTION_DATABASE_URL: not set yet" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::PRODUCTION_DATABASE_URL is not set: JackiOh-Production -> Connect -> Session pooler"
            exit 1
          fi
          # Where the password comes from, and what it looks like (never the password): a refused login
          # is most often the wrong thing on the clipboard.
          case "$DB_PASSWORD" in
            "") pw="PRODUCTION_DB_PASSWORD is unset, so the one written into PRODUCTION_DATABASE_URL" ;;
            sb_*) pw="PRODUCTION_DB_PASSWORD, which is a Supabase API key, not the database password" ;;
            postgres*://*) pw="PRODUCTION_DB_PASSWORD, which is a database address, not the password" ;;
            *) pw="PRODUCTION_DB_PASSWORD, ${#DB_PASSWORD} characters" ;;
          esac
          echo "the password: $pw" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 "$RUNNER_TEMP/pooler.py" "$PRODUCTION_REF" "$PRODUCTION_DATABASE_URL" "" \
            > "$RUNNER_TEMP/production.url.raw" 2> "$RUNNER_TEMP/production.where" ||
            { cat "$RUNNER_TEMP/production.where"; exit 1; }
          grep '^::add-mask::' "$RUNNER_TEMP/production.url.raw" || true
          grep -v '^::add-mask::' "$RUNNER_TEMP/production.url.raw" | tr -d '\n' > "$RUNNER_TEMP/production.url"
          echo "production's database: $(cat "$RUNNER_TEMP/production.where")"
          rm -f "$RUNNER_TEMP/production.url.raw"

      - name: check production's secrets, writing nothing
        if: ${{ inputs.step == 'check-production' }}
        env:
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          key=$PRODUCTION_SUPABASE_SECRET_KEY
          case "$key" in
            sb_secret_*) shape="a secret key (sb_secret_…)" ;;
            eyJ*) shape="a legacy service_role JWT (eyJ…)" ;;
            sb_publishable_*) shape="the PUBLISHABLE key, not the secret one" ;;
            "") shape="EMPTY or unset" ;;
            *) shape="NOT a Supabase key" ;;
          esac
          echo "PRODUCTION_SUPABASE_SECRET_KEY: $shape, ${#key} characters" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s "$RUNNER_TEMP/production.url" ] || exit 1
          held=$(psql "$(cat "$RUNNER_TEMP/production.url")" -XAtq -v ON_ERROR_STOP=1 -c "select (select count(*) from information_schema.tables where table_schema = 'public') || ' public tables, ' || (select count(*) from auth.users) || ' users'")
          echo "PRODUCTION_DATABASE_URL reaches JackiOh-Production: $held" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$shape" in a\ *) ;; *) exit 1 ;; esac

      - name: copy staging's sign-in settings to JackiOh-Production
        if: ${{ inputs.step == 'production-auth' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # infra/supabase.tf's, so Terraform's first full apply finds nothing to change.
          PRODUCTION_SITE: https://jackioh.com
          PRODUCTION_REDIRECTS: https://jackioh.com/login
          STAGING_REDIRECT: https://staging.jackioh.com/login
        run: |
          set -euo pipefail
          umask 077
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            "") echo "::error::SUPABASE_ACCESS_TOKEN is not set: a personal access token from https://supabase.com/dashboard/account/tokens"; exit 1 ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN is not a Supabase personal access token (sbp_…)"; exit 1 ;;
          esac
          api() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }
          config=https://api.supabase.com/v1/projects
          api "$config/$STAGING_REF/config/auth" > "$RUNNER_TEMP/auth.staging.json"
          api "$config/$PRODUCTION_REF/config/auth" > "$RUNNER_TEMP/auth.production.json"

          # Prints the plan, writes the two PATCH bodies (an empty object when nothing changes).
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, os, re, sys
          tmp = sys.argv[1]
          staging = json.load(open(f"{tmp}/auth.staging.json"))
          production = json.load(open(f"{tmp}/auth.production.json"))
          staging_ref = os.environ["STAGING_REF"]
          secret = re.compile(r"(pass|secret|key|token)", re.I)
          # The project's own sizing and SAML (an add-on of its own), not sign-in behaviour.
          own = re.compile(r"^(db_max_pool_size|db_max_pool_size_unit|api_max_request_duration|saml_.*)$")
          template = re.compile(r"^mailer_(templates|subjects|notifications)_")
          def hidden(value):
              # A secret the API masks rather than hands back.
              return isinstance(value, str) and re.fullmatch(r"[*\u2022]{3,}", value) is not None
          def shown(key, value):
              if value in (None, ""):
                  return "(empty)"
              if isinstance(value, str) and secret.search(key):
                  return "(a secret, set)"
              if template.match(key):
                  return f"({len(str(value))} characters)"
              text = json.dumps(value)
              return text if len(text) <= 80 else text[:77] + "..."
          # A provider, a hook or SMTP goes over whole or not at all: half of one breaks sign-in.
          def group(key):
              m = re.match(r"^(smtp_|external_[a-z0-9]+_|hook_[a-z0-9_]+?_(?=uri$|secrets$|enabled$))", key)
              return m.group(1) if m else None
          patch, left, broken = {}, [], set()
          for key, value in sorted(staging.items()):
              if key in ("site_url", "uri_allow_list") or own.match(key):
                  continue
              if isinstance(value, str) and staging_ref in value:
                  left.append(f"{key}: names staging's project ({value})")
                  broken.add(group(key))
                  continue
              if secret.search(key) and (hidden(value) or value in (None, "")):
                  if hidden(value):
                      left.append(f"{key}: the API hands it back masked")
                      broken.add(group(key))
                  continue
              if value != production.get(key):
                  patch[key] = value
          patch["site_url"] = os.environ["PRODUCTION_SITE"]
          patch["uri_allow_list"] = os.environ["PRODUCTION_REDIRECTS"]
          patch["password_hibp_enabled"] = True
          patch = {k: v for k, v in patch.items() if v != production.get(k)}
          if staging.get("smtp_host") and not staging.get("smtp_pass"):
              broken.add("smtp_")
          broken.discard(None)
          for prefix in sorted(broken):
              for k in [k for k in patch if k.startswith(prefix)]:
                  del patch[k]
              left.append(f"{prefix}*: all of it, since a part could not come over; set it by hand")
          if "smtp_" in broken:
              # Supabase's own mailer takes no higher email rate limit.
              patch.pop("rate_limit_email_sent", None)
              left.append("SMTP: staging's password does not come back from the API, so production keeps "
                          "Supabase's own mailer: Authentication -> Emails -> SMTP Settings, by hand")
          print(f"JackiOh-Production: {len(patch)} setting(s) to change")
          for key in sorted(patch):
              print(f"  {key}: {shown(key, production.get(key))} -> {shown(key, patch[key])}")
          for line in left:
              print(f"::warning::left out: {line}")
          json.dump(patch, open(f"{tmp}/auth.production.patch.json", "w"))
          redirect = os.environ["STAGING_REDIRECT"]
          urls = [u for u in (staging.get("uri_allow_list") or "").split(",") if u]
          staging_patch = {} if redirect in urls else {"uri_allow_list": ",".join(urls + [redirect])}
          print(f"staging's Redirect URLs: {', '.join(urls) or '(none)'}"
                + ("" if not staging_patch else f" -> adds {redirect}"))
          json.dump(staging_patch, open(f"{tmp}/auth.staging.patch.json", "w"))
          EOF

          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: nothing written. Run it again without dry_run to apply." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for ref in "$PRODUCTION_REF" "$STAGING_REF"; do
            case "$ref" in "$PRODUCTION_REF") body=auth.production.patch.json ;; *) body=auth.staging.patch.json ;; esac
            if [ "$(cat "$RUNNER_TEMP/$body")" = "{}" ]; then echo "$ref: nothing to change"; continue; fi
            api -X PATCH "$config/$ref/config/auth" --data-binary "@$RUNNER_TEMP/$body" > /dev/null
            echo "$ref: changed $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/$body")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # Read back what matters most.
          api "$config/$PRODUCTION_REF/config/auth" \
            | jq -r '"production now: site_url \(.site_url), redirects \(.uri_allow_list), leaked-password protection \(.password_hibp_enabled), confirm email \(.mailer_autoconfirm | not), SMTP host \(.smtp_host // "Supabase'"'"'s own")"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: sign-in emails through Resend
        if: ${{ inputs.step == 'email' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          EMAIL_DOMAIN: jackioh.com
          EMAIL_FROM: no-reply@jackioh.com
          EMAIL_NAME: JackiOh
          # Supabase's own mailer holds a project to 2 an hour; with SMTP of its own, Supabase's usual
          # 30, inside Resend's free 100 a day.
          EMAIL_PER_HOUR: "30"
          # The sending-only key this step makes; an earlier run's, by the same name, is deleted.
          KEY_NAME: supabase-smtp
        run: |
          set -euo pipefail
          umask 077
          case "$RESEND_API_KEY" in
            re_*) ;;
            "") echo "::error::RESEND_API_KEY is not set: a Full access key from https://resend.com/api-keys"; exit 1 ;;
            *) echo "::error::RESEND_API_KEY is not a Resend API key (re_…)"; exit 1 ;;
          esac
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1 ;; esac
          resend() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" "$@"
          }
          supabase() {
            curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }
          api=https://api.resend.com
          if ! domains=$(resend "$api/domains" 2>&1); then
            echo "::error::Resend refused to list the domains, so RESEND_API_KEY is probably a Sending access key: make a Full access one. Resend said: $domains"
            exit 1
          fi
          id=$(jq -r --arg d "$EMAIL_DOMAIN" '[(.data // .)[] | select(.name == $d)][0].id // empty' <<<"$domains")
          if [ -z "$id" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "dry_run: would add $EMAIL_DOMAIN to Resend, then print its DNS records" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            id=$(resend -X POST "$api/domains" -d "$(jq -n --arg d "$EMAIL_DOMAIN" '{name: $d}')" | jq -r .id)
            echo "added $EMAIL_DOMAIN to Resend"
          fi
          domain=$(resend "$api/domains/$id")
          # Sign-in mail carries no tracking: no pixel, and no link rewritten through Resend (whose
          # Tracking record then is not needed either).
          if [ "$(jq -r '(.open_tracking // false) or (.click_tracking // false)' <<<"$domain")" = true ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "dry_run: would turn off Resend's open and click tracking for $EMAIL_DOMAIN"
            else
              resend -X PATCH "$api/domains/$id" -d '{"open_tracking": false, "click_tracking": false}' > /dev/null
              domain=$(resend "$api/domains/$id")
            fi
          fi
          status=$(jq -r .status <<<"$domain")
          echo "Resend's $EMAIL_DOMAIN: $status (open tracking $(jq -r '.open_tracking // false' <<<"$domain"), click tracking $(jq -r '.click_tracking // false' <<<"$domain")). Its DNS records, one JSON object a line:"
          jq -c '.records[] | select(.record != "Tracking") | {record, type, name, value, priority, ttl, status}' <<<"$domain"
          if [ "$status" != verified ]; then
            [ "$DRY_RUN" = true ] && exit 0
            resend -X POST "$api/domains/$id/verify" > /dev/null
            for _ in $(seq 1 30); do
              sleep 10
              status=$(resend "$api/domains/$id" | jq -r .status)
              case "$status" in verified | failed) break ;; esac
            done
            if [ "$status" != verified ]; then
              echo "::error::$EMAIL_DOMAIN is $status at Resend: add the records above to the jackioh.com zone, then run this again"
              exit 1
            fi
            echo "$EMAIL_DOMAIN verified"
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: would make a sending-only key for $EMAIL_DOMAIN and set it as both projects' SMTP" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          old=$(resend "$api/api-keys" | jq -r --arg n "$KEY_NAME" '(.data // .)[] | select(.name == $n) | .id')
          key=$(resend -X POST "$api/api-keys" \
            -d "$(jq -n --arg n "$KEY_NAME" --arg d "$id" '{name: $n, permission: "sending_access", domain_id: $d}')" | jq -r .token)
          echo "::add-mask::$key"
          case "$key" in re_*) ;; *) echo "::error::Resend made no key"; exit 1 ;; esac
          jq -n --arg pass "$key" --arg from "$EMAIL_FROM" --arg name "$EMAIL_NAME" --argjson hour "$EMAIL_PER_HOUR" \
            '{smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend", smtp_pass: $pass,
              smtp_admin_email: $from, smtp_sender_name: $name, rate_limit_email_sent: $hour}' > "$RUNNER_TEMP/smtp.json"
          for ref in "$PRODUCTION_REF" "$STAGING_REF"; do
            supabase -X PATCH "https://api.supabase.com/v1/projects/$ref/config/auth" --data-binary "@$RUNNER_TEMP/smtp.json" > /dev/null
            supabase "https://api.supabase.com/v1/projects/$ref/config/auth" \
              | jq -r --arg ref "$ref" '"\($ref): SMTP \(.smtp_host):\(.smtp_port) as \(.smtp_user), from \(.smtp_sender_name) <\(.smtp_admin_email)>, \(.rate_limit_email_sent) emails an hour"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$RUNNER_TEMP/smtp.json"
          # Only now that both projects send with the new key: an earlier run's goes.
          for gone in $old; do
            resend -X DELETE "$api/api-keys/$gone" > /dev/null
            echo "deleted the earlier $KEY_NAME key $gone"
          done

      - name: production's statistics logins, sealed for a person
        if: ${{ inputs.step == 'stats-logins' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          umask 077
          production=$(cat "$RUNNER_TEMP/production.url")
          host=$(python3 -c 'import sys, urllib.parse as u; print(u.urlsplit(sys.argv[1]).hostname)' "$production")
          q() { psql "$1" -XAtq -v ON_ERROR_STOP=1 "${@:2}"; }
          # training/learn.md's two logins: stats_importer acts as service_role only by `set role`, and
          # stats_reader's every transaction is read-only. The copy brought both from staging.
          q "$production" -c "select rolname || ': ' || case when rolconfig is null then 'no settings' else array_to_string(rolconfig, ', ') end
            from pg_roles where rolname in ('stats_importer', 'stats_reader') order by 1" | sed 's/^/production holds /'
          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: would give stats_importer and stats_reader new passwords and print their addresses sealed"
            exit 0
          fi
          [ -n "$PUBLIC_KEY" ] || { echo "::error::public_key is empty: the addresses are printed only sealed"; exit 1; }
          base64 -d <<<"$PUBLIC_KEY" > "$RUNNER_TEMP/key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/key.der" -out "$RUNNER_TEMP/key.pem"

          importer=$(openssl rand -hex 24)
          reader=$(openssl rand -hex 24)
          echo "::add-mask::$importer"
          echo "::add-mask::$reader"
          # Each password goes to the database as its SCRAM verifier, so no statement or log holds it.
          cat > "$RUNNER_TEMP/scram.py" <<'EOF'
          import base64, hashlib, hmac, os, sys
          salt, rounds = os.urandom(16), 4096
          key = hashlib.pbkdf2_hmac("sha256", sys.stdin.read().encode(), salt, rounds)
          client = hmac.new(key, b"Client Key", "sha256").digest()
          server = hmac.new(key, b"Server Key", "sha256").digest()
          b = lambda v: base64.b64encode(v).decode()
          print(f"SCRAM-SHA-256${rounds}:{b(salt)}${b(hashlib.sha256(client).digest())}:{b(server)}")
          EOF
          scram() { printf %s "$1" | python3 "$RUNNER_TEMP/scram.py"; }
          q "$production" -v importer="$(scram "$importer")" -v reader="$(scram "$reader")" <<'SQL'
          do $$
          begin
            if not exists (select from pg_roles where rolname = 'stats_importer') then
              create role stats_importer login noinherit;
              grant service_role to stats_importer;
            end if;
            if not exists (select from pg_roles where rolname = 'stats_reader') then
              create role stats_reader login;
              grant service_role to stats_reader;
              alter role stats_reader set default_transaction_read_only = on;
            end if;
          end
          $$;
          alter role stats_importer password :'importer';
          alter role stats_reader password :'reader';
          SQL

          for login in stats_importer stats_reader; do
            case "$login" in stats_importer) pw=$importer ;; *) pw=$reader ;; esac
            url="postgresql://$login.$PRODUCTION_REF:$pw@$host:5432/postgres"
            echo "::add-mask::$url"
            # The pooler may take a moment to see a new password.
            for wait in 5 10 20 0; do
              if held=$(q "$url" -c "set role service_role; select 'read-only ' || current_setting('default_transaction_read_only') || ', ' || count(*) || ' card rows in reach' from public.card_totals"); then
                break
              fi
              [ "$wait" = 0 ] && { echo "::error::$login cannot sign in to JackiOh-Production"; exit 1; }
              sleep "$wait"
            done
            sealed=$(printf %s "$url" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/key.pem" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 | base64 -w0)
            echo "$login signs in: $held"
            echo "$login sealed: $sealed"
          done

      - name: development statistics into JackiOh-Production
        if: ${{ inputs.step == 'dev-stats' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STAGING_STATS: ${{ secrets.STATS_IMPORT_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$STAGING_STATS" ] || { echo "::error::STATS_IMPORT_DATABASE_URL is not set"; exit 1; }
          production=$(cat "$RUNNER_TEMP/production.url")
          q() { psql "$1" -XAtq -v ON_ERROR_STOP=1 "${@:2}"; }
          mkdir -p "$RUNNER_TEMP/dev" && cd "$RUNNER_TEMP/dev"
          tables=(card_totals game_totals record_totals game_record_batches)
          dev() { case "$1" in game_record_batches) echo "true" ;; *) echo "source = 'dev'" ;; esac; }

          # Both sides' columns in the same order, or the rows would land in the wrong ones.
          columns="select string_agg(table_name || '(' || cols || ')', ' ' order by table_name) from (
            select table_name, string_agg(column_name, ',' order by ordinal_position) as cols
            from information_schema.columns where table_schema = 'public'
            and table_name in ('card_totals', 'game_totals', 'record_totals', 'game_record_batches') group by 1) t"
          # As service_role (stats_importer inherits nothing), inside a transaction, which keeps one
          # connection even through a transaction pooler.
          a=$(q "$STAGING_STATS" -c "begin read only" -c "set local role service_role" -c "$columns" -c "commit")
          b=$(q "$production" -c "$columns")
          [ "$a" = "$b" ] || { echo "::error::the statistics tables differ: staging $a, production $b"; exit 1; }

          # Staging's, in one snapshot.
          copies=(-c "begin isolation level repeatable read read only" -c "set local role service_role")
          for t in "${tables[@]}"; do
            copies+=(-c "\\copy (select * from public.$t where $(dev "$t")) to '$t.tsv'")
          done
          copies+=(-c "commit")
          q "$STAGING_STATS" "${copies[@]}"
          counts=()
          for t in "${tables[@]}"; do
            n=$(grep -c . "$t.tsv" || true)
            counts+=("$t=$n")
          done
          games=$(q "$STAGING_STATS" -c "set role service_role; select coalesce(sum((total->>'games')::bigint), 0) || ' games over ' || count(distinct patch) || ' patches' from public.game_totals where source = 'dev'")
          echo "staging's development statistics: ${counts[*]} ($games)"
          echo "production holds now: $(q "$production" -c "select (select count(*) from public.card_totals where source = 'dev') || ' development card rows, '
            || (select count(*) from public.game_record_batches) || ' batches'")"

          # Production's development rows replaced by staging's, the counts checked before commit.
          load=()
          check="do \$\$ begin"
          for t in "${tables[@]}"; do
            load+=(-c "delete from public.$t where $(dev "$t")" -c "\\copy public.$t from '$t.tsv'")
            n=$(grep -c . "$t.tsv" || true)
            check+=" if (select count(*) from public.$t where $(dev "$t")) <> $n then raise exception '$t holds a different count'; end if;"
          done
          check+=" end \$\$"
          last=()
          [ "$DRY_RUN" = true ] && last=(-c rollback)
          psql "$production" -X -q --single-transaction -v ON_ERROR_STOP=1 "${load[@]}" -c "$check" "${last[@]}"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: staging's development statistics loaded into JackiOh-Production and agreed, then rolled back"
            exit 0
          fi
          echo "JackiOh-Production now holds $(q "$production" -c "select coalesce(sum((total->>'games')::bigint), 0) || ' development games over ' || count(distinct patch) || ' patches' from public.game_totals where source = 'dev'"), as staging does" | tee -a "$GITHUB_STEP_SUMMARY"
