# Holds CI to its budget (#73): no job may run longer than five minutes. After every run of CI or
# bot selftest, this reads how long each of its jobs took and, if any went over, opens an issue
# naming them, or comments on the one already open, so a slow job is seen and split before it grows
# into the old 19-minute wait. The night bot's own workflows are exempt: a build legitimately runs
# for hours.
#
# It never checks out or runs code. `workflow_run` runs this file from the default branch with a
# write token even for a fork's pull request, so it only reads job timings through the API, and the
# job names it quotes reach the shell through env, never through `${{ }}` in a script.
name: ci duration

on:
  workflow_run:
    workflows: ["CI", "bot selftest"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  check:
    name: no CI job over 5 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: time every job of the run, and report the slow ones
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
          LIMIT_SECONDS: "300"
          TITLE: "CI: a job ran over 5 minutes"
        run: |
          set -euo pipefail
          # The latest attempt's jobs that ran to an end. A cancelled job (a newer push superseding
          # the run) says nothing about how long the job takes.
          slow=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
            .jobs[]
            | select(.started_at != null and .completed_at != null)
            | select(.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out")
            | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $s
            | select($s > (env.LIMIT_SECONDS | tonumber))
            | "| [\(.name | gsub("\\|"; "\\|"))](\(.html_url)) | \($s / 60 | floor)m \($s % 60)s | \(.conclusion) |"')
          if [ -z "$slow" ]; then
            echo "every job of $WORKFLOW run $RUN_ID finished within $LIMIT_SECONDS s"
            exit 0
          fi
          echo "over $LIMIT_SECONDS s:"; echo "$slow"

          body=$(printf '%s\n' \
            "[$WORKFLOW run $RUN_ID]($RUN_URL) on \`$BRANCH\` (\`${SHA:0:7}\`, $EVENT) had jobs over the 5-minute budget (#73):" \
            "" \
            "| Job | Time | Result |" \
            "|---|---|---|" \
            "$slow" \
            "" \
            "Split the slow job further: most splits only need a longer matrix list in \`.github/workflows/ci.yml\`; for e2e, also refresh the \`WEIGHTS\` in \`e2e/scripts/shard-specs.mjs\`." \
            "" \
            "---" \
            "_Posted by \`.github/workflows/ci-duration.yml\`._")

          # One open issue collects every report, so a slow job does not open one issue per run.
          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
