# TEMPORARY (staging's red super run 45746855347), deleted before any pull request of this branch
# merges: the session fixing it cannot build Rust or install the web's packages (its container's
# network policy denies crates.io), so it reproduces the run's new failures here, with a few lines of
# logging patched in for this workflow alone:
# - fuzz seeds 7360 (I23) and 13680 (I18), plain wave: the failing step's action, events and states;
# - run-sim --from 0 --seeds 1 --skill 0.5 --budget full: which of decide.rs's fallbacks it takes;
# - the R290 tutorial tier and run-sim on #4897's parent, on #4897 and on main (a bisect);
# - e2e spec 48 alone, its pick-budget assertion naming the picker's kind, the play and the card.
name: tmp repro 4984

on:
  push:
    branches: [claude/charming-bell-p8etig]
    paths: [".github/workflows/tmp-repro-4984.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: patch in the logging
        run: |
          python3 - <<'EOF'
          p = 'crates/tools/src/fuzz.rs'
          t = open(p).read()
          a = "        let action_type = action.action_type().as_str().to_string();\n"
          assert t.count(a) == 1, 'action_type anchor'
          t = t.replace(a, "        let tmp_prev = std::env::var(\"JACKIOH_TMP_DUMP\").ok().map(|_| state.clone());\n" + a)
          b = "        let mut broken = monitor.after(&result.events, &state);\n"
          assert t.count(b) == 1, 'after anchor'
          dump = (
              "        if let (Ok(want), Some(prev)) = (std::env::var(\"JACKIOH_TMP_DUMP\"), tmp_prev.as_ref()) {\n"
              "            if broken.iter().any(|f| f.contains(want.as_str())) {\n"
              "                std::fs::write(\"/tmp/dump-findings.json\", serde_json::to_string(&broken).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-action.json\", serde_json::to_string(&log.last().map(|a| &a.body)).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-events.json\", serde_json::to_string(&result.events).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-prev.json\", serde_json::to_string(prev).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-after.json\", serde_json::to_string(&state).unwrap()).unwrap();\n"
              "            }\n"
              "        }\n"
          )
          t = t.replace(b, b + dump)
          open(p, 'w').write(t)

          p = 'crates/ai/src/match_.rs'
          t = open(p).read()
          c = "            if decision.reason == DecisionReason::Fallback {\n"
          assert t.count(c) == 1, 'match fallback anchor'
          t = t.replace(c, c + "                eprintln!(\"TMP-FALLBACK turn {} seat {}\", current.turn, seat.as_str());\n")
          open(p, 'w').write(t)

          p = 'crates/ai/src/decide.rs'
          t = open(p).read()
          d = "reason: DecisionReason::Fallback,"
          assert t.count(d) == 5, 'decide sites'
          t = t.replace(d, "reason: { eprintln!(\"TMP-FALLBACK site decide.rs:{}\", line!()); DecisionReason::Fallback },")
          open(p, 'w').write(t)
          EOF
      - name: jackioh and jackioh-server
        run: cargo build --release -p jackioh-server -p jackioh-tools
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/rust-release.tgz" target/release/jackioh target/release/jackioh-server
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}/rust-release.tgz
          retention-days: 1

  fuzz-dump:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 7360
            want: I23
          - seed: 13680
            want: I18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: replay the seed
        env:
          JACKIOH_TMP_DUMP: ${{ matrix.want }}
        run: target/release/jackioh fuzz --from ${{ matrix.seed }} --seeds 1 2>&1 | grep -E "I[0-9]+ |message:|failed|passed" | cut -c1-600 || true
      - name: print the dump
        run: |
          for f in findings action events prev after; do
            echo "DUMP-$f-BEGIN"
            gzip -9c /tmp/dump-$f.json | base64 -w0 || true
            echo
            echo "DUMP-$f-END"
          done

  run-sim:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: the failing run
        run: target/release/jackioh run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -vE "^\s*$" | tail -80 || true

  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: [9be0adf6e2, 53c18151f9, main]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache-key: tmp-bisect-${{ matrix.ref }}
      - name: R290's tutorial tier
        run: cargo test -p jackioh-ai --tests --features jackioh-engine/testkit -- --ignored r290_the_greedy_baseline --nocapture 2>&1 | grep -E "R290|test result|not won|panicked" | cut -c1-900 || true
      - name: run-sim seed 0 at full budget
        run: cargo run --release -p jackioh-tools -- run-sim --from 0 --seeds 1 --skill 0.5 --budget full 2>&1 | grep -vE "^\s*$|Compiling|Downloaded|Downloading" | tail -40 || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: the WASM module
        run: sh scripts/build-wasm.sh
      - name: the e2e client
        run: pnpm build:e2e
      - name: the dev dashboard's e2e client
        run: pnpm --dir apps/admin build:e2e
      - name: pack them
        run: tar -czf "$RUNNER_TEMP/web-build.tgz" apps/web/src/wasm/pkg apps/web/dist apps/admin/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tgz
          retention-days: 1

  e2e-48:
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: name the picker in the pick-budget assertion
        run: |
          python3 - <<'EOF'
          p = 'e2e/support/tutorial.ts'
          t = open(p).read()
          old = 'expect(remaining, `the play of ${play.instanceId} is complete within ${String(PLAY_PICK_BUDGET)} picks`).to.be.greaterThan(0);'
          assert t.count(old) == 1, 'budget anchor'
          new = ('expect(remaining, `the play of ${play.instanceId} is complete within ${String(PLAY_PICK_BUDGET)} picks; '
                 'TMP kind=${String($body.find(`${PROMPT}[data-prompt-source="play"]`).attr("data-prompt-kind"))} '
                 'play=${JSON.stringify(play)} card=${card.text().slice(0, 160)} '
                 'prompt=${$body.find(PROMPT).first().text().slice(0, 400)}`).to.be.greaterThan(0);')
          t = t.replace(old, new)
          open(p, 'w').write(t)
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: rust-release
          path: ${{ runner.temp }}
      - name: unpack
        run: |
          tar -xzf "$RUNNER_TEMP/web-build.tgz"
          tar -xzf "$RUNNER_TEMP/rust-release.tgz"
      - name: start the client and the server
        env:
          E2E: "1"
        run: |
          CATALOG_VERSION=$(target/release/jackioh catalog-version)
          export CATALOG_VERSION
          nohup pnpm --dir apps/web exec vite preview --port 5173 --strictPort > "$RUNNER_TEMP/client.log" 2>&1 &
          nohup target/release/jackioh-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for url in http://localhost:5173 http://localhost:8787/api/catalog; do
            for i in $(seq 1 120); do
              if curl -fs -o /dev/null "$url"; then echo "up: $url"; break; fi
              sleep 1
            done
          done
      - name: spec 48
        env:
          E2E: "1"
        run: pnpm --dir e2e exec cypress run --browser chrome --spec cypress/e2e/48-tutorial-final-exam.cy.ts || true
