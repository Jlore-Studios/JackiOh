# The learned evaluation's self-play export (#466, #1007; docs/learned-eval.md D1, "How much data and
# compute"): `jackioh selfplay` in shards, on the local runner by default or on GitHub's runners when
# asked, by dispatch only (never on a pull request or a schedule). `gh workflow run selfplay.yml -f
# games=100000 -f seed=<base>` (training/README.md, Where the exports come from). The local runner is
# the default because an export on GitHub's takes 12 of the organization's 20 hosted runners for
# hours, and CI waits behind it: 70 to 110 minutes a run on 2026-10-20, against 10 to 16 without (#1455).
#
#   plan      splits the games into `shards` ranges of game numbers (`--from`, `--games`), and the
#             ranges into rounds: one on GitHub's runners, five on the local runner
#   build     one release `jackioh`, as super.yml's `rust-build` builds it, passed on as an artifact
#   round1-5  selfplay-shards.yml, a round each, one after another: one job per range on `runner`,
#             `jackioh selfplay --from <k> --games <n> --seed <base>`, its log file uploaded as
#             `selfplay-<base>-<k>` (kept `retention` days, 90 at most)
#   count     the logs of every shard that finished through `jackioh positions` for its counts only
#             (games, positions, games dropped for not replaying), written to the run's summary
#
# A game is a function of its seed (R1006001), so an export is repeatable from its base: the same
# dispatch plays the same games on any runner, and its shards' files together are the games one
# machine would have played. A base naming a training gate's hold-out deals or the dev set is refused
# by `selfplay` itself (R1006002). On GitHub's runners each shard keeps well under the 6-hour job
# limit (about 1,500 games an hour on four vCPUs). On the local runner (`jackioh-selfplay-local`,
# bot/machine/README.md, The local runner) every job runs there, the plan, the build and the count
# too, and its shards run one after another, each for as long as it needs (about 2,500 games an hour
# on six CPUs), in five rounds, so that no shard waits for the runner longer than its round takes
# (GitHub fails a job no self-hosted runner takes in 24 hours; selfplay-shards.yml). The export is
# slow on purpose, and ci-duration.yml does not watch it.
#
# The learn lane (learn.yml, #1012) calls it as a reusable workflow (`workflow_call`, the same inputs,
# `count` off: its retrain folds the positions itself) on the local runner, and its artifacts are that
# run's.
name: selfplay

on:
  workflow_call:
    inputs:
      games:
        type: string
        required: true
      seed:
        type: string
        required: true
      shards:
        type: string
        required: false
        default: "20"
      runner:
        type: string
        required: false
        default: jackioh-selfplay-local
      retention:
        type: string
        required: false
        default: "30"
      count:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      games:
        description: "Games to play in all (game numbers 1..games)"
        required: true
        default: "100000"
      seed:
        description: "The seed base (letters, digits, . _ -): game n is <base>:n. Never a gate's (improve, unban) nor improve-dev"
        required: true
      shards:
        description: "How many jobs to split the games over"
        required: true
        default: "20"
      runner:
        description: "Where the shards run"
        type: choice
        options:
          - jackioh-selfplay-local
          - ubuntu-latest
        default: jackioh-selfplay-local
      retention:
        description: "Days to keep the logs (at most 90)"
        required: true
        default: "90"
      count:
        description: "Fold the export's positions for its counts (the summary)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan the shards
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      round1: ${{ steps.split.outputs.round1 }}
      round2: ${{ steps.split.outputs.round2 }}
      round3: ${{ steps.split.outputs.round3 }}
      round4: ${{ steps.split.outputs.round4 }}
      round5: ${{ steps.split.outputs.round5 }}
    steps:
      - id: split
        env:
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
          RETENTION: ${{ inputs.retention }}
          SEED: ${{ inputs.seed }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          # The base names the shards' artifacts, which take no `:` or `/`.
          if not re.fullmatch(r"[A-Za-z0-9._-]+", os.environ["SEED"]):
              sys.exit(f"the seed base {os.environ['SEED']!r} takes letters, digits, '.', '_' and '-' only")
          games, shards, retention = (int(os.environ[k]) for k in ("GAMES", "SHARDS", "RETENTION"))
          if games < 1 or shards < 1 or shards > 256 or not 1 <= retention <= 90:
              sys.exit(f"games {games}, shards {shards} (1 to 256) and retention {retention} (1 to 90) are out of range")
          shards = min(shards, games)
          base, extra = divmod(games, shards)
          ranges, start = [], 1
          for k in range(shards):
              n = base + (1 if k < extra else 0)
              ranges.append({"from": start, "games": n})
              start += n
          # In order, into one round on GitHub's runners and five (or one a shard, when fewer) on the
          # local runner; a round with no shards is skipped.
          rounds = 1 if os.environ["RUNNER_LABEL"] == "ubuntu-latest" else min(5, shards)
          size, more = divmod(shards, rounds)
          at = 0
          for r in range(5):
              n = size + (1 if r < more else 0) if r < rounds else 0
              print(f"round{r + 1}=" + json.dumps(ranges[at:at + n]))
              at += n
          PY

  build:
    name: release build
    runs-on: ${{ inputs.runner }}
    # The local runner builds with no cache of its own, and at half a CPU while the PC is busy.
    timeout-minutes: ${{ inputs.runner == 'ubuntu-latest' && 30 || 720 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: jackioh
        run: cargo build --release -p jackioh-tools
      # A tarball keeps the executable bit an artifact would drop.
      - name: pack it
        run: tar -czf "$RUNNER_TEMP/jackioh.tgz" target/release/jackioh
      - uses: actions/upload-artifact@v4
        with:
          name: selfplay-jackioh
          path: ${{ runner.temp }}/jackioh.tgz
          if-no-files-found: error
          retention-days: 3

  # The shards, in rounds (selfplay-shards.yml): one round on GitHub's runners, up to five on the
  # local runner, each started once the round before it has ended, whether or not every shard of it
  # finished (a shard that did not costs the export its games, not the rest of the export).
  round1:
    name: round 1
    needs: [plan, build]
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.round1 }}
      seed: ${{ inputs.seed }}
      runner: ${{ inputs.runner }}
      retention: ${{ inputs.retention }}

  round2:
    name: round 2
    needs: [plan, build, round1]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.round2 != '[]' }}
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.round2 }}
      seed: ${{ inputs.seed }}
      runner: ${{ inputs.runner }}
      retention: ${{ inputs.retention }}

  round3:
    name: round 3
    needs: [plan, build, round2]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.round3 != '[]' }}
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.round3 }}
      seed: ${{ inputs.seed }}
      runner: ${{ inputs.runner }}
      retention: ${{ inputs.retention }}

  round4:
    name: round 4
    needs: [plan, build, round3]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.round4 != '[]' }}
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.round4 }}
      seed: ${{ inputs.seed }}
      runner: ${{ inputs.runner }}
      retention: ${{ inputs.retention }}

  round5:
    name: round 5
    needs: [plan, build, round4]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.round5 != '[]' }}
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.round5 }}
      seed: ${{ inputs.seed }}
      runner: ${{ inputs.runner }}
      retention: ${{ inputs.retention }}

  count:
    name: count the export
    needs: [round1, round2, round3, round4, round5]
    # A caller may leave the counts to its own positions pass. It counts the shards that finished.
    if: ${{ !cancelled() && inputs.count && needs.round1.result != 'skipped' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.runner == 'ubuntu-latest' && 120 || 720 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: selfplay-jackioh
          path: ${{ runner.temp }}
      - name: unpack it
        run: tar -xzf "$RUNNER_TEMP/jackioh.tgz" -C "$RUNNER_TEMP"
      - uses: actions/download-artifact@v4
        with:
          pattern: selfplay-${{ inputs.seed }}-*
          path: ${{ runner.temp }}/export
      - name: positions, for the counts
        env:
          SEED: ${{ inputs.seed }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          cd "$RUNNER_TEMP"
          mapfile -t logs < <(find export -name 'selfplay-*.jsonl' | sort -V)
          "$RUNNER_TEMP/target/release/jackioh" positions "${logs[@]}" --out positions.jsonl > counts.json
          bytes=$(cat "${logs[@]}" | wc -c)
          python3 - "$SEED" "$RUNNER_LABEL" "$bytes" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          seed, runner, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          counts = json.load(open("counts.json"))["counts"]
          shards = []
          for path in sorted(glob.glob("export/*/timing.txt")):
              text = dict(line.split(": ") for line in open(path).read().split("\n") if ": " in line)
              shards.append((int(text["seconds"]), int(text["cores"])))
          slowest = max((s for s, _ in shards), default=0)
          # GitHub's runners play the shards side by side; the local runner, one after another.
          elapsed = slowest if runner == "ubuntu-latest" else sum(s for s, _ in shards)
          cpu_seconds = sum(s * c for s, c in shards)
          games = counts["games"]
          print(f"## Self-play export `{seed}` on `{runner}`\n")
          print("| | |\n|---|---|")
          for key in ("games", "replayed", "positions", "notReplayed", "noResult", "earlierPatch", "unreadable"):
              print(f"| {key} | {counts[key]:,} |")
          print(f"| shards | {len(shards)} |")
          print(f"| slowest shard | {slowest / 3600:.2f} h |")
          if elapsed:
              print(f"| games an hour (all shards) | {games / elapsed * 3600:,.0f} |")
          if cpu_seconds and games:
              print(f"| vCPU-seconds a game | {cpu_seconds / games:.2f} |")
          print(f"| logs | {size / 1e6:,.1f} MB, {size / max(games, 1):,.0f} bytes a game |")
          PY
          cat counts.json
          rm -f positions.jsonl
