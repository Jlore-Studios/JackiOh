# The learned evaluation's self-play export (#466, #1007; docs/learned-eval.md D1, "How much data and
# compute"): `jackioh selfplay` in shards on GitHub's runners, by dispatch only (never on a pull
# request or a schedule). `gh workflow run selfplay.yml -f games=100000 -f seed=<base>`
# (training/README.md, Where the exports come from). Since the organization's Team plan runs 60
# hosted jobs at once (#3740), an export takes 10 of them, the training lanes' share. On the Free
# plan's 20 it took 12, and CI waited behind it, 70 to 110 minutes a run on 2026-10-20 against 10 to
# 16 without, so the owner's PC played the exports from #1455 until then.
#
#   plan      splits the games into `shards` ranges of game numbers (`--from`, `--games`)
#   build     one release `jackioh`, as super.yml's `rust-build` builds it, passed on as an artifact
#             (with `jackioh-server` and training/file-records.sh when the shards file, `file_every`)
#   shards    selfplay-shards.yml: one job per range, `jackioh selfplay --from <k> --games <n>
#             --seed <base>`, its log file uploaded as `selfplay-<base>-<k>` (kept `retention` days,
#             90 at most)
#   count     the logs of every shard that finished through `jackioh positions` for its counts only
#             (games, positions, games dropped for not replaying), written to the run's summary
#
# A game is a function of its seed (R1006001), so an export is repeatable from its base: the same
# dispatch plays the same games on any runner, and its shards' files together are the games one
# machine would have played. A base naming a training gate's hold-out deals or the dev set is refused
# by `selfplay` itself (R1006002). Each shard keeps under GitHub's 6-hour job limit: 1,250 games (a
# 100,000-game export in 80 shards) take about 3 hours on four vCPUs at the AI's budget since #2628,
# 10 shards at once (selfplay-shards.yml). The export is slow on purpose, and ci-duration.yml does
# not watch it.
#
# The learn lane (learn.yml, #1012) calls it as a reusable workflow (`workflow_call`, the same inputs,
# `count` off: its retrain folds the positions itself; `ref`, the commit of main its plan read;
# `file_every` and the two statistics databases' addresses, so each shard files its games into the
# card statistics about an hour at a time as it plays them, selfplay-shards.yml), and its artifacts
# are that run's. A dispatched export files nothing.
name: selfplay

on:
  workflow_call:
    inputs:
      games:
        type: string
        required: true
      seed:
        type: string
        required: true
      shards:
        type: string
        required: false
        default: "80"
      retention:
        type: string
        required: false
        default: "30"
      count:
        type: boolean
        required: false
        default: true
      # The commit the build checks out: the learn lane's plan passes main as it found it. The
      # run's own commit when empty.
      ref:
        type: string
        required: false
        default: ""
      # Games each shard plays, then files into the card statistics, at a time (the learn lane's;
      # selfplay-shards.yml). Empty, as on a dispatch, files nothing.
      file_every:
        type: string
        required: false
        default: ""
    secrets:
      STATS_IMPORT_DATABASE_URL:
        required: false
      PRODUCTION_STATS_IMPORT_DATABASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      games:
        description: "Games to play in all (game numbers 1..games)"
        required: true
        default: "100000"
      seed:
        description: "The seed base (letters, digits, . _ -): game n is <base>:n. Never a gate's (improve, unban) nor improve-dev"
        required: true
      shards:
        description: "How many jobs to split the games over (on GitHub's runners, at most 1,250 games each: 6 hours a job)"
        required: true
        default: "80"
      retention:
        description: "Days to keep the logs (at most 90)"
        required: true
        default: "90"
      count:
        description: "Fold the export's positions for its counts (the summary)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Days the export's build (`selfplay-jackioh`) is kept: every shard downloads it as it starts, and
  # the learn lane's retrain and import fold and file the export with it (R1676000), a re-run of
  # either among them. An export takes about a day. At 3, when exports took three days on the
  # owner's PC, every shard that started after the third day failed at once on the missing artifact
  # (#3722).
  BUILD_RETENTION_DAYS: "14"

jobs:
  plan:
    name: plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ranges: ${{ steps.split.outputs.ranges }}
    steps:
      - id: split
        env:
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
          RETENTION: ${{ inputs.retention }}
          SEED: ${{ inputs.seed }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          # The base names the shards' artifacts, which take no `:` or `/`.
          if not re.fullmatch(r"[A-Za-z0-9._-]+", os.environ["SEED"]):
              sys.exit(f"the seed base {os.environ['SEED']!r} takes letters, digits, '.', '_' and '-' only")
          games, shards, retention = (int(os.environ[k]) for k in ("GAMES", "SHARDS", "RETENTION"))
          if games < 1 or shards < 1 or shards > 256 or not 1 <= retention <= 90:
              sys.exit(f"games {games}, shards {shards} (1 to 256) and retention {retention} (1 to 90) are out of range")
          shards = min(shards, games)
          base, extra = divmod(games, shards)
          ranges, start = [], 1
          for k in range(shards):
              n = base + (1 if k < extra else 0)
              ranges.append({"from": start, "games": n})
              start += n
          print("ranges=" + json.dumps(ranges))
          PY

  build:
    name: release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: jackioh
        run: cargo build --release -p jackioh-tools
      # The shards that file their games (`file_every`) need the server's `stats-import` and the
      # filing script, of the same commit as the build that played them.
      - name: jackioh-server
        if: ${{ inputs.file_every != '' }}
        run: cargo build --release -p jackioh-server
      # A tarball keeps the executable bit an artifact would drop.
      - name: pack it
        env:
          FILE_EVERY: ${{ inputs.file_every }}
        run: |
          files=(target/release/jackioh)
          [ -z "$FILE_EVERY" ] || files+=(target/release/jackioh-server training/file-records.sh)
          tar -czf "$RUNNER_TEMP/jackioh.tgz" "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: selfplay-jackioh
          path: ${{ runner.temp }}/jackioh.tgz
          if-no-files-found: error
          retention-days: ${{ env.BUILD_RETENTION_DAYS }}

  # The shards (selfplay-shards.yml). One that does not finish costs the export its games, not the
  # rest of the export.
  shards:
    name: shards
    needs: [plan, build]
    uses: ./.github/workflows/selfplay-shards.yml
    with:
      ranges: ${{ needs.plan.outputs.ranges }}
      seed: ${{ inputs.seed }}
      retention: ${{ inputs.retention }}
      file_every: ${{ inputs.file_every }}
    secrets:
      STATS_IMPORT_DATABASE_URL: ${{ secrets.STATS_IMPORT_DATABASE_URL }}
      PRODUCTION_STATS_IMPORT_DATABASE_URL: ${{ secrets.PRODUCTION_STATS_IMPORT_DATABASE_URL }}

  count:
    name: count the export
    needs: [shards]
    # A caller may leave the counts to its own positions pass. It counts the shards that finished.
    if: ${{ !cancelled() && inputs.count && needs.shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: selfplay-jackioh
          path: ${{ runner.temp }}
      - name: unpack it
        run: tar -xzf "$RUNNER_TEMP/jackioh.tgz" -C "$RUNNER_TEMP"
      - uses: actions/download-artifact@v4
        with:
          pattern: selfplay-${{ inputs.seed }}-*
          path: ${{ runner.temp }}/export
      - name: positions, for the counts
        env:
          SEED: ${{ inputs.seed }}
        run: |
          cd "$RUNNER_TEMP"
          mapfile -t logs < <(find export -name 'selfplay-*.jsonl' | sort -V)
          "$RUNNER_TEMP/target/release/jackioh" positions "${logs[@]}" --out positions.jsonl > counts.json
          bytes=$(cat "${logs[@]}" | wc -c)
          python3 - "$SEED" "$bytes" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          seed, size = sys.argv[1], int(sys.argv[2])
          counts = json.load(open("counts.json"))["counts"]
          shards = []
          for path in sorted(glob.glob("export/*/timing.txt")):
              text = dict(line.split(": ") for line in open(path).read().split("\n") if ": " in line)
              shards.append((int(text["seconds"]), int(text["cores"])))
          slowest = max((s for s, _ in shards), default=0)
          # The shards play side by side, as many at once as selfplay-shards.yml's max-parallel lets
          # (10), so about the sum over that many. With fewer shards than that, the slowest.
          at_once = min(10, len(shards))
          elapsed = max(slowest, sum(s for s, _ in shards) / at_once) if shards else 0
          cpu_seconds = sum(s * c for s, c in shards)
          games = counts["games"]
          print(f"## Self-play export `{seed}`\n")
          print("| | |\n|---|---|")
          for key in ("games", "replayed", "positions", "notReplayed", "noResult", "earlierPatch", "unreadable"):
              print(f"| {key} | {counts[key]:,} |")
          print(f"| shards | {len(shards)} |")
          print(f"| slowest shard | {slowest / 3600:.2f} h |")
          if elapsed:
              print(f"| games an hour (all shards) | {games / elapsed * 3600:,.0f} |")
          if cpu_seconds and games:
              print(f"| vCPU-seconds a game | {cpu_seconds / games:.2f} |")
          print(f"| logs | {size / 1e6:,.1f} MB, {size / max(games, 1):,.0f} bytes a game |")
          PY
          cat counts.json
          rm -f positions.jsonl
