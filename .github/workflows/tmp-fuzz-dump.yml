# TEMPORARY (issue #4783), deleted before its pull request merges: the session building it cannot
# build Rust (its container's network policy denies crates.io). This replays the handicapped fuzz
# wave's seed 1461, whose I14 branch tripped I23 in the merge queue, with the fuzz loop patched in this
# job alone to dump the state the branch was taken from and the events of the listed play it reduced.
name: tmp fuzz dump

on:
  pull_request:
    paths: [".github/workflows/tmp-fuzz-dump.yml"]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: patch the fuzz loop to dump the failing branch
        run: |
          python3 - <<'EOF'
          p = 'crates/tools/src/fuzz.rs'
          t = open(p).read()
          b = "            broken.extend(monitor.listed(&state, probe));\n"
          assert t.count(b) == 1, 'listed anchor'
          dump = (
              "            if broken.iter().any(|f| f.contains(\"I23\")) {\n"
              "                std::fs::write(\"/tmp/dump-prev.json\", serde_json::to_string(&state).unwrap()).unwrap();\n"
              "                let body: ActionBody = serde_json::from_value(serde_json::json!({\"type\":\"play\",\"instanceId\":\"c147\",\"zone\":{\"row\":\"units\",\"lane\":5}})).unwrap();\n"
              "                let branch = reduce(&state, &Action::new(body, jackioh_engine::PlayerId::P1, \"dump\".to_string()));\n"
              "                std::fs::write(\"/tmp/dump-events.json\", serde_json::to_string(&branch.events).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-after.json\", serde_json::to_string(&branch.state).unwrap()).unwrap();\n"
              "                std::fs::write(\"/tmp/dump-action.json\", serde_json::to_string(&branch.error).unwrap()).unwrap();\n"
              "            }\n"
          )
          t = t.replace(b, b + dump)
          open(p, 'w').write(t)
          EOF
      - name: build
        run: cargo build --release -p jackioh-tools
      - name: replay handicapped seed 1461
        run: target/release/jackioh fuzz --handicap --from 1461 --seeds 1 2>&1 | grep -v "^\s*$" | grep -E "I23|failed|passed" || true
      - name: print the dump
        run: |
          for f in action events prev after; do
            echo "DUMP-$f-BEGIN"
            gzip -9c /tmp/dump-$f.json | base64 -w0
            echo
            echo "DUMP-$f-END"
          done
