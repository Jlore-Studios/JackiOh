# Starts every Claude subscription's 5-hour session at 06:00 America/Chicago and every four hours
# around it (02:00, 06:00, 10:00, 14:00, 18:00, 22:00; bot/go/internal/wake's WakeAt and Every),
# so each resets five hours later, rather than at whatever hour its next run lands. A session the
# bots' state files show running is left alone, and so is one whose usage limit refused a call or
# has a window full; each other one gets one turn of Haiku at low effort with no tools, skills or
# commands, the smallest call there is. A ping its limit refuses is reported, not failed.
#
# GitHub starts this repository's schedules late and drops some, so it fires every hour: a run
# within an hour before a wake time sleeps until it (`wake --wait`), one up to two hours after
# it wakes the sessions at once, and the rest find nothing to do. Later firings queue behind a
# sleeping run and stop once a run has finished green since that wake time. GitHub's cron is UTC;
# the hourly firing covers the wake times in both CDT and CST. Run it by hand with `now` to wake
# them at any hour.
#
# The accounts are every Claude subscription in either bot's pool (`wake --list`), so a new one is
# woken once its secret is in providers.SecretNames and in the list below, which
# bot/go/tests/workflows_test.go holds to it. Each subscription's turn runs in a job of its
# own, all at once, holding that one secret and no write token.
name: claude wake

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Wake the sessions at once, at any hour"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: claude-wake
  cancel-in-progress: false

jobs:
  clock:
    name: wait for the wake time
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read         # the state files on the bots' state branches
      actions: read          # whether an earlier run already woke today's sessions
    outputs:
      accounts: ${{ steps.list.outputs.accounts }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: The harness (bot/go)
        uses: ./.github/actions/harness

      - name: Sleep until the wake time
        id: wait
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOW: ${{ inputs.now }}
        run: |
          if [ "${NOW}" = "true" ]; then
            harness wake --wait --now
          else
            harness wake --wait
          fi

      # Which provider secrets exist, never their values (providers.SecretNames).
      - name: The sessions not running, the night bot's and Squishy's
        id: list
        if: steps.wait.outputs.go == 'true'
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_7' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_8 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_8' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
        run: |
          set -euo pipefail
          night="$(harness wake --list | tail -n 1)"
          squishy="$(HARNESS_HOME=.squishy harness wake --list | tail -n 1)"
          echo "accounts=$(jq -cn --argjson a "${night}" --argjson b "${squishy}" '$a + $b')" \
            >> "$GITHUB_OUTPUT"

  ping:
    name: wake ${{ matrix.account.id }}
    needs: clock
    if: needs.clock.outputs.accounts != '' && needs.clock.outputs.accounts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.clock.outputs.accounts) }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: The harness (bot/go)
        uses: ./.github/actions/harness

      - name: Install the claude CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: One turn of Haiku at low effort
        working-directory: bot
        env:
          HARNESS_HOME: ${{ matrix.account.home }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[matrix.account.secret] }}
          ACCOUNT: ${{ matrix.account.id }}
        run: harness wake --ping "${ACCOUNT}"
