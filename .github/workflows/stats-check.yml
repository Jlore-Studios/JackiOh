# Checks every three hours that both sites' /stats page loads its card statistics (#5174), with the check
# both deploys run (.github/actions/check-stats): the page's first read, `GET /api/stats/cards?mode=all`,
# must answer 200 with cards within the client's API_REQUEST_TIMEOUT_SECONDS. A site can break between
# deploys, because its statistics grow with every version the gather lane files into both databases.
# Production did on 2026-11-27, on a commit deployed the day before, and a person found it, as they found
# the two breaks before it (#5129). The deploy checks alone would not have caught it.
#
# While either site fails, one issue, CHECK_TITLE, is open for the night bot (`priority:high`), and each
# failing run comments on it. A run that loads both closes it. Staging's site is behind Cloudflare Access,
# which lets the check through with the service token deploy-staging.yml's live check uses
# (CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET). Without those secrets, staging is skipped with a notice.
# A run wakes a sleeping server as a visitor would, and the Worker's hourly cron wakes it anyway
# (wrangler.jsonc). It checks out only the action and the client's constant, and runs no code from a pull
# request.
name: stats check

on:
  schedule:
    - cron: "29 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stats-check
  cancel-in-progress: false

jobs:
  check:
    name: the card statistics load on both sites
    runs-on: ubuntu-latest
    # Two attempts of the client's 75 s on each of two sites, and the issue.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/check-stats
            apps/web/src/wire/serverConfig.ts
          sparse-checkout-cone-mode: false

      - name: production
        id: production
        continue-on-error: true
        uses: ./.github/actions/check-stats
        with:
          site: https://jackioh.com

      # A step's `if` cannot read secrets, so this one says whether the token is there.
      - name: whether Access will let staging's check through
        id: access
        env:
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$ACCESS_ID" ] && [ -n "$ACCESS_SECRET" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CF_ACCESS_CLIENT_ID or CF_ACCESS_CLIENT_SECRET is not set, so staging's statistics are not checked: Cloudflare Access refuses a request without a service token (docs/deploy-cloudflare.md)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: staging
        id: staging
        if: steps.access.outputs.set == 'true'
        continue-on-error: true
        uses: ./.github/actions/check-stats
        with:
          site: https://staging.jackioh.com
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRODUCTION: ${{ steps.production.outcome }}
          STAGING: ${{ steps.staging.outcome }}
          CHECK_TITLE: "CI: the card statistics do not load"
          # Who fixes it: the night bot (.harness/config.json's bot_login) and its queue label.
          BOT_LOGIN: jgoetzmann-bot
          BOT_QUEUE: "bot:build"
        run: |
          set -euo pipefail
          export TITLE=$CHECK_TITLE
          open=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          failing=""
          if [ "$PRODUCTION" = failure ]; then failing="production (https://jackioh.com)"; fi
          if [ "$STAGING" = failure ]; then failing="${failing:+$failing and }staging (https://staging.jackioh.com)"; fi
          if [ -z "$failing" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" --reason completed --comment "[This run]($RUN_URL) loaded the card statistics on every site it checked (production: $PRODUCTION, staging: ${STAGING:-skipped})."
              echo "closed #$open"
            fi
            exit 0
          fi
          body=$(printf '%s\n' \
            "[stats-check run]($RUN_URL): the card statistics did not load on $failing. \`GET /api/stats/cards?mode=all\`, the /stats page's first read, did not answer 200 with cards within the client's \`API_REQUEST_TIMEOUT_SECONDS\` in two attempts, so players see \"The card statistics didn't load.\" The run's log has each attempt's status and time." \
            "" \
            "Night bot: this is yours, and it comes first (\`priority:high\`). The causes so far: the server killed while loading the statistics (exit 137), and a load that outgrew the client's timeout as the statistics grew (#5129, #5174). Production serves the commit the production issue names, which can predate a fix on \`main\`. If the fix is on \`main\` already, moving production is a person's call (\`/promote\` on the production issue), so say so. Anything else outside your reach (a secret, Cloudflare's or Access's settings, the Workers logs) is a person's: say exactly what they must do. A run that loads both sites closes this." \
            "" \
            "---" \
            "_Posted by \`.github/workflows/stats-check.yml\`._")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
            [ "$(gh issue view "$open" --repo "$REPO" --json assignees --jq '.assignees | length')" = 0 ] || exit 0
            number=$open
          else
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$body")
            echo "opened $url"
            number=${url##*/}
          fi
          gh issue edit "$number" --repo "$REPO" --add-assignee "$BOT_LOGIN" --add-label "$BOT_QUEUE" \
            --add-label "priority:high" --add-label "difficulty:hard" \
            && echo "handed #$number to @$BOT_LOGIN, high priority" \
            || echo "::warning::could not hand #$number to @$BOT_LOGIN"
