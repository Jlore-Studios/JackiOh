# The pinned "Night bot status" issue (bot/go/internal/dashboard, #148), rewritten every five
# minutes, with its statistics (bot/go/internal/stats) counted afresh every 30 minutes and kept in
# the issue between counts. (They had an issue of their own, #190, until they were folded in.)
#
# GitHub fires this repository's schedules late and rarely (the ten-minute sweep has gone hours
# between runs), so a schedule alone cannot keep the issue current. Instead one job loops: it
# rewrites the issue every five minutes for five and a half hours, inside the six-hour cap, then
# starts the next loop itself (a workflow_dispatch from the job's own token does start a run).
# A tick costs a few dozen GitHub calls (a count of the statistics, a few hundred, comes only
# every 30 minutes), and the loop's one runner is busy either way, so five minutes costs no
# more runner time than ten.
# Between the rewrites the loop redraws the issue's runners section alone every two minutes
# (`dashboard.RefreshRunners`): what every runner is doing, read from the runs going and queued
# and their jobs. It costs a few calls and one a run, and a run's jobs read again unchanged cost no
# rate limit (a conditional request, `gh.Cached`).
# The hourly schedule only restarts the loop if it ever stops; the concurrency group keeps one
# loop going and at most one waiting. Each tick also runs the sweep (bot-commands' scheduled job,
# which GitHub fires as late), so when the bot's chain of runs breaks, the next night run starts
# within five minutes, not hours. Each tick also settles the issue about the bot machine's disk
# (bot/go/internal/disk): open while the disk is filling up, closed once it is not.
# With the config's `controller` on (#1455), each tick's sweep also plans the night bot's work and
# starts each bot-night run with its plan made (`--controller`, bot/go/internal/controller), so a run
# waits in GitHub's queue once, for its model job, not for a gate and a plan job first; while this
# loop goes, nothing else plans (bot-night's gate defers to it, and the planning lock holds the
# rest). The loop also delivers those runs once they end (#1537): bot-night gives them no deliver
# job, so each tick, before it plans, the sweep downloads a finished run's `work` upload, clones the
# default branch into RUNNER_TEMP and delivers it as deliver did (`controller.Deliver`). That needs
# this job's write grants: the plans go on the state branch, the runs start from its token, and a
# delivery pushes the branch and opens or updates the pull request with the bot's.
# Each tick also runs Squishy (#60) in a process of its own (`--companions`): its sweep, with
# Squishy's token, and its section of the status issue, which sits apart from the night bot's.
# It holds no model secret and runs no model. Cancelling a run by hand stops the loop until the
# next schedule; disable the workflow to stop it for good.
name: bot-status

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: bot-status
  cancel-in-progress: false

env:
  EVERY_SECONDS: "300"
  RUNNERS_EVERY_SECONDS: "120"
  LOOP_SECONDS: "19800"

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write        # the state file on bot-state keeps the issue's number; a delivery's push
      issues: write          # the status issue, and the queue it reads and the sweep labels
      pull-requests: write   # the sweep answers and labels pull requests
      actions: write         # whether runs are alive; start a night run and the next loop; a run's upload
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - uses: ./.github/actions/harness

      - name: Sweep and rewrite the status issue every five minutes, its runners every two
        working-directory: bot
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          # Squishy's own token, for its sweep (`config.CompanionEnv`); the night bot's
          # process never writes with it.
          SQUISHY_GITHUB_TOKEN: ${{ secrets.SQUISHY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # The gist the owner's PC writes its heartbeat to, which its supervisor names here
          # (bot/machine/README.md, The local runner): the runners section reads it.
          JACKIOH_PC_GIST: ${{ vars.JACKIOH_PC_GIST }}
          # Which provider secrets exist, never their values: the issue says when one is unset.
          HARNESS_SECRETS_SET: >-
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'CLAUDE_CODE_OAUTH_TOKEN' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_2' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_3' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_4' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_5' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_6' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_7' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_8 != '' && 'CLAUDE_CODE_OAUTH_TOKEN_8' || '' }}
            ${{ secrets.CODEX_AUTH_JSON != '' && 'CODEX_AUTH_JSON' || '' }}
            ${{ secrets.MUSE_AUTH != '' && 'MUSE_AUTH' || '' }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SQUISHY != '' && 'CLAUDE_CODE_OAUTH_TOKEN_SQUISHY' || '' }}
        run: |
          harness dashboard --sweep --stats --companions --controller \
            --every "${EVERY_SECONDS}" --runners-every "${RUNNERS_EVERY_SECONDS}" \
            --for "${LOOP_SECONDS}"

      # Not after a cancellation, so a person can stop the loop.
      - name: Start the next loop
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: gh workflow run bot-status.yml --repo "${REPO}" --ref "${REF}"
