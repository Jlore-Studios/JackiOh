# Refreshes the win rates of record, once per patch (R3882000, issue #3882): the frozen per-version
# figures the tier pools (S #109 xxFreshJack, S+ #95 JC Backed, #96 Open Enrollment, #97 Selective
# Enrollment) and S+ #164 KPIs read (R3538000, R3538001). Each day it reads production's windowed
# card figures, each card over its own window as /api/stats/cards counts them, from the totals
# (`jackioh-server stats-cards --window --json`, R1367000; the records' detail is purged after a
# week, so an export of the records would undercount), and runs `cargo jackioh winrates --refresh`
# over them.
#
# The refresh writes only when it is due: the report is at the newest shipped version, no pending
# fragment carries win rates of record, and no version of the patch window (the X a major or a patch
# opens) shipped any. It then writes a pending fragment carrying the table (`records`) and claiming
# through `plays` every card whose script reads the record, which this opens as a pull request that
# merges itself once CI passes. patches-ship.yml then ships it as a micro and freezes the table as
# crates/cards/patches/records/<version>.json, so the refresh is never due twice in one X. When no
# refresh is due, the refresh says why and this opens nothing. One refresh is open at a time. M #50
# CN Tech and M+ #2 NA Tech never read this table: they read each game's snapshot (R3049000).
#
# It reads production through STATS_DATABASE_URL, the read-only connection string to
# JackiOh-Production's session pooler (db-size.yml reads it too; docs/repository-secrets.md). With
# no secret set it says so and stops, green. The pull request is pushed and opened with
# BOT_GITHUB_TOKEN, as patches-ship.yml's are, because one opened with GITHUB_TOKEN starts no
# workflow and the required checks would never report. From #3049 to #3882 the command it called
# did not exist, so every run failed at the refresh step.
name: winrates refresh

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: winrates-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: refresh the win-rate table when it is due
    runs-on: ubuntu-latest
    # Two release builds (the server's and the CLI's) on a warm dependency cache, then one read.
    timeout-minutes: 30
    steps:
      - id: db
        name: the stats database
        env:
          STATS_DATABASE_URL: ${{ secrets.STATS_DATABASE_URL }}
        run: |
          if [ -z "$STATS_DATABASE_URL" ]; then
            echo "::notice::STATS_DATABASE_URL is not set, so no refresh: a person adds a read-only connection string under Settings -> Secrets and variables -> Actions."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.db.outputs.set == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - if: ${{ steps.db.outputs.set == 'true' }}
        uses: ./.github/actions/setup
        with:
          node: "false"

      - id: open
        name: a refresh already open
        if: ${{ steps.db.outputs.set == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --base main --json url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("winrates/refresh-")) | .url][0] // empty')
          if [ -n "$open" ]; then
            echo "A refresh is already open: $open"
          fi
          echo "url=$open" >> "$GITHUB_OUTPUT"

      - name: the windowed card figures
        if: ${{ steps.db.outputs.set == 'true' && steps.open.outputs.url == '' }}
        env:
          DATABASE_URL: ${{ secrets.STATS_DATABASE_URL }}
        run: cargo run --release -q -p jackioh-server -- stats-cards --window --json > "$RUNNER_TEMP/window.json"

      - name: refresh, when it is due
        if: ${{ steps.db.outputs.set == 'true' && steps.open.outputs.url == '' }}
        shell: bash
        run: cargo jackioh winrates --refresh "$RUNNER_TEMP/window.json" | tee "$RUNNER_TEMP/refresh.log"

      - name: open the refresh pull request
        if: ${{ steps.db.outputs.set == 'true' && steps.open.outputs.url == '' }}
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No refresh is due; nothing to open."
            exit 0
          fi
          head=$(git rev-parse HEAD)
          branch="winrates/refresh-$(git rev-parse --short HEAD)"
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          title="Patch: the tier cards and KPIs read the newest win rates"

          git checkout -b "$branch"
          git add -A
          git -c user.name="$login" -c user.email="$id+$login@users.noreply.github.com" \
            commit -q -m "$title" -m "The win rates of record from production's windowed figures, due once per patch (R3882000)."
          git push -u origin "$branch"

          body=$(printf '%s\n' \
            "Refreshes the win rates of record from production's windowed figures on main at $head (R3882000): no version of the newest patch's window has shipped any yet." \
            "" \
            '```' \
            "$(cat "$RUNNER_TEMP/refresh.log")" \
            '```' \
            "" \
            "Its fragment carries the table and claims the cards that read it, so it ships as a micro and \`patches ship\` freezes it as \`crates/cards/patches/records/<version>.json\`. Opened by \`.github/workflows/winrates-refresh.yml\`; it merges itself once CI passes.")
          url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body")
          gh pr merge "$url" --auto --squash
          echo "### $title" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
