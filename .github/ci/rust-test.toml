# ci.yml's `rust-test` groups, one `[[group]]` each: `.github/ci/matrix.py` expands them into the job's
# matrix in the `changes` job (#3072). A group's `test` is what its `cargo test` step runs, `doc` its
# doc tests, `scope` its scripts/ci-scope.sh line (`rust_<scope>`) and `cache` its Rust cache's key.
# `binaries` lists every test binary of a crate split by binary, the crate first, checked against
# Cargo so a new one cannot go unrun; the last group takes every crate no other group names, so a new
# crate cannot either.
#
# Two things here may grow without an edit to this file, which only people change (the night bot may
# not touch .github/):
#
# - `tests`, a pattern of the test targets `manifest` declares (`[[test]]`): the group runs once per
#   target that matches, `{test}` in `test` the target's name, in the order the manifest declares
#   them. A target `rules_2` of the pattern `rules*` is the job `engine rules 2`: the group's name
#   with what follows the pattern's prefix, its underscores spaces. A pattern in `binaries` expands
#   to the same targets, so the check still names every binary.
# - Its shard count, in scripts/ci-shards.toml: a group with a count K above 1 runs as K jobs,
#   `<group> k/K`, each running the tests whose names hash to it (`matrix.py shard`), every test in
#   exactly one shard for any K. Each shard compiles the group's binaries again, so a count splits
#   the run, not the compile: a group slow to compile needs its tests in more binaries instead (a new
#   target that its `tests` pattern matches runs in a job of its own by itself). The doc tests, the
#   binaries check and the Luau module's check run in shard 1.
#
# One job compiling the whole workspace took 14 minutes, nearly all of it compiling, so each group
# compiles only its own crates and what they build on (the engine and the cards at opt-level 2,
# about two minutes in every group but `engine`, which builds them at 0, and the `engine rules` and
# `cards lib` groups), side by side. The engine and the cards each split further, by test binary:
# the rule tests (in three, #2090, #2957), the engine's unit tests and the cards' unit tests (one per
# card) each take two to three minutes to compile at opt-level 2 on their own, and the golden replay
# runs apart from the engine's unit tests (#1608). So does the AI, whose tests take minutes to play
# their games rather than to compile; the server and the tools split by test name instead, each
# group running what its filters pick.
#
# The engine's two features: testkit, which its `rules` binaries require, and ts, whose
# export_bindings tests (in its unit tests) write apps/web/src/wire/generated/ (SURFACE §5.1); the
# engine's and the server's export_config tests write engineConfig.ts and serverConfig.ts. What a
# group wrote must be what is committed (V20), so every group checks. The same holds for the card
# scripts' typed module (#442 L10), which the group with `luau` (the one that runs crates/luau's
# tests) checks once it exists.
#
# Each `--config` stays one word: the `cargo test` step splits `test` and `doc` on spaces.

# The engine's rule tests, one binary per job (#2090, #2957): `rules`, the modules of tests/rules/
# from `a` to `o`, `rules_2` those from `p` to `r`, whose replays take the longest to run, and
# `rules_3` the rest. As one binary at Cargo.toml's opt-level 2 they took the job past seven minutes,
# five of them compiling the engine, the cards and then that binary, one after another, and
# `rules_2` alone, then holding `p` to `z`, took it to 7m 17s again (#2957). Here the engine is at
# opt-level 1 and the cards at 0 (of the rule tests only rule_benders runs a real card): on four
# cores `rules` compiles in about 175 s and runs in 20. Without ts, which nothing in them reads:
# ts-rs's derives only add to the compile. A fourth binary, `rules_4`, is the job `engine rules 4`.
[[group]]
group = "engine rules"
scope = "engine_rules"
cache = "engine-rules"
manifest = "crates/engine/Cargo.toml"
tests = "rules*"
test = "-p jackioh-engine --features jackioh-engine/testkit --test {test} --config profile.test.package.jackioh-engine.opt-level=1 --config profile.test.package.jackioh-cards.opt-level=0"

# The engine's unit tests (with ts, whose export_bindings tests write wire/generated/), its constants
# export and its doc tests, with the engine and the cards at opt-level 0 (#1608). The unit-test
# binary links the cards, a dev-dependency, so it waits for them: at Cargo.toml's opt-level 2 the
# engine, the cards and that binary took about 240 s to compile one after another, and at 0 they
# take about 85 s, the 444 tests running in under a second. `doc` carries the same flags, or it
# compiles both crates again at 2.
[[group]]
group = "engine"
scope = "engine"
cache = "engine"
manifest = "crates/engine/Cargo.toml"
test = "-p jackioh-engine --features jackioh-engine/testkit,jackioh-engine/ts --lib --test export_config --config profile.test.package.jackioh-engine.opt-level=0 --config profile.test.package.jackioh-cards.opt-level=0"
doc = "-p jackioh-engine --features jackioh-engine/testkit,jackioh-engine/ts --config profile.test.package.jackioh-engine.opt-level=0 --config profile.test.package.jackioh-cards.opt-level=0"
binaries = "jackioh-engine export_config golden rules*"

# The golden replay (§13) at Cargo.toml's opt-level 2, where its 240 games take under 20 s (over two
# minutes at 0), and without ts, which it never reads. Everything it reads turns `rust_engine` on, so
# it runs on that line; it builds on the dependencies `engine rules` does, so it shares that cache,
# as `ai slow` shares `ai`'s (#1608).
[[group]]
group = "engine golden"
scope = "engine"
cache = "engine-rules"
test = "-p jackioh-engine --features jackioh-engine/testkit --test golden"

# Every card's tests, ported from TypeScript (V5), and the cross-card tests. The cards' unit tests
# (one module per card, 8,133 tests) took the job past seven minutes at Cargo.toml's opt-level 2
# (#2353), nearly all of it compiling: on four cores the engine in about 85 s, then that binary in
# 275, the tests running in 8. Here the engine is at opt-level 1 and the cards at 0, as in
# `engine rules`: the engine compiles in about 70 s, the binary in 75 and the tests run in 13 (with
# the engine at 0 too, 30 s less compiling and 57 s of tests).
[[group]]
group = "cards lib"
scope = "cards_lib"
cache = "cards-lib"
test = "-p jackioh-cards --lib --config profile.test.package.jackioh-engine.opt-level=1 --config profile.test.package.jackioh-cards.opt-level=0"

[[group]]
group = "cards"
scope = "cards"
cache = "cards"
test = "-p jackioh-cards --test cards"
doc = "-p jackioh-cards"
binaries = "jackioh-cards cards"

# The server's tests in four groups by test name, all on the `rust_server` line and sharing one
# cache, as `ai slow` shares `ai`'s: in one group they took the job past seven minutes, over three of
# them compiling and three and a half running (#2223). `server` runs every test whose path holds no
# `api::`, `server api` the API's but the practice claims', and the two `server practice` groups
# those, the ones named for a ruling (`api::practice::r`) apart from the rest: each claim has the
# server re-run a whole practice game's AI. Only the lib and the `server` binary hold `api::` tests,
# and only `server` holds `api::practice::` ones (crates/server/README.md), so a test elsewhere whose
# path held either would run in no group: name none so. `server` and `server api` build the engine
# and the cards at opt-level 1, as `engine rules` does: their tests play few games, and at 2 they
# compiled 14 s longer and ran no faster.
[[group]]
group = "server"
scope = "server"
cache = "server"
test = "-p jackioh-server --config profile.test.package.jackioh-engine.opt-level=1 --config profile.test.package.jackioh-cards.opt-level=1 -- --skip api::"

[[group]]
group = "server api"
scope = "server"
cache = "server"
test = "-p jackioh-server --lib --test server --config profile.test.package.jackioh-engine.opt-level=1 --config profile.test.package.jackioh-cards.opt-level=1 -- api:: --skip api::practice::"

[[group]]
group = "server practice"
scope = "server"
cache = "server"
test = "-p jackioh-server --test server -- api::practice:: --skip api::practice::r"

[[group]]
group = "server practice rulings"
scope = "server"
cache = "server"
test = "-p jackioh-server --test server -- api::practice::r"

# The AI's integration tests in two binaries (#873): `ai`, and the modules that play the most games
# at AI_GATE_BUDGET, in `ai_slow`, whose many-game sweeps run daily (`#[ignore]`, super.yml's `daily
# tests`). One cache: the two compile the same crates.
[[group]]
group = "ai"
scope = "ai"
cache = "ai"
test = "-p jackioh-ai --lib --test ai"
doc = "-p jackioh-ai"
binaries = "jackioh-ai ai ai_slow"

[[group]]
group = "ai slow"
scope = "ai_slow"
cache = "ai"
test = "-p jackioh-ai --test ai_slow"

# The Luau host's tests, with its `ts` feature on so that `export_api` writes the card scripts' typed
# module, which the group's last step holds to what is committed. In `tools, wasm` that second
# compile of the engine and the cards, with `ts`, ran after the group's own and took the job past
# seven minutes (#959).
[[group]]
group = "luau"
scope = "luau"
cache = "luau"
test = "-p jackioh-luau --features ts"
luau = true

# The tools' unit tests, the `jackioh` binary's (about 160 s of games on four threads), in three
# groups by test name, all on the `rust_tools_wasm` line and sharing one cache, as `ai slow` shares
# `ai`'s: in one group they took the job past seven minutes (#1929). A name filter matches anywhere
# in a test's path, so `tools, wasm` skips exactly what the other two run (`fuzz::` matches
# `duos_fuzz::` too). Those two run the binary alone, so a test elsewhere (an integration test, a doc
# test) whose path held `fuzz::`, `selfplay::` or `positions::` would run in no group: name none so.
# No card script is Luau, so only `tools, wasm`'s few custom-card tests reach the Luau host, and each
# group builds jackioh-luau at opt-level 0 (about 25 s less compiling; mlua stays at Cargo.toml's 2).
[[group]]
group = "tools fuzz"
scope = "tools_wasm"
cache = "tools-wasm"
test = "-p jackioh-tools --bin jackioh --config profile.test.package.jackioh-luau.opt-level=0 -- fuzz:: positions:: --skip duos_fuzz::"

[[group]]
group = "tools duos, selfplay"
scope = "tools_wasm"
cache = "tools-wasm"
test = "-p jackioh-tools --bin jackioh --config profile.test.package.jackioh-luau.opt-level=0 -- duos_fuzz:: selfplay::"

[[group]]
group = "tools, wasm"
scope = "tools_wasm"
cache = "tools-wasm"
test = "--workspace --exclude jackioh-engine --exclude jackioh-cards --exclude jackioh-server --exclude jackioh-ai --exclude jackioh-luau --config profile.test.package.jackioh-luau.opt-level=0 -- --skip fuzz:: --skip selfplay:: --skip positions::"
