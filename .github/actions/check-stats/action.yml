# Asks a deployed site for its card statistics as the /stats page's first read does (#5174): `GET
# /api/stats/cards?mode=all` (apps/web/src/routes/stats.tsx, DEFAULT_MODE) must answer 200 with cards
# within the client's API_REQUEST_TIMEOUT_SECONDS, read from the client's own copy
# (apps/web/src/wire/serverConfig.ts, generated from crates/server/src/config.rs) so the two never part.
# Past that the client gives up and the page says "The card statistics didn't load."
#
# A first attempt that fails is a warning, and the second is the verdict, as a person who presses Retry
# sees it. The first request after the server wakes can wait on a statistics load already under way at
# boot (the bot pool's refresh, R3049002), so a slow first answer followed by a quick second is the server
# warming. Two failures in a row mean the page is broken.
#
# deploy-staging.yml and promote-production.yml run it once their server reports the deployed commit,
# while the deploy has the container awake, so the check wakes nothing and adds no container time (no
# schedule runs it for that reason; staging redeploys whenever main has moved, as often as every two
# hours). Staging's site is behind Cloudflare Access, which lets a request through with an Access service
# token's two headers. A refusal from Access fails at once.
#
# Between two attempts it follows a load the server reports (`GET /api/stats/loading`, R5186000) for up to
# LOAD_WAIT_SECONDS, as the page does behind its progress bar: the load runs on a task of its own, so the
# next attempt finds the statistics it made rather than waiting on a load begun again. Only the server's
# own answer that nothing is loading ends that wait early. Cloudflare rolls the container to the new image
# a little after `wrangler deploy`, and the server on the old one, started under the new Worker, already
# reports the deployed commit: on 2026-11-28 (deploy-staging run 46126109815) the first attempt reached it
# as it drained, the probe's plain 500 from the Worker was read as "not loading", and the second attempt
# then waited on the new server's first load. An ask with no JSON answer is waited out instead. Nor is
# "not loading" alone the end: deploy-staging run 46133467395's first attempt got the Worker's 500 from a
# server still starting, so nothing had asked for the statistics, and the probe's `{"loading": false}`
# from the fresh server sent the second attempt into its first load. The wait ends on a load that
# finished (`expected_ms`, R5186000); while a server has none under way and none finished, it asks for
# the statistics, letting go after KICK_SECONDS, so a load starts.
#
# GitHub runs a composite step's `shell: bash` with `-e`, so each command whose failure the script reads
# itself sits in an `if` or ends in `|| true`: a request curl itself gave up on (a timeout, a connection
# the site closed) is an attempt that failed, not the end of the step. Until 2026-11-27 such a request
# ended the step at once with no message, and so did any failed attempt curl wrote no error for, on the
# first attempt each time (deploy-staging run 46066268550).
name: check the card statistics load
description: GET a site's /api/stats/cards?mode=all and fail unless it answers 200 with cards within the client's timeout
inputs:
  site:
    description: the site's base URL, which sends /api/* to its server
    required: true
  access-client-id:
    description: an Access service token's client id, for a site behind Cloudflare Access; empty sends none
    required: false
    default: ""
  access-client-secret:
    description: that service token's client secret
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SITE: ${{ inputs.site }}
        ACCESS_ID: ${{ inputs.access-client-id }}
        ACCESS_SECRET: ${{ inputs.access-client-secret }}
        CONFIG: apps/web/src/wire/serverConfig.ts
        # The Cards tab's first read, on the page's default match type.
        STATS_PATH: /api/stats/cards?mode=all
        ATTEMPTS: "2"
        # Between two attempts.
        PAUSE_SECONDS: "5"
        # R5186000: what the server's load of the statistics is doing, which the check follows between
        # attempts for up to LOAD_WAIT_SECONDS, asking every LOAD_POLL_SECONDS.
        LOADING_PATH: /api/stats/loading
        LOAD_WAIT_SECONDS: "600"
        LOAD_POLL_SECONDS: "10"
        # How long the ask that starts a load on a server that has loaded nothing waits before letting go.
        KICK_SECONDS: "5"
      run: |
        set -uo pipefail
        timeout=$(sed -nE 's/^export const API_REQUEST_TIMEOUT_SECONDS = ([0-9_]+);.*/\1/p' "$CONFIG" | tr -d _) || true
        if [ -z "$timeout" ]; then
          echo "::error::API_REQUEST_TIMEOUT_SECONDS is not in $CONFIG, so the check cannot hold the server to the client's timeout"
          exit 1
        fi
        access=()
        if [ -n "$ACCESS_ID" ]; then
          access=(-H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET")
        fi
        body=$(mktemp)
        errors=$(mktemp)
        seen=""
        for attempt in $(seq 1 "$ATTEMPTS"); do
          : > "$body"
          : > "$errors"
          # curl writes its -w line (status 000) even for a request it gave up on, and exits non-zero.
          out=$(curl -sS -m "$timeout" -o "$body" -w '%{http_code} %{time_total}' "${access[@]}" "$SITE$STATS_PATH" 2> "$errors") || true
          status=${out%% *}
          seconds=${out##* }
          cards=$(jq -r 'if (.cards | type) == "array" then (.cards | length) else "no cards list" end' "$body" 2> /dev/null || echo "no JSON")
          cards=${cards:-no body}
          if [ "$status" = 200 ] && [[ $cards =~ ^[0-9]+$ ]] && [ "$cards" -gt 0 ]; then
            echo "$SITE$STATS_PATH: $cards cards in ${seconds}s (attempt $attempt of $ATTEMPTS)"
            echo "$SITE: the card statistics loaded in ${seconds}s (attempt $attempt of $ATTEMPTS)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case $status in
            301 | 302 | 303 | 307 | 401 | 403)
              if [ "${#access[@]}" -gt 0 ]; then
                echo "::error::$SITE$STATS_PATH answered $status: Cloudflare Access did not accept the service token (CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET, docs/deploy-cloudflare.md)."
                exit 1
              fi
              ;;
          esac
          detail=""
          if [ -s "$errors" ]; then
            detail="; $(head -c 300 "$errors")"
          fi
          seen="HTTP ${status:-000} after ${seconds:-?}s, $cards$detail"
          echo "::warning::$SITE$STATS_PATH, attempt $attempt of $ATTEMPTS: $seen"
          [ "$attempt" = "$ATTEMPTS" ] && break
          # Only the server's own "not loading" ends the wait. No answer, or one that is not its JSON, is a
          # server restarting (a rollout's old container draining, the new one booting) or too busy to say,
          # and is waited out like a load: the time counts by the clock, since one ask can take $timeout.
          started=$SECONDS
          while :; do
            waited=$(( SECONDS - started ))
            [ "$waited" -lt "$LOAD_WAIT_SECONDS" ] || break
            : > "$body"
            code=$(curl -sS -m "$timeout" -o "$body" -w '%{http_code}' "${access[@]}" "$SITE$LOADING_PATH" 2> /dev/null) || true
            # `done` is a load that finished since the server started (its `expected_ms`); `idle` is none
            # under way and none finished, as on a server that has just started.
            loading=$(jq -r 'if type != "object" or (has("loading") | not) then "unsaid"
              elif .loading then "true" elif .expected_ms != null then "done" else "idle" end' "$body" 2> /dev/null) || loading=unsaid
            if [ "$code" = 200 ] && [ "$loading" = done ]; then
              break
            elif [ "$code" = 200 ] && [ "$loading" = idle ]; then
              # Nothing has asked this server for the statistics yet (the attempt before reached one still
              # starting), so ask now and let go: the load runs on a task of its own and outlives the ask.
              curl -sS -m "$KICK_SECONDS" -o /dev/null "${access[@]}" "$SITE$STATS_PATH" 2> /dev/null || true
              echo "$SITE: the server has not loaded the card statistics since it started, so the check asked it to; ${waited}s waited of ${LOAD_WAIT_SECONDS}s"
            elif [ "$code" = 200 ] && [ "$loading" = true ]; then
              echo "$SITE: the card statistics are still loading, ${waited}s waited of ${LOAD_WAIT_SECONDS}s"
            else
              # A server without the route, or Access turning the ask away, says nothing more by waiting.
              case $code in
                404 | 301 | 302 | 303 | 307 | 401 | 403) break ;;
              esac
              echo "$SITE: the server did not say whether the card statistics are loading (HTTP ${code:-000}), so it may be restarting; ${waited}s waited of ${LOAD_WAIT_SECONDS}s"
            fi
            sleep "$LOAD_POLL_SECONDS"
          done
          sleep "$PAUSE_SECONDS"
        done
        echo "::error::$SITE$STATS_PATH did not answer 200 with cards within ${timeout}s (API_REQUEST_TIMEOUT_SECONDS) in $ATTEMPTS attempts; last: $seen. Players see \"The card statistics didn't load.\" (#5174)"
        echo "$SITE: the card statistics did not load in $ATTEMPTS attempts; last: $seen" >> "$GITHUB_STEP_SUMMARY"
        exit 1
