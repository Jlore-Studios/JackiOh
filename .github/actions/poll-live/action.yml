# Waits for a deploy to reach its server: polls the site's GET /api/catalog (R163) until the server
# answers that it runs `commit` (its `x-deployed-commit` header, the DEPLOYED_COMMIT the Worker hands
# the container, crates/server/src/api/catalog.rs) or `seconds` pass, and fails then, saying what it
# last saw. promote-production.yml's deploy job and deploy-staging.yml run it after `wrangler deploy`.
#
# The first request after a deploy starts the container on the new image, once the Worker has drained
# a server still on the old one (apps/edge/src/index.ts), so an answer can take a minute or two.
# Staging's site is behind Cloudflare Access, which lets a request through with an Access service
# token's two headers; a refusal from Access fails at once rather than waiting out the time.
name: wait for the live server
description: Poll a site's /api/catalog until its server reports running the given commit
inputs:
  site:
    description: the site's base URL, which sends /api/* to its server
    required: true
  commit:
    description: the full git SHA the server must report running
    required: true
  seconds:
    description: how long to wait before failing
    required: true
  access-client-id:
    description: an Access service token's client id, for a site behind Cloudflare Access; empty sends none
    required: false
    default: ""
  access-client-secret:
    description: that service token's client secret
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SITE: ${{ inputs.site }}
        COMMIT: ${{ inputs.commit }}
        WAIT_SECONDS: ${{ inputs.seconds }}
        ACCESS_ID: ${{ inputs.access-client-id }}
        ACCESS_SECRET: ${{ inputs.access-client-secret }}
        # One request's limit: the one that starts the container waits for it to listen.
        REQUEST_SECONDS: "120"
        # Between two requests.
        POLL_SECONDS: "15"
      run: |
        deadline=$(( $(date +%s) + WAIT_SECONDS ))
        want=$(printf '%s' "$COMMIT" | tr 'A-F' 'a-f')
        headers=$(mktemp)
        body=$(mktemp)
        access=()
        if [ -n "$ACCESS_ID" ]; then
          access=(-H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET")
        fi
        seen="no answer"
        while [ "$(date +%s)" -lt "$deadline" ]; do
          : > "$headers"
          : > "$body"
          status=$(curl -sS -m "$REQUEST_SECONDS" -D "$headers" -o "$body" -w '%{http_code}' "${access[@]}" "$SITE/api/catalog" 2>/dev/null || true)
          reported=$(tr -d '\r' < "$headers" | awk -F': *' 'tolower($1) == "x-deployed-commit" { print tolower($2); exit }')
          case $status in
            200)
              version=$(jq -r '.version // "(no version)"' "$body" 2>/dev/null || echo "(not JSON)")
              seen="catalog $version on commit ${reported:-(none reported)}"
              if [ "$reported" = "$want" ]; then
                echo "$SITE serves $seen"
                exit 0
              fi
              ;;
            301 | 302 | 303 | 307 | 401 | 403)
              # Access sends a request it does not let through to its sign-in page, or refuses it.
              if [ "${#access[@]}" -gt 0 ]; then
                echo "::error::$SITE/api/catalog answered $status: Cloudflare Access did not accept the service token (CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET, docs/deploy-cloudflare.md)."
                exit 1
              fi
              seen="HTTP $status"
              ;;
            *) seen="HTTP ${status:-000}" ;;
          esac
          echo "$(date -u +%H:%M:%S) $SITE: $seen; waiting for commit $want"
          sleep "$POLL_SECONDS"
        done
        echo "::error::$SITE did not report running $want within $WAIT_SECONDS seconds; it last answered $seen."
        exit 1
