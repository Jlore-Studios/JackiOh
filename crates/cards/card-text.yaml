    radiant: "活化，易碎4\n你的对手每打出{plays}张牌，将最后一张牌的一张光辉复制融合进这张牌，并获得+{brittleGain}易碎。"
    previews:
      your opponent plays: 你的对手每打出{plays}张牌
classicplus-075: # J-lease J-Jungle EX-plorer
