  flavour: Rosemary, sea salt, and the quiet return of your second wind.
  voice:
    cast: Crunchy, herby, and oddly energizing.
  zh:
    name: 迷迭香饼干
    base: 复原{refresh}点法力值。
    radiant: 复原{refresh}点法力值。
stinkyscape-009: # Ticketed
  flavour: Parked in the wrong zone? It sits in the impound lot until the ticket clears.
  voice:
    cast: You're parked illegally. Ticket issued.
  zh:
    name: 罚单
    base: "易碎3\n战吼：将另一个永久物置于这张牌之下。\n当这张牌离开场上时，被置于其下的永久物回到其控制者一方。"
    radiant: "战吼：将另一个永久物置于这张牌之下。\n当这张牌离开场上时，被置于其下的永久物回到其控制者一方。"
    previews:
      the permanent beneath it: 被置于其下的永久物
stinkyscape-010: # Otherworldly Endurance
  flavour: Three prayers from a faith nobody here has heard of.
  voice:
    cast: Borrowed blessings from somewhere far away.
  zh:
    name: 异界坚韧
    base: 将一张心灵之火、一张神圣之灵和一张真言术·盾置入你的手牌。
    radiant: 将一张光辉心灵之火、一张光辉神圣之灵和一张光辉真言术·盾置入你的手牌。
stinkyscape-010-1: # Inner Fire
  flavour: Strength measured by how much you can take. Simple theology.
  voice:
    cast: Let your spirit burn within.
  zh:
    name: 心灵之火
    base: 使一个单位的攻击力等同于其生命值。
    radiant: 使一个单位的攻击力等同于其生命值；若它是你的单位则再加{shift}，若它是敌方单位则减{shift}。
stinkyscape-010-2: # Divine Spirit
  flavour: Twice the faith, twice the flesh. Thrice, on a good day.
  voice:
    cast: Be made whole, and then some.
  zh:
    name: 神圣之灵
    base: 使一个单位的生命值翻倍。
    radiant: 使一个单位的生命值变为三倍。
stinkyscape-010-3: # Power Word Shield
  flavour: Say the word, and the word is shield.
  voice:
    cast: One word, and you are shielded.
  zh:
    name: 真言术·盾
    base: 使一个单位获得+{health}点生命值。抽{draw}张牌。
    radiant: 使一个单位获得+{health}点生命值。抽{draw}张牌。
stinkyscape-011: # Otherworldly Magic
  flavour: Spells from a far-off school, still warm from someone else's hands.
  voice:
    cast: Frost, missiles, and flame. A sampler!
  zh:
    name: 异界魔法
    base: 将一张寒冰箭、一张奥术飞弹和一张烈焰风暴置入你的手牌。
    radiant: 将一张光辉寒冰箭、一张光辉奥术飞弹和一张光辉烈焰风暴置入你的手牌。
stinkyscape-011-1: # Frostbolt
  flavour: A shard of winter thrown at speed. Manners optional.
  voice:
    cast: Ice to meet you!
  zh:
    name: 寒冰箭
    base: 造成{damage}点伤害并将其冻结。
    radiant: 造成{damage}点伤害并将其冻结。对其相邻的单位造成{damage}点伤害。
stinkyscape-011-2: # Arcane Missiles
  flavour: Little purple bolts that never quite agree on where to go.
  voice:
    cast: Pew pew pew!
  zh:
    name: 奥术飞弹
    base: "回响2\n对一个随机敌人造成{damage}点伤害。"
    radiant: "回响5\n对一个随机敌人造成{damage}点伤害。"
stinkyscape-011-3: # Flame Strike
  flavour: A pillar of fire, delivered to the other side of the table.
  voice:
    cast: Burn, all of you!
  zh:
    name: 烈焰风暴
    base: 对所有敌方单位造成{damage}点伤害。
    radiant: 对所有敌方单位造成{damage}点伤害。
stinkyscape-012: # Otherworldly Nightmare
  flavour: Three bad dreams from another world, each one about you.
  voice:
    cast: Sweet dreams. Not for you.
  zh:
    name: 异界梦魇
    base: 将一张暗言术·灭、一张暗言术·痛和一张心灵尖啸置入你的手牌。
    radiant: 将一张光辉暗言术·灭、一张光辉暗言术·痛和一张光辉心灵尖啸置入你的手牌。
stinkyscape-012-1: # Shadow Word Death
  flavour: The bigger they are, the shorter the sentence.
  voice:
    cast: Too strong to live.
  zh:
    name: 暗言术·灭
    base: 消灭一个攻击力大于或等于{attack}的单位。
    radiant: 消灭一个攻击力大于或等于{attack}的单位，以及其相邻的单位。
stinkyscape-012-2: # Shadow Word Pain
  flavour: Small, quiet, and very final.
  voice:
    cast: Weaklings first.
  zh:
    name: 暗言术·痛
    base: 消灭一个攻击力小于或等于{attack}的单位。
    radiant: 消灭一个攻击力小于或等于{attack}的单位，以及其相邻的单位。
stinkyscape-012-3: # Psychic Scream
  flavour: Everyone on the board screams at once, then wakes up in the wrong deck.
  voice:
    cast: Scream, and scatter!
  zh:
    name: 心灵尖啸
    base: 将所有永久物洗入你对手的牌库。
    radiant: 将所有永久物洗入你对手的牌库。它们的法力值消耗各增加({surcharge})点，但不超过(4)。
stinkyscape-013: # Asphyxiants Cloud
  flavour: Don't breathe in. Actually, don't breathe at all.
  voice:
    cast: Hold your breath. Forever.
  zh:
    name: 窒息毒云
    base: "剧毒\n你在本回合中的下一张法术具有剧毒。对所有敌人造成{damage}点伤害。抽{draw}张牌。"
    radiant: "回响1，剧毒\n你在本回合中的下一张法术具有剧毒。对所有敌人造成{damage}点伤害。抽{draw}张牌。"
stinkyscape-014: # Arm of the Jempire
  flavour: The Jempire never sends a hand when an arm will do.
  voice:
    play: Hold the line. The Jempire is watching.
    attack: For the Jempire!
    death: The Jempire will remember.
  zh:
    name: 杰姆帝国之臂
    base: 每当你的一个具有嘲讽的单位被攻击时，使其获得+{buff}攻击力。
    radiant: 每当你的一个具有嘲讽的单位被攻击时，使其获得+{buff}攻击力。
stinkyscape-015: # Arg Arg Defender
  flavour: "Arg. Arg arg. Translated: nobody gets past my friends."
  voice:
    play: Arg arg!
    attack: Arg!
    death: Arg... arg.
  zh:
    name: 啊格啊格守卫
    base: 战吼：使相邻的单位获得+{buff}/+{buff}和嘲讽。
    radiant: 战吼：使相邻的单位获得+{buff}/+{buff}、圣盾和嘲讽。
stinkyscape-016: # Rod of Ages
  flavour: Older than the lanes, and still learning new tricks.
  voice:
    cast: The ages remember every hand that held it.
  zh:
    name: 万古之杖
    base: "活化，飞行\n你打出到此牌上的第一个单位会被装备进此牌。\n回合结束时：获得{keywords}个随机战斗关键词。\n当此牌拥有10个关键词时，使其变为光辉。"
    radiant: "活化，飞行，不可摧毁\n你打出到此牌上的第一个单位会被装备进此牌。\n回合结束时：获得{keywords}个随机战斗关键词。"
stinkyscape-017: # Imprisoned Ship Smith
  flavour: Chains on his wrists, a forge in his head.
  voice:
    play: They can not stop my work.
    attack: Hammer down.
    death: My work outlives me.
  zh:
    name: 被囚的造船匠
    base: 休眠2个回合。此牌苏醒时，召唤一把炽炎战斧。
    radiant: 休眠2个回合。此牌苏醒时，召唤一把光辉炽炎战斧。
stinkyscape-018: # Imitated Instrumentality
  flavour: Three minds, one vote, and no appeals process.
  voice:
    cast: Three brains online. Please behave.
  zh:
    name: 仿制补完
    base: 召唤梅尔基奥尔、巴尔塔萨和卡斯帕。它们能提供巨大的战略价值，但它们可以投票将你移出游戏。
    radiant: 召唤光辉梅尔基奥尔、光辉巴尔塔萨和光辉卡斯帕。它们能提供巨大的战略价值，但它们可以投票将你移出游戏。
stinkyscape-018-1: # MELCHIOR
  flavour: The scientist in her counts the board. Lose the count, lose her trust.
  voice:
    cast: Melchior. Analysis complete.
  zh:
    name: 梅尔基奥尔
    base: "不可摧毁\n回合开始时：如果你的对手拥有的单位比你多，投票将你移出游戏。\n激活：发现一个战斗关键词，并使你的每个单位获得该关键词。"
    radiant: "不可摧毁\n回合开始时：如果你的对手拥有的单位比你多，投票将你移出游戏。\n激活：使你的每个单位获得{keywords}个随机战斗关键词。"
stinkyscape-018-2: # BALTHASAR
  flavour: The mother in her worries about your health, and she will say so in a vote.
  voice:
    cast: Balthasar. Concern noted.
  zh:
    name: 巴尔塔萨
    base: "不可摧毁\n回合开始时：如果你的英雄生命值低于其初始生命值的一半，投票将你移出游戏。\n激活：将你上一张打出的牌的一张复制置入你的手牌。其法力值消耗增加({surcharge})点。"
    radiant: "不可摧毁\n回合开始时：如果你的英雄生命值低于其初始生命值的一半，投票将你移出游戏。\n激活：将你上一张打出的牌的一张光辉复制置入你的手牌。其法力值消耗增加({surcharge})点。"
    previews:
      the last card you played: 你上一张打出的牌
stinkyscape-018-3: # CASPER
  flavour: The woman in her hates waste. Leave nothing unspent.
  voice:
    cast: Casper. Motion to remove.
  zh:
    name: 卡斯帕
    base: "不可摧毁\n回合开始时：如果你在你的上个回合进行了结余，投票将你移出游戏。\n激活：迷惑一个随机敌方单位。"
    radiant: "不可摧毁\n回合开始时：如果你在你的上个回合进行了结余，投票将你移出游戏。\n激活：迷惑一个随机敌方单位，以及你对手手牌中的一个随机单位。"
    previews:
      if you Floated on your last turn: 如果你在你的上个回合进行了结余
stinkyscape-019: # Imprisoned Cosmality
  flavour: It was sealed away for a reason. Two turns is not long enough.
  voice:
    play: Count the turns, little ones.
    attack: Unbound.
    death: The stars dim.
  zh:
    name: 被囚的宇宙体
    base: "穿透\n休眠2个回合。此牌苏醒时，造成{damage}点伤害，随机分配到所有敌人身上。"
    radiant: "穿透\n休眠2个回合。此牌苏醒时，造成{damage}点伤害，随机分配到所有敌人身上。"
stinkyscape-020: # Tnack Trav
  flavour: He saw your best card. Now he has it too.
  voice:
    play: Nice move. Mine now.
    attack: Copy that.
    death: Original content, finally.
  zh:
    name: Tnack Trav
    base: 战吼：复制场上一个传说或神话单位的文本。
    radiant: 战吼：复制场上一个传说或神话单位的光辉文本。
stinkyscape-021: # Moonberry
  flavour: Picked under a moon that isn't ours. Tastes faintly of other worlds.
  voice:
    cast: Moon-ripe and a little strange!
  zh:
    name: 月莓
    base: "闪回\n将一张随机异源牌置入你的手牌。"
    radiant: "闪回\n将一张随机光辉异源牌置入你的手牌。其法力值消耗减少({discount})点。"
stinkyscape-022: # Gatinsir
  flavour: They waited in the dark between the stars for someone to start a fight.
  voice:
    cast: Ambush protocol engaged.
  zh:
    name: 加廷西尔
    base: 当一个敌方单位攻击时，有{chance}%的几率揭示：召唤{disruptors}个曲速干扰器，然后召唤{phalanxes}个方阵。该攻击照常进行。
    radiant: 当一个敌方单位攻击时，有{chance}%的几率揭示：召唤{disruptors}个光辉曲速干扰器，然后召唤{phalanxes}个光辉方阵。该攻击照常进行。
stinkyscape-023: # Warp Disruptor
  flavour: It bends space just enough that nobody can sit back and wait.
  voice:
    cast: Warp field unstable. Engage!
  zh:
    name: 曲速干扰器
    base: "堆叠，易碎3\n光环：所有单位无法成为守备表示，并拥有+{attack}攻击力。\n在你的对手召唤一个单位后，你的一个随机单位攻击它。"
    radiant: "堆叠，易碎3\n光环：所有单位无法成为守备表示，并拥有+{attack}攻击力。你的单位拥有先攻。\n在你的对手召唤一个单位后，你的一个随机单位攻击它。"
stinkyscape-024: # Warp Disruptor II
  flavour: The second model removed the safety settings. Everyone noticed.
  voice:
    cast: Version two. No mercy setting.
  zh:
    name: 曲速干扰器II型
    base: "堆叠，易碎5\n光环：所有单位无法成为守备表示，并拥有+{attack}攻击力。\n在你的对手召唤一个单位后，你的每个单位依次攻击它。"
    radiant: "堆叠，易碎5\n光环：所有单位无法成为守备表示，并拥有+{attack}攻击力。你的单位拥有先攻。\n在你的对手召唤一个单位后，你的每个单位依次攻击它。"
stinkyscape-025: # KY's Tricknology
  flavour: KY's proof is left as an exercise for the opponent.
  voice:
    cast: Compute the determinant. Then duck.
  zh:
    name: KY的诡术学
    base: 选择一个区域。它的雅可比矩阵会拉伸一个单位正方形。在其覆盖的每个区域中，为该区域的玩家召唤一个随机星舰部件。F(x，y) = (x² − y，xy)。
    radiant: 选择一个区域。它的雅可比矩阵会拉伸一个单位正方形。在被其覆盖的你的每个区域中，召唤一个随机光辉星舰部件。F(x，y) = (x² − y，xy)。
stinkyscape-026: # ZolarKeth
  flavour: Tenured, decorated, and still on the launch waitlist.
  voice:
    play: Class is in session. Mind the rockets.
    attack: A lesson.
    death: Office hours are over.
  zh:
    name: ZolarKeth
    base: 战吼：抉择：召唤一个大学；或此单位获得“激活：随机召唤一个星舰部件。”
    radiant: 战吼：抉择：召唤一个光辉大学；或此单位获得“激活：随机召唤一个光辉星舰部件。”
stinkyscape-027: # Drone Core I
  flavour: The cheapest core on the market. It eats a card, but the drone works fine.
  voice:
    cast: Core online. Drone away.
  zh:
    name: 无人机核心I
    base: 随机弃掉一张牌。召唤一个无人截击机。
    radiant: 随机弃掉一张牌。召唤一个光辉无人截击机。
stinkyscape-028: # Drone Core II
  flavour: One drone, no strings attached. Some assembly required.
  voice:
    cast: Interceptor away. Weapons free.
  zh:
    name: 无人机核心II
    base: 召唤一个无人截击机。
    radiant: 召唤一个光辉无人截击机。
stinkyscape-029: # Drone Core III
  flavour: Two drones are a squadron if you squint.
  voice:
    cast: Two interceptors, wings level.
  zh:
    name: 无人机核心III
    base: 召唤{interceptors}个无人截击机。
    radiant: 召唤{interceptors}个光辉无人截击机。
stinkyscape-030: # Drone Core IV
  flavour: "Three interceptors: the minimum viable swarm."
  voice:
    cast: Three bogeys inbound. Ours, thankfully.
  zh:
    name: 无人机核心IV
    base: 召唤{interceptors}个无人截击机。
    radiant: 召唤{interceptors}个光辉无人截击机。
stinkyscape-031: # Drone Core V
  flavour: A corvette is just a drone that went to the gym.
  voice:
    cast: Corvette spinning up. Stand clear.
  zh:
    name: 无人机核心V
    base: 召唤一个无人护卫舰。
    radiant: 召唤一个光辉无人护卫舰。
stinkyscape-032: # Drone Core VI
  flavour: Five drones, one shared brain cell, zero hesitation.
  voice:
    cast: Five drones. The sky is ours.
  zh:
    name: 无人机核心VI
    base: 召唤{interceptors}个无人截击机。
    radiant: 召唤{interceptors}个光辉无人截击机。
stinkyscape-033: # Drone Core VII
  flavour: A corvette with an entourage. Every captain dreams of one.
  voice:
    cast: Corvette and escorts, forming up.
  zh:
    name: 无人机核心VII
    base: 召唤一个无人护卫舰和{interceptors}个无人截击机。
    radiant: 召唤一个光辉无人护卫舰和{interceptors}个光辉无人截击机。
stinkyscape-034: # Drone Core VIII
  flavour: Leftover energy, poured straight into the assembly line.
  voice:
    cast: Every hangar empty. Every lane full.
  zh:
    name: 无人机核心VIII
    base: "结余减费。\n用无人截击机填满你的单位区。"
    radiant: "结余减费。\n用光辉无人截击机填满你的单位区。"
stinkyscape-035: # Drone Core IX
  flavour: Three corvettes. Subtlety was never on the spec sheet.
  voice:
    cast: Three corvettes. Overkill is underrated.
  zh:
    name: 无人机核心IX
    base: "结余减费。\n召唤{corvettes}个无人护卫舰。"
    radiant: "结余减费。\n召唤{corvettes}个光辉无人护卫舰。"
stinkyscape-036: # Drone Core X
  flavour: The core that builds the battleship that builds the drones.
  voice:
    cast: Battleship protocol engaged. Brace yourselves.
  zh:
    name: 无人机核心X
    base: "结余减费。\n召唤无人战列舰。"
    radiant: "结余减费。\n召唤光辉无人战列舰。"
stinkyscape-037: # Kwzka
  flavour: Everyone cheaper than her falls a little in love.
  voice:
    play: Darling, you're all mine now.
    attack: Kiss kiss.
    death: Fine. Keep your hearts.
  zh:
    name: Kwzka
    base: "光环：每个被打出的法力值消耗低于此单位的敌方单位都会被迷惑。\n亡语：移除场上所有的迷惑。"
    radiant: "圣盾\n光环：每个被打出的法力值消耗低于此单位的敌方单位都会被迷惑。\n亡语：移除场上所有的迷惑。"
stinkyscape-038: # Shield Amplifier
  flavour: It hums a little louder after every hit it shrugs off.
  voice:
    play: Shield harmonics online.
    attack: Pushing forward.
    death: Field collapsed.
  zh:
    name: 护盾增幅器
    base: "星舰部件，装备，圣盾\n每当此单位在一次攻击中存活下来时，它获得+{buff}/+{buff}。"
    radiant: "星舰部件，装备，圣盾\n每当此单位在一次攻击中存活下来时，它获得+{buff}/+{buff}。"
stinkyscape-039: # The Narcor Project
  flavour: Officially it studies Narcor. Unofficially, the vault is getting crowded.
  voice:
    cast: Strictly research. Ignore the vault.
  zh:
    name: 纳科计划
    base: "易碎4\n回合结束时：获得一个纳科。\n激活：弃掉一个纳科，使这张牌的易碎减少1。\n亡语：如果这张牌因易碎而被消灭，在本局对战的剩余时间内，你的每个回合结束时获得两个纳科。"
    radiant: "易碎4\n回合结束时：获得一个红纳科。\n激活：弃掉一个纳科或红纳科，使这张牌的易碎减少1。\n亡语：如果这张牌因易碎而被消灭，在本局对战的剩余时间内，你的每个回合结束时获得两个红纳科。"
stinkyscape-040: # Poison Capsule
  flavour: Do not shake it. Do not open it. Do not stand downwind of it.
  voice:
    play: Hazard seals engaged.
    attack: Venting toxins.
    death: Containment breach!
