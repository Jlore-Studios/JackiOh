core-098: # Heroic Power
  flavour: Pick a power at the door. It's yours for the night.
  voice:
    cast: With great power... whatever.
  zh:
    name: 英雄之力
    base: "不可摧毁\n对战开始时：随机获得13种能力中的一种。每种能力都是花费其(X)的激活能力。\n(3)探险地图：招募一个永久物。\n(1)生命分流：抽{tapDraw}张牌。受到{tapDamage}点伤害。\n(1)稳固射击：对敌方英雄造成{shot}点伤害。\n(2)牧场：召唤一个突袭衍生物。\n(1)猫咖：召唤一个猫族衍生物。\n(1)点射：穿透。造成{ping}点伤害。\n(2)见证价值：发现一张单位牌。\n(2)缝合：发现两张法力值消耗为({stitchCost})或更低的单位牌。将它们融合。\n(1)全副武装：直到你的下个回合，你的英雄获得{armor}点护甲。\n(2)死吧，虫子：对一个随机敌人造成{insect}点伤害。\n(2)KY头脑风暴：将一张随机KY牌置入你的手牌。使你手牌中所有法术的法力值消耗减少({discount})点。\n(2)采摘：将一张随机水果牌置入你的手牌。其法力值消耗为({fruitCost})。\n(3)终点诡计：发现一张陷阱牌并召唤它。"
    radiant: "不可摧毁\n对战开始时：随机获得13种能力中的一种。每种能力都是花费其(X)的激活能力。\n(3)探险地图：招募一个永久物。使其变为光辉。\n(1)生命分流：从每名玩家的牌库中各抽{tapDraw}张牌。\n(1)稳固射击：对敌方英雄造成{shot}点伤害。永久强化此能力，使其伤害+2。\n(2)牧场：召唤一个光辉突袭衍生物。\n(1)猫咖：召唤一个随机猫族。\n(1)点射：穿透。造成{ping}点伤害。如果此能力杀死了一个单位，召唤一个具有其属性的食尸鬼衍生物。\n(2)见证价值：发现一张光辉单位牌。\n(2)缝合：发现两张法力值消耗为({stitchCost})或更低的光辉单位牌。将它们融合。\n(1)铜墙铁壁：你的英雄获得{armor}点护甲，然后此能力刷新。\n(2)死吧，虫子：幸运1。对一个随机敌人造成{insect}点伤害。\n(2)KY头脑风暴：将一张光辉KY牌置入你的手牌。使你手牌中所有法术的法力值消耗减少({discount})点。\n(2)采摘：将一张随机光辉水果牌置入你的手牌。其法力值消耗为({fruitCost})。\n(3)终点诡计：发现一张光辉陷阱牌并召唤它。"
