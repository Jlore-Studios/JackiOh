    radiant: 从你的墓地中召唤所有单位。放逐这张牌。
classic-045: # Nature Titan
  flavour: A titan of moss and patience. Every step grows something.
  voice:
    play: The forest walks with me.
    attack: The forest strikes!
    death: Return me to the earth.
  zh:
    name: 自然泰坦
    base: "献祭1\n战吼及当此单位攻击时：抽{draw}张牌并为你的英雄恢复{heal}点生命值。"
    radiant: "献祭1\n战吼及当此单位攻击时：抽{draw}张牌并为你的英雄恢复{heal}点生命值。"
classic-046: # Divine Favor
