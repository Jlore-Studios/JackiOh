    radiant: 从你的牌库中抽出所有法力值消耗为(2)的牌。放逐你的牌库、手牌和墓地中所有法力值消耗为奇数的牌，法力值消耗为X的牌除外。获得{mana}点法力值。
core-095: # Call to Chaos (Core Edition)
  flavour: Pull the lever. Pray the lever likes you.
  voice:
    cast: Roll the dice! Pray nice!
  zh:
    name: 混沌召唤（核心版）
    base: 一个随机效果：召唤3个法力值消耗为(3)的随机单位；为你的英雄恢复30点生命值；抽出你的整个牌库并获得4点法力值；将3张随机牌置入你的手牌，其法力值消耗为(0)；使你的手牌变为光辉；召唤5个光辉突袭衍生物；你的手牌和牌库中的牌的法力值消耗减少(2)点；召唤一个混沌魔像；将5张随机场地法术或陷阱召唤到你的后场，陷阱为里侧表示；施放一张随机混沌召唤。
    radiant: 三个不同的随机效果，按所列顺序结算：召唤3个法力值消耗为(3)的随机单位；为你的英雄恢复30点生命值；抽出你的整个牌库并获得4点法力值；将3张随机牌置入你的手牌，其法力值消耗为(0)；使你的手牌变为光辉；召唤5个光辉突袭衍生物；你的手牌和牌库中的牌的法力值消耗减少(2)点；召唤一个混沌魔像；将5张随机场地法术或陷阱召唤到你的后场，陷阱为里侧表示；施放一张随机混沌召唤。
