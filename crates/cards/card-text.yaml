  voice:
    play: Let's talk about the meta.
    attack: The meta demands it.
    death: The meta has shifted.
  zh:
    name: 版本现状
    base: 不可摧毁，不可变
    radiant: 不可摧毁，不可变，吸血
classic-042: # Transmutable Toxins
