    base: "活化，吸血\n当你的对手召唤一个单位时揭示：对其造成{damage}点伤害。然后将这张牌作为一个守备表示的单位召唤。\n之后的单位不会受到伤害。"
    radiant: "活化，吸血\n当你的对手召唤一个单位时揭示：对其造成{damage}点伤害。然后将这张牌作为一个守备表示的单位召唤。\n之后的单位不会受到伤害。"
