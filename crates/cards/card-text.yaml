core-093: # Combo-Index
  flavour: Grade E means effort. Grade S means show-off.
  voice:
    cast: Style points! Grade me!
  zh:
    name: 连击指数
    base: "等级(初始为E)。\n回合结束时：如果你在本回合中打出了N张或更多的牌，提升一个等级，并触发从E到该等级的每一级效果。N=从E到当前等级的等级数。\nE：随机将一张你在本回合中打出的牌的复制置入你的手牌。\nD：手牌中的2张随机牌的法力值消耗减少(1)点。\nC：对手随机放逐一张手牌。\nB：使手牌中的一张随机牌变为光辉。\nA：对敌方英雄造成8点吸血伤害。\nS：再次触发E–A。"
    radiant: "等级(初始为E)。\n回合开始时：将一张连击炮灰置入你的手牌。\n回合结束时：如果你在本回合中打出了N张或更多的牌，提升一个等级，并触发从E到该等级的每一级效果。N=从E到当前等级的等级数。\nE：随机将一张你在本回合中打出的牌的复制置入你的手牌。\nD：手牌中的2张随机牌的法力值消耗减少(1)点。\nC：对手随机放逐一张手牌。\nB：使手牌中的一张随机牌变为光辉。\nA：对敌方英雄造成8点吸血伤害。\nS：再次触发E–A。"
    previews:
      Grade: 等级
      N = the grades from E to the current one: N=从E到当前等级的等级数
core-093-1: # Combo-Fodder
