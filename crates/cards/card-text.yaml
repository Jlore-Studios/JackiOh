  voice:
    play: Something's gonna snap. Not me.
    attack: Snap!
    death: My back! My back!
  zh:
    name: 后场粉碎者
    base: "堆叠\n亡语：消灭所有后场牌。"
    radiant: "堆叠\n亡语：消灭所有敌方后场牌。"
classic-052: # Final Gambit
