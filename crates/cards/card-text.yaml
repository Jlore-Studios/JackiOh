    name: 经典魔像
    base: "突袭，先攻，践踏\n当此单位攻击一个单位时，那个单位变形成为一个随机光辉经典或经典+单位。如果它死亡，此单位可以再次攻击。"
    radiant: "突袭，践踏，圣盾\n当此单位攻击一个单位时，那个单位变形成为一个随机经典或经典+单位。如果它死亡，此单位可以再次攻击。"
classicplus-074: # Twice Forward One Step Backwards
