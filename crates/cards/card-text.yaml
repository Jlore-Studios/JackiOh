  voice:
    play: From the void, I walk.
    attack: Into the void.
    death: Back into the dark.
  zh:
    name: 虚空行者
    base: "战吼：放逐双方墓地中的所有牌。\n光环：即将进入墓地的牌会改为被放逐。"
    radiant: "战吼：放逐你对手墓地中的所有牌。\n光环：你的对手拥有的即将进入墓地的牌会改为被放逐。"
classic-051: # Back Breaker
