    radiant: 当你的对手在一个回合内抽的牌达到{draws}张时揭示：对手选择保留一张牌，并将其余的手牌交给你。你获得的牌的法力值消耗减少({discount})点。
    previews:
      the cards your opponent has drawn in a turn: 你的对手在一个回合内抽的牌
classic-010: # Exile
