  voice:
    play: Mic check, one two, tech in!
    attack: Drop the beat!
    death: Mic drop.
  zh:
    name: 精控技师
    base: 战吼：如果你的对手控制{threshold}个或更多永久物，随机夺取其中一个。
    radiant: 战吼：如果你的对手控制{threshold}个或更多永久物，夺取你选择的其中一个。
classic-041: # State of the Game
