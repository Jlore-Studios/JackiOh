  voice:
    cast: The heavens smile upon us.
  zh:
    name: 神恩术
    base: 抽牌，直到你的手牌数量与你对手的相同。
    radiant: 抽牌，直到你的手牌数量为你对手的{multiplier}×。
    previews:
      Draw: 抽牌
classic-047: # Recurring Felinor
