    radiant: 消灭所有单位。它们原本每带有一个瘟疫指示物，你便获得{mana}点法力值。然后从其拥有者的墓地中召唤这些单位中每个曾带有瘟疫指示物的单位，由你控制。
    previews:
      for each Plague Counter that was on them: 它们原本每带有一个瘟疫指示物
classic-044: # Back from the GY
