    radiant: "幸运1\n亡语：重新召唤这张牌，回到第1阶段。\n任务：第1阶段，上传简历。激活这张牌，将你手牌中的一张牌作为简历投递出去。奖励：2到6个回合后收到回复。\n任务：第2阶段，面试。从三个任务中随机抽取一个：打出一张法力值消耗与你的简历相同的牌；在一个回合内打出3张法力值消耗各不相同的牌；或者单次受到或造成12点或更多伤害。奖励：将你的简历置入你的手牌并将其强化{buffs}次。其法力值消耗为(0)。\n任务：第3阶段，录用通知。激活这张牌以接受录用，或者再投一份申请，回到第1阶段，且所有奖励变为三倍。奖励：从你的下个回合起，在你的每个回合开始时，将一张薪水支票置入你的手牌。"
