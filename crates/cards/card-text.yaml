  voice:
    play: Come closer, little one. Into my web.
    attack: Caught you.
    death: My web... unravels...
  zh:
    name: 乔罗
    base: 当这张牌在你的手牌中时：你的对手用一张法术以你的一个单位为目标时，召唤这张牌，并使其成为新的目标。
    radiant: "不可摧毁\n当这张牌在你的手牌中时：你的对手用一张法术以你的一个单位为目标时，召唤这张牌，并使其成为新的目标。"
classic-034: # Ancient Acquisition
  flavour: Some things are worth digging up twice.
  voice:
    cast: A priceless relic. Mine now.
  zh:
    name: 远古征集
    base: 将{cards}张随机牌从你的墓地移回手牌。
    radiant: 将{cards}张随机牌从你的墓地或放逐区移回手牌。
classic-035: # Prep
  flavour: Measure twice, cast once.
  voice:
    cast: Stretch, plan, prepare. Go time.
  zh:
    name: 伺机
    base: "在本回合中，你的下一张法术的法力值消耗减少({discount})点。\n加码(2)：并从你的牌库中随机抽取一张法术。"
    radiant: "在本回合中，你的下一张法术的法力值消耗减少({discount})点。\n加码(2)：并从你的牌库中抽取法力值消耗最高的法术。"
classic-036: # Burn
  flavour: Everything burns. Some things burn and pay you back.
  voice:
    cast: Oh, that is a sick burn!
  zh:
    name: 燃烧
    base: 造成{damage}点伤害。如果你还剩余{threshold}点或更多法力值，抽{draw}张牌。
    radiant: 造成{damage}点伤害。如果你的法力值上限为{threshold}点或更多，抽{draw}张牌。
classic-037: # Last Hurrah
  flavour: One night of everything. One morning of nothing.
  voice:
    cast: One last hurrah, together!
  zh:
    name: 最后的狂欢
    base: 抽光你的牌库。在本回合结束时，弃掉你的手牌。
    radiant: 抽光你的牌库。在你的下个回合结束时，弃掉你的手牌。
classic-038: # Jackiestan Auctioneer
  flavour: Going once, going twice, sold to the player in lane three.
  voice:
    cast: Going once, going twice, sold!
  zh:
    name: 杰基斯坦拍卖师
    base: "活化\n当你在一个回合内打出的牌达到{plays}张时揭示。\n这张牌揭示后：每当你打出一张牌，抽{draw}张牌并对敌方英雄造成{damage}点伤害。"
    radiant: "活化\n当你在一个回合内打出的牌达到{plays}张时揭示。\n这张牌揭示后：每当你打出一张牌，抽{draw}张牌并对敌方英雄造成{damage}点伤害。"
    previews:
      in a turn: 你在一个回合内打出的牌
classic-039: # Outbreak
