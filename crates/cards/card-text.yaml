      random Radiant Stinkyscape Resource: 随机光辉臭臭星景资源
stinkyscape-171: # Large Asteroid
  flavour: Bring a bigger drill. Then bring a bigger ship.
  voice:
    play: Big rock. Bigger payout.
    attack: Rumble!
    death: Split wide open.
  zh:
    name: 大型小行星
    base: "无法攻击，无法守备\n亡语：获得{resources}个随机臭臭星景资源。\n激活：受到{selfDamage}点伤害。献祭这张牌。"
    radiant: "无法攻击，无法守备\n亡语：获得{resources}个随机光辉臭臭星景资源。\n激活：献祭这张牌。"
    previews:
      random Stinkyscape Resource: 随机臭臭星景资源
      random Radiant Stinkyscape Resource: 随机光辉臭臭星景资源
stinkyscape-172: # Huge Asteroid
  flavour: A small moon with a big attitude and a richer core.
  voice:
    play: I am the motherlode. Dig deep.
    attack: Tremble!
    death: Shattered into a fortune.
  zh:
    name: 巨型小行星
    base: "无法攻击，无法守备\n亡语：获得{resources}个随机臭臭星景资源。\n激活：受到{selfDamage}点伤害。献祭这张牌。"
