    radiant: 当一次命中将使你的英雄的生命值降至0或更低时揭示：取消这次命中。然后为你的英雄恢复{heal}点生命值并抽光你的牌库。
classic-053: # Plague Crawler
  flavour: It loves the itch. It reads about it, too.
  voice:
    play: Crawling... closer... closer...
    attack: Crawling in...
    death: Squish.
  zh:
    name: 瘟疫爬行者
    base: "战吼：在一个永久物上放置{tokens}个瘟疫指示物。\n每当有瘟疫指示物被放置在此单位上时，抽{draw}张牌。"
    radiant: "战吼：在一个永久物上放置{tokens}个瘟疫指示物。\n每当有瘟疫指示物被放置在此单位上时，抽{draw}张牌。"
classic-054: # Rewind
