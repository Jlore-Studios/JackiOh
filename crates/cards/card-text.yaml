    radiant: "光环：你的对手每回合最多只能抽{drawLimit}张牌。\n当你的对手打出一张法力值消耗为(1)的法术时，夺取它并由你施放它。一旦这张牌已夺取{threshold}张法术，献祭这张牌。"
