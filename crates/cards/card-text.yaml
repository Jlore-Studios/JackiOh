      random Radiant Stinkyscape Resource: 随机光辉臭臭星景资源
stinkyscape-173: # Abandoned Spice Tower
  flavour: The traders left in a hurry. The spice stayed behind.
  voice:
    play: Still standing. Still full of spice.
    attack: Creak.
    death: The last spice spills out.
  zh:
    name: 废弃香料塔
    base: "无法攻击，无法守备\n亡语：将{spices}张香料置入你的手牌。\n激活：受到{selfDamage}点伤害。献祭这张牌。"
    radiant: "无法攻击，无法守备\n亡语：将{spices}张光辉香料置入你的手牌。\n激活：受到{selfDamage}点伤害。献祭这张牌。"
stinkyscape-174: # Aerelret
  flavour: A fleet folded into a single card, waiting for someone to swing first.
  voice:
    cast: Fleet decloaking. Engage.
  zh:
    name: 艾雷尔雷特
    base: 当一个敌方单位攻击时，有{chance}%的几率揭示：召唤一个曲速干扰器，然后召唤{paragons}个典范Mk1。该攻击照常进行。
    radiant: 当一个敌方单位攻击时，有{chance}%的几率揭示：召唤一个光辉曲速干扰器，然后召唤{paragons}个光辉典范Mk1。该攻击照常进行。
stinkyscape-175: # Frost Module
  flavour: Keeps the drinks cold and the enemy colder.
  voice:
    play: Cryo module online.
    attack: Chill out.
    death: Thawed for good.
  zh:
    name: 冰霜模块
    base: "星舰部件，装备\n激活：冻结一个敌方单位。"
    radiant: "星舰部件，装备\n激活2：冻结一个敌方单位。"
stinkyscape-176: # Preemptive Strike
  flavour: "The fleet's oldest rule: if they are going to shoot first, make sure they are too late."
  voice:
    cast: Launch the ship. We strike first.
  zh:
    name: 先发制人
    base: 如果你有一艘休眠星舰，将其发射，然后发现一张战争条令牌并施放它。
    radiant: 如果你有一艘休眠星舰，将其发射，然后发现一张光辉战争条令牌并施放它。
stinkyscape-177: # Cloaking Module
  flavour: Standard issue on every hull. Nobody has ever seen one installed, which is rather the point.
  voice:
    play: Cloak engaged. You never saw me.
    attack: Decloaking!
    death: Cloak failing. Visible.
  zh:
    name: 隐形模块
    base: 星舰部件，装备，隐匿，不可变
    radiant: 星舰部件，装备，隐匿，不可变，法术免疫
stinkyscape-t-dormant-starship: # Dormant Starship
  flavour: A hull of borrowed parts, dreaming of a sky it has never seen.
  voice:
    play: Hull assembled. Awaiting parts.
    attack: Full burn.
    death: The ship is lost.
  zh:
    name: 休眠星舰
    base: "休眠，直到其被发射。你死亡的星舰部件会融合进此单位。\n激活：支付(3)发射此单位。"
    radiant: "休眠，直到其被发射。你死亡的星舰部件会融合进此单位。\n激活：支付(3)发射此单位。"
stinkyscape-t-drone-interceptor: # Drone Interceptor
  flavour: Small, fast, and programmed to find out what it's good at.
  voice:
    play: Interceptor online.
    attack: Engaging.
    death: Signal lost.
  zh:
    name: 无人截击机
    base: "远程，飞行\n光环：拥有{keywords}个随机战斗关键词。"
    radiant: "远程，飞行\n光环：拥有{keywords}个随机战斗关键词。"
stinkyscape-t-drone-corvette: # Drone Corvette
  flavour: Built like a drone, armed like a warship.
  voice:
    play: Corvette on station. Guns warm.
    attack: Firing solution!
    death: Hull breach. Going down.
  zh:
    name: 无人护卫舰
    base: "远程，飞行\n光环：拥有{keywords}个随机战斗关键词。"
    radiant: "远程，飞行\n光环：拥有{keywords}个随机战斗关键词。"
stinkyscape-t-shield-layer: # Drone Battleship (Shield Layer)
  flavour: The outer hull takes the blows so the rest of the ship never has to.
  voice:
    play: Shield layer up. Hide behind me.
    attack: Holding the line!
    death: Shields down. Next layer exposed.
  zh:
    name: 无人战列舰（护盾层）
    base: "星舰，无法攻击，嘲讽，护甲4\n你的英雄或其他单位将受到的致命伤害改为由它承担。"
    radiant: "星舰，无法攻击，嘲讽，护甲8\n你的英雄或其他单位将受到的致命伤害改为由它承担。"
stinkyscape-t-propagation-layer: # Drone Battleship (Propagation Layer)
  flavour: A shipyard inside a warship, printing escorts on demand.
  voice:
    play: Propagation bay open. Printing escorts.
    attack: Deploying!
    death: Bay destroyed. Core exposed.
  zh:
    name: 无人战列舰（繁衍层）
    base: "星舰，无法攻击\n激活2：召唤一个无人截击机。\n激活：召唤一个无人护卫舰。"
    radiant: "星舰，无法攻击\n激活2：召唤一个光辉无人截击机。\n激活：召唤一个光辉无人护卫舰。"
stinkyscape-t-meltdown-layer: # Drone Battleship (Meltdown Layer)
  flavour: The reactor at the heart of the battleship is not stable. It was never meant to be.
  voice:
    play: Reactor critical. Going out loud.
    attack: Overload!
    death: Meltdown complete.
  zh:
