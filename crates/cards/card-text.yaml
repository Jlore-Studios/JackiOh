    radiant: 在一个永久物上放置{tokens}个瘟疫指示物。如果它是敌方永久物，且其带有的瘟疫指示物数量不少于其法力值消耗，夺取它。否则，它每带有一个瘟疫指示物，便抽{drawPer}张牌。
classic-040: # MC Tech
