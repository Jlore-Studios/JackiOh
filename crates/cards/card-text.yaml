  voice:
    cast: Again... again... again...
  zh:
    name: 回响
    base: 这张牌具有任意一名玩家打出的上一张法术的文本。
    radiant: "回响1\n这张牌具有任意一名玩家打出的上一张法术的文本。"
classic-058: # Common Resources
