    radiant: "光环：你的单位每带有一个瘟疫指示物，便获得+{stats}/+{stats}。敌方单位每带有一个瘟疫指示物，便获得−{stats}/−{stats}。\n激活：在{tokens}个随机单位上各放置一个瘟疫指示物。"
classic-043: # Plague Nuke
