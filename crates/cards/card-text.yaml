  zh:
    name: Gokugains
    base: "隐匿\n战吼：秘密地削弱你对手手牌中的一个随机单位{times}次，但不影响其法力值消耗。在它被打出之前，没有人能看到这些削弱。"
    radiant: "隐匿\n战吼：秘密地削弱你对手手牌中的一个随机单位{times}次，但不影响其法力值消耗。在它被打出之前，没有人能看到这些削弱。"
stinkyscape-124: # Jlockeed's Shipbuilding Grant
  flavour: Free money for rockets, provided Jlockeed's friends build the rockets.
  voice:
    cast: Grant approved. Spend it on spaceships.
  zh:
    name: Jlockeed的造船补助
    base: 将{cards}张随机星舰部件牌置入你的手牌。
    radiant: 将{cards}张随机光辉星舰部件牌置入你的手牌。
stinkyscape-125: # Jlockeed's Spacerace Propaganda
  flavour: Posters of square-jawed astronauts, all paid for by a missile company.
  voice:
    cast: Reach for the stars, citizen!
  zh:
    name: Jlockeed的太空竞赛宣传
    base: 激活：将一张随机星舰部件牌置入你的手牌。
    radiant: 激活：将一张随机光辉星舰部件牌置入你的手牌。
stinkyscape-126: # Jlockeed's Permanent Procurement Lobbying
  flavour: Lobbyists never ask twice. They send a ship every morning until you agree.
  voice:
    cast: Renewed every quarter, at taxpayer expense.
  zh:
    name: Jlockeed的永久采购游说
    base: "在本局对战的剩余时间内。\n回合开始时：将{cards}张随机星舰部件牌置入你的手牌。"
    radiant: "在本局对战的剩余时间内。\n回合开始时：将{cards}张随机光辉星舰部件牌置入你的手牌。每张牌的法力值消耗减少({discount})点。"
stinkyscape-127: # Jlockeed's Siege Tank
  flavour: Jlockeed calls it a peacekeeper. The treads tell a different story.
  voice:
    play: Siege mode engaged.
    attack: Firing for effect!
    death: Tread's thrown!
  zh:
    name: Jlockeed的攻城坦克
    base: "回合结束时：此单位随机攻击一个敌人。\n加码(4)：星舰部件。"
    radiant: "回合结束时：此单位随机攻击一个敌人。\n加码(4)：星舰部件。"
stinkyscape-128: # Jlockeed's Yamato Cannon
  flavour: It takes ages to warm up, and nobody stands in front of it while it does.
  voice:
    play: Main gun is ready.
    attack: Fire!
    death: Barrel cracked.
  zh:
    name: Jlockeed的大和炮
    base: "远程，顺劈\n加码(3)：星舰部件。"
    radiant: "远程，顺劈，突袭\n加码(3)：星舰部件。"
stinkyscape-129: # Jlockeed's Missile Pod
  flavour: Small enough to bolt onto anything. Loud enough to wake the whole sector.
  voice:
    play: Missile pod armed.
    attack: Missiles away!
    death: Pod's empty.
  zh:
    name: Jlockeed的导弹舱
    base: "回合结束时：对所有敌人造成等同于此单位攻击力除以{divisor}后向下取整的伤害。\n加码(2)：星舰部件和装备。"
    radiant: "回合结束时：对所有敌人造成等同于此单位攻击力除以{divisor}后向下取整的伤害。\n加码(2)：星舰部件和装备。"
stinkyscape-130: # Jlockeed's Starship Retrofitting Program
  flavour: New fins, new paint, the same invoice. Now with a launch clause.
  voice:
    cast: Retrofit approved. Change orders pending.
  zh:
    name: Jlockeed的星舰改装计划
    base: 将一张随机Jlockeed牌置入你的手牌。它获得星舰部件。
    radiant: 将一张随机光辉Jlockeed牌置入你的手牌。它获得星舰部件，并且其法力值消耗减少({discount})点。
stinkyscape-131: # Spacerace Stimulus
  flavour: Public money for private rockets, as long as somebody launches something.
  voice:
    cast: And they're off! Liftoff money unlocked!
  zh:
    name: 太空竞赛刺激
    base: "活化，星舰部件\n当任意一名玩家发射星舰时揭示。"
    radiant: "活化，星舰部件\n当任意一名玩家发射星舰或打出星舰部件时揭示。"
stinkyscape-132: # Defensive Crystal
  flavour: Grows a new facet every time something hits it, and remembers who did.
  voice:
    play: Facets aligned.
    attack: Shard strike.
    death: Shattered, but not wasted.
  zh:
    name: 防御水晶
    base: "星舰部件\n亡语：你的英雄获得{heroArmor}点护甲。"
    radiant: "星舰部件\n亡语：你的英雄获得{heroArmor}点护甲。"
stinkyscape-133: # Ultra Capacitor
  flavour: Stores a lightning storm in a can the size of a lunchbox.
  voice:
    play: Storing power. Please wait.
    attack: Zap!
    death: Fully drained.
  zh:
    name: 超级电容
    base: "星舰部件\n发射时，你的星舰中每有一个其他星舰部件，你的星舰便获得+{per}/+{per}。"
    radiant: "星舰部件\n发射时，你的星舰中每有一个星舰部件，你的星舰便获得+{per}/+{per}。"
stinkyscape-134: # Felinor Containment Chamber
  flavour: Labeled DO NOT OPEN in four languages. The cat inside reads none of them.
  voice:
    play: Something is scratching inside.
    attack: Hiss and spit!
    death: The cat is out!
  zh:
    name: 猫族收容舱
    base: "星舰部件\n亡语：召唤一个猫族衍生物，其攻击力和生命值与此单位相同。"
    radiant: "星舰部件\n亡语：召唤一个猫族衍生物，其攻击力和生命值为此单位的两倍。它获得圣盾。"
stinkyscape-135: # Sacked
  flavour: Into the sack it goes, kicking, until somebody lets it out.
  voice:
    cast: Gotcha! In the sack you go!
  zh:
    name: 装袋
    base: 当你的对手打出一个单位时揭示：在其结算后，将它装进一个由你的对手控制的麻袋。
    radiant: 当你的对手打出一个单位时揭示：在其结算后，将它装进一个由你控制的麻袋。
stinkyscape-135-1: # Sack
  flavour: Burlap, a drawstring, and something inside that is very upset.
  voice:
    play: Mmmph! Mmmph mmph!
    attack: Mmph!
    death: Free at last!
  zh:
    name: 麻袋
    base: 当这张牌离开场上时，召唤装在其中的单位。
    radiant: "易碎1\n当这张牌离开场上时，召唤装在其中的单位。"
    previews:
      the Unit stuffed into it: 装在其中的单位
stinkyscape-136: # Magic Module
  flavour: Nobody aboard knows how it works, but the wizard insisted it be installed.
  voice:
    play: Arcane circuits humming.
    attack: Spellfire!
    death: The magic fizzles.
  zh:
    name: 魔法模块
    base: "星舰部件，装备，法术伤害+2\n发射时，将{spells}张随机的伤害法术牌置入你的手牌。"
    radiant: "星舰部件，装备，法术伤害+4\n发射时，将{spells}张随机的伤害法术牌置入你的手牌。"
stinkyscape-137: # Starfleet Commander
  flavour: Doctrine says strike first. Doctrine also says ask questions later, if at all.
  voice:
    play: Strike package authorized.
    attack: Hit them first!
    death: We were too slow.
  zh:
    name: 星际舰队指挥官
    base: "先攻\n战吼：如果你有一艘休眠星舰，将其发射，然后发现一张战争条令牌并施放它。"
    radiant: "先攻\n战吼：如果你有一艘休眠星舰，将其发射，然后发现一张光辉战争条令牌并施放它。"
stinkyscape-137-1: # Land Doctrine
  flavour: Roll over the hills, roll over the walls, roll over whatever is behind the walls.
  voice:
    cast: Tanks forward! Flatten their line!
  zh:
    name: 陆战条令
    base: 在本局对战的剩余时间内，你的单位具有践踏。你的星舰随机攻击一个敌方单位。
    radiant: 在本局对战的剩余时间内，你的单位具有践踏。你的星舰攻击每个敌方单位。
stinkyscape-137-2: # Sea Doctrine
  flavour: Patience, salt water and a very large hull. The tides do the rest.
  voice:
    cast: Steady as she goes. Hold the line.
  zh:
    name: 海战条令
    base: 在本局对战的剩余时间内，你的单位具有灵巧。为你的英雄恢复等同于你的星舰生命值{multiplier}倍的生命值。
    radiant: 在本局对战的剩余时间内，你的单位具有灵巧。为你的英雄恢复等同于你的星舰生命值{multiplier}倍的生命值。
stinkyscape-137-3: # Air Doctrine
  flavour: Own the sky, and every road below it is yours by lunchtime.
  voice:
    cast: Air superiority achieved. Begin the run.
  zh:
    name: 空战条令
    base: 在本局对战的剩余时间内，你的单位具有突袭。造成等同于你的星舰攻击力{multiplier}倍的伤害，随机分配到所有敌人身上。
    radiant: 在本局对战的剩余时间内，你的单位具有突袭。造成等同于你的星舰攻击力{multiplier}倍的伤害，随机分配到所有敌人身上。
stinkyscape-137-4: # Space Doctrine
  flavour: "Where the map ends, the doctrine begins: up, out and never back."
  voice:
    cast: Spread out and take the high orbit.
  zh:
    name: 太空战条令
    base: 在本局对战的剩余时间内，你的单位具有飞行。用融合进你的星舰的星舰部件的复制填满你的手牌。
    radiant: 在本局对战的剩余时间内，你的单位具有飞行。用融合进你的星舰的星舰部件的复制填满你的手牌。它们的法力值消耗为({setCost})。
stinkyscape-138: # Pocket Peptides
  flavour: Emergency supplements, taken mid-fight. Results may vary wildly.
  voice:
    cast: Quick, take your vitamins!
  zh:
    name: 口袋多肽
    base: 当你的一个单位将在战斗中死亡时揭示：对其施放中国牌CN多肽。
    radiant: 当你的一个单位将在战斗中死亡时揭示：对你的每个单位各施放一张光辉的中国牌CN多肽。
stinkyscape-139: # Wormhole
  flavour: What goes in on their side comes out on yours. Physics is very rude.
  voice:
    cast: Thank you. I'll take that.
  zh:
    name: 虫洞
    base: 当你的对手打出一张只以其英雄或其控制的永久物为目标的法术时揭示：反制该法术，并由你施放它，且只能以你的英雄或你控制的永久物为目标。
    radiant: 当你的对手打出一张只以其英雄或其控制的永久物为目标的法术时揭示：反制该法术，使其变为光辉，然后由你施放它，且只能以你的英雄或你控制的永久物为目标。
stinkyscape-140: # Rush Token Launcher
  flavour: Loads one very angry soldier per pull. Reloads itself, sadly.
  voice:
    play: Soldier cartridge loaded.
    attack: Deploying!
    death: Out of soldiers.
  zh:
    name: 突袭衍生物发射器
    base: "星舰部件，装备\n激活：召唤一个突袭衍生物，它攻击一个敌方单位，须优先攻击具有嘲讽的单位。"
    radiant: "星舰部件，装备\n激活：召唤一个光辉突袭衍生物，它攻击一个敌方单位，须优先攻击具有嘲讽的单位。"
stinkyscape-141: # Fruit Launcher
  flavour: Designed for orbital food delivery. Redesigned after the first delivery.
  voice:
    play: Fresh produce, high velocity!
    attack: Catch!
    death: Bruised and battered.
  zh:
    name: 水果发射器
    base: "星舰部件，装备\n激活：选择一个永久物。对其施放一张随机水果牌。"
    radiant: "星舰部件，装备\n激活：选择一个永久物。对其施放一张随机光辉水果牌。"
stinkyscape-142: # Jade Launcher
  flavour: Every shot is a gamble. Most shots pay. Some shots are just rocks.
  voice:
    play: Lucky stones, loaded and ready!
    attack: Fortune incoming!
    death: Bad luck, after all.
  zh:
    name: 玉石发射器
    base: "星舰部件，装备\n激活：对一个敌人造成{damage}点伤害，然后获得鸿运石所给予的奖励。"
    radiant: "星舰部件，装备\n激活2：对一个敌人造成{damage}点伤害，然后获得鸿运石所给予的奖励。"
stinkyscape-143: # Book Launcher
  flavour: Assigned reading, delivered at terminal velocity.
  voice:
    play: Overdue books, returning at speed.
    attack: Read this!
    death: Out of print.
  zh:
    name: 书本发射器
    base: "星舰部件，装备\n激活：选择一个目标。如果它是敌人，施放一张随机有害的书牌，可行时以其为目标。如果它是友方，施放一张随机有益的书牌，可行时以其为目标。"
    radiant: "星舰部件，装备\n激活：选择一个目标。如果它是敌人，施放一张随机光辉有害书牌，可行时以其为目标。如果它是友方，施放一张随机光辉有益书牌，可行时以其为目标。"
stinkyscape-144: # Prepare For Liftoff
  flavour: Fuel the rockets, kiss the dog, and never read the waiver.
  voice:
    cast: T minus zero. This one is free!
  zh:
    name: 准备升空
    base: "可交易，闪回\n当你的一个星舰部件死亡时揭示：你的星舰发射的法力值消耗为(0)。"
    radiant: "可交易，闪回\n当你的一个星舰部件死亡时揭示：从你的墓地召唤它。你的星舰发射的法力值消耗为(0)。"
stinkyscape-145: # Fortify Flesh
  flavour: Skin like bark, then like stone, then like a bank vault.
  voice:
    cast: Hard as stone. Harder.
  zh:
    name: 强化血肉
    base: 你的英雄随机获得{least}至{most}点护甲。
    radiant: "幸运1\n你的英雄随机获得{least}至{most}点护甲。"
stinkyscape-146: # Flash Freeze
  flavour: The moment you look at it, everything stops. Including you.
  voice:
    cast: Everybody freeze! Nobody move!
  zh:
    name: 急速冻结
    base: 抽到时施放：冻结所有单位。
    radiant: 抽到时施放：冻结所有敌方单位。
stinkyscape-147: # IN33DH3
  flavour: Ask him anything. He will ask the AI.
  voice:
    play: Hold on, let me ask the AI.
    attack: Optimal.
    death: Ctrl Z, please.
  zh:
    name: IN33DH3
    base: "战吼：在你本回合的剩余时间里，AI会帮助你做出帕累托最优的决策。\n亡语：将一张至尊IN33DH3洗入你的牌库。"
    radiant: "战吼：在你本回合的剩余时间里，AI会帮助你做出帕累托最优的决策。\n亡语：将一张光辉至尊IN33DH3洗入你的牌库。"
stinkyscape-147-1: # IN33DH3 Prime
  flavour: He stopped asking the AI. Now the AI asks him.
  voice:
    play: Prime time. Drums, please.
    attack: Optimal violence.
    death: Rebooting...
  zh:
    name: 至尊IN33DH3
    base: 战吼：召唤一个战鼓团块。
    radiant: 战吼：召唤一个光辉战鼓团块。
stinkyscape-147-2: # Wardrum Blob
  flavour: It hums, it wobbles, and it plays a little better than you.
  voice:
    cast: Boom, boom. Helpful noises.
  zh:
    name: 战鼓团块
    base: "光环：AI总会帮助你做出帕累托最优的决策。\n回合开始时：做点有帮助的事。"
    radiant: "光环：AI总会帮助你做出帕累托最优的决策。\n回合开始时：做点真正有帮助的事。"
stinkyscape-148: # Alteran Reach
  flavour: Twenty jumps to the edge of everything, and a souvenir at every stop.
  voice:
    cast: The stars stretch on forever.
  zh:
    name: 奥特兰疆域
    base: "不可摧毁\n激活♾️：支付(1)点法力值，沿你的星图航行一个节点并获得其奖励。\n第20个节点是宇宙的尽头：抵达那里会将一张宇宙边缘置入你的手牌。"
    radiant: "不可摧毁\n你每回合的第一次航行免费。\n激活♾️：支付(1)点法力值，沿你的星图航行一个节点并获得其奖励。\n第20个节点是宇宙的尽头：抵达那里会将一张宇宙边缘置入你的手牌。"
stinkyscape-148-1: # Edge of the Universe
  flavour: You did not win the war. You just walked off the edge of the map.
  voice:
    cast: Beyond this, nothing. Goodbye.
  zh:
    name: 宇宙边缘
    base: 逃离宇宙：你赢得本局对战，而对你的对手而言这是一场平局。
    radiant: 逃离宇宙：你赢得本局对战，并由你选择对你的对手而言这是一场平局还是一场失败。
stinkyscape-149: # Wildar
  flavour: Wildar always shares the chaos. Wildar always keeps the better half.
  voice:
    cast: One for you, a better one for me.
  zh:
    name: 怀尔达
    base: 将一张随机混沌召唤置入你对手的手牌，其法力值消耗为(0)。然后将一张随机光辉混沌召唤置入你的手牌。
    radiant: 将一张随机混沌召唤置入你对手的手牌，其法力值消耗为(0)。然后将一张随机光辉混沌召唤置入你的手牌，其法力值消耗为(0)。
stinkyscape-150: # Call to Chaos (Stinky Edition)
  flavour: The stinkiest roll in the known universe, and somehow the luckiest.
  voice:
    cast: Hold your nose and roll the dice!
  zh:
    name: 混沌召唤（臭臭版）
    base: 一个随机效果：将一张光辉阵营：伦理会和一张光辉阵营：先锋联盟置入你的手牌；将一位非常时髦的小伙和一张北极堡垒置入你的手牌，它们的法力值消耗为(0)；将3张随机任务或胜利条件场地法术召唤到你的后场；将一张随机赞誉臭臭星景单位牌置入你的手牌，并复原等同于其法力值消耗的法力值；将所有敌方单位切换为攻击表示并冻结它们；用随机人类臭臭星景单位填满你的单位区；迷惑所有敌方单位；在本局对战的剩余时间内，每当一张赞誉牌死亡时，其控制者施放一张随机混沌召唤；召唤一个臭臭星景魔像；施放一张随机混沌召唤。
    radiant: 三个不同的随机效果，按所列顺序结算：将一张光辉阵营：伦理会和一张光辉阵营：先锋联盟置入你的手牌；将一位非常时髦的小伙和一张北极堡垒置入你的手牌，它们的法力值消耗为(0)；将3张随机任务或胜利条件场地法术召唤到你的后场；将一张随机赞誉臭臭星景单位牌置入你的手牌，并复原等同于其法力值消耗的法力值；将所有敌方单位切换为攻击表示并冻结它们；用随机人类臭臭星景单位填满你的单位区；迷惑所有敌方单位；在本局对战的剩余时间内，每当一张赞誉牌死亡时，其控制者施放一张随机混沌召唤；召唤一个臭臭星景魔像；施放一张随机混沌召唤。
stinkyscape-150-1: # Stinkyscape Golem
  flavour: Built from whatever the stars left lying around, and it smells like it.
  voice:
    play: Stinkyscape golem! Smash the stars!
    attack: Golem smash!
    death: Back to stardust.
  zh:
    name: 臭臭星景魔像
    base: 星舰部件，飞行，远程，突袭
    radiant: 星舰部件，飞行，远程，突袭
stinkyscape-151: # Call to Chaos (Scape Edition)
  flavour: The whole starscape rolls the dice at once, and you are standing on the table.
  voice:
    cast: Strap in. The cosmos rolls the dice!
  zh:
    name: 混沌召唤（星景版）
    base: 一个随机效果：将你这一侧的场面替换为一个随机异常，十种中任意一种；召唤3个无人护卫舰；召唤无人战列舰；从核心系统、安全系统、不安全系统和狂野系统中随机施放2张不同的牌；将4张随机星舰部件牌置入你的手牌，它们的法力值消耗为(0)；在你的每个单位区召唤一个无人截击机，堆叠在其中已有的单位之上；将4张随机星舰部件牌融合进你的休眠星舰，然后将其发射；将2张随机光辉武器牌置入你的手牌，它们的法力值消耗为(0)；在本局对战的剩余时间内，市场每回合都会以20信用点向你出售一张混沌召唤；施放一张随机混沌召唤。
    radiant: 三个不同的随机效果，按所列顺序结算：将你这一侧的场面替换为一个随机异常，十种中任意一种；召唤3个无人护卫舰；召唤无人战列舰；从核心系统、安全系统、不安全系统和狂野系统中随机施放2张不同的牌；将4张随机星舰部件牌置入你的手牌，它们的法力值消耗为(0)；在你的每个单位区召唤一个无人截击机，堆叠在其中已有的单位之上；将4张随机星舰部件牌融合进你的休眠星舰，然后将其发射；将2张随机光辉武器牌置入你的手牌，它们的法力值消耗为(0)；在本局对战的剩余时间内，市场每回合都会以20信用点向你出售一张混沌召唤；施放一张随机混沌召唤。
stinkyscape-152: # Sanctum
  flavour: Nothing in here is ever truly finished.
  voice:
    cast: Rest here, and rise again.
  zh:
    name: 圣所
    base: "不可摧毁\n光环：你牌库和墓地中的每张牌都拥有闪回。"
    radiant: "不可摧毁\n战吼：获得{mana}点法力值。\n光环：你牌库和墓地中的每张牌都拥有闪回。"
stinkyscape-153: # Stimmycheck
  flavour: Free money! Prices may vary. Prices will vary.
  voice:
    cast: Free money! Read the fine print later.
  zh:
    name: 刺激支票
    base: "获得{mana}点法力值。通货膨胀：你手牌和牌库中的每张牌都有{chance}%的几率使其法力值消耗增加(1)点。\n在本回合结束时，将一张刺激支票置入你的手牌。其通货膨胀几率提高10%。"
    radiant: "幸运1\n获得{mana}点法力值。通货膨胀：你手牌和牌库中的每张牌都有{chance}%的几率使其法力值消耗增加(1)点。\n在本回合结束时，将一张光辉刺激支票置入你的手牌。其通货膨胀几率提高10%。"
    previews:
      "{chance}% chance": "{chance}%的几率"
stinkyscape-154: # Dice of Doom
  flavour: Sixty-seven. It is always, eventually, sixty-seven.
  voice:
    cast: Come on, sixty-seven!
  zh:
    name: 末日骰子
    base: "掷一枚100面骰。如果结果为67，将每张终点牌置入你的手牌。它们的法力值消耗为(0)。\n回合结束时：将这张牌放回你的手牌。\n加码(1)：这张牌还会永久获得幸运+1。"
    radiant: "掷两次80面骰。如果任意一次结果为67，将每张终点牌置入你的手牌。它们的法力值消耗为(0)。\n回合结束时：将这张牌放回你的手牌。\n加码(1)：这张牌还会永久获得幸运+1。"
stinkyscape-155: # Comet Crash
  flavour: It landed, it burned, and it left the crater full of riches.
  voice:
    cast: Brace for impact! Mind the crater.
  zh:
    name: 彗星撞击
    base: "陨坑，易碎1\n亡语：获得{resources}个随机臭臭星景资源。"
    radiant: "陨坑，易碎1\n亡语：获得{resources}个随机光辉臭臭星景资源。"
stinkyscape-156: # Catalyst Comet
  flavour: It never lands. It just keeps coming back around with something new.
  voice:
    cast: Catch it on the way back!
  zh:
    name: 催化彗星
    base: 将一张随机催化剂牌置入你的手牌。将这张牌洗入你的牌库。
    radiant: 将一张随机光辉催化剂牌置入你的手牌。将这张牌洗入你的牌库。
stinkyscape-157: # The Gauntlet
  flavour: Three lanes in, no lanes out.
  voice:
    cast: Welcome to the Gauntlet! Nobody leaves.
  zh:
    name: 夹道试炼
    base: "易碎3\n中间3条纵列的单位区被困在夹道试炼之中。那里的单位只能互相攻击，其他单位也无法攻击它们。"
    radiant: "易碎3\n中间3条纵列的单位区被困在夹道试炼之中。那里的单位只能互相攻击，其他单位也无法攻击它们。\n激活：抉择：使此牌获得+{brittleGain}易碎；或献祭此牌。"
stinkyscape-158: # Stratos Swarm
  flavour: Cheap ships in bulk. Somewhere, an accountant is very proud of this.
  voice:
    cast: Squadron launch. All wings, go!
  zh:
    name: 斯塔托斯蜂群
    base: 用斯塔托斯填满你的单位区。
    radiant: 用光辉斯塔托斯填满你的单位区。
stinkyscape-159: # Faction: ETHICS
  flavour: The board met, deliberated at length, and approved absolutely everything.
  voice:
    cast: The committee will see you now.
  zh:
    name: 阵营：伦理会
    base: 将iKwzki、Shockwave447、xxFreshJack、Tnack Trav、Kwzka和Tylannt各一张置入你的手牌。
    radiant: 将iKwzki、Shockwave447、xxFreshJack、Tnack Trav、Kwzka和Tylannt的光辉版各一张置入你的手牌。
stinkyscape-160: # Faction: Golden Accord
  flavour: Gold-leaf signatures on a treaty nobody read past the first page.
  voice:
    cast: Signed, sealed and golden.
  zh:
    name: 阵营：黄金协定
    base: 将典范Mk1、典范Mk2、典范-X和猎鹰各一张置入你的手牌。
    radiant: 将典范Mk1、典范Mk2、典范-X和猎鹰的光辉版各一张置入你的手牌。
stinkyscape-161: # Faction: Pegasus
  flavour: Wings, style and a very expensive tailor.
  voice:
    cast: Spread your wings, darlings!
  zh:
    name: 阵营：飞马
    base: 将一位非常时髦的小伙、Tmack Trav、Gokugains和北极堡垒各一张置入你的手牌。
    radiant: 将一位非常时髦的小伙、Tmack Trav、Gokugains和北极堡垒的光辉版各一张置入你的手牌。
stinkyscape-162: # Faction: Star-Jumper Core
  flavour: One core, five ships, no refunds.
  voice:
    cast: Core online. Prepare to jump.
  zh:
    name: 阵营：跃星核心
    base: 将獾、蜜獾、奥扎克、虎鲸和银河各一张置入你的手牌。
    radiant: 将獾、蜜獾、奥扎克、虎鲸和银河的光辉版各一张置入你的手牌。
stinkyscape-163: # Swear Loyalities
  flavour: Pick a side. The other four will never forgive you, or the spelling.
  voice:
    cast: Choose your side. Forever.
  zh:
    name: 宣誓效忠
    base: 从阵营：先锋联盟、阵营：伦理会、阵营：黄金协定、阵营：飞马和阵营：跃星核心中选择一个阵营宣誓效忠：将其阵营牌置入你的手牌，然后放逐你手牌和牌库中所有属于其他阵营的牌。
    radiant: 从阵营：先锋联盟、阵营：伦理会、阵营：黄金协定、阵营：飞马和阵营：跃星核心中选择一个阵营宣誓效忠：将其光辉阵营牌置入你的手牌，然后放逐你手牌和牌库中所有属于其他阵营的牌。
stinkyscape-164: # The Syndicate
  flavour: Every deal goes through the Syndicate. Some deals never come back.
  voice:
    cast: Nice card. Shame if it went missing.
  zh:
    name: 辛迪加
    base: "可交易\n光环：你手牌中的牌具有可交易。\n每当你交易一张牌时，你洗入牌库的那张牌有{exileChance}%的几率被放逐，有{radiantChance}%的几率变为光辉。"
    radiant: "可交易\n光环：你手牌中的牌具有可交易。\n每当你交易一张牌时，你洗入牌库的那张牌有{exileChance}%的几率被放逐，有{radiantChance}%的几率变为光辉。"
stinkyscape-165: # The Trade Union
  flavour: One card, one trade. Unless you've paid your dues.
  voice:
    cast: Solidarity! Every card gets a fair trade.
  zh:
    name: 贸易联盟
    base: "可交易\n光环：你手牌中的牌具有可交易。"
    radiant: "可交易\n光环：你手牌中的牌具有可交易。你每回合最多可以交易{trades}张牌。"
stinkyscape-166: # Scanning Probe Mk1
  flavour: Ping. Nothing. Ping. Nothing. Ping. Wait, what was that?
  voice:
    cast: Scanning. Something is out there.
  zh:
    name: 扫描探测器Mk1
    base: "有5%的几率将一张光辉发现异常！置入你的手牌。\n改为有20%的几率将一张发现异常！置入你的手牌。\n否则，你之后的扫描探测器的上述两项几率分别提高1%和4%。"
    radiant: "幸运1\n有5%的几率将一张光辉发现异常！置入你的手牌。\n改为有20%的几率将一张发现异常！置入你的手牌。\n否则，你之后的扫描探测器的上述两项几率分别提高1%和4%。"
    previews:
      "5% chance": "5%的几率"
      "20% chance": "20%的几率"
stinkyscape-167: # Scanning Probe Mk2
  flavour: Twice the antenna, half the patience.
  voice:
    cast: Deep scan engaged. Listening.
  zh:
    name: 扫描探测器Mk2
    base: "幸运1\n有5%的几率将一张光辉发现异常！置入你的手牌。\n改为有20%的几率将一张发现异常！置入你的手牌。\n否则，你之后的扫描探测器的上述两项几率分别提高1%和4%。"
    radiant: "幸运3\n有5%的几率将一张光辉发现异常！置入你的手牌。\n改为有20%的几率将一张发现异常！置入你的手牌。\n否则，你之后的扫描探测器的上述两项几率分别提高1%和4%。"
    previews:
      "5% chance": "5%的几率"
      "20% chance": "20%的几率"
stinkyscape-168: # Drone Hanger
  flavour: Spelled wrong on the blueprint. Nobody dared to correct it.
  voice:
    cast: Hangar doors open. Interceptor away.
  zh:
    name: 无人机机库
    base: 回合开始时：召唤一个无人截击机。
    radiant: 回合开始时：召唤一个光辉无人截击机。
stinkyscape-169: # Tiny Asteroid
  flavour: Small enough to mine before lunch.
  voice:
    play: Pebble reporting for mining duty.
    attack: Rumble.
    death: Crumbled into loot.
  zh:
    name: 微型小行星
    base: "无法攻击，无法守备\n亡语：获得{resources}个随机臭臭星景资源。\n激活：受到{selfDamage}点伤害。献祭这张牌。"
