    radiant: 随机三种不同的效果，按所列顺序结算：将5张随机水果牌置入你的手牌，它们的法力值消耗为(0)；将3张随机书牌置入你的手牌，它们的法力值消耗为(0)；消灭所有敌方永久物；将3张随机经典牌置入你的手牌，它们的法力值消耗为(0)；强化你手牌和牌库中的每张牌两次；向你牌库中的每张牌融合一张随机牌，每张牌保持其法力值消耗不变；削弱你对手场上和手牌中的每张牌三次；召唤一个经典魔像；将你的牌库替换为随机混沌召唤牌，它们的法力值消耗为(0)；随机施放一张混沌召唤或混沌召唤。
classicplus-073-1: # Classic Golem
