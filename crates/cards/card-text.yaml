  voice:
    play: Fresh cookies, guild approved!
    attack: Fresh from the oven!
    death: Crumbs. Nothing but crumbs.
  zh:
    name: 曲奇公会
    base: 战吼：招募{units}个法力值消耗为({costLimit})或更低的单位。
    radiant: 战吼：招募{units}个法力值消耗为({costLimit})或更低的单位。
classic-032: # Felinor Feelings
  flavour: The cat claims it. It's the cat's now.
  voice:
    cast: Purr. I have so many feelings.
  zh:
    name: 猫族心意
    base: 在一个你控制着法力值消耗为(1)的单位的纵列中，夺取一个敌方单位。
    radiant: 召唤一个猫族衍生物。然后在一个你控制着法力值消耗为(1)的单位的纵列中，夺取一个敌方单位。
classic-033: # Joro
