traininggrounds-039: # Call to Chaos (Training-Grounds Edition)
  flavour: The final exam, graded by dice.
  voice:
    cast: Class is chaos! Roll the dice!
  zh:
    name: 混沌召唤（训练场版）
    base: 一个随机效果：召唤3个突袭衍生物，然后使你场上、手牌中和牌库中的单位获得嘲讽和圣盾；用高兹曼游戏设计填满你的手牌，并刷新4点法力值；将4张随机训练场牌置入你的手牌，它们的法力值消耗为(0)；获得8点法力值并抽2张牌；召唤6个随机训练场永久物；将2张随机光辉训练场牌置入你的手牌，它们的法力值消耗为(0)；召唤5个突袭衍生物，并在本局对战的剩余时间内使你的单位拥有突袭、践踏和穿透；召唤一个训练场魔像；现在以及在本局对战剩余时间内你的每第二个回合开始时，将一张随机混沌召唤置入你的手牌，其法力值消耗为(0)；施放一张随机混沌召唤。
    radiant: 三个不同的随机效果，按所列顺序结算：召唤3个突袭衍生物，然后使你场上、手牌中和牌库中的单位获得嘲讽和圣盾；用高兹曼游戏设计填满你的手牌，并刷新4点法力值；将4张随机训练场牌置入你的手牌，它们的法力值消耗为(0)；获得8点法力值并抽2张牌；召唤6个随机训练场永久物；将2张随机光辉训练场牌置入你的手牌，它们的法力值消耗为(0)；召唤5个突袭衍生物，并在本局对战的剩余时间内使你的单位拥有突袭、践踏和穿透；召唤一个训练场魔像；现在以及在本局对战剩余时间内你的每第二个回合开始时，将一张随机混沌召唤置入你的手牌，其法力值消耗为(0)；施放一张随机混沌召唤。
