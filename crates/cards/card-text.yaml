  voice:
    cast: Rewind. Let's try that again.
  zh:
    name: 倒带
    base: 触发你在场上或墓地中的一个单位的战吼。
    radiant: 触发场上或任一墓地中任意一个单位的战吼{repeats}次。
classic-055: # Book of Wildfire
  flavour: The forest fire that spells itself.
  voice:
    cast: This chapter spreads like wildfire.
  zh:
    name: 野火之书
    base: "造成{damage}点伤害。\n回合结束时：变为另一张随机书牌。"
    radiant: "造成{damage}点伤害。\n回合结束时：变为另一张随机光辉书牌。"
classic-056: # Spell Tyrant
