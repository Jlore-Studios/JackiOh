# Every card's words other than its rules, the one file to edit for them (#2498): each catalog card's
# and token's flavour line and artist (R660), its voice lines (R655, R1088, R1448) and its name and
# faces in Simplified Chinese (ME-CN, R1303), and the six hero portraits' emote lines (R644). A card's
# English name and face text are catalog.json's; the voice that speaks each line and the effect beside
# it are apps/web/src/audio/card-audio.json5's.
#
# One entry per catalog card and token, keyed by its id in catalog order, with the card's name in a
# comment on the line of its id. The name is for people; a test checks it against the catalog, so a
# renamed card's comment changes with it. Every string is trimmed and on one line. Quote one that YAML
# would read otherwise: one starting with a quote, a bracket, a digit or a symbol, or holding ": " or
# " #", or a word like yes, no or null.
#   flavour  a line of words about the card, 120 characters at most, no rules words
#   artist   the credited artist of the card's art, 60 characters at most
#   voice    the card's spoken lines, each in letters, spaces and , . ' ! ? - only: a Unit's play,
#            attack and death, anything else's cast, and for a card whose effect summons a trigger
#            list (R1088). Each needs its hook, with the voice that speaks it, in card-audio.json5.
#   zh       name, base and radiant, each face with exactly the {key}s its English face has, and
#            previews (English label template: Chinese one) where the card's script previews one
#   emotes   per portrait id, its five lines: greetings, wellPlayed, oops, thanks and threaten
#
# Nothing reads this file but crates/tools/tests/export_card_text.rs, which writes what the readers
# take from it (no pure crate parses YAML, CLAUDE.md rule 4): crates/cards/flavour.json,
# crates/cards/chinese.json and apps/web/src/audio/voice-text.json. After an edit, run
#   cargo test -p jackioh-tools --test export_card_text
# and commit the three files with it; the test fails while one is stale. A new or changed voice line
# also has to be rendered (docs/ADDING_CARDS.md §7).

