    radiant: 激活♾️：随机弃掉一张牌。放逐你对手牌库底部的{exile}张牌以及其手牌中的一张随机牌。
classic-016: # Book of Flame
  flavour: "Page one: fire. Page two: more fire."
  voice:
    cast: Page one hundred. Everything burns.
  zh:
    name: 烈焰之书
    base: "践踏\n造成{damage}点伤害。"
    radiant: "践踏\n造成{damage}点伤害。"
classic-017: # Counterspell
  flavour: No.
  voice:
    cast: Not today, spellcaster.
  zh:
    name: 法术反制
    base: 当你的对手打出一张法术时揭示：反制它。
    radiant: 当你的对手打出一张法术时揭示：反制它。将它的一张复制置入你的手牌。该复制的法力值消耗为({setCost})。
classic-018: # Glitch in the System
  flavour: A typo in reality, and every matching card goes missing.
  voice:
    cast: Error. Error. Reality not found.
  zh:
    name: 系统故障
    base: 选择一个数字。放逐场上所有法力值消耗等于该数字的牌。
    radiant: 选择一个数字。放逐你对手场上、手牌中和牌库中所有法力值消耗等于该数字的牌。
classic-019: # Lizard's Breath
  flavour: One breath, and the lizard decides what you meant by it.
  voice:
    cast: Hiss! Smell that lizard breath!
  zh:
    name: 蜥蜴吐息
    base: 造成{damage}点伤害。你最大的牌堆会追加其效果：牌库，抽{draw}张牌；墓地，获得{mana}点法力值；放逐区，额外造成{extraDamage}点伤害。数量相同时，以先列出的牌堆为准。
    radiant: 造成{damage}点伤害。你最大的两个牌堆会追加其效果：牌库，抽{draw}张牌；墓地，获得{mana}点法力值；放逐区，额外造成{extraDamage}点伤害。数量相同时，以先列出的牌堆为准。
    previews:
      Your largest pile: 你最大的牌堆
      Your two largest piles: 你最大的两个牌堆
classic-020: # The Power to Punish
  flavour: Pick your punishment. All three are on the menu.
  voice:
    cast: Every sin shall be punished.
  zh:
    name: 惩戒之力
    base: 激活：抉择：造成{damage}点穿透伤害；你的对手随机弃掉{discards}张牌；或者选择一个单位，它会在你的下个回合开始时被消灭。
    radiant: 激活：抉择：造成{damage}点穿透伤害；你的对手随机弃掉{discards}张牌；或者所有敌方单位会在你的下个回合开始时被消灭。
classic-021: # Turtinator
  flavour: Slow, steady, and armed with a turret.
  voice:
    play: Shell shocked and ready to roll.
    attack: Shell slam!
    death: Flipped on my back again.
  zh:
    name: 龟结者
    base: 激活：献祭另一个单位。造成等同于{multiplier}×其攻击力的伤害。
    radiant: 激活：献祭另一个单位。造成等同于{multiplier}×其攻击力的伤害。
classic-022: # Mid Runner
  flavour: Mid lane is his lane. He'll leave if you ask nicely.
  voice:
    play: Middle lane is mine, team.
    attack: Diving mid!
    death: Mid is down. Report the jungler.
  zh:
    name: 中路跑者
    base: 战吼：如果此单位位于中间纵列，献祭此单位。如果你打出此单位时拥有{threshold}点或更多法力值，弹回{bounces}个随机敌方永久物。
    radiant: 战吼：如果此单位位于中间纵列，献祭此单位。如果你打出此单位时拥有{threshold}点或更多法力值，弹回{bounces}个随机敌方永久物。
classic-023: # Devil's Pact
  flavour: Signed in ink, paid in cards, read in flames.
  voice:
    cast: Sign here. Your soul, please.
  zh:
    name: 恶魔契约
    base: "不可摧毁，法术伤害+1\n战吼：随机弃掉{discards}张牌。\n激活：在本回合中，你打出的每张牌都会被替换为一张烈焰之书。"
    radiant: "不可摧毁，法术伤害+2\n战吼：随机弃掉{discards}张牌。\n激活：在本回合中，你打出的每张牌都会被替换为一张烈焰之书。"
classic-024: # Book of Knowledge
  flavour: Knowledge is power. Power is more cards.
  voice:
    cast: Knowledge is power. Read on.
  zh:
    name: 知识之书
    base: 抽{least}-{most}张牌。
    radiant: 抽{least}-{most}张牌。
classic-025: # Lag in the System
  flavour: Hold on, it's buffering. The cheap stuff is gone.
  voice:
    cast: Please... wait... buffering...
  zh:
    name: 系统延迟
    base: 放逐场上所有法力值消耗为({threshold})或更低的牌。
    radiant: 放逐场上以及你对手手牌和牌库中所有法力值消耗为({threshold})或更低的敌方牌。
classic-026: # Rapid Draw
  flavour: Draw fast, think fast, toss the worst.
  voice:
    cast: Fastest hands in the west!
  zh:
    name: 急速抽牌
    base: 抽{draw}张牌。然后随机弃掉{discard}张牌。
    radiant: 抽{draw}张牌。然后随机弃掉{discard}张牌。
classic-027: # Pestilent Slime
  flavour: It loves company, especially the itchy kind.
  voice:
    play: Blorp. Squelch. Hello!
    attack: Blorp attack!
    death: Splat.
  zh:
    name: 疫病软泥怪
    base: "放置在此单位上的瘟疫指示物数量乘以{multiplier}。\n亡语：将其瘟疫指示物分散放置在你的永久物上。"
    radiant: "放置在此单位上的瘟疫指示物数量乘以{multiplier}。\n亡语：将其瘟疫指示物分散放置在你的永久物上。"
classic-028: # Second Wind
  flavour: Once you've lost everything, the old stuff starts looking good.
  voice:
    cast: Not done yet. Deep breath.
  zh:
    name: 重振旗鼓
    base: "战吼：放逐你的牌库。弃掉你的手牌。\n光环：你可以从你的墓地中打出法力值消耗为({minCost})或更高的牌。即将进入你墓地的牌会改为被放逐。"
    radiant: "战吼：放逐你的牌库。弃掉你的手牌。\n光环：你可以从你的墓地中打出法力值消耗为({minCost})或更高的牌。"
classic-029: # Book of Vital Kill
  flavour: Thirteen is an unlucky number. Ask the hero who got it.
  voice:
    cast: The final chapter. How tragic.
  zh:
    name: 致命之书
    base: "将一名英雄的生命值设为13。\n结束回合。"
    radiant: 将一名英雄的生命值设为13。
classic-030: # Recycle
  flavour: Old cards, new shuffle.
  voice:
    cast: Reduce, reuse, recycle!
  zh:
