[package]
name = "jackioh-luau"
description = "The Luau host for card scripts (#442 L3–L8): the sandbox, the integer boundary, the lint and one VM per thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Pure (CLAUDE.md rule 4), as the engine is, plus mlua (#442 L3), which compiles Luau's C++ (`g++`).
jackioh-engine = { workspace = true }
indexmap = { workspace = true }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Off by default, as the engine's `ts` is: the typed module's generator (`tests/export_api.rs`) runs
# with `cargo test -p jackioh-luau --features ts --test export_api`, and nothing else derives types.
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "jackioh-engine/ts"]

[dev-dependencies]
jackioh-engine = { workspace = true, features = ["testkit"] }
# #913: the kit's twins play beside the official cards' Rust scripts (`tests/kit.rs`). No cycle: since
# #902 the cards take nothing of this crate.
jackioh-cards = { workspace = true }
