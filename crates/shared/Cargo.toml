[package]
name = "jackioh-shared"
description = "The logic the JackiOh server and its clients share, pure (CLAUDE.md rule 4): the Conquest series rules (SPEC §9.5), the match host's machine and the ladder bots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Pure (CLAUDE.md rule 4): serde, indexmap, the engine and, behind `ts`, ts-rs. It may also take serde_json,
# the cards, the AI and the run, never jackioh-luau, and none of them takes it. The host machine's and the
# loadout's tests play whole games under the real catalog, which these dependencies carry.
jackioh-engine = { workspace = true }
# The host machine asks the AI who owes a move (`ai_to_act`) and reads a panic's text (`panic_message`).
jackioh-ai = { workspace = true }
# The practice session names a kept game's catalog as the cards crate does (`version_name_from`, R1371000)
# and reads a dungeon run's fight (`run_fight_report`, R2706000); `serde_json` carries the cosmetics of a
# saved deck, which only the page reads.
jackioh-cards = { workspace = true }
jackioh-run = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
indexmap = { workspace = true }
# Off by default, as the engine's and the run's `ts` are: the types that cross the boundary (README.md, the
# host contract) are written to `apps/web/src/wire/generated/` by `cargo test -p jackioh-shared --features ts`,
# and nothing else derives types.
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "jackioh-engine/ts", "jackioh-run/ts"]
