[package]
name = "jackioh-shared"
description = "The logic the JackiOh server and its clients share, pure (CLAUDE.md rule 4): the Conquest series rules (SPEC §9.5), the match host's machine, the ladder bots and the collection economy's rolls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Compiles the face model's data in (the glossary, the powers, the short forms, the translations): build.rs.
build = "build.rs"

[dependencies]
# Pure (CLAUDE.md rule 4): serde, indexmap, the engine and, behind `ts`, ts-rs. It may also take serde_json,
# the cards, the AI and the run, and none of them takes it. The host machine's and the
# loadout's tests play whole games under the real catalog, which these dependencies carry.
jackioh-engine = { workspace = true }
# The host machine asks the AI who owes a move (`ai_to_act`) and reads a panic's text (`panic_message`).
jackioh-ai = { workspace = true }
# The cosmetics registry is parsed here (`cosmetics.json`, compiled in), and an offer is judged against the
# shipped catalog (`jackioh_cards::catalog_json`); the loadout tests deal a real game from it
# (`tests/loadout.rs`), the face tests register it the way a host does (`jackioh_cards::register_all`), and
# the host machine's tests play whole games under it.
jackioh-cards = { workspace = true }
# The practice session reads a dungeon run's fight (`run_fight_report`, R2706000); `serde_json` also carries the
# cosmetics of a saved deck, which only the page reads.
jackioh-run = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
# Off by default, as the engine's and the run's `ts` are: the types that cross the boundary (README.md, the
# host contract) are written to `apps/web/src/wire/generated/` by `cargo test -p jackioh-shared --features ts`,
# and nothing else derives types.
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "jackioh-engine/ts", "jackioh-run/ts"]

[build-dependencies]
# build.rs reads data/*.json and the cards' Chinese tables: a build script runs at compile time, which
# is where data reaches a pure crate (rule 4).
serde_json = { workspace = true }
