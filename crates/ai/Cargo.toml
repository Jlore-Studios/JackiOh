[package]
name = "jackioh-ai"
description = "The JackiOh practice opponent (SPEC §9.9; docs/v0.3.0/SURFACE.md §9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Pure (SURFACE §3): serde, serde_json, indexmap and the engine. Nothing else.
jackioh-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

[build-dependencies]
# build.rs reads src/learned/weights.json (#1010). Build scripts are not the pure crate: they run at
# compile time, which is where data reaches a pure crate (CLAUDE.md rule 4).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
jackioh-cards = { workspace = true }
jackioh-engine = { workspace = true, features = ["testkit"] }
