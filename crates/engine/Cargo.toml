[package]
name = "jackioh-engine"
description = "The JackiOh rules engine, its wire types and the deck validator (SPEC.md; docs/v0.3.0/SURFACE.md §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# `jackioh_engine::testkit`: scenario() and the invariant monitor (SURFACE §8). Every test crate
# enables it as a dev-dependency feature.
testkit = []
# #3117: every random pool `catalog::query` returns comes back rotated `POOL_PROBE_SHIFT` places, so each
# draw lands on its neighbour as it would after a card joined the pool (R380); a test that leans on where a
# roll lands then fails. Implies `testkit`; `sh scripts/pool-probe.sh` runs the suites under it.
pool-probe = ["testkit"]
# The client's generated TypeScript types (SURFACE §5.1):
# `cargo test -p jackioh-engine --features ts export_bindings`.
ts = ["dep:ts-rs"]

[dependencies]
# Pure (SURFACE §3): serde, serde_json, indexmap and, behind `ts`, ts-rs. Nothing else.
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# The golden binary's committed logs and the rule benders run the real cards (SURFACE §2, §13).
jackioh-cards = { workspace = true }

# The integration-test binaries for the ported engine tests (SURFACE §1), the modules of
# `tests/rules/` from `a` to `o` in `rules`, from `p` through `r` in `rules_2` and the rest in
# `rules_3`, which compile side by side in CI (#2090, #2957). They reach the engine through
# `jackioh_engine::testkit`, so they build only with that feature:
# `cargo test -p jackioh-engine --features testkit --test 'rules*'`.
[[test]]
name = "rules"
path = "tests/rules.rs"
required-features = ["testkit"]

[[test]]
name = "rules_2"
path = "tests/rules_2.rs"
required-features = ["testkit"]

[[test]]
name = "rules_3"
path = "tests/rules_3.rs"
required-features = ["testkit"]

# The golden replay (§13), through `jackioh_engine::testkit::golden`, which `cargo jackioh golden check`
# shares (#1641), so it too builds only with that feature.
[[test]]
name = "golden"
path = "tests/golden.rs"
required-features = ["testkit"]
