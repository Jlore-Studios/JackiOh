# The pure crates' purity lint (CLAUDE.md rule 4). The same file sits in crates/engine, crates/cards,
# crates/ai and crates/luau: crates/tools/tests/acceptance.rs holds the four byte for byte the same and
# runs clippy over crates/tools/tests/fixtures/purity.rs, one use of each entry, so each one fires.
# Left free on purpose: Cell and thread::LocalKey (the engine's and luau's declared seams), OnceLock
# and LazyLock (statics set once), mpsc (the tests' channels) and the atomics of the tests' nonces.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random per process: use indexmap::IndexMap (insertion order, like a JS Map) or BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order is random per process: use indexmap::IndexSet or BTreeSet" },
  { path = "std::time::Instant", reason = "CLAUDE.md rule 4: no clocks in pure crates" },
  { path = "std::time::SystemTime", reason = "CLAUDE.md rule 4: no clocks in pure crates" },
  { path = "std::fs::File", reason = "CLAUDE.md rule 4: no I/O in pure crates" },
  { path = "std::thread::Thread", reason = "CLAUDE.md rule 4: no threads in pure crates" },
  { path = "std::sync::Mutex", reason = "no mutable statics: per-game state lives in GameState, per-call state in EngineSink" },
  { path = "std::sync::RwLock", reason = "no mutable statics" },
  { path = "std::cell::RefCell", reason = "no interior mutability in the rules" },
  { path = "std::hash::RandomState", reason = "CLAUDE.md rule 4: OS randomness, which the HashMap ban keeps out" },
  { path = "std::fs::OpenOptions", reason = "CLAUDE.md rule 4: no I/O in pure crates" },
  { path = "std::fs::DirBuilder", reason = "CLAUDE.md rule 4: no I/O in pure crates" },
  { path = "std::net::TcpListener", reason = "CLAUDE.md rule 4: no network in pure crates" },
  { path = "std::net::TcpStream", reason = "CLAUDE.md rule 4: no network in pure crates" },
  { path = "std::net::UdpSocket", reason = "CLAUDE.md rule 4: no network in pure crates" },
  { path = "std::process::Command", reason = "CLAUDE.md rule 4: no processes in pure crates" },
  { path = "std::process::Child", reason = "CLAUDE.md rule 4: no processes in pure crates" },
  { path = "std::thread::Builder", reason = "CLAUDE.md rule 4: no threads in pure crates" },
]
