[package]
name = "jackioh-wasm-core"
description = "The bodies the two wrappers bind (#1505, #3093): JSON strings in and out, the state cache and each binding's work, which `crates/wasm` wraps for wasm-bindgen and `crates/wasm/c` for C on a plain wasm32-unknown-unknown link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# R1420's `preview_sets`: the engine's testkit. Each module's `preview` feature turns this on.
preview = ["jackioh-engine/testkit"]
# #936's Duos bodies. Only `crates/wasm`'s `duos` feature turns this on; without it each body
# answers the reason.
duos = []

[dependencies]
jackioh-engine = { workspace = true }
jackioh-cards = { workspace = true }
jackioh-ai = { workspace = true }
jackioh-run = { workspace = true }
jackioh-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# #4426: turns the run's and the shared logic's `ts` features on in every test build of the workspace, so the
# `tools, wasm` CI group (`cargo test --workspace --exclude …`) writes their types into
# `apps/web/src/wire/generated/` and ci.yml's V20 step fails on any diff. Dev-dependency features never
# reach the WebAssembly modules or the release binaries. `crates/tools/tests/acceptance.rs` holds both.
jackioh-run = { workspace = true, features = ["ts"] }
jackioh-shared = { workspace = true, features = ["ts"] }
