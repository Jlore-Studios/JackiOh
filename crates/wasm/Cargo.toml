[package]
name = "jackioh-wasm"
description = "The WASM bindings the web client loads: JSON strings in and out (docs/v0.3.0/SURFACE.md §10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jackioh-wasm"
path = "src/main.rs"

[features]
default = []
# R1420's preview in the browser (`preview_sets`, #552): the engine's testkit, whose thread-local
# preview the binding sets. scripts/build-wasm.sh turns it on by default (development, the unit
# tests, the e2e client) and apps/web's `prebuild` turns it off for the production bundle
# (`JACKIOH_WASM_PREVIEW=0`), so a module a player loads can preview nothing.
preview = ["jackioh-engine/testkit"]
# #936's Duos bindings (`duos_create`, …), for `/dev/duos` alone, which only a development build
# serves: scripts/build-wasm.sh turns it on by default (the dev server, the e2e client) and apps/web's
# `prebuild` and `pretest` turn it off (`JACKIOH_WASM_DUOS=0`), so neither the module a player loads
# nor the one #442 L12 weighs carries them. Without it each binding fails with the reason.
duos = []

[dependencies]
jackioh-engine = { workspace = true }
jackioh-cards = { workspace = true }
jackioh-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
