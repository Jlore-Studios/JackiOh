# cargo-mutants' settings (#3490). Coverage (super.yml's llvm-cov, held to .github/coverage-floor.txt)
# proves a line ran; a mutant proves whether any test fails when the line is wrong. cargo-mutants
# changes one thing at a time (a function's body to a default value, an operator to another) and
# runs the mutated package's tests: a mutant they fail is killed, one they pass survived.
# `sh scripts/mutants.sh` runs it, one area's shard at a time or a branch's changed lines
# (`--in-diff`), and mutants.yml runs a shard of every area each week and writes each one's score to
# its summary.
#
# It is a tool, installed on its own (`cargo install cargo-mutants --locked`) and never a dependency:
# no crate takes the `mutants` crate (CLAUDE.md rule 4), so `#[mutants::skip]` is never used. A
# mutant no test can or should kill is left out below, by file or by name, each with its reason.

# Each mutant is tested by its own package's tests alone: the engine's rules are its own tests' to
# prove (CLAUDE.md, Architecture: the engine's tests use fixture scripts), never the cards'.
test_workspace = false

# The engine's testkit, which its `rules*` and `golden` tests require and every other crate's tests
# turn on through their dev-dependencies. Not `ts`, whose export_bindings tests only write
# apps/web/src/wire/. The opt-levels are ci.yml's `engine rules` group's
# (.github/ci/rust-test.toml): each mutant compiles its package and its tests again, so compiling is
# most of a mutant's time. No debug info, which only a debugger reads.
additional_cargo_args = [
  "--features",
  "jackioh-engine/testkit",
  "--config",
  "profile.test.package.jackioh-engine.opt-level=1",
  "--config",
  "profile.test.package.jackioh-cards.opt-level=0",
  "--config",
  "profile.test.debug=0",
]

# A mutant whose change breaks a lint the crate denies is still a mutant to test, not unviable.
cap_lints = true

# A mutant that loops forever is killed by its timeout: three times the unmutated tests' own time
# (cargo-mutants times them first), and never under two minutes, as long as the AI's tests and the
# games the golden replay and the tools' fuzz play take on a runner's four cores.
timeout_multiplier = 3.0
minimum_test_timeout = 120
# One that fills memory first, too fast for any timeout, is ended by scripts/mutants.sh's cap on a test
# binary's memory (TEST_MEMORY), which `cargo mutants` run by hand goes without.

# A mutant whose build never ends is killed by its timeout too: three times the unmutated build's
# time, which built every dependency as well, so a mutant's own build (its package and its tests,
# about 40 s in crates/shared against a 107 s baseline) never comes near it. cargo-mutants times no
# build by default: in crates/shared's first shard (mutants.yml on main, 2026-11-10) 248 of 249
# mutants finished, the test timeout killing two, and the last held its job until the step's five
# hours ended. One way a build never ends: with `cap_lints`, rustc's limit on a long constant
# evaluation is only a warning.
build_timeout_multiplier = 3.0

exclude_globs = [
  # The tests' own harness: scenario(), its verbs, the invariant monitor and the pool probe. A mutant
  # there asks whether the tests are right, which the tests that use it answer by failing for a
  # reason of their own; it judges no rule.
  "crates/engine/src/testkit/**",
  # Test modules in files of their own (`#[cfg(test)] mod tests;`).
  "**/tests.rs",
  "**/*_tests.rs",
  # The binaries' command lines: argument parsing and dispatch, which call the modules the tests
  # reach (crates/tools: every `cargo jackioh` command; crates/server: the server's boot).
  "crates/tools/src/main.rs",
  "crates/server/src/main.rs",
]

exclude_re = [
  # Display and Debug text: what a person reads in a log or a message, which no rule reads.
  '<impl (std::|core::)?(fmt::)?(Display|Debug) for ',
  # The plain build's stand-ins for the testkit's overrides (crates/engine/src/catalog.rs,
  # scripts.rs), each one `None` or `false`: under the testkit, which every test runs with, they are
  # compiled out, so no test can see them. Their testkit twins share their names and only reach the
  # harness (above).
  'replace (test_override|shipped_override|previewed|override_map) -> ',
  # crates/engine (#3514): Burn and Toxic's tick (R3540001), tick_at_turn_start's four `> 0`. A count is
  # never below 0 (`burn_on`, `toxic_on` and `counter_on` floor it there), so `>= 0` lets every acting Unit
  # into the targets and runs both hits at a count of 0. A hit of 0 is no damage instance (deal_damage
  # returns before step 1, R63) and Burn's drop from 0 is to 0, a change `set_counter` neither stores nor
  # reports; and a Unit that carried neither count at the read gains none inside the tick: its hits have no
  # source for a rider or a conversion (R3540002, R3540003), no state check runs (R59), and a replacement's
  # follow-up waits as work.
  'afflictions\.rs:.*replace > with >= in tick_at_turn_start',
  # crates/run (#3513): a boss card's slot is the last, Anything, and `run_check_setup` only asks
  # whether a card's slot is at or above each rank, so any index at or past the last fits the same
  # slots (`len - 1`, `len + 1` and `len / 1` alike).
  'replace - with (\+|/) in slot_needed',
  # crates/run (#3513): `weighted`'s fallback, `rows[rows.len() - 1]`, after the loop: a roll under the
  # weights' total always falls in one of them inside the loop, so the fallback is never reached.
  'replace - with (\+|/) in weighted',
  # crates/shared (#3513): `game_in_play` asks that the series be Playing and its last game have no
  # result, and `abandon_unstarted` that the last game be the one `next_match_id` names and have no
  # result. On every row the transitions make, a series is Playing exactly while its last game has no
  # result and carries `next_match_id`: `begin` pushes that game and sets Playing, `game_ended` gives it
  # its result and then ends the series or reopens the picks under a new id, `abandon_unstarted` pops
  # it, and `forfeit_series` runs only between games. So either half alone decides as both do.
  'replace && with \|\| in (game_in_play|abandon_unstarted)',
  # crates/shared (#3513): the bots' cosmetic draws compare a roll of the engine's Rng, in [0, 1), against
  # a share (`draw_wardrobe`) or a running sum of weights (`pick_by`): `<` and `<=` part only on a roll
  # exactly equal to it, one draw in 2^32 at a given bound, which no seed a test can find makes.
  'replace < with <= in (draw_wardrobe|pick_by)',
  # crates/shared (#3513): `pick_by`'s fallback after its loop, the last candidate of any weight: the
  # running sum adds the weights in the order `total` summed them, so it ends at `total` exactly, and a
  # roll of `next() * total` is below it, so the loop always returns first.
  'replace > with (==|<|>=) in pick_by',
  # crates/shared (#3513): a bot's username draws its register and its shape (`weighted`) and its
  # number's kind (`number`) by comparing a roll of the engine's Rng, in [0, 1), against a share or what
  # is left of one, none of them 0: as above, `<` and `<=` part only on a roll exactly equal to it. The
  # file's path keeps crates/run's own `weighted`, whose integer draw can equal its weight, out of it.
  'bots/names/mod\.rs:.*replace < with <= in (weighted|number)',
  # crates/shared (#3513): the bots' end-of-game habits (concessions, draw offers and answers, idle
  # turns, a rematch's offer and answer) compare a roll of the engine's Rng against a fitted share, as
  # above.
  'bots/signals\.rs:.*replace < with <= in (concedes|offers_draw|accepts_draw|idles_turn|rematch_plan)',
  # crates/shared (#3513): the pool's size is the weekly people times BOT_POOL_PER_WEEKLY_ACTIVE, 1.0,
  # and a count divided by 1.0 is the count times 1.0. Another share makes this mutant killable by
  # tests/bots_pool.rs's size test, and then this line goes.
  'replace \* with / in pool_target',
  # crates/shared (#3513): at exactly the target, plan_pool's retiring path retires none and the other
  # puts back and makes none, so `>` and `>=` plan the same empty change.
  'replace > with >= in plan_pool',
  # crates/shared (#3513): deal_bot_deck spells out AiDeckOptions' lean_set as None, its default, and
  # gated_sets as no set, which the default (AI_DECK_GATED_SETS, crates/ai/src/config.rs) also is while
  # it gates nothing: either field left to its default deals the same deck. A set gated there makes the
  # second killable (a bot's deck is a player's random deal, R1453), and then it leaves this line.
  'delete field (lean_set|gated_sets) from struct jackioh_ai::AiDeckOptions expression in deal_bot_deck',
  # crates/shared (#3513): rematch.rs's next_seats deals an All Random rematch a player's random decks (R1372,
  # R1453), spelling out three of AiDeckOptions' fields as the values their defaults deal alike while they change
  # nothing: `banned` as no card, as the default (SHADOW_BAN_IDS, crates/ai/src/shadow_ban.rs) is while SHADOW_BAN
  # bans none; `gated_sets` as no set, as AI_DECK_GATED_SETS is while it gates none; and `strength` as 0.0, which
  # deals as `None` does (deck.rs). A card shadow-banned or a set gated makes the first two killable, and then they
  # leave this line.
  'delete field (banned|gated_sets|strength) from struct AiDeckOptions expression in next_seats',
  # crates/shared (#3513): practice/deal.rs's human_deck deals a player's random deck the same way, spelling out
  # `banned` and `gated_sets` as no card and no set, which their defaults also are while nothing is shadow-banned or
  # gated (as above).
  'delete field (banned|gated_sets) from struct AiDeckOptions expression in human_deck',
  # crates/shared (#3513): draw_trio's early None for fewer than TRIO_DECKS decks: validate_trio's L1
  # refuses a trio of any other count, so the trio is None either way.
  'replace < with > in draw_trio',
  # crates/shared (#3513): a cosmetic pack's card pick (`pick_card`) walks a roll of the engine's Rng
  # times the weights' total down by each card's weight, as `pick_by` does: `< 0.0` and `<= 0.0` part only
  # on a roll exactly at a running sum, one draw in 2^32 at a given bound.
  'cosmetic_pack\.rs:.*replace < with <= in pick_card',
  # crates/shared (#3513): level_for_xp's closed-form guess only saves steps. The two loops after it walk
  # any guess to the highest level whose total is at most the XP, so a mutant of the guess's arithmetic
  # answers the same level, slower. So do the loop bounds that only add a step: the down loop's
  # `level > 1` as `>= 1` and its total's `>` as `>=` (one step down, one back up), its `&&` as `||`
  # (down to level 1, then all the way up), and the up loop's `< u32::MAX` as `<=` (at the top, the next
  # level's total is past any XP). The up loop's own mutants are not equivalent; economy/math.rs's
  # tests reach them with guesses one short.
  'economy/math\.rs:.*replace (/|\+|\*) with (%|\*|-|\+|/) in level_for_xp',
  'economy/math\.rs:.*replace (&& with \|\||> with >=|< with <=) in level_for_xp',
  # crates/shared (#3513): a card pack's card pick (`draw_card`) walks a roll times the weights' total
  # down by each card's weight, as `pick_card` above does.
  'economy/roll\.rs:.*replace < with <= in draw_card',
  # crates/shared (#3513): reward_for_level's arm for level 10 pays what its arm for every tenth level
  # does, so without it level 10 is paid the same.
  'delete match arm 10 in reward_for_level',
  # crates/shared (#3513): spelled_ingredients walks one place past a fused id's last character, whose mark is
  # '\0', neither parenthesis, so a test of `at < chars.len()` before either and one of `at <= chars.len()`
  # take the same branch.
  'face/fused\.rs:.*replace < with <= in spelled_ingredients',
  # crates/shared (#3513): named_face gives its FaceSource the name and the face's type of the definition it also
  # gives it, and face_in reads a card's name off its definition before the source's, and its type off the face,
  # then the definition, as named_face worked it out: either field left out draws the same face.
  'delete field (name|type_) from struct FaceSource expression in named_face',
  # crates/shared (#3513): tuning.rs's way_of and signed are only given a change that is not 0: face_tuning skips a
  # stat or a count that did not move and a number at its printed value, and change_words only words face_tuning's
  # changes. So `delta > 0` and `delta >= 0` part only on a 0 neither is given.
  'face/tuning\.rs:.*replace > with >= in (way_of|signed)',
  # crates/shared (#3513): spans.rs's Builder::draw guards a run of plain words before a wrap (`wrap_start > at`)
  # and after the last (`at < end`). At equality the run is empty, so it prints nothing, and the values owed at
  # its edge were printed after the wrap before it (values_at prints each once), or are owed nowhere at a run's
  # start (a value follows its label's words).
  'face/spans\.rs:.*replace (> with >=|< with <=) in Builder<.*>::draw',
  # crates/shared (#3513): reader_keyword keeps the longest term a text names. Two terms of one length a
  # text both names would be one id (each is the text or its start before a space), and no id is a
  # candidate twice (the glossary's are only those the keywords lack), so `>` and `>=` keep the same one.
  'face/chinese\.rs:.*replace > with >= in reader_keyword',
  # crates/run (#3513): `place_fights`' `most_allowed` is `RUN_ROUTE_FIGHTS_MAX.min(rows - RUN_ROUTE_TILES_MIN)`.
  # A map always holds `RUN_ACTS` acts of `RUN_ACT_ROWS` rows and a boss (24 rows), so `rows - 8` is 16, the
  # fights' max, and `rows + 8` is 32: the minimum is 16 either way, and no map of another length is dealt.
  # The name has no way to tell this `-` from the function's others, so the entry holds its column (53),
  # which no other `-` of `place_fights` has, and not its line, which moves with the code above it.
  'lib\.rs:\d+:53: replace - with \+ in place_fights',
  # crates/shared (#3513): glicko2.rs's next_volatility (Glickman's step 5). Its bracket search below a never steps:
  # f(a - kτ) is 1/τ plus e^x(Δ² - φ² - v - e^x) / (2(φ² + v + e^x)²), which is above -e^x / (2(φ² + v + e^x)) > -1/2,
  # and every caller passes GLICKO_TAU, 0.5, so f(a - τ) > 3/2 and `f < 0` never holds: as `<= 0` (column 27) or
  # `== 0` it never holds either, and `k += 1` as `-=` or `*=` (column 15) never runs. Its two loops' caps, `k <` and
  # `step <` GLICKO_MAX_ITERATIONS, are never reached (the bracket at once, the Illinois loop in a few steps), so `<=`
  # and `step += 1` as `*=` (column 14) stop at the same place. Its `>`s part from `>=` only on Δ² exactly φ² + v and
  # on |B - A| exactly GLICKO_CONVERGENCE. `f_c * f_b <= 0` as `f_c / f_b` (column 16) has the same sign, f_b never 0.
  'ranked/glicko2\.rs:.*replace > with >= in next_volatility',
  'ranked/glicko2\.rs:.*replace < with <= in next_volatility',
  'ranked/glicko2\.rs:\d+:27: replace < with == in next_volatility',
  'ranked/glicko2\.rs:\d+:15: replace \+= with (-=|\*=) in next_volatility',
  'ranked/glicko2\.rs:\d+:14: replace \+= with \*= in next_volatility',
  'ranked/glicko2\.rs:\d+:16: replace \* with / in next_volatility',
  # crates/shared (#3513): season.rs's spread is only given its values' own mean as `center` (soft_reset's two
  # reports), and about the mean (v + c)(v - c) = v^2 - c^2 averages to E[v^2] - c^2, the same variance (v - c)^2
  # averages to: either `-` as `+` reports the same spread. The columns hold the entry to those two `-`.
  'ranked/season\.rs:\d+:(29|48): replace - with \+ in spread',
  # crates/shared (#3513): ladder.rs's target_ladder takes the last tier on `last` or on the percentile being under
  # the tiers' running share, and clamps the pips into a tier at `PIPS_PER_TIER - 1`. The shares sum to PERCENT (the
  # compile-time check after percent_of) and a percentile is under 1 (its numerator, 2 x below + level + 1, is under
  # its denominator, 2 x (others + 1)), so the running share's test already holds at the last tier, and the pips into
  # a tier stay under PIPS_PER_TIER: neither `last`'s `len() - 1` nor the clamp's `- 1` decides anything. The columns
  # hold the entry to those two `-`, apart from the function's others.
  'ranked/ladder\.rs:\d+:(52|67): replace - with (\+|/) in target_ladder',
  # crates/shared (#3513): duos.rs's end_as_ceiling_draw is reached only from begin_apply's panic branch, which a
  # finished host never reaches (it answers MatchOver first), and only for a server action, which a stopped host never
  # makes (on_ai_move and reach_ceiling return once stopped, and an AI move's retry runs in the step its first try
  # ran in). So its `finished || stopped` guard never holds, and `&&` decides the same.
  'host/duos\.rs:.*replace \|\| with && in DuosHost::end_as_ceiling_draw',
  # crates/shared (#3513): resolve's AI arm is never answered MatchOver: on_ai_move plays nothing once the host is
  # finished, and a result finishes the host in the step that wrote it (after_change, on_terminal), so begin_apply's
  # MatchOver never meets an AI move, and that arm and the catch-all after it are never told apart.
  'host/duos\.rs:.*delete match arm ActionAnswer::MatchOver in DuosHost::resolve',
  # crates/shared (#3513): resolve's ceiling arm runs the ceiling out again on `is_internal() && !stopped &&
  # !finished`. The engine refuses the ceiling only once the game has a result (duos/reduce.rs), and a written
  # ceiling ends the game, which finishes the host before resolve (on_logged runs after_change first): so a ceiling
  # answer that is not internal comes only to a finished host, and `is_internal() || (!stopped && !finished)` decides
  # the same. The column (41) holds this entry to the line's first `&&`, where no other `&&` of resolve stands.
  'host/duos\.rs:\d+:41: replace && with \|\| in DuosHost::resolve',
  # crates/shared (#3513): ai_mode's guards on a forced KeepHand and a forced AnswerPrompt ask whether the seat still
  # owes the mulligan or still holds that prompt, which `owes` asks again of the same mode before drive_ai pauses a
  # seat. A guard of `true` differs only at the end of a pause whose person answered meanwhile: start_job hands
  # on_ai_move the stale mode, which plays nothing and drives no seat, where None drives every seat again. The
  # person's answer drove every idle seat already (after_change), so that drive reaches only a seat gone idle since,
  # after a lost write or a search that threw, and has it decide again before its retry or a newer state, which no
  # rule asks for.
  'host/duos\.rs:.*replace match guard (owes_mulligan\(&self\.game, seat\)|held_prompt\(&self\.game, seat\)\.as_deref\(\) == Some\(choice\.as_str\(\)\)) with true in DuosHost::ai_mode',
  # crates/shared (#3513): duel.rs's end_stale_hovers runs after a written row (after_change). While a seat's prompt
  # is open the only rows are its answer, a concede (`end_game` clears `pending`) and the clock's, which answers it:
  # each closes or replaces the prompt, so a hover whose prompt is still the open one never reaches it, and ending
  # every hover there changes nothing a seat is sent.
  'host/duel\.rs:.*replace && with \|\| in DuelHost::end_stale_hovers',
  # crates/shared (#3513): curve.rs's `fraction` reduces by `gcd(num, den) * den.signum()`, and a signum is 1 or -1,
  # which a number is multiplied or divided by alike; at 0 (two cells of one column, a Lagrange denominator of 0)
  # both divide by 0.
  'log/curve\.rs:.*replace \* with / in fraction',
  # crates/shared (#3513): curve.rs's `signed` is given only a curve's terms that are not 0 (the equation filters
  # the rest out first), so `num < 0` and `num <= 0` part only on a 0 it is never given.
  'log/curve\.rs:.*replace < with <= in signed',
  # crates/shared (#3513): chaos.rs's `own` reads a clause in its edition's words, before the words every edition
  # that has the clause spells it by. Every clause two editions of data/chaos-names.json share they spell alike, so
  # that fallback finds the same words. A clause two editions spell differently makes this killable (a test of
  # each edition's words), and then this line goes.
  'log/chaos\.rs:.*replace own -> ',
  # crates/ai (#3515): candidates.rs's zone_group_key blanks every play's lane to one constant, -1, and its key is
  # only ever compared with another play's blanked key (collapse_zones' maps), never with a play itself: any one
  # constant, 1 as well, groups the same plays.
  'candidates\.rs:.*delete - in zone_group_key',
  # crates/ai (#3515): baselines.rs's greedy_action returns the best answer, or the first candidate, while the seat
  # answers its own prompt (`answering`), before it looks for endTurn among the candidates; past it, finding none, it
  # returns the same. While the seat's prompt is open legal_actions offers only the prompt's answers and concede
  # (R211), never endTurn (tests/ai/search.rs, b14's seat answering its own prompt), and a prompt of the other seat's
  # never reaches the line (ai_to_act owes that seat only a draw offer's answer, which greedy_action gives first). So
  # `pending.player_id != seat` returns the same action. The column (50) holds the entry to that `==`.
  'baselines\.rs:\d+:50: replace == with != in greedy_action',
  # crates/server (#3516): app.rs's init_logging and serve are the process's boot, which main.rs calls (excluded
  # above): init_logging installs the process-wide tracing subscriber, a JSON line per event on stdout, and serve
  # opens the season, binds $PORT and serves until the process gets SIGTERM or Ctrl-C. Neither is equivalent; a
  # test could see them only from a process of its own (a test binary or a child process that watches stdout and
  # the port), never inside tests/server.rs, whose support/deps.rs holds its own process-wide subscriber so each
  # test can record its logs, and whose tests serve on a port of their own through serve_until (the graceful
  # shutdown's). What serve calls is tested piece by piece: build, router, seats::boot, open_season, serve_until.
  'server/src/app\.rs:.*replace (init_logging with \(\)|serve -> anyhow::Result<\(\)> with Ok\(\(\)\))',
  # crates/shared (#3513): duel.rs's on_expire guards on `stopped || finished` and then hands its run to
  # advance_run, whose first check is the same `stopped || finished` (beside an empty queue), before anything is
  # sent, noted or reduced: with either alone, `&&` lets on_expire set the run, which advance_run clears at once.
  'host/duel\.rs:.*replace \|\| with && in DuelHost::on_expire',
  # crates/shared (#3513): advance_run goes on to the run's next server action when resolve says it may, and with
  # `!` deleted it stops there instead, and goes on where resolve says stop. resolve says stop only after clearing
  # the run (a panic, an internal answer), so going on meets no run and returns. It says go on for an answer that
  # begin_apply gives at once only on an Ack, a MatchOver or an Illegal: an Ack only for a nonce the log holds (the
  # run's nonce names the seq its row would take), a MatchOver only once finished (advance_run checked it), an
  # Illegal only for a server action the engine refuses. Only the mulligan clock's run holds two actions, and the
  # engine takes a Timeout while the mulligans are open (R268's MULLIGAN_OPEN_ACTION_TYPES); a run of one that
  # stops there leaves its emptied queue in `run`, which nothing reads but the next advance_run, which clears it,
  # and on_expire, which replaces it.
  'host/duel\.rs:.*delete ! in DuelHost::advance_run',
  # crates/shared (#3513): duel.rs's end_as_ceiling_draw is reached only from resolve's clock arm on a nonce whose
  # reduce panicked, which only begin_apply inside advance_run's loop records for a clock action, just after that
  # loop checked `stopped || finished` with nothing setting either in between (on_logged's nonce had its row asked
  # for, so it never panicked). So its `finished || stopped` guard never holds, and `&&` decides the same, as in
  # duos.rs's.
  'host/duel\.rs:.*replace \|\| with && in DuelHost::end_as_ceiling_draw',
  # crates/cards (#3517): C+ #6 Wrong-House Attacker is keywords only (spec §8.7 row 6), so both faces are
  # `Script::default()`, which is exactly what `CardScripts`'s derived Default builds.
  'c006_wrong_house_attacker\.rs:.*replace script -> CardScripts with Default::default\(\)',
  # crates/cards (#3517): C+ #12.1 Devour's Radiant Cry heals only for a Health above 0. The Health read is
  # never below 0 (`.max(0)`), so `>=` differs only at 0, and a heal of 0 is none: the engine's hero heal
  # returns before any replacement, multiplier or `healed` event for an amount at or below 0 (damage.rs).
  'c012_1_devour\.rs:.*replace > with >= in script',
  # crates/cards (#3517): C #9 Income Tax's deferred step hands its own data (the delay's: the firing `event` and
  # the Radiant `discount`) back to the keep prompt, which `choose_from_hand`'s `resume_self` already merges in
  # whole but for the engine's bookkeeping keys (`card_data`, `without_prompt_keys`). The deferred run's data
  # holds none of those (`__run` is rewritten and `__owner` written again by `open_prompt` either way), so the
  # prompt carries the same data with `Value::Null`. Only in a fused card would it differ, by a `__partDepth`
  # that routes the answer to the same ingredient, Income Tax being the only card with a `keep` step.
  'c009_income_tax\.rs:.*replace carried_data -> Value with Default::default\(\)',
  # crates/cards (#3517): TG #1 Spikey Steven and TG #8 Clobberer are vanilla, TG #4 Boulder Fist Ogre, TG #6
  # Chosen by the Sun and TG #7 Chosen by the Moon keywords only (spec §8.11 rows 1, 4, 6, 7 and 8): their
  # stats and keywords are catalog data, so both faces are `Script::default()`, which is exactly what
  # `CardScripts`'s derived Default builds.
  'training_grounds/(c001_spikey_steven|c004_boulder_fist_ogre|c006_chosen_by_the_sun|c007_chosen_by_the_moon|c008_clobberer)\.rs:.*replace script -> CardScripts with Default::default\(\)',
  # crates/cards (#3517): TG #5 Midlane Menace's lane `-1` stands in only when `slot_of` finds no field zone, and
  # then `in_units_row_or_standing`, which reads the same card's zone, is false too, so the `&&` decides
  # "not in midlane" whatever lane the sentinel is (`1` included, midlane on a board of one or two lanes).
  'training_grounds/c005_midlane_menace\.rs:.*delete - in cry',
  # crates/cards (#3517): Core #8 Mr. Vanilla is vanilla, Core #11 Tempo Timmy, Core #20 Pointmaster, Core #25 4-mana
  # 7/7 and M+ #8 Arch Mage keywords only (spec §8.1 rows 8, 11 and 20, §8.2 row 25, §8.9 row 8): their stats and
  # keywords are catalog data, so both faces are `Script::default()`, which is exactly what `CardScripts`'s derived
  # Default builds.
  '(core/(c008_mr_vanilla|c011_tempo_timmy|c020_pointmaster|c025_4_mana_7_7)|meditative_plus/c008_arch_mage)\.rs:.*replace script -> CardScripts with Default::default\(\)',
  # crates/cards (#3517): S #5 Masochism Unmasked's `declared_cap` reads the `cap` the face declares off the build's
  # catalog (`crate::card_def`, never a folded version's), and catalog.json declares 20 on both faces, so the guard
  # forced either way gives the same 20. The engine then reads the card's own `cap` over it (R386:
  # flag + tuned - printed), the same either way, so only a patch to one face's cap could tell them apart.
  'stinkyscape/c005_masochism_unmasked\.rs:.*replace match guard radiant with (true|false) in declared_cap',
  # crates/cards (#3517): S+ #12 Shield Booster, S+ #16 Servo Surge, S+ #26.1 Conscript, S+ #27.1 Imp and S+ #36 Duo
  # are keywords only (spec §8.12 rows 12, 16, 26.1, 27.1 and 36): their stats and keywords are catalog data, so
  # both faces are `Script::default()`, which is exactly what `CardScripts`'s derived Default builds.
  'stinkyscape_plus/(c012_shield_booster|c016_servo_surge|c026_1_conscript|c027_1_imp|c036_duo)\.rs:.*replace script -> CardScripts with Default::default\(\)',
  # crates/cards (#3517): M #14 Prime Time's trial division. For a divisor of 2 or more `d + d <= d * d`, so the
  # mutant's loop tries every divisor the real one does, in the same order, and then more, each above the square
  # root of `n` and at most `n / 2`. A composite `n` has a divisor at or below its square root, which both loops
  # reach first; a prime has no divisor in either range. Both answer the same for every `n`.
  'c014_prime_time\.rs:.*replace \* with \+ in is_prime',
  # crates/cards (#3517): S+ #33 True Conservative's `strongest` ranks (total, cost, index) keys, the index each past
  # version's own place in the list, so a key held from an earlier place never equals a later one: `<=` replaces
  # exactly when `<` does.
  'c033_true_conservative\.rs:.*replace < with <= in strongest',
]
