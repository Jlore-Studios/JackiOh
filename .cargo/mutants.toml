# cargo-mutants' settings (#3490). Coverage (super.yml's llvm-cov, held to .github/coverage-floor.txt)
# proves a line ran; a mutant proves whether any test fails when the line is wrong. cargo-mutants
# changes one thing at a time (a function's body to a default value, an operator to another) and
# runs the mutated package's tests: a mutant they fail is killed, one they pass survived.
# `sh scripts/mutants.sh` runs it, one area's shard at a time or a branch's changed lines
# (`--in-diff`), and mutants.yml runs a shard of every area each week and writes each one's score to
# its summary.
#
# It is a tool, installed on its own (`cargo install cargo-mutants --locked`) and never a dependency:
# no crate takes the `mutants` crate (CLAUDE.md rule 4), so `#[mutants::skip]` is never used. A
# mutant no test can or should kill is left out below, by file or by name, each with its reason.

# Each mutant is tested by its own package's tests alone: the engine's rules are its own tests' to
# prove (CLAUDE.md, Architecture: the engine's tests use fixture scripts), never the cards'.
test_workspace = false

# The engine's testkit, which its `rules*` and `golden` tests require and every other crate's tests
# turn on through their dev-dependencies. Not `ts`, whose export_bindings tests only write
# apps/web/src/wire/. The opt-levels are ci.yml's `engine rules` group's
# (.github/ci/rust-test.toml): each mutant compiles its package and its tests again, so compiling is
# most of a mutant's time. No debug info, which only a debugger reads.
additional_cargo_args = [
  "--features",
  "jackioh-engine/testkit",
  "--config",
  "profile.test.package.jackioh-engine.opt-level=1",
  "--config",
  "profile.test.package.jackioh-cards.opt-level=0",
  "--config",
  "profile.test.debug=0",
]

# A mutant whose change breaks a lint the crate denies is still a mutant to test, not unviable.
cap_lints = true

# A mutant that loops forever is killed by its timeout: three times the unmutated tests' own time
# (cargo-mutants times them first), and never under two minutes, as long as the AI's tests and the
# games the golden replay and the tools' fuzz play take on a runner's four cores.
timeout_multiplier = 3.0
minimum_test_timeout = 120
# One that fills memory first, too fast for any timeout, is ended by scripts/mutants.sh's cap on a test
# binary's memory (TEST_MEMORY), which `cargo mutants` run by hand goes without.

# A mutant whose build never ends is killed by its timeout too: three times the unmutated build's
# time, which built every dependency as well, so a mutant's own build (its package and its tests,
# about 40 s in crates/shared against a 107 s baseline) never comes near it. cargo-mutants times no
# build by default: in crates/shared's first shard (mutants.yml on main, 2026-11-10) 248 of 249
# mutants finished, the test timeout killing two, and the last held its job until the step's five
# hours ended. One way a build never ends: with `cap_lints`, rustc's limit on a long constant
# evaluation is only a warning.
build_timeout_multiplier = 3.0

exclude_globs = [
  # The tests' own harness: scenario(), its verbs, the invariant monitor and the pool probe. A mutant
  # there asks whether the tests are right, which the tests that use it answer by failing for a
  # reason of their own; it judges no rule.
  "crates/engine/src/testkit/**",
  # Test modules in files of their own (`#[cfg(test)] mod tests;`).
  "**/tests.rs",
  "**/*_tests.rs",
  # The binaries' command lines: argument parsing and dispatch, which call the modules the tests
  # reach (crates/tools: every `cargo jackioh` command; crates/server: the server's boot).
  "crates/tools/src/main.rs",
  "crates/server/src/main.rs",
]

exclude_re = [
  # Display and Debug text: what a person reads in a log or a message, which no rule reads.
  '<impl (std::|core::)?(fmt::)?(Display|Debug) for ',
  # The plain build's stand-ins for the testkit's overrides (crates/engine/src/catalog.rs,
  # scripts.rs), each one `None` or `false`: under the testkit, which every test runs with, they are
  # compiled out, so no test can see them. Their testkit twins share their names and only reach the
  # harness (above).
  'replace (test_override|shipped_override|previewed|override_map) -> ',
  # crates/run (#3513): a boss card's slot is the last, Anything, and `run_check_setup` only asks
  # whether a card's slot is at or above each rank, so any index at or past the last fits the same
  # slots (`len - 1`, `len + 1` and `len / 1` alike).
  'replace - with (\+|/) in slot_needed',
  # crates/run (#3513): `weighted`'s fallback, `rows[rows.len() - 1]`, after the loop: a roll under the
  # weights' total always falls in one of them inside the loop, so the fallback is never reached.
  'replace - with (\+|/) in weighted',
  # crates/shared (#3513): `game_in_play` asks that the series be Playing and its last game have no
  # result, and `abandon_unstarted` that the last game be the one `next_match_id` names and have no
  # result. On every row the transitions make, a series is Playing exactly while its last game has no
  # result and carries `next_match_id`: `begin` pushes that game and sets Playing, `game_ended` gives it
  # its result and then ends the series or reopens the picks under a new id, `abandon_unstarted` pops
  # it, and `forfeit_series` runs only between games. So either half alone decides as both do.
  'replace && with \|\| in (game_in_play|abandon_unstarted)',
  # crates/shared (#3513): the bots' cosmetic draws compare a roll of the engine's Rng, in [0, 1), against
  # a share (`draw_wardrobe`) or a running sum of weights (`pick_by`): `<` and `<=` part only on a roll
  # exactly equal to it, one draw in 2^32 at a given bound, which no seed a test can find makes.
  'replace < with <= in (draw_wardrobe|pick_by)',
  # crates/shared (#3513): `pick_by`'s fallback after its loop, the last candidate of any weight: the
  # running sum adds the weights in the order `total` summed them, so it ends at `total` exactly, and a
  # roll of `next() * total` is below it, so the loop always returns first.
  'replace > with (==|<|>=) in pick_by',
  # crates/shared (#3513): a bot's username draws its register and its shape (`weighted`) and its
  # number's kind (`number`) by comparing a roll of the engine's Rng, in [0, 1), against a share or what
  # is left of one, none of them 0: as above, `<` and `<=` part only on a roll exactly equal to it. The
  # file's path keeps crates/run's own `weighted`, whose integer draw can equal its weight, out of it.
  'bots/names/mod\.rs:.*replace < with <= in (weighted|number)',
  # crates/shared (#3513): the bots' end-of-game habits (concessions, draw offers and answers, idle
  # turns, a rematch's offer and answer) compare a roll of the engine's Rng against a fitted share, as
  # above.
  'bots/signals\.rs:.*replace < with <= in (concedes|offers_draw|accepts_draw|idles_turn|rematch_plan)',
  # crates/shared (#3513): the pool's size is the weekly people times BOT_POOL_PER_WEEKLY_ACTIVE, 1.0,
  # and a count divided by 1.0 is the count times 1.0. Another share makes this mutant killable by
  # tests/bots_pool.rs's size test, and then this line goes.
  'replace \* with / in pool_target',
  # crates/shared (#3513): at exactly the target, plan_pool's retiring path retires none and the other
  # puts back and makes none, so `>` and `>=` plan the same empty change.
  'replace > with >= in plan_pool',
  # crates/shared (#3513): deal_bot_deck spells out AiDeckOptions' lean_set as None, its default, and
  # gated_sets as no set, which the default (AI_DECK_GATED_SETS, crates/ai/src/config.rs) also is while
  # it gates nothing: either field left to its default deals the same deck. A set gated there makes the
  # second killable (a bot's deck is a player's random deal, R1453), and then it leaves this line.
  'delete field (lean_set|gated_sets) from struct jackioh_ai::AiDeckOptions expression in deal_bot_deck',
  # crates/shared (#3513): rematch.rs's next_seats deals an All Random rematch a player's random decks (R1372,
  # R1453), spelling out three of AiDeckOptions' fields as the values their defaults deal alike while they change
  # nothing: `banned` as no card, as the default (SHADOW_BAN_IDS, crates/ai/src/shadow_ban.rs) is while SHADOW_BAN
  # bans none; `gated_sets` as no set, as AI_DECK_GATED_SETS is while it gates none; and `strength` as 0.0, which
  # deals as `None` does (deck.rs). A card shadow-banned or a set gated makes the first two killable, and then they
  # leave this line.
  'delete field (banned|gated_sets|strength) from struct AiDeckOptions expression in next_seats',
  # crates/shared (#3513): draw_trio's early None for fewer than TRIO_DECKS decks: validate_trio's L1
  # refuses a trio of any other count, so the trio is None either way.
  'replace < with > in draw_trio',
  # crates/shared (#3513): a cosmetic pack's card pick (`pick_card`) walks a roll of the engine's Rng
  # times the weights' total down by each card's weight, as `pick_by` does: `< 0.0` and `<= 0.0` part only
  # on a roll exactly at a running sum, one draw in 2^32 at a given bound.
  'cosmetic_pack\.rs:.*replace < with <= in pick_card',
  # crates/shared (#3513): level_for_xp's closed-form guess only saves steps. The two loops after it walk
  # any guess to the highest level whose total is at most the XP, so a mutant of the guess's arithmetic
  # answers the same level, slower. So do the loop bounds that only add a step: the down loop's
  # `level > 1` as `>= 1` and its total's `>` as `>=` (one step down, one back up), its `&&` as `||`
  # (down to level 1, then all the way up), and the up loop's `< u32::MAX` as `<=` (at the top, the next
  # level's total is past any XP). The up loop's own mutants are not equivalent; economy/math.rs's
  # tests reach them with guesses one short.
  'economy/math\.rs:.*replace (/|\+|\*) with (%|\*|-|\+|/) in level_for_xp',
  'economy/math\.rs:.*replace (&& with \|\||> with >=|< with <=) in level_for_xp',
  # crates/shared (#3513): a card pack's card pick (`draw_card`) walks a roll times the weights' total
  # down by each card's weight, as `pick_card` above does.
  'economy/roll\.rs:.*replace < with <= in draw_card',
  # crates/shared (#3513): reward_for_level's arm for level 10 pays what its arm for every tenth level
  # does, so without it level 10 is paid the same.
  'delete match arm 10 in reward_for_level',
  # crates/shared (#3513): spelled_ingredients walks one place past a fused id's last character, whose mark is
  # '\0', neither parenthesis, so a test of `at < chars.len()` before either and one of `at <= chars.len()`
  # take the same branch.
  'face/fused\.rs:.*replace < with <= in spelled_ingredients',
  # crates/shared (#3513): named_face gives its FaceSource the name and the face's type of the definition it also
  # gives it, and face_in reads a card's name off its definition before the source's, and its type off the face,
  # then the definition, as named_face worked it out: either field left out draws the same face.
  'delete field (name|type_) from struct FaceSource expression in named_face',
  # crates/shared (#3513): tuning.rs's way_of and signed are only given a change that is not 0: face_tuning skips a
  # stat or a count that did not move and a number at its printed value, and change_words only words face_tuning's
  # changes. So `delta > 0` and `delta >= 0` part only on a 0 neither is given.
  'face/tuning\.rs:.*replace > with >= in (way_of|signed)',
  # crates/shared (#3513): spans.rs's Builder::draw guards a run of plain words before a wrap (`wrap_start > at`)
  # and after the last (`at < end`). At equality the run is empty, so it prints nothing, and the values owed at
  # its edge were printed after the wrap before it (values_at prints each once), or are owed nowhere at a run's
  # start (a value follows its label's words).
  'face/spans\.rs:.*replace (> with >=|< with <=) in Builder<.*>::draw',
  # crates/shared (#3513): reader_keyword keeps the longest term a text names. Two terms of one length a
  # text both names would be one id (each is the text or its start before a space), and no id is a
  # candidate twice (the glossary's are only those the keywords lack), so `>` and `>=` keep the same one.
  'face/chinese\.rs:.*replace > with >= in reader_keyword',
  # crates/run (#3513): `place_fights`' `most_allowed` is `RUN_ROUTE_FIGHTS_MAX.min(rows - RUN_ROUTE_TILES_MIN)`.
  # A map always holds `RUN_ACTS` acts of `RUN_ACT_ROWS` rows and a boss (24 rows), so `rows - 8` is 16, the
  # fights' max, and `rows + 8` is 32: the minimum is 16 either way, and no map of another length is dealt.
  # The name has no way to tell this `-` from the function's others, so the entry holds its column (53),
  # which no other `-` of `place_fights` has, and not its line, which moves with the code above it.
  'lib\.rs:\d+:53: replace - with \+ in place_fights',
  # crates/shared (#3513): curve.rs's `fraction` reduces by `gcd(num, den) * den.signum()`, and a signum is 1 or -1,
  # which a number is multiplied or divided by alike; at 0 (two cells of one column, a Lagrange denominator of 0)
  # both divide by 0.
  'log/curve\.rs:.*replace \* with / in fraction',
  # crates/shared (#3513): curve.rs's `signed` is given only a curve's terms that are not 0 (the equation filters
  # the rest out first), so `num < 0` and `num <= 0` part only on a 0 it is never given.
  'log/curve\.rs:.*replace < with <= in signed',
  # crates/shared (#3513): chaos.rs's `own` reads a clause in its edition's words, before the words every edition
  # that has the clause spells it by. Every clause two editions of data/chaos-names.json share they spell alike, so
  # that fallback finds the same words. A clause two editions spell differently makes this killable (a test of
  # each edition's words), and then this line goes.
  'log/chaos\.rs:.*replace own -> ',
]
