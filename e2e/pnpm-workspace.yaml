# e2e/ is deliberately its own pnpm root as well as one of the root workspace's two projects
# (`apps/web` and `e2e`), so the suite can install Cypress on its own.
# `pnpm install` inside e2e/ therefore just works, and Cypress is allowed to run its postinstall,
# which fetches the browser binary.
packages: []
allowBuilds:
  cypress: true
