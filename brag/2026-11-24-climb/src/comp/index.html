<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JackiOh: the climb to Jlorious (composition)</title>
<!-- The crest's own stylesheet (apps/web/src/rank/rankCrest.css): its row, pips and Jlorious shimmer. -->
<link rel="stylesheet" href="assets/rankCrest.css">
<style>
  @font-face { font-family: "Alegreya"; src: url("assets/alegreya-5.3.0-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "Inter"; src: url("assets/inter-5.3.0-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: #0c0704; }
  #stage { position: relative; overflow: hidden; background: #0c0704; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .abs { position: absolute; }
  .full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* The tavern backdrop: .tavern.app-shell's gradients and its ::before planks (apps/web/src/auth/tavern.css). */
  .tavern { position: absolute; inset: 0; isolation: isolate; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 150, 60, 0.2), transparent 70%),
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(90, 52, 27, 0.38), transparent 70%),
      linear-gradient(180deg, #1c110a 0%, #120b07 55%, #0c0704 100%); }
  .tavern::before { content: ""; position: absolute; z-index: -1; left: -20%; right: -20%; bottom: 0; height: 33%;
    transform: perspective(700px) rotateX(58deg); transform-origin: 50% 100%;
    background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.5) 0 3px, transparent 3px 12.5%),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 17px),
      linear-gradient(180deg, #2b170c 0%, #5a341b 60%, #8a5a33 100%);
    opacity: 0.55; -webkit-mask-image: linear-gradient(0deg, #000 25%, transparent 100%); mask-image: linear-gradient(0deg, #000 25%, transparent 100%); }
  .gold { font-family: "Alegreya", serif; font-weight: 800; line-height: 1.0; letter-spacing: 0.01em; padding: 0 0.06em 0.08em; white-space: nowrap;
    background: linear-gradient(180deg, #fbe7b0 0%, #ffe39a 22%, #f3c969 44%, #c9953f 64%, #9b6423 84%, #d9a44c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: var(--stroke, 2px) #3a1f0c;
    filter: drop-shadow(0 0 var(--glow, 18px) rgba(255, 170, 60, 0.38)) drop-shadow(0 3px 0 #3a1f0c); }
  .body { font-family: "Inter", sans-serif; font-weight: 600; color: #efe0bf; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
  .caps { font-family: "Alegreya", serif; font-weight: 700; color: #c9953f; letter-spacing: 0.28em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .center { text-align: center; }
  #dip { position: absolute; inset: 0; background: #0c0704; pointer-events: none; z-index: 50; }
  #flash { position: absolute; inset: 0; pointer-events: none; z-index: 49; background: radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255,236,190,0.95), rgba(255,190,90,0.35) 45%, transparent 75%); }

  /* A crest drawn big: the component's own markup, its svg sized up and its row turned into a column. */
  .crest { position: absolute; display: flex; justify-content: center; transform-origin: 50% 50%; }
  .crest .rank-crest { flex-direction: column; gap: calc(var(--cs) * 0.05); color: #efe0bf; }
  .crest .rank-crest__art { width: var(--cs); height: var(--cs); overflow: visible; }
  .crest .rank-crest__pips { gap: calc(var(--cs) * 0.04); }
  .crest .rank-crest__pip { width: calc(var(--cs) * 0.055) !important; height: calc(var(--cs) * 0.055) !important; border-width: calc(var(--cs) * 0.008); }
  .crest .rank-crest__position { font-family: "Alegreya", serif; font-weight: 800; font-size: calc(var(--cs) * 0.24); color: #ffd76a; text-shadow: 0 0 18px rgba(255,200,90,0.6), 0 3px 0 #3a1f0c; }
  .crest.nopips .rank-crest__pips, .crest.nopos .rank-crest__position { display: none; }
  .glowdisc { position: absolute; border-radius: 50%; pointer-events: none; }
  .rung { position: absolute; transform-origin: 50% 50%; }
  .card { position: absolute; border-radius: 5.5% / 4%; overflow: hidden; }
  .card img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="tavern" id="bg"></div>

  <!-- Board footage: the real client's win, landscape or phone layout. -->
  <div class="scene" id="sWin">
    <img class="full" id="winImg" alt="">
    <div class="full" id="winScrim"></div>
    <div class="abs gold" id="winCap">Win to climb.</div>
  </div>

  <!-- Crest scenes share one layer: hook (Raisin), the climb, Jlorious. -->
  <div class="scene" id="sCrest">
    <div class="glowdisc" id="crestGlow"></div>
    <div id="sparks" class="full"></div>
    <div class="crest" id="bigCrest"></div>
    <div class="abs caps center" id="hookCaps">Ranked</div>
    <div class="abs gold center" id="hookLine">You start as a Raisin.</div>
    <div class="abs gold" id="tierName"></div>
    <div class="abs caps" id="tierDiv"></div>
    <div class="abs caps" id="tierNote">The top 1%</div>
    <div class="abs gold center" id="jTitle">Jlorious</div>
    <div class="abs body center" id="jLine">Only the top 100 players.</div>
    <div id="ladder" class="full"></div>
  </div>

  <!-- The trophy: the real Jlorious card back, breathing. -->
  <div class="scene" id="sBack">
    <div class="glowdisc" id="backGlow"></div>
    <div class="card" id="backCard"><img id="backImg" alt=""></div>
    <div class="abs caps" id="backCaps">Mythic card back</div>
    <div class="abs gold" id="backLine">Earned at Jlorious.</div>
    <div class="abs body" id="backSub">Yours to keep.</div>
    <div class="abs gold center" id="vUrl">jackioh.com</div>
  </div>

  <!-- Outro (landscape). -->
  <div class="scene" id="sOut">
    <div class="glowdisc" id="outGlow"></div>
    <img class="abs" id="outLogo" src="assets/jackioh-logo.svg" alt="">
    <div class="abs body center" id="outLine">Start your climb.</div>
    <div class="abs gold center" id="outUrl">jackioh.com</div>
  </div>

  <div id="flash"></div>
  <div id="dip"></div>
</div>
<script>
const V = new URLSearchParams(location.search).get("v") === "1";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = (id) => document.getElementById(id);
$("stage").style.width = W + "px"; $("stage").style.height = H + "px";
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const eBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const place = (el, s) => { for (const k in s) el.style[k] = typeof s[k] === "number" ? s[k] + "px" : s[k]; };
const pending = [];
function setSrc(img, src) { if (img.getAttribute("src") !== src) img.setAttribute("src", src); pending.push(img); }
function textIn(el, t, at, d = 0.18, rise = 18) { const x = eOut(seg(t, at, at + d)); el.style.opacity = x; el.style.transform = `translateY(${(1 - x) * rise}px)`; }
const show = (id, on) => { $(id).style.display = on ? "block" : "none"; };

// Timeline: 100 bpm (epic-1), a beat 0.6 s, a bar 2.4 s, every cut on a beat.
const T = V
  ? { win: 1.8, climb: 3.6, tiers: [3.6, 4.8, 6.0, 7.2, 8.4], jl: 9.6, back: 12.0, out: null, end: 14.4, pips: [0.3, 0.6, 0.9, 1.2, 1.5], winPage: 1.1 }
  : { win: 2.4, climb: 4.8, tiers: [4.8, 6.0, 7.2, 8.4, 9.6], jl: 12.0, back: 14.4, out: 16.8, end: 19.2, pips: [0.9, 1.2, 1.5, 1.8, 2.1], winPage: 0.8 };
const TIERS = [["rotten", "Rotten Grape"], ["normal", "Normal Grape"], ["large", "Large Grape"], ["golden", "Golden Grape"], ["mythic", "Mythic Grape"]];
const NUM = { 3: "III", 2: "II", 1: "I" };
let CRESTS = {};

// Layout by format. Vertical keeps every read line in y 250–1536 and clear of the right 140 px below y 960.
const L = V ? {
  hook: { cs: 470, cx: 540, cy: 600 }, hookCaps: { left: 0, width: 1080, top: 285, fontSize: 34 },
  hookLine: { left: 90, width: 850, top: 1010, fontSize: 112, whiteSpace: "normal", lineHeight: "1.08", "--stroke": "3px" },
  climb: { cs: 440, cx: 540, cy: 560 }, tierName: { left: 90, width: 850, top: 870, fontSize: 118, textAlign: "center", "--stroke": "3px" },
  tierDiv: { left: 90, width: 850, top: 1020, fontSize: 64, textAlign: "center" }, tierNote: { left: 90, width: 850, top: 1110, fontSize: 40, textAlign: "center", color: "#efe0bf" },
  jl: { cs: 500, cx: 540, cy: 560 }, jTitle: { left: 0, width: 1080, top: 1010, fontSize: 170, "--stroke": "4px", "--glow": "28px" },
  jLine: { left: 90, width: 850, top: 1215, fontSize: 64, lineHeight: "1.15" },
  rungs: { dir: "row", x0: 120, step: 133, y: 1395, cs: 86 },
  backCard: { left: 265, top: 290, width: 550, height: 770 }, backCaps: { left: 90, width: 850, top: 1110, fontSize: 34, textAlign: "center" },
  backLine: { left: 90, width: 850, top: 1165, fontSize: 104, textAlign: "center", "--stroke": "3px" }, backSub: { display: "none" },
  vUrl: { left: 90, width: 850, top: 1345, fontSize: 92, "--stroke": "3px" },
  winCap: { left: 90, width: 850, top: 280, fontSize: 112, textAlign: "center", "--stroke": "3px" },
  winScrim: "linear-gradient(180deg, rgba(10,6,3,0.0) 0%, rgba(10,6,3,0.86) 11%, rgba(10,6,3,0.7) 22%, rgba(10,6,3,0.0) 33%)",
} : {
  hook: { cs: 420, cx: 960, cy: 400 }, hookCaps: { left: 0, width: 1920, top: 118, fontSize: 32 },
  hookLine: { left: 0, width: 1920, top: 800, fontSize: 124, "--stroke": "3px" },
  climb: { cs: 460, cx: 700, cy: 520 }, tierName: { left: 1010, top: 380, fontSize: 128, "--stroke": "3px" },
  tierDiv: { left: 1020, top: 540, fontSize: 72 }, tierNote: { left: 1020, top: 640, fontSize: 42, color: "#efe0bf" },
  jl: { cs: 420, cx: 960, cy: 300 }, jTitle: { left: 0, width: 1920, top: 728, fontSize: 168, "--stroke": "4px", "--glow": "28px" },
  jLine: { left: 0, width: 1920, top: 920, fontSize: 62 },
  rungs: { dir: "col", x: 170, y0: 950, step: 132, cs: 88 },
  backCard: { left: 1230, top: 150, width: 560, height: 784 }, backCaps: { left: 170, top: 352, fontSize: 32 },
  backLine: { left: 156, top: 400, fontSize: 116, "--stroke": "3px" }, backSub: { left: 170, top: 570, fontSize: 64 },
  vUrl: { display: "none" },
  winCap: { left: 110, top: 880, fontSize: 104, "--stroke": "3px" },
  winScrim: "linear-gradient(0deg, rgba(10,6,3,0.92) 0%, rgba(10,6,3,0.7) 16%, rgba(10,6,3,0.0) 36%)",
};
for (const id of ["hookCaps", "hookLine", "tierName", "tierDiv", "tierNote", "jTitle", "jLine", "backCaps", "backLine", "backSub", "vUrl", "winCap"]) {
  const s = { ...L[id] }; for (const k of Object.keys(s)) if (k.startsWith("--")) { $(id).style.setProperty(k, s[k]); delete s[k]; } place($(id), s);
}
$("winScrim").style.background = L.winScrim;
if (V) { const h = $("hookLine"); h.className = "abs center"; h.innerHTML = '<div class="gold">You start as a</div><div class="gold">Raisin.</div>'; }
place($("backCard"), { ...L.backCard, boxShadow: "0 30px 80px rgba(0,0,0,0.65), 0 0 60px rgba(176,108,255,0.35)" });
place($("backGlow"), { left: L.backCard.left - 260, top: L.backCard.top - 220, width: L.backCard.width + 520, height: L.backCard.height + 440,
  background: "radial-gradient(ellipse 50% 50% at 50% 50%, rgba(176,108,255,0.42), rgba(120,60,200,0.16) 45%, transparent 70%)" });
if (!V) {
  place($("outLogo"), { left: 460, top: 250, width: 1000, height: 324 });
  place($("outLine"), { left: 0, width: 1920, top: 650, fontSize: 60 });
  place($("outUrl"), { left: 0, width: 1920, top: 760, fontSize: 132 }); $("outUrl").style.setProperty("--stroke", "3px");
  place($("outGlow"), { left: 360, top: 120, width: 1200, height: 620, background: "radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,170,60,0.28), transparent 70%)" });
}

// The ladder's rungs: Raisin, the five Grapes and Jlorious, each its real crest.
const RUNG_KEYS = ["raisin-5", "rotten-1-0", "normal-1-0", "large-1-0", "golden-1-0", "mythic-1-0", "jlorious-1"];
const rungs = [];
function buildLadder() {
  const box = $("ladder"), R = L.rungs;
  const line = document.createElement("div"); line.className = "abs"; line.id = "rail";
  const fill = document.createElement("div"); fill.className = "abs"; fill.id = "railFill";
  box.appendChild(line); box.appendChild(fill);
  RUNG_KEYS.forEach((k, i) => {
    const d = document.createElement("div"); d.className = "crest rung nopips nopos"; d.style.setProperty("--cs", R.cs + "px");
    d.innerHTML = CRESTS[k];
    const cx = R.dir === "col" ? R.x : R.x0 + i * R.step, cy = R.dir === "col" ? R.y0 - i * R.step : R.y;
    place(d, { left: cx - R.cs / 2, top: cy - R.cs / 2, width: R.cs, height: R.cs });
    box.appendChild(d); rungs.push({ el: d, cx, cy });
  });
  const a = rungs[0], b = rungs[rungs.length - 1];
  if (R.dir === "col") { place(line, { left: a.cx - 3, top: b.cy, width: 6, height: a.cy - b.cy, background: "rgba(201,149,63,0.22)", borderRadius: 3 }); }
  else { place(line, { left: a.cx, top: a.cy - 3, width: b.cx - a.cx, height: 6, background: "rgba(201,149,63,0.22)", borderRadius: 3 }); }
}
function ladderAt(t, level, since) {
  // level: the index reached (0 Raisin … 6 Jlorious); since: when it was reached, for the pop.
  const R = L.rungs, a = rungs[0];
  rungs.forEach((r, i) => {
    const reached = i <= level, cur = i === level;
    const pop = cur ? 1 + 0.28 * (1 - eOut(seg(t, since, since + 0.3))) : 1;
    r.el.style.opacity = reached ? 1 : 0.28;
    r.el.style.filter = reached ? (cur ? "drop-shadow(0 0 14px rgba(255,210,120,0.8))" : "none") : "grayscale(1) brightness(0.6)";
    r.el.style.transform = `scale(${(cur ? 1.18 : 1) * pop})`;
  });
  const r = rungs[Math.max(0, level)], prev = rungs[Math.max(0, level - 1)];
  const k = eOut(seg(t, since, since + 0.25));
  const fill = $("railFill");
  if (R.dir === "col") { const top = lerp(prev.cy, r.cy, k); place(fill, { left: a.cx - 3, top, width: 6, height: a.cy - top, background: "linear-gradient(0deg,#9b6423,#ffe39a)", borderRadius: 3 }); }
  else { const right = lerp(prev.cx, r.cx, k); place(fill, { left: a.cx, top: a.cy - 3, width: right - a.cx, height: 6, background: "linear-gradient(90deg,#9b6423,#ffe39a)", borderRadius: 3 }); }
}

// Sparks for Jlorious: fixed by index, so a frame depends on t alone.
const SPARKS = [];
function buildSparks() {
  const box = $("sparks");
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("div"); s.className = "abs";
    const size = 7 + ((i * 37) % 10);
    s.style.width = s.style.height = size + "px"; s.style.borderRadius = "50%";
    s.style.background = "radial-gradient(circle, #fff6d6 0%, #f3c969 45%, rgba(243,201,105,0) 72%)";
    box.appendChild(s);
    SPARKS.push({ el: s, a: (i / 30) * Math.PI * 2 + ((i * 53) % 10) * 0.05, r: 280 + ((i * 71) % 220), size, d: 0.6 + ((i * 29) % 30) / 100 });
  }
}

let lastKey = null;
function bigCrest(key, cs, cx, cy, scale, opts = {}) {
  const el = $("bigCrest");
  if (lastKey !== key) { el.innerHTML = CRESTS[key]; lastKey = key; }
  el.className = "crest" + (opts.pips ? "" : " nopips") + (opts.pos ? "" : " nopos");
  el.style.setProperty("--cs", cs + "px");
  const h = cs * (opts.pos ? 1.32 : opts.pips ? 1.14 : 1);
  place(el, { left: cx - cs, top: cy - cs / 2, width: cs * 2, height: h });
  el.style.transform = `scale(${scale})`;
  el.style.opacity = opts.op ?? 1;
  // The Jlorious shimmer (rankCrest.css, 2.4 s) driven by t: paused at its own phase.
  const sh = el.querySelector(".rank-crest__shimmer");
  if (sh) { sh.style.animationPlayState = "paused"; sh.style.animationDelay = `-${(opts.t % 2.4).toFixed(3)}s`; }
}
function glow(el, cx, cy, r, color, op) { place(el, { left: cx - r, top: cy - r, width: 2 * r, height: 2 * r, background: `radial-gradient(circle, ${color} 0%, transparent 68%)` }); el.style.opacity = op; }

window.ready = (async () => {
  CRESTS = await (await fetch("assets/crests.json")).json();
  buildLadder(); buildSparks();
  await document.fonts.load('800 100px "Alegreya"'); await document.fonts.load('700 30px "Alegreya"'); await document.fonts.load('600 40px "Inter"');
  await document.fonts.ready;
  return true;
})();

window.renderAt = async function renderAt(t) {
  pending.length = 0;
  const scene = t < T.win ? "hook" : t < T.climb ? "win" : t < T.jl ? "climb" : t < T.back ? "jl" : (T.out === null || t < T.out) ? "back" : "out";
  show("sWin", scene === "win"); show("sCrest", ["hook", "climb", "jl"].includes(scene)); show("sBack", scene === "back"); show("sOut", scene === "out");
  for (const id of ["hookCaps", "hookLine", "tierName", "tierDiv", "tierNote", "jTitle", "jLine", "ladder", "sparks"]) $(id).style.display = "none";
  let flash = 0, dip = 0;

  if (scene === "hook") {
    // The Raisin slams in on frame 0's beat; its five placement pips fill on the eighths.
    const n = T.pips.filter((p) => t >= p).length;
    const s = 1 + 1.3 * (1 - eBack(seg(t, 0, 0.22)));
    const C = L.hook;
    bigCrest(`raisin-${n}`, C.cs, C.cx, C.cy, s, { pips: true, op: seg(t, 0, 0.06), t });
    glow($("crestGlow"), C.cx, C.cy, C.cs * 0.95, "rgba(255,170,60,0.32)", 1);
    flash = 0.55 * (1 - seg(t, 0.12, 0.42)) * seg(t, 0.0, 0.12);
    for (const id of ["hookCaps", "hookLine"]) $(id).style.display = "block";
    textIn($("hookCaps"), t, 0.1); textIn($("hookLine"), t, 0.18, 0.16, 24);
    if (V) { /* the last frame dims into this first one, so the loop flows */ }
  }

  if (scene === "win") {
    const page = T.winPage + (t - T.win);
    setSrc($("winImg"), `${V ? "seq-port" : "seq-land"}/${String(Math.max(0, Math.floor(page * 60 + 1e-6))).padStart(4, "0")}.jpg`);
    $("winCap").style.display = "block"; textIn($("winCap"), t, T.win + 0.06, 0.16, 20);
  }

  if (scene === "climb") {
    $("ladder").style.display = "block";
    let i = 0; while (i + 1 < T.tiers.length && t >= T.tiers[i + 1]) i++;
    const at = T.tiers[i], dur = (i + 1 < T.tiers.length ? T.tiers[i + 1] : T.jl) - at;
    // Division III on the beat, II and I on the next two eighths: the studs add up.
    const d = t < at + 0.3 ? 3 : t < at + 0.6 ? 2 : 1;
    const tick = d === 3 ? at : d === 2 ? at + 0.3 : at + 0.6;
    const C = L.climb;
    const s = (1 + 0.55 * (1 - eBack(seg(t, at, at + 0.2)))) * (1 + 0.07 * (1 - eOut(seg(t, tick, tick + 0.18))) * (d < 3 ? 1 : 0));
    bigCrest(`${TIERS[i][0]}-${d}-0`, C.cs, C.cx, C.cy, s, { t });
    const glowColor = ["rgba(160,140,120,0.25)", "rgba(123,79,160,0.32)", "rgba(138,79,192,0.36)", "rgba(232,185,49,0.36)", "rgba(176,108,255,0.45)"][i];
    glow($("crestGlow"), C.cx, C.cy, C.cs * 0.95, glowColor, 1);
    flash = 0.3 * (1 - seg(t, at, at + 0.22));
    const name = $("tierName"), div = $("tierDiv");
    name.style.display = div.style.display = "block";
    name.textContent = TIERS[i][1]; div.textContent = NUM[d];
    textIn(name, t, at, 0.12, 16);
    div.style.opacity = 1; div.style.transform = `scale(${1 + 0.25 * (1 - eOut(seg(t, tick, tick + 0.16)))})`; div.style.transformOrigin = V ? "50% 50%" : "0% 50%";
    if (i === 4) { $("tierNote").style.display = "block"; textIn($("tierNote"), t, at + 0.3, 0.16, 12); }
    ladderAt(t, i + 1, at);
    if (t < T.climb + 0.12) dip = Math.max(dip, 1 - eOut(seg(t, T.climb, T.climb + 0.12)));
  }

  if (scene === "jl") {
    $("ladder").style.display = "block"; $("sparks").style.display = "block";
    const C = L.jl, at = T.jl;
    const s = 1 + 0.9 * (1 - eBack(seg(t, at, at + 0.26)));
    bigCrest("jlorious-1", C.cs, C.cx, C.cy, s, { pos: true, t });
    glow($("crestGlow"), C.cx, C.cy, C.cs * 1.25, "rgba(255,215,106,0.5)", 0.8 + 0.2 * Math.sin((t - at) * 2.6));
    flash = 0.95 * (1 - eOut(seg(t, at, at + 0.4)));
    for (const sp of SPARKS) {
      const k = seg(t, at + 0.02, at + 0.02 + sp.d * 1.6);
      const r = sp.r * eOut(k) + 40, x = C.cx + Math.cos(sp.a) * r, y = C.cy + Math.sin(sp.a) * r * 0.85 - k * 60;
      place(sp.el, { left: x - sp.size / 2, top: y - sp.size / 2 }); sp.el.style.opacity = k > 0 && k < 1 ? (1 - k) : 0;
    }
    for (const id of ["jTitle", "jLine"]) $(id).style.display = "block";
    textIn($("jTitle"), t, at + 0.06, 0.18, 26); textIn($("jLine"), t, at + 0.6, 0.18, 18);
    ladderAt(t, 6, at);
    if (V) $("ladder").style.display = "none";
  }

  if (scene === "back") {
    const at = T.back;
    // The real J★ back (CardBack.tsx, back="card-back-jlorious"), sampled over its 4 s breathe at 30 fps.
    const f = Math.floor((t - at) * 30 + 30) % 120;
    setSrc($("backImg"), `back/${String(f).padStart(3, "0")}.png`);
    const k = eOut(seg(t, at, at + 0.32));
    $("backCard").style.transform = `perspective(1800px) rotateY(${(1 - k) * -80}deg) translateY(${(1 - k) * 40}px)`;
    $("backCard").style.opacity = seg(t, at, at + 0.08);
    $("backGlow").style.opacity = k;
    textIn($("backCaps"), t, at + 0.12); textIn($("backLine"), t, at + 0.2, 0.18, 22); textIn($("backSub"), t, at + 0.6);
    textIn($("vUrl"), t, at + 0.6);
    if (t < at + 0.12) dip = Math.max(dip, 1 - eOut(seg(t, at, at + 0.12)));
    if (V) dip = Math.max(dip, eIn(seg(t, T.end - 0.2, T.end)));
  }

  if (scene === "out") {
    const at = T.out;
    const k = eOut(seg(t, at, at + 0.5));
    $("outLogo").style.opacity = k; $("outLogo").style.transform = `translateY(${(1 - k) * 30}px) scale(${0.96 + 0.04 * k})`;
    $("outGlow").style.opacity = k;
    textIn($("outLine"), t, at + 0.3); textIn($("outUrl"), t, at + 0.6, 0.2, 20);
    if (t < at + 0.12) dip = Math.max(dip, 1 - eOut(seg(t, at, at + 0.12)));
    dip = Math.max(dip, eIn(seg(t, T.end - 0.5, T.end)) * 0.9);
  }

  // Dips into each section join (out 0.08 s before it).
  for (const j of [T.climb, T.back, ...(T.out === null ? [] : [T.out])]) if (t >= j - 0.08 && t < j) dip = Math.max(dip, eIn(seg(t, j - 0.08, j)));
  $("flash").style.opacity = flash; $("dip").style.opacity = dip;
  await Promise.all(pending.map((img) => (img.complete && img.naturalWidth ? null : img.decode().catch(() => null))));
  return scene;
};
</script>
