<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#120b07" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found · JackiOh</title>
    <!-- Vercel serves this file, with a 404 status, for any path vercel.json does not route to the
         app. It stands alone, so its styles are inline: the tavern frame of the app's own 404 panel
         (main.tsx NotFound, auth/tavern.css), with no script. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16px;
        box-sizing: border-box;
        color: #efe0bf;
        background:
          radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 150, 60, 0.2), transparent 70%),
          radial-gradient(ellipse 90% 55% at 50% 0%, rgba(90, 52, 27, 0.38), transparent 70%),
          linear-gradient(180deg, #1c110a 0%, #120b07 55%, #0c0704 100%);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        box-sizing: border-box;
        text-align: center;
        border: 1px solid rgba(201, 149, 63, 0.55);
        border-radius: 14px;
        background: linear-gradient(180deg, #2b170c, #1a0e07);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(251, 231, 176, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-size: 40px;
        line-height: 1.1;
        color: #f3c969;
      }
      p {
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        color: #24160c;
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(180deg, #fff0bf, #f3c969 45%, #dc9b33 80%, #a86a1f);
      }
      a:focus-visible {
        outline: 2px solid #fbe7b0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JackiOh</h1>
      <p>That page doesn&rsquo;t exist. The link may be wrong or out of date.</p>
      <a href="/">Back to the start</a>
    </main>
  </body>
</html>
