[project]
name = "jackioh-ml"
version = "0.0.0"
description = "The learned evaluation's fit (#466, #1009; docs/learned-eval.md D4, D5, D8): positions in, a report and weights out"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "pytest==9.1.1",
]

[tool.uv]
# A set of scripts, not a package: uv installs the dependencies and nothing else.
package = false

# CPU-only torch from PyTorch's own index (D8): the cost is playing the games, not the fit, and the
# CPU wheels are a fraction of the CUDA ones.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
