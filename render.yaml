# Render Blueprint for the server (`crates/server`, the Rust `jackioh-server`) — the half of this
# repo Vercel cannot host.
#
# docs/architecture.md §4 ("Why the match actor cannot be a stateless function") takes the third
# of ARCHITECTURE-CCG §2.1's options: one long-running process hosting one actor object per live
# match. That is what this file deploys. `apps/web` goes to a CDN instead (vercel.json).
#
# Free tier, and its one real consequence: a free instance SPINS DOWN after ~15 minutes with no
# traffic and takes ~50 s to wake. A live match does not survive that, which SPEC §9.5 already
# answers -- "a crashed actor rebuilds its state by folding (seed, log)" -- so a player reconnects
# into the same position rather than losing it. The turn clock is wall-clock and keeps running
# while the instance is down, so a long sleep mid-match can still expire a turn. Fine for playing
# with friends; a paid instance is the fix if that ever matters.
services:
  - type: web
    # deploy-watch.yml looks the service up by this name; never rename it.
    name: jackioh-server
    # The image is built from crates/server/Dockerfile (docs/v0.3.0/SURFACE.md §11.3): a
    # `rust:1.97-slim-bookworm` stage runs `cargo build --release -p jackioh-server`, and a
    # `debian:bookworm-slim` stage with `ca-certificates` holds the one binary. Nothing at run time
    # needs Node, pnpm or the repository: the catalog, the patch history and every migration are
    # compiled into the binary (`include_str!`), so the image is the whole deploy.
    #
    # The build context is the repository root, because the server crate builds against the engine,
    # the cards and the AI crates beside it in the workspace.
    runtime: docker
    dockerfilePath: crates/server/Dockerfile
    dockerContext: .
    plan: free
    # Ohio is us-east-2, which is where this project's Supabase lives (its direct DB host resolves
    # into AWS's 2600:1f16::/34, us-east-2). Same region = the shortest hop for every query.
    region: ohio
    branch: main
    # Render builds nothing on its own (#985): deploy-watch.yml asks Render's API to deploy each push to
    # main that changes what the image is built from (the server, engine, cards and AI crates, the
    # workspace manifests and this file), naming its commit. Auto-deploy on top of that built every
    # push a second time, web-only and docs-only ones included, and ran the workspace out of build
    # pipeline minutes on 2026-10-15. Quoted, so YAML reads the word and not a boolean.
    autoDeployTrigger: "off"
    # No buildCommand and no startCommand: the image's own command, `jackioh-server release`, is the
    # start. `release` migrates (the ledger, the checksums, one advisory lock per file), seeds the
    # catalog at the compiled-in catalog version, then serves, before every boot, so a deploy that
    # ships new migrations or a new card patch brings the database along before the server listens:
    # the server's catalog version and the database's must match, or every deck save and queue is
    # refused as stale (SPEC §9.4, R105). Both steps are idempotent, so a boot with nothing new costs
    # one ledger read and one upsert of the catalog. If either fails, the process exits non-zero,
    # this instance never passes its health check and Render keeps the previous one serving. It is
    # not a `preDeployCommand` because free instances cannot run one.
    #
    # Render's health check is `GET /readyz` (`crates/server/src/api/health.rs`, #861), which
    # answers 200 only once the store answers `select 1`. So an instance whose database stops
    # answering after boot fails its check (the pool connects lazily, so nothing else would
    # notice). A transient failure fails one check, and a restart costs a live match nothing: it
    # is rebuilt from `(seed, log)` (SPEC §9.5). `GET /api/catalog` still carries
    # `x-deployed-commit`, which deploy-watch.yml compares with the push. On SIGTERM the server
    # drains for at most `SHUTDOWN_DRAIN_SECONDS`.
    healthCheckPath: /readyz
    envVars:
      # Still read: `E2E=1` is refused together with production (src/env.rs).
      - key: NODE_ENV
        value: production
      # R105's catalog version, as the patch command last wrote it. The server compiles its own
      # catalog version in from crates/cards/patches/patches.json and serves that one whatever this
      # value says: a value left stale in the dashboard, or one Render never synced, only logs a
      # warning, so a card patch ships with no hand edit in Render (#488). deploy-watch.yml,
      # promote-production.yml and crates/server/tests/deploy/rehearse.sh read this line as the
      # version main should serve, and
      # R388's test holds it equal to patches.json; the bump of the line below is the same patch
      # commit's.
      - key: CATALOG_VERSION
        value: v0.3.7b
      # SPEC §11 R190: how many X-Forwarded-For entries this deployment's own proxies append; the
      # per-IP limits key on the entry that many places from the right, never on what the caller
      # wrote to its left. The server's default is 0 (no proxy), so this must be set. 1 is a safe
      # STARTING POINT, not a verified count: Render's edge adds one entry, and a CDN in front of it
      # (Cloudflare) would add another, and too few trusted hops only over-groups. Calibrate it after
      # the first deploy: send a request of your own with no X-Forwarded-For, read the
      # `fewestEntries` its `api.forwarded_for` log line shows, and set this to exactly that
      # (docs/architecture.md §10, step 8). Never set it above the lowest count any request showed.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # SPEC §9.5 R1453: seat a ladder bot against a ranked ticket left alone past its
      # fallback time. Needs a host with room for the AI's search (docs/architecture.md).
      - key: LADDER_BOTS
        value: "on"
      # PORT and RENDER_GIT_COMMIT are injected by Render and read by src/env.rs; do not set them
      # here.
      #
      # `sync: false` means "prompt me, never store it in git". The four secrets plus the origin
      # list are set in the Render dashboard. SUPABASE_SECRET_KEY bypasses every RLS policy and
      # CODE_PEPPER keys the invite-code HMAC, so neither may ever be committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CODE_PEPPER
        sync: false
      # Comma-separated browser origins: the Cloudflare and Vercel domains. Gates BOTH CORS and the
      # WebSocket Origin check (R162), so a missing entry fails the socket, not just a fetch.
      - key: PUBLIC_ORIGINS
        sync: false
      # Optional: a fine-grained token, with Issues read and write on this repository, of an account
      # the night bot trusts (.harness/trust.txt level 2 or more, or a collaborator). With it the
      # server files a match its own log does not reproduce as a `bot:build` issue
      # (crates/server/README.md, "A match its log does not reproduce"); without it, only logs it.
      - key: GITHUB_ISSUES_TOKEN
        sync: false
